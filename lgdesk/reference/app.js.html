}

function renderTeamLogs() {
  if (TL_TAB === 'member') _tlByMember(); else _tlByDate();
}

// ── Work Days Helpers ─────────────────────────────────────────────────────────
// Returns true if the given ISO date is the 1st, 3rd, or 5th Saturday of its
// month (alternate week offs — non-working). 2nd and 4th Saturdays are working.
function _isAltWeekSat(iso) {
  var d = new Date(iso + 'T00:00:00');
  if (d.getDay() !== 6) return false;   // not a Saturday
  // Which Saturday of the month is this? (1st, 2nd, 3rd, 4th, 5th)
  var weekNum = Math.ceil(d.getDate() / 7);
  return weekNum === 1 || weekNum === 3 || weekNum === 5;
}

// Returns the subset of days[] that count as expected work days:
//   exclude Sundays, 1st/3rd/5th Saturdays (alt week off), and admin-set holidays
function _tlExpectedWorkDays(days) {
  return days.filter(function(iso) {
    var dw = new Date(iso + 'T00:00:00').getDay();
    if (dw === 0) return false;                          // Sunday — week off
    if (_isAltWeekSat(iso)) return false;                // 1st / 3rd / 5th Saturday — alt week off
    if (TL_HOLIDAYS.indexOf(iso) !== -1) return false;  // admin-set holiday
    return true;
  });
}

// ── By Member ─────────────────────────────────────────────────────────────────
function _tlByMember() {
  var range    = _tlRange();
  var workDays = _tlExpectedWorkDays(range.days);
  var role     = APP.currentUser.role;
  var isAdmin  = _isAdmin(role);
  var myTeam   = APP.currentUser.team || '';

  // For TC/TF: restrict members to their own team only.
  // For SA/Admin: all active employees.
  var allActive = (APP.employees || []).filter(function(e) { return String(e.Is_Active || '').toUpperCase() === 'TRUE'; });
  var members   = isAdmin ? allActive : allActive.filter(function(e) { return (e.Team || e.Sub_Department || '') === myTeam; });

  // logMap[empId][date] = log
  var logMap = {};
  TL_RAW.forEach(function(l) {
    var d = _dateIso(l.Date);
    if (d >= range.start && d <= range.end) {
      if (!logMap[l.Emp_ID]) logMap[l.Emp_ID] = {};
      logMap[l.Emp_ID][d] = l;
    }
  });

  if (!members.length) { el('team-logs-container').innerHTML = emptyState('No team members found', ''); return; }

  if (isAdmin) {
    // SA/Admin: group by team with section headers
    var teamGroups = {}, teamOrder = [];
    members.forEach(function(e) {
      var t = e.Team || e.Sub_Department || '(No Team)';
      if (!teamGroups[t]) { teamGroups[t] = []; teamOrder.push(t); }
      teamGroups[t].push(e);
    });
    teamOrder.sort();

    var totalActive = members.filter(function(e) { return Object.keys(logMap[e.Emp_ID] || {}).length > 0; }).length;
    el('tl-sub').textContent = range.label + ' — ' + totalActive + ' / ' + members.length + ' members active';

    var html = '';
    teamOrder.forEach(function(team) {
      var tm = teamGroups[team];
      tm.sort(function(a, b) {
        var ac = Object.keys(logMap[a.Emp_ID] || {}).length, bc = Object.keys(logMap[b.Emp_ID] || {}).length;
        return ac !== bc ? bc - ac : (a.Name || '').localeCompare(b.Name || '');
      });
      var teamActive = tm.filter(function(e) { return Object.keys(logMap[e.Emp_ID] || {}).length > 0; }).length;
      html += '<div class="tl-team-section">' +
        '<div class="tl-team-hdr"><span class="material-symbols-outlined">group</span>' +
        esc(team) + '<span class="tl-team-count">' + teamActive + ' / ' + tm.length + ' active</span></div>' +
        '<div class="tlm-grid">';
      if      (TL_MODE === 'day')  html += _tlMemberDayCards(tm, logMap, range.start);
      else if (TL_MODE === 'week') html += _tlMemberWeekCards(tm, logMap, range);
      else {
        try { html += _tlMemberMonthCards(tm, logMap, workDays); }
        catch(e) { console.error('_tlMemberMonthCards error:', e); html += '<div style="padding:12px;color:#c53030;font-size:13px;">Error rendering cards: ' + String(e) + '</div>'; }
      }
      html += '</div></div>';
    });
    el('team-logs-container').innerHTML = html;

  } else {
    // TC/TF: own team only — flat list, no group header needed
    members.sort(function(a, b) {
      var ac = Object.keys(logMap[a.Emp_ID] || {}).length, bc = Object.keys(logMap[b.Emp_ID] || {}).length;
      return ac !== bc ? bc - ac : (a.Name || '').localeCompare(b.Name || '');
    });
    var active = members.filter(function(e) { return Object.keys(logMap[e.Emp_ID] || {}).length > 0; }).length;
    el('tl-sub').textContent = range.label + ' — ' + active + ' / ' + members.length + ' members active';

    var cards;
    if      (TL_MODE === 'day')  cards = _tlMemberDayCards(members, logMap, range.start);
    else if (TL_MODE === 'week') cards = _tlMemberWeekCards(members, logMap, range);
    else {
      try { cards = _tlMemberMonthCards(members, logMap, workDays); }
      catch(e) { console.error('_tlMemberMonthCards error:', e); cards = '<div style="padding:12px;color:#c53030;font-size:13px;">Error rendering cards: ' + String(e) + '</div>'; }
    }
    el('team-logs-container').innerHTML = '<div class="tlm-grid">' + cards + '</div>';
  }
}

function _tlMemberDayCards(members, logMap, date) {
  return members.map(function(emp) {
    var log  = (logMap[emp.Emp_ID] || {})[date];
    var init = (emp.Name || emp.Emp_ID).charAt(0).toUpperCase();
    var team = emp.Team || emp.Sub_Department || '';
    if (log) {
      return '<div class="tlm-card" onclick="openMemberLogDetail(\'' + esc(emp.Emp_ID) + '\')" title="View & edit work log">' +
        '<div class="tlm-card-hd"><div class="tlm-avatar" style="background:' + _avatarColor(emp.Emp_ID) + '">' + init + '</div>' +
        '<div><div class="tlm-name">' + esc(emp.Name || emp.Emp_ID) + '</div><div class="tlm-team">' + esc(team) + '</div></div>' +
        '<div class="tlm-badge"><span class="badge" style="background:#e8f5e9;color:#2e7d32">Done</span>' +
        (log.Status === 'Tentative' ? '<span class="tlm-tentative-badge">Tentative</span>' : '') + '</div></div>' +
        '<div class="tlm-hours-row"><span class="tlm-hours">' + _attEffHours(log.Attendance, log['Extra Hours'] || log.Hours_Total) + '</span><span class="tlm-hours-lbl"> hrs</span></div>' +
        ((log['Work Update - 1st Half'] || log.Tasks_Worked || log.Description)
          ? '<div class="tlm-tasks">' + esc(log['Work Update - 1st Half'] || log.Tasks_Worked || log.Description) + '</div>' : '') +
        (log['Work Update - 2nd Half']
          ? '<div class="tlm-desc">' + esc(log['Work Update - 2nd Half']) + '</div>' : '') +
        '<div class="tlm-tags">' +
          ((log.Remark || log.Blockers) ? '<span class="wl-blocker">⚠ ' + esc(log.Remark || log.Blockers) + '</span>' : '') +
        '</div></div>';
    }
    return '<div class="tlm-card missing" onclick="openMemberLogDetail(\'' + esc(emp.Emp_ID) + '\')" title="Add work log">' +
      '<div class="tlm-card-hd"><div class="tlm-avatar" style="background:#bdbdbd">' + init + '</div>' +
      '<div><div class="tlm-name">' + esc(emp.Name || emp.Emp_ID) + '</div><div class="tlm-team">' + esc(team) + '</div></div>' +
      '<div class="tlm-badge"><span class="badge" style="background:#ffebee;color:#c62828">✗ Missing</span></div></div>' +
      '<div class="tlm-missing-note">Click to add work log.</div></div>';
  }).join('');
}

// Maps attendance value → { cls, label } for the week-dot display
function _attDot(att) {
  if (!att) return null;
  var map = {
    'Present':            { cls: 'att-present',    lbl: 'P'  },
    'Extra Full Day':     { cls: 'att-extra-full',  lbl: 'EF' },
    'Extra Half Day':     { cls: 'att-extra-half',  lbl: 'EH' },
    'Leave Full Day':     { cls: 'att-leave-full',  lbl: 'LF' },
    'Leave Half Day':     { cls: 'att-leave-half',  lbl: 'LH' },
    'Alternate Week Off': { cls: 'att-alt-week',    lbl: 'AW' },
    'Week Off':           { cls: 'att-week-off',    lbl: 'W'  },
    'Holiday':            { cls: 'att-holiday',     lbl: 'H'  }
  };
  return map[att] || null;
}

// ── Intern attendance helpers ────────────────────────────────────────────────
// Patterns that indicate an off/absent day in intern free-text attendance.
var INTERN_OFF_PATTERNS = /^\s*(holiday|leave|week.?off|off|absent|half.?day|sick|vacation|alt.?week)\s*$/i;

function _internIsOffDayText(att) {
  return !att || INTERN_OFF_PATTERNS.test(att);
}

// Maps intern free-text attendance → team week-dot { cls, lbl }.
// Numeric values (e.g. "9", "8.5") → present-style dot with hours label.
// Off-day text → off-style dot. Unrecognised → tentative.
function _internAttToCircle(att) {
  if (!att) return { cls: 'tlm-dot missing', lbl: '–', title: 'Missing' };
  if (INTERN_OFF_PATTERNS.test(att)) return { cls: 'tlm-dot att-leave-full', lbl: 'Off', title: att };
  var n = parseFloat(att);
  if (!isNaN(n) && n > 0) return { cls: 'tlm-dot att-present', lbl: n + 'h', title: att + ' hrs' };
  return { cls: 'tlm-dot att-tentative', lbl: '?', title: att };
}

// Intern personal WL: called on attendance text input change.
// Uses robust row-traversal instead of guessed class selectors.
// Signature: _internWlOnAttendanceChange(this, '${iso}') from oninput.
function _internWlOnAttendanceChange(input, dateKey) {
  var raw    = (input.value || '').trim();
  var num    = parseFloat(raw);
  var isNum  = raw !== '' && !isNaN(num) && num > 0;
  var isOff  = !isNum && _internIsOffDayText(raw);
  var isEmpty = raw === '';

  // ── 1. Find the day row container ─────────────────────────────
  var row = input.closest('tr')
    || input.closest('[data-date="' + dateKey + '"]')
    || input.closest('.wl-day-row')
    || document.getElementById('wl-day-' + dateKey)
    || document.getElementById('wl-row-' + dateKey);

  // ── 2. Enable / disable work fields ───────────────────────────
  // numeric ("9", "8.5") → enable; off-day keyword ("Holiday") → disable;
  // empty → disable; any other text ("Training") → enable.
  var shouldEnable = isNum || (!isOff && !isEmpty);

  if (row) {
    // All textarea elements in this row (work update notes)
    row.querySelectorAll('textarea').forEach(function(e) {
      e.disabled      = !shouldEnable;
      e.style.opacity = shouldEnable ? '1' : '0.4';
      e.style.cursor  = shouldEnable ? '' : 'not-allowed';
    });

    // text inputs — skip the attendance field itself (and any hidden fields)
    row.querySelectorAll('input[type="text"]').forEach(function(e) {
      if (e === input) return;
      e.disabled      = !shouldEnable;
      e.style.opacity = shouldEnable ? '1' : '0.4';
      e.style.cursor  = shouldEnable ? '' : 'not-allowed';
    });

    // number inputs (extra hours — wl-eh-{dateKey})
    row.querySelectorAll('input[type="number"]').forEach(function(e) {
      e.disabled      = !shouldEnable;
      e.style.opacity = shouldEnable ? '1' : '0.4';
    });

    // buttons — skip the save button so it stays actionable
    row.querySelectorAll('button').forEach(function(e) {
      if (e.classList.contains('wl-save-btn')) return;
      e.style.opacity       = shouldEnable ? '1' : '0.4';
      e.style.pointerEvents = shouldEnable ? 'auto' : 'none';
    });

    // ── 3. Show/hide "Worked today" toggle for off-day text ──────
    var toggle = document.getElementById('wl-odt-' + dateKey)
      || row.querySelector('.wl-offday-toggle');
    if (toggle) toggle.style.display = isOff ? '' : 'none';
  }

  // ── 4. Update +OT badge ───────────────────────────────────────
  var badgeEl = document.getElementById('wl-ot-badge-' + dateKey);
  if (badgeEl) {
    var ehEl = document.getElementById('wl-eh-' + dateKey);
    var extraHrs = ehEl ? (parseFloat(ehEl.value) || 0) : 0;
    badgeEl.style.display = extraHrs > 0 ? 'inline' : 'none';
  }

  // ── 6. Update intern hours display ───────────────────────────
  var internHrsEl = document.getElementById('wl-intern-hrs-' + dateKey);
  if (internHrsEl) internHrsEl.textContent = (isNum && num > 0) ? num + ' hrs' : '—';

  // ── 7. Mark dirty, then auto-save ────────────────────────────
  // wlMarkDirty must run BEFORE _wlAutoSave so the debounced callback
  // doesn't bail out on the !WL_DIRTY guard.
  wlMarkDirty(dateKey);
  if (typeof _wlAutoSave === 'function') _wlAutoSave(dateKey);
}

// Intern team-modal: called on attendance text input change for a member row.
function _mlInternWlOnAttChange(inp) {
  if (!inp) return;
  var iso = inp.dataset.iso;
  var att = inp.value.trim();
  var isOff = _internIsOffDayText(att);
  var row = inp.closest('tr');
  if (row) row.querySelectorAll('textarea.ml-ta,input.ml-hrs').forEach(function(e) { e.disabled = isOff; });
  // Update OT badge
  _mlUpdateOtBadge(iso);
  // Mark dirty
  if (typeof ML_DIRTY !== 'undefined') ML_DIRTY[iso] = true;
  _mlAutoSave(iso);
}

function _tlMemberWeekCards(members, logMap, range) {
  var WDAY = ['S','M','T','W','T','F','S'];   // indexed by getDay() (0=Sun)
  return members.map(function(emp) {
    var empLogs = logMap[emp.Emp_ID] || {};
    var init = (emp.Name || emp.Emp_ID).charAt(0).toUpperCase();
    var team = emp.Team || emp.Sub_Department || '';
    var totalHrs = 0;
    Object.keys(empLogs).forEach(function(d) { totalHrs += _attEffHours(empLogs[d].Attendance, empLogs[d]['Extra Hours'] || empLogs[d].Hours_Total); });
    var hasAny = Object.keys(empLogs).length > 0;
    // Count colored circles: submitted logs + auto-colored Sunday/holiday/alt-sat days
    var coloredDays = range.days.reduce(function(n, d) {
      if (empLogs[d]) return n + 1;
      var dw = new Date(d + 'T00:00:00').getDay();
      if (dw === 0 || _isAltWeekSat(d) || TL_HOLIDAYS.indexOf(d) !== -1) return n + 1;
      return n;
    }, 0);
    return '<div class="tlm-card' + (hasAny ? '' : ' missing') + '" onclick="openMemberLogDetail(\'' + esc(emp.Emp_ID) + '\')" title="View & edit work log">' +
      '<div class="tlm-card-hd"><div class="tlm-avatar" style="background:' + (hasAny ? _avatarColor(emp.Emp_ID) : '#bdbdbd') + '">' + init + '</div>' +
      '<div><div class="tlm-name">' + esc(emp.Name || emp.Emp_ID) + '</div><div class="tlm-team">' + esc(team) + '</div></div></div>' +
      '<div class="tlm-week-dots">' +
        range.days.map(function(d) {
          var log      = empLogs[d];
          var dw       = new Date(d + 'T00:00:00').getDay();
          var isSun    = dw === 0;
          var isAltSat = _isAltWeekSat(d);
          var isHol    = TL_HOLIDAYS.indexOf(d) !== -1;
          var dot, lbl, title;
          var isEmpIntern = (emp.Role === 'Intern');
          if (log) {
            var att  = log.Attendance || '';
            if (isEmpIntern) {
              var ic = _internAttToCircle(att);
              dot = ic.cls; lbl = ic.lbl; title = ic.title;
            } else {
              var info = _attDot(att);
              if (info) {
                dot = 'tlm-dot ' + info.cls; lbl = info.lbl; title = att;
              } else if (log.Status === 'Tentative') {
                dot = 'tlm-dot att-tentative'; lbl = '?'; title = 'Tentative';
              } else {
                dot = 'tlm-dot att-tentative'; lbl = '…'; title = 'Pre-filled';
              }
            }
          } else if (isSun) {
            dot = 'tlm-dot att-week-off'; lbl = 'W'; title = 'Week Off (Sunday)';
          } else if (isAltSat) {
            dot = 'tlm-dot att-alt-week'; lbl = 'AW'; title = 'Alt Week Off';
          } else if (isHol) {
            dot = 'tlm-dot att-holiday'; lbl = 'H'; title = 'Holiday';
          } else {
            dot = 'tlm-dot missing'; lbl = '–'; title = 'Missing';
          }
          return '<div class="tlm-dot-item"><span class="tlm-dot-day">' + WDAY[dw] + '</span>' +
            '<span class="' + dot + '" title="' + esc(title) + '">' + lbl + '</span></div>';
        }).join('') +
      '</div>' +
      '<div class="tlm-week-total">' + totalHrs + ' hrs · ' + coloredDays + ' day' + (coloredDays !== 1 ? 's' : '') + ' logged</div>' +
    '</div>';
  }).join('');
}

var _TLM_ATT_LABELS = {
  'Present':            'P',
  'Extra Full Day':     'EF',
  'Extra Half Day':     'EH',
  'Leave Full Day':     'LF',
  'Leave Half Day':     'LH',
  'Leave':              'LF',
  'Alternate Week Off': 'AW',
  'Week Off':           'W',
  'Holiday':            'H'
};
var _TLM_ATT_ORDER = [
  'Present', 'Extra Full Day', 'Extra Half Day',
  'Leave Full Day', 'Leave Half Day', 'Leave',
  'Holiday', 'Week Off', 'Alternate Week Off'
];
var _TLM_ATT_COLORS = {
  'Present':            'background:#e8f5e9;color:#2e7d32',
  'Extra Full Day':     'background:#e0f2f1;color:#00695c',
  'Extra Half Day':     'background:#e0f7fa;color:#00838f',
  'Leave Full Day':     'background:#fff3e0;color:#e65100',
  'Leave Half Day':     'background:#fff8e1;color:#f57f17',
  'Leave':              'background:#fff3e0;color:#e65100',
  'Holiday':            'background:#e3f2fd;color:#1565c0',
  'Week Off':           'background:#f5f5f5;color:#757575',
  'Alternate Week Off': 'background:#fafafa;color:#9e9e9e'
};

function _tlMemberMonthCards(members, logMap, workDays) {
  if (!members || !members.length) return '';

  var cards = '';

  for (var mi = 0; mi < members.length; mi++) {
    var emp = members[mi];
    if (!emp) continue;

    var empId   = emp.Emp_ID || '';
    var empName = emp.Name   || empId;
    var init    = empName.charAt(0).toUpperCase();
    var team    = emp.Team || emp.Sub_Department || '';
    var empLogs = (logMap && logMap[empId]) ? logMap[empId] : {};

    var totalHrs  = 0;
    var otHrs     = 0;
    var attCounts = {};
    var logDates  = Object.keys(empLogs);

    for (var li = 0; li < logDates.length; li++) {
      var log = empLogs[logDates[li]];
      if (!log) continue;
      var attVal = (log.Attendance || '').toString().trim();
      var extra  = parseFloat(log['Extra Hours'] || log.Hours_Total || 0) || 0;
      totalHrs += _attEffHours(attVal, extra);
      otHrs += extra;
      if (attVal === 'Extra Full Day') otHrs += 9;
      if (attVal === 'Extra Half Day') otHrs += 4;
      if (attVal) attCounts[attVal] = (attCounts[attVal] || 0) + 1;
    }

    totalHrs = Math.round(totalHrs * 10) / 10;
    otHrs    = Math.round(otHrs    * 10) / 10;

    var submitted = 0;
    var wdLen = (workDays && workDays.length) ? workDays.length : 0;
    for (var wi = 0; wi < wdLen; wi++) {
      if (empLogs[workDays[wi]]) submitted++;
    }
    var pct      = wdLen > 0 ? Math.round(submitted / wdLen * 100) : 0;
    var hasAny   = submitted > 0;
    var pctColor = pct >= 80 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--danger)';

    var otHtml = '';
    if (otHrs > 0) {
      otHtml = '<span style="font-size:12px;font-weight:600;color:#e65100;' +
               'background:#fff3e0;border-radius:10px;padding:2px 8px;' +
               'margin-left:8px;white-space:nowrap;">+' + otHrs + ' OT</span>';
    }

    var attHtml  = '';
    var attShown = {};

    for (var oi = 0; oi < _TLM_ATT_ORDER.length; oi++) {
      var attKey = _TLM_ATT_ORDER[oi];
      if (attCounts[attKey] && !attShown[attKey]) {
        attShown[attKey] = true;
        var attLbl = _TLM_ATT_LABELS[attKey] || attKey.substring(0, 3);
        var attClr = _TLM_ATT_COLORS[attKey] || 'background:#f5f5f5;color:#757575';
        attHtml += '<span style="' + attClr + ';font-size:11px;font-weight:600;' +
                   'border-radius:10px;padding:2px 7px;white-space:nowrap;line-height:1.4;">' +
                   esc(attLbl) + ': ' + attCounts[attKey] + '</span>';
      }
    }

    var attKeys = Object.keys(attCounts);
    for (var ak = 0; ak < attKeys.length; ak++) {
      var uk = attKeys[ak];
      if (!attShown[uk]) {
        var ukLbl = _TLM_ATT_LABELS[uk] || (uk.length > 4 ? uk.substring(0, 4) : uk);
        attHtml += '<span style="background:#f5f5f5;color:#757575;font-size:11px;' +
                   'font-weight:600;border-radius:10px;padding:2px 7px;' +
                   'white-space:nowrap;line-height:1.4;">' +
                   esc(ukLbl) + ': ' + attCounts[uk] + '</span>';
      }
    }

    var attRowHtml = attHtml
      ? '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;">' + attHtml + '</div>'
      : '';

    cards +=
      '<div class="tlm-card' + (hasAny ? '' : ' missing') + '" ' +
        'onclick="openMemberLogDetail(\'' + esc(empId) + '\')" ' +
        'title="View &amp; edit work log">' +
        '<div class="tlm-card-hd">' +
          '<div class="tlm-avatar" style="background:' + (hasAny ? _avatarColor(empId) : '#bdbdbd') + '">' + esc(init) + '</div>' +
          '<div>' +
            '<div class="tlm-name">' + esc(empName) + '</div>' +
            '<div class="tlm-team">' + esc(team)    + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="tlm-hours-row" style="display:flex;align-items:center;flex-wrap:wrap;">' +
          '<span class="tlm-hours">' + totalHrs + '</span>' +
          '<span class="tlm-hours-lbl"> hrs</span>' +
          otHtml +
        '</div>' +
        '<div class="tlm-month-bar">' +
          '<div class="tlm-month-bar-fill" style="width:' + pct + '%"></div>' +
        '</div>' +
        '<div class="tlm-month-stats">' +
          '<span>' + submitted + ' / ' + wdLen + ' work days</span>' +
          '<span style="font-weight:700;color:' + pctColor + '">' + pct + '%</span>' +
        '</div>' +
        attRowHtml +
      '</div>';
  }

  return cards;
}

// ── By Date ───────────────────────────────────────────────────────────────────
function _tlByDate() {
  var range = _tlRange();
  var logs  = TL_RAW.filter(function(l) {
    var d = _dateIso(l.Date);
    return d >= range.start && d <= range.end;
  });
  var memf = elVal('tl-member');
  if (memf) logs = logs.filter(function(l) { return l.Emp_ID === memf; });

  if (!logs.length) { el('tl-sub').textContent = range.label; el('team-logs-container').innerHTML = emptyState('No work logs for this period', ''); return; }

  var byDate = {};
  logs.forEach(function(l) { var d = _dateIso(l.Date) || 'Unknown'; if (!byDate[d]) byDate[d] = []; byDate[d].push(l); });

  var dates = Object.keys(byDate).sort().reverse();
  el('tl-sub').textContent = range.label + ' — ' + logs.length + ' entr' + (logs.length !== 1 ? 'ies' : 'y') + ' across ' + dates.length + ' day' + (dates.length !== 1 ? 's' : '');
  el('team-logs-container').innerHTML = dates.map(function(d) {
    return '<div class="team-log-day">' +
      '<div class="tld-date">' + fmtDate(d) + ' — ' + byDate[d].length + ' submission' + (byDate[d].length !== 1 ? 's' : '') + '</div>' +
      byDate[d].map(function(l) {
        return '<div class="tld-entry">' +
          '<div class="tld-entry-hd">' +
            '<span class="avatar-sm">' + (l.Emp_Name || l.Emp_ID).charAt(0).toUpperCase() + '</span>' +
            '<span class="tld-emp">' + esc(l.Emp_Name || l.Emp_ID) + '</span>' +
            '<span class="tld-team">' + esc(l.Team || '') + '</span>' +
            '<span class="tld-hours">' + _attEffHours(l.Attendance, l['Extra Hours'] || l.Hours_Total) + ' hrs</span>' +
            (l.Status === 'Tentative' ? '<span class="tlm-tentative-badge">Tentative</span>' : '') +
          '</div>' +
          ((l['Work Update - 1st Half'] || l.Tasks_Worked || l.Description)
            ? '<div style="font-size:13px;line-height:1.5;color:var(--text)">' + esc(l['Work Update - 1st Half'] || l.Tasks_Worked || l.Description) + '</div>' : '') +
          (l['Work Update - 2nd Half']
            ? '<div style="font-size:13px;line-height:1.5;color:var(--muted);margin-top:4px">' + esc(l['Work Update - 2nd Half']) + '</div>' : '') +
          ((l.Remark || l.Blockers) ? '<div class="wl-blocker" style="margin-top:6px">⚠ ' + esc(l.Remark || l.Blockers) + '</div>' : '') +
          _wlDurHtml(_dateIso(l.Date), l.Emp_ID) +
        '</div>';
      }).join('') + '</div>';
  }).join('');
}

// ── Member Log Detail (Admin/Manager drill-down) ───────────────────────────────
var ML_EMP          = null;
var ML_ANCHOR       = null;
var ML_MODE         = 'week';   // mirrors TL_MODE at open time
var ML_CUSTOM_START = '';
var ML_CUSTOM_END   = '';
var ML_DATA         = {};
var ML_ITEMS        = {};   // iso:halfKey → [{type, id, text}] — mirrors WL_ITEMS for team modal
var ML_DIRTY        = {};
var ML_SAVING       = {};
var ML_DEBOUNCE     = {}; // iso → setTimeout ID for team modal 500ms debounce
var ML_MEMBER_ID    = null;  // Emp_ID of member currently open — set by loadMemberLogDetail()
var ML_LOADED_START = null;  // 'YYYY-MM-DD' — start of currently loaded ML data range
var ML_LOADED_END   = null;  // 'YYYY-MM-DD' — end of currently loaded ML data range
var ML_RENDERING    = false; // true during _renderMemberLogModal — prevents onchange from dirtying rows

// True if the range needed for the current mode falls outside the already-loaded ML date range.
function _mlNeedsReload() {
  if (!ML_LOADED_START || !ML_LOADED_END) return true;
  var neededStart, neededEnd;
  if (ML_MODE === 'month') {
    var _a = ML_ANCHOR || new Date();
    neededStart = _localIso(new Date(_a.getFullYear(), _a.getMonth(), 1));
    neededEnd   = _localIso(new Date(_a.getFullYear(), _a.getMonth() + 1, 0));
  } else if (ML_MODE === 'custom' && ML_CUSTOM_START && ML_CUSTOM_END) {
    neededStart = ML_CUSTOM_START;
    neededEnd   = ML_CUSTOM_END;
  } else {
    var mon = _mlWeekMonday(ML_ANCHOR || new Date());
    neededStart = _localIso(mon);
    neededEnd   = _localIso(new Date(mon.getTime() + 6 * 86400000));
  }
  return neededStart < ML_LOADED_START || neededEnd > ML_LOADED_END;
}

function openMemberLogDetail(empId) {
  ML_EMP          = (APP.employees || []).find(function(e) { return e.Emp_ID === empId; }) || { Emp_ID: empId };
  ML_ANCHOR       = new Date(TL_ANCHOR || new Date());
  ML_MODE         = TL_MODE;
  ML_CUSTOM_START = TL_CUSTOM_START || '';
  ML_CUSTOM_END   = TL_CUSTOM_END   || '';
  ML_DATA   = {}; ML_DIRTY = {}; ML_SAVING = {};
  var name = ML_EMP.Name || ML_EMP.Emp_ID;
  var av   = el('ml-header-avatar');
  if (av) { av.textContent = name.charAt(0).toUpperCase(); av.style.background = _avatarColor(empId); }
  el('ml-header-title').textContent = name + ' — Work Log';
  el('member-log-modal').classList.remove('hidden');
  loadMemberLogDetail();
}

function loadMemberLogDetail(memberId) {
  // Accept optional memberId; fall back to already-set ML_EMP for the reload ↻ button
  ML_MEMBER_ID = memberId || (ML_EMP && ML_EMP.Emp_ID) || null;
  var targetId = ML_MEMBER_ID;
  if (!targetId) return;

  if (!memberId) {
    // First open via openMemberLogDetail — derive week from TL_MODE/TL_ANCHOR context
    var _tlDate = TL_ANCHOR instanceof Date ? new Date(TL_ANCHOR) : new Date();
    var _today  = new Date(); _today.setHours(0, 0, 0, 0);
    if (TL_MODE === 'month') {
      // Month view: current month → today's week; past/future month → first week of that month
      var _sameMonth = (_tlDate.getFullYear() === _today.getFullYear() && _tlDate.getMonth() === _today.getMonth());
      ML_ANCHOR = _mlWeekMonday(_sameMonth ? _today : new Date(_tlDate.getFullYear(), _tlDate.getMonth(), 1));
    } else {
      // Day / week / custom: use the TL anchor date (normalised to Monday)
      ML_ANCHOR = _mlWeekMonday(_tlDate);
    }
  } else {
    // Reload button — preserve the week the manager is currently viewing
    ML_ANCHOR = _mlWeekMonday(ML_ANCHOR || new Date());
  }

  var bodyDiv = el('member-log-body');
  if (bodyDiv) bodyDiv.innerHTML = '<div class="empty-state"><div class="ei material-symbols-outlined">hourglass_empty</div><p>Loading…</p></div>';

  ML_DATA = {}; ML_DIRTY = {};

  // Fetch range depends on the current mode
  var mlAnchor = ML_ANCHOR || new Date();
  var mlRange;
  if (ML_MODE === 'month') {
    var _y = mlAnchor.getFullYear(), _m = mlAnchor.getMonth();
    mlRange = {
      start: _localIso(new Date(_y, _m, 1)),
      end:   _localIso(new Date(_y, _m + 1, 0))
    };
  } else if (ML_MODE === 'custom' && ML_CUSTOM_START && ML_CUSTOM_END) {
    mlRange = { start: ML_CUSTOM_START, end: ML_CUSTOM_END };
  } else {
    // day / week: ±8-week window around anchor
    mlRange = {
      start: _localIso(new Date(mlAnchor.getTime() - 8 * 7 * 86400000)),
      end:   _localIso(new Date(mlAnchor.getTime() + 2 * 7 * 86400000))
    };
  }

  google.script.run
    .withSuccessHandler(function(logs) {
      ML_LOADED_START = mlRange.start;
      ML_LOADED_END   = mlRange.end;
      ML_DATA = {}; ML_DIRTY = {};
      (logs || []).forEach(function(l) {
        var iso = _dateIso(l.Date);
        if (!iso) return;
        ML_DATA[iso] = {
          logId:         l.Log_ID                                                          || '',
          attendance:    l.Attendance                                                      || '',
          leaveType:     l.Purpose                     || l.Leave_Type                     || '',
          leaveReq:      l['Leave Requested']          || l.Leave_Requested                || '',
          work1:         l['Work Update - 1st Half']   || l.Work_1st_Half || l.Description || '',
          work2:         l['Work Update - 2nd Half']   || l.Work_2nd_Half                  || '',
          extraHrs:      l['Extra Hours']              || l.Extra_Hours   || l.Hours_Total  || 0,
          remark:        l.Remark                      || l.Blockers                        || '',
          status:        l.Status                                                           || '',
          adminComments: l.Comments                    || l.Admin_Comments                  || ''
        };
      });
      _renderMemberLogModal();
    })
    .withFailureHandler(function(err) {
      var bodyDiv = el('member-log-body');
      if (bodyDiv) bodyDiv.innerHTML = '<div class="empty-state"><div class="ei material-symbols-outlined">error_outline</div><p>' + esc((err && err.message) || 'Failed to load logs') + '</p></div>';
    })
    .getMemberWorkLogs(targetId, APP._verifiedEmail, mlRange.start, mlRange.end);
}

function mlNav(dir) {
  // Nav buttons are hidden for month/custom — this only fires for day/week
  if (ML_MODE !== 'month' && ML_MODE !== 'custom') ML_MODE = 'week';
  var d = new Date(ML_ANCHOR || new Date());
  if (ML_MODE === 'day') d.setDate(d.getDate() + dir);
  else                   d.setDate(d.getDate() + dir * 7);
  ML_ANCHOR = d; renderMemberLogDetail();
}

function mlNavToday() {
  if (ML_MODE !== 'month' && ML_MODE !== 'custom') ML_MODE = 'week';
  ML_ANCHOR = new Date(); renderMemberLogDetail();
}

function _mlDays() {
  if (ML_MODE === 'month') {
    var a = ML_ANCHOR || new Date(), y = a.getFullYear(), m = a.getMonth();
    var days = [];
    for (var day = new Date(y, m, 1); day.getMonth() === m; day.setDate(day.getDate() + 1))
      days.push(_wlIso(new Date(day)));
    return days;
  }
  if (ML_MODE === 'custom' && ML_CUSTOM_START && ML_CUSTOM_END) {
    var days = [], cur = new Date(ML_CUSTOM_START + 'T00:00:00'), end = new Date(ML_CUSTOM_END + 'T00:00:00');
    while (cur <= end) { days.push(_wlIso(new Date(cur))); cur.setDate(cur.getDate() + 1); }
    return days;
  }
  // week or day → always show Mon–Sun of ML_ANCHOR
  var d = ML_ANCHOR || new Date(), dow = (d.getDay() + 6) % 7;
  var mon = new Date(d); mon.setDate(d.getDate() - dow);
  var days = [];
  for (var i = 0; i < 7; i++) { var x = new Date(mon); x.setDate(mon.getDate() + i); days.push(_wlIso(x)); }
  return days;
}

function _mlRangeLabel(days) {
  if (!days.length) return '—';
  if (ML_MODE === 'month') {
    var a = ML_ANCHOR || new Date();
    var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return MONTHS[a.getMonth()] + ' ' + a.getFullYear();
  }
  if (ML_MODE === 'custom') return new Date(days[0] + 'T00:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short' }) +
    ' – ' + new Date(days[days.length - 1] + 'T00:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  return new Date(days[0] + 'T00:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short' }) +
    ' – ' + new Date(days[days.length - 1] + 'T00:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}

function renderMemberLogDetail() {
  var days  = _mlDays();
  var today = _wlIso(new Date());
  var DN    = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  el('ml-week-label').textContent = _mlRangeLabel(days);
  // Hide nav arrows for month/custom — clicking them switches to week mode anyway
  var isFixedRange = (ML_MODE === 'month' || ML_MODE === 'custom');
  document.querySelectorAll('#member-log-modal .tl-nav-btn').forEach(function(b) {
    b.style.visibility = isFixedRange ? 'hidden' : '';
  });
  el('ml-week-label').title = isFixedRange ? 'Use ‹ › to navigate by week' : '';

  function selOpts(opts, val) {
    return opts.map(function(o) {
      return '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(o || '—') + '</option>';
    }).join('');
  }

  var rows = days.map(function(iso) {
    var d       = new Date(iso + 'T00:00:00');
    var dow     = d.getDay();
    var isWknd  = (dow === 0 || dow === 6);
    var isTdy   = (iso === today);
    var data    = ML_DATA[iso] || {};
    var att     = data.attendance;
    // Pre-fill attendance when no saved log exists
    if (!att && !data.logId) {
      if      (dow === 0)                             att = 'Week Off';
      else if (dow === 6 && _isAltWeekSat(iso))      att = 'Alternate Week Off';
      else if (TL_HOLIDAYS.indexOf(iso) !== -1)      att = 'Holiday';
      else                                            att = '';
    }
    att = att || '';
    var isInternMember = ML_EMP && ML_EMP.Role === 'Intern';
    var isLeave = isInternMember ? false : WL_LEAVE_TYPES.indexOf(att) !== -1;
    var isOff   = isInternMember ? _internIsOffDayText(att) : WL_OFF_TYPES.indexOf(att) !== -1;
    var isDirty  = !!ML_DIRTY[iso];
    var isSaving = !!ML_SAVING[iso];
    var dayLbl   = DN[dow] + ' ' + iso.substring(8) + '/' + (d.getMonth() + 1);
    var rowCls   = 'wl-row' + (isTdy ? ' wl-row-today' : '') + (isWknd ? ' wl-row-wknd' : '') +
                   (isOff ? ' wl-row-off' : '') + (isLeave ? ' wl-row-leave' : '');

    var attSel = isInternMember
      ? '<input type="text" class="wl-inp wl-att-sel" id="ml-att-' + iso + '"' +
          ' value="' + esc(att) + '" placeholder="e.g. 9, 8.5, Holiday"' +
          ' oninput="mlMarkDirty(\'' + iso + '\')" style="width:100%;min-width:0">'
      : '<select class="wl-inp wl-att-sel" id="ml-att-' + iso + '" onchange="mlOnAttChange(\'' + iso + '\')">' +
          selOpts(WL_ATTENDANCE_OPTIONS, att) + '</select>';

    var h1Work  = '<textarea class="wl-inp wl-desc-inp" id="ml-h1-' + iso + '" rows="1" placeholder="Work update — 1st half…" ' +
      'oninput="mlMarkDirty(\'' + iso + '\');wlAutoResize(this)"' + (isOff ? ' disabled' : '') + '>' + esc(data.work1 || '') + '</textarea>';
    var h1Leave = '<select class="wl-inp" id="ml-lt-' + iso + '" onchange="mlMarkDirty(\'' + iso + '\')">' +
      selOpts(WL_LEAVE_OPTIONS, data.leaveType) + '</select>';
    var isFullLeave = att === 'Leave Full Day';
    var h1Cell  = '<div id="ml-h1-work-' + iso + '"' + (isFullLeave ? ' style="display:none"' : '') + '>' + h1Work + '</div>' +
                  '<div id="ml-h1-leave-' + iso + '"' + (!isLeave ? ' style="display:none"' : '') + '>' + h1Leave + '</div>';

    var h2Work  = '<textarea class="wl-inp wl-desc-inp" id="ml-h2-' + iso + '" rows="1" placeholder="Work update — 2nd half…" ' +
      'oninput="mlMarkDirty(\'' + iso + '\');wlAutoResize(this)"' + (isOff ? ' disabled' : '') + '>' + esc(data.work2 || '') + '</textarea>';
    var h2Leave = '<select class="wl-inp" id="ml-lr-' + iso + '" onchange="mlMarkDirty(\'' + iso + '\')">' +
      selOpts(['','Same Day','One Day Before','Within Same Week','One Week Before'], data.leaveReq) + '</select>';
    // Leave Full Day: work hidden, leave request shown; Leave Half Day: both shown; Present: only work shown
    var h2Cell  = '<div id="ml-h2-work-' + iso + '"' + (isFullLeave ? ' style="display:none"' : '') + '>' + h2Work + '</div>' +
                  '<div id="ml-h2-leave-' + iso + '"' + (!isLeave ? ' style="display:none"' : '') + '>' + h2Leave + '</div>';

    var ehCell = '<input type="number" class="wl-inp wl-hrs-inp" id="ml-eh-' + iso + '" value="' + esc(String(data.extraHrs || '')) + '" ' +
      'min="0" max="12" step="0.5" placeholder="0" oninput="mlMarkDirty(\'' + iso + '\')"' + (isOff ? ' disabled' : '') + '/>';
    var rmCell = '<input type="text" class="wl-inp" id="ml-rm-' + iso + '" value="' + esc(data.remark || '') + '" ' +
      'placeholder="Remark…" oninput="mlMarkDirty(\'' + iso + '\')"/>';
    var stCell = '<select class="wl-inp wl-status-sel" id="ml-st-' + iso + '" onchange="mlMarkDirty(\'' + iso + '\')">' +
      selOpts(WL_STATUS_OPTIONS, data.status) + '</select>';
    var acCell = '<input type="text" class="wl-inp wl-admin-inp" id="ml-ac-' + iso + '" value="' + esc(data.adminComments || '') + '" ' +
      'placeholder="Comments…" oninput="mlMarkDirty(\'' + iso + '\')"/>';

    var btnCls  = 'wl-save-btn' + (isSaving ? '' : isDirty ? ' dirty' : data.logId ? ' saved' : '');
    var btnIcon = isSaving ? icon('sync') : isDirty ? icon('save') : data.logId ? icon('check') : '—';

    return '<tr class="' + rowCls + '" id="ml-tr-' + iso + '">' +
      '<td class="wl-day-cell"><div class="wl-day-name">' + dayLbl + '</div>' + (isTdy ? '<div class="wl-day-today-badge">Today</div>' : '') + '</td>' +
      '<td class="wl-att-cell">' + attSel + '</td>' +
      '<td class="wl-h1-cell">' + h1Cell + '</td>' +
      '<td class="wl-h2-cell">' + h2Cell + '</td>' +
      '<td class="wl-extra-cell">' + ehCell + '</td>' +
      '<td class="wl-remark-cell">' + rmCell + '</td>' +
      '<td class="wl-status-cell">' + stCell + '</td>' +
      '<td class="wl-comments-cell">' + acCell + _wlDurHtml(iso, ML_MEMBER_ID) + '</td>' +
      '<td class="wl-save-cell"><button class="' + btnCls + '" id="ml-save-btn-' + iso + '" ' +
        'onclick="saveMemberEntry(\'' + iso + '\')"' + (isSaving ? ' disabled' : '') + '>' + btnIcon + '</button>' +
        '<span id="ml-as-' + iso + '" style="font-size:11px;color:var(--muted);margin-left:4px;min-width:56px;display:inline-block;vertical-align:middle;"></span></td>' +
    '</tr>';
  }).join('');

  el('member-log-content').innerHTML =
    '<div class="wl-week-wrap"><table class="wl-week-table">' +
    '<thead><tr>' +
      '<th class="wl-day-cell">Day</th>' +
      '<th class="wl-att-cell">Attendance</th>' +
      '<th class="wl-h1-cell">Work Update — 1st Half</th>' +
      '<th class="wl-h2-cell">Work Update — 2nd Half</th>' +
      '<th class="wl-extra-cell">Extra Hrs</th>' +
      '<th class="wl-remark-cell">Remark</th>' +
      '<th class="wl-status-cell">Status</th>' +
      '<th class="wl-comments-cell">Comments</th>' +
      '<th class="wl-save-cell"></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';

  document.querySelectorAll('#member-log-content .wl-desc-inp').forEach(function(ta) { wlAutoResize(ta); });
}

function mlOnAttChange(iso) {
  var att         = (el('ml-att-' + iso) || {}).value || '';
  var isLeave     = WL_LEAVE_TYPES.indexOf(att) !== -1;
  var isFullLeave = att === 'Leave Full Day';
  var isOff       = WL_OFF_TYPES.indexOf(att)   !== -1;
  function tog(id, show) { var e = el(id); if (e) e.style.display = show ? '' : 'none'; }
  // Work fields: visible unless full-day leave
  tog('ml-h1-work-'  + iso, !isFullLeave);
  tog('ml-h1-leave-' + iso, isLeave);       // leave type: visible for any leave
  tog('ml-h2-work-'  + iso, !isFullLeave);
  tog('ml-h2-leave-' + iso, isLeave);       // leave request: visible for any leave type
  ['ml-h1-' + iso, 'ml-h2-' + iso, 'ml-eh-' + iso].forEach(function(id) { var e = el(id); if (e) e.disabled = isOff; });
  var tr = el('ml-tr-' + iso);
  if (tr) { tr.classList.remove('wl-row-off','wl-row-leave'); if (isOff) tr.classList.add('wl-row-off'); if (isLeave) tr.classList.add('wl-row-leave'); }
  mlMarkDirty(iso);
}

function mlMarkDirty(iso) { ML_DIRTY[iso] = true; _mlUpdateSaveBtn(iso); }
function _mlMarkDirtyFromInput(inp) { var iso = inp.getAttribute('data-iso'); if (iso) ML_DIRTY[iso] = true; }

function _mlUpdateSaveBtn(iso) {
  var btn = el('ml-save-btn-' + iso); if (!btn) return;
  var data = ML_DATA[iso], isDirty = !!ML_DIRTY[iso], isSaving = !!ML_SAVING[iso];
  if (isSaving)               { btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">sync</span>'; btn.className = 'wl-save-btn'; }
  else if (isDirty)           { btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">save</span>'; btn.className = 'wl-save-btn dirty'; }
  else if (data && data.logId){ btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">check</span>'; btn.className = 'wl-save-btn saved'; }
  else                        { btn.textContent = '—';  btn.className = 'wl-save-btn'; }
}

// Render chips for one half of one day in the team modal — mirrors wlRenderChips.
function _mlRenderChips(iso, halfKey) {
  var chipsEl = el('ml-chips-' + halfKey + '-' + iso);
  if (!chipsEl) return;
  var items = ML_ITEMS[iso + ':' + halfKey] || [];
  var iconMap = { meeting:'video_call', project:'folder_open', task:'task_alt', subfn:'check_box', custom:'edit_note' };
  chipsEl.innerHTML = items.map(function(it, i) {
    var ic = iconMap[it.type] || 'label';
    return '<div class="wl-chip wl-chip-' + it.type + '">' +
      '<span class="material-symbols-outlined wl-chip-icon">' + ic + '</span>' +
      '<span class="wl-chip-text" title="Click to edit" onclick="_mlEditChipItem(\'' + iso + '\',\'' + halfKey + '\',' + i + ')">' + esc(it.text) + '</span>' +
      '<span class="wl-chip-del" onclick="_mlRemoveChipItem(\'' + iso + '\',\'' + halfKey + '\',' + i + ')">&times;</span>' +
    '</div>';
  }).join('');
}

// Re-render chips for all populated ML_ITEMS keys.
function _mlRenderAllChips() {
  Object.keys(ML_ITEMS).forEach(function(key) {
    var parts = key.split(':');
    _mlRenderChips(parts[0], parts[1]);
  });
}

// Remove a chip from ML_ITEMS and re-render.
function _mlRemoveChipItem(iso, halfKey, idx) {
  var key = iso + ':' + halfKey;
  if (ML_ITEMS[key]) ML_ITEMS[key].splice(idx, 1);
  _mlRenderChips(iso, halfKey);
  ML_DIRTY[iso] = true;
  _mlAutoSave(iso);
}

// Edit a chip: put its text back into the textarea and remove it from ML_ITEMS.
function _mlEditChipItem(iso, halfKey, idx) {
  var key   = iso + ':' + halfKey;
  var items = ML_ITEMS[key];
  if (!items || !items[idx]) return;
  var inp = el('ml-cust-' + halfKey + '-' + iso);
  if (!inp) return;
  inp.value = items[idx].text;
  inp.focus();
  items.splice(idx, 1);
  _mlRenderChips(iso, halfKey);
  ML_DIRTY[iso] = true;
  inp.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function saveMemberEntry(iso) {
  function gv(id) { var e = el(id); return e ? (e.value || '').trim() : ''; }
  var att         = gv('ml-att-' + iso);
  var isLeave     = WL_LEAVE_TYPES.indexOf(att) !== -1;
  var isFullLeave = att === 'Leave Full Day';
  var work1    = isFullLeave ? '' : gv('ml-h1-' + iso);
  var work2    = isFullLeave ? '' : gv('ml-h2-' + iso);
  var leaveType= isLeave ? gv('ml-lt-' + iso) : '';
  var leaveReq = isLeave ? gv('ml-lr-' + iso) : '';
  var extraHrs = parseFloat(gv('ml-eh-' + iso)) || 0;
  var remark   = gv('ml-rm-' + iso);
  var status   = gv('ml-st-' + iso);
  var adminCmt = gv('ml-ac-' + iso);

  if (!att && !work1 && !work2 && !leaveType && !remark && !extraHrs) {
    delete ML_DIRTY[iso]; _mlUpdateSaveBtn(iso); return;
  }

  var data = ML_DATA[iso] || {};
  ML_SAVING[iso] = true; _mlUpdateSaveBtn(iso);
  _wlAsStatus('ml', iso, 'saving');

  function onSuccess(result) {
    var patch = { attendance: att, leaveType: leaveType, leaveReq: leaveReq,
      work1: work1, work2: work2, extraHrs: extraHrs, remark: remark, status: status, adminComments: adminCmt };
    if (result && result.logId) patch.logId = result.logId;
    ML_DATA[iso] = Object.assign(data, patch);
    delete ML_DIRTY[iso]; delete ML_SAVING[iso];
    _wlAsStatus('ml', iso, 'saved');
    toast('Saved!', 'success'); _mlUpdateSaveBtn(iso);
  }
  function onError(err) { delete ML_SAVING[iso]; _mlUpdateSaveBtn(iso); _wlAsStatus('ml', iso, 'error'); toast(err.message || 'Failed.', 'error'); }

  if (data.logId) {
    google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onError)
      .adminUpdateWorkLog(data.logId, {
        Attendance:               att,
        Purpose:                  leaveType,
        'Leave Requested':        leaveReq,
        'Work Update - 1st Half': work1,
        'Work Update - 2nd Half': work2,
        'Extra Hours':            extraHrs,
        Remark:                   remark,
        Status:                   status,
        Comments:                 adminCmt
      }, APP.currentUser.email);
  } else {
    google.script.run.withSuccessHandler(function(newId) { onSuccess({ logId: newId }); }).withFailureHandler(onError)
      .adminSubmitWorkLog({ date: iso, attendance: att, purpose: leaveType, leaveRequested: leaveReq,
        work1stHalf: work1, work2ndHalf: work2, extraHours: extraHrs, remark: remark,
        status: status, comments: adminCmt }, ML_EMP.Emp_ID, APP.currentUser.email);
  }
}

// ── Member Log Modal — full-parity chip-based UX (mirrors personal Work Log) ──

function _renderMemberLogModal() {
  ML_RENDERING = true;
  var bodyDiv = el('member-log-body');
  if (!bodyDiv) { ML_RENDERING = false; return; }

  if (!ML_ANCHOR) {
    var t = new Date(); t.setHours(0,0,0,0);
    t.setDate(t.getDate() - ((t.getDay()+6)%7));
    ML_ANCHOR = t;
  }

  // Use _mlDays() so month/custom/day/week all produce the correct day list
  var isoDays  = _mlDays();
  var days     = isoDays.map(function(iso) { return new Date(iso + 'T00:00:00'); });
  var todayIso = _wlIso(new Date());

  // Update header label using the same logic as renderMemberLogDetail
  var lblEl = el('ml-week-label');
  if (lblEl) lblEl.textContent = _mlRangeLabel(isoDays);

  // Hide/show nav arrows for month/custom (no next/prev in fixed-range modes)
  var isFixedRange = (ML_MODE === 'month' || ML_MODE === 'custom');
  document.querySelectorAll('#member-log-modal .tl-nav-btn').forEach(function(b) {
    b.style.visibility = isFixedRange ? 'hidden' : '';
  });

  // Work-update cell: outer wrapper (show/hide for off-day) + upd-wrap + textarea + chips
  function workCell(iso, half, data, disabled) {
    var halfKey  = half === '1st' ? 'h1' : 'h2';
    var halfNum  = halfKey === 'h1' ? '1' : '2';
    var placeholder = halfKey === 'h1' ? 'Custom note — 1st half…' : 'Custom note — 2nd half…';
    var outerStyle  = disabled ? ' style="display:none"' : '';
    return '<div id="ml-h' + halfNum + '-work-' + iso + '"' + outerStyle + '>' +
      '<div class="wl-upd-wrap" id="ml-upd-' + halfKey + '-' + iso + '">' +
      '<div class="wl-upd-custom" style="margin-bottom:4px">' +
        '<textarea class="wl-cust-inp wl-inp ml-ta" id="ml-cust-' + halfKey + '-' + iso + '"' +
          ' data-iso="' + iso + '" data-half="' + halfKey + '"' +
          ' placeholder="' + esc(placeholder) + '"' +
          ' rows="2"' +
          ' oninput="_mlMarkDirtyFromInput(this);wlAutoResize(this);"' +
          ' onblur="_mlOnBlur(this)"' +
          ' onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();_mlAddItem(\'' + iso + '\',\'' + halfKey + '\');}"' +
          (disabled ? ' disabled' : '') +
        '></textarea>' +
        '<button class="wl-cust-add-btn" onclick="_mlAddItem(\'' + iso + '\',\'' + halfKey + '\')" title="Add as item"' +
          (disabled ? ' disabled style="opacity:0.4;pointer-events:none"' : '') + '>↵</button>' +
      '</div>' +
      '<div class="wl-upd-chips" id="ml-chips-' + halfKey + '-' + iso + '"></div>' +
      '</div>' +
    '</div>';
  }

  var thead = '<thead><tr>' +
    '<th class="wl-day-cell">Day</th>' +
    '<th class="wl-att-cell">Attendance</th>' +
    '<th class="wl-h1-cell">Work Update — 1st Half</th>' +
    '<th class="wl-h2-cell">Work Update — 2nd Half</th>' +
    '<th class="wl-extra-cell">Extra Hrs</th>' +
    '<th class="wl-remark-cell">Remark</th>' +
    '<th class="wl-status-cell">Status</th>' +
    '<th class="wl-comments-cell">Comments</th>' +
    '</tr></thead>';

  var tbody = '<tbody>';
  days.forEach(function(dayObj) {
    var iso        = _wlIso(dayObj);
    var dow        = dayObj.getDay();
    var data       = ML_DATA[iso] || {};
    var isToday    = iso === todayIso;
    var isUpcoming = iso > todayIso;
    var isWeekend  = (dow === 0 || dow === 6);
    var isDirty    = !!ML_DIRTY[iso];
    var att        = data.attendance || '';
    // Default attendance for weekend/holiday rows
    if (!att && !data.logId) {
      if (dow === 0) att = 'Week Off';
      else if (TL_HOLIDAYS && TL_HOLIDAYS.indexOf(iso) !== -1) att = 'Holiday';
    }

    var isIntern      = ML_EMP && ML_EMP.Role === 'Intern';
    var isOff         = isIntern ? (att !== '' && _internIsOffDayText(att)) : WL_OFF_TYPES.indexOf(att) !== -1;
    var hasOffDayWork = isOff && !!data.logId && (!!(data.work1) || !!(data.work2) || parseFloat(data.extraHrs || 0) >= 2);
    var offDayHide    = isOff && !hasOffDayWork;

    var rowCls = 'wl-row' +
      (isToday   ? ' wl-row-today' : '') +
      (isWeekend ? ' wl-row-wknd'  : '') +
      (isOff     ? ' wl-row-off'   : '');
    var dayLbl = dayObj.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'numeric' });

    // +OT badge — always rendered so JS can toggle it by id
    var _showOt = _wlShowsOtBadge(att, data.extraHrs, isOff && hasOffDayWork);
    var otBadge = '<span id="ml-ot-badge-' + iso + '" class="wl-ot-badge"' +
      (_showOt ? '' : ' style="display:none"') + '>+OT</span>';

    // Day cell: name + Today/Upcoming badges + save indicator + OT badge
    var dayCell = '<div class="wl-day-name">' + esc(dayLbl) + '</div>' +
      (isToday    ? '<div class="wl-day-today-badge">Today</div>' : '') +
      (isUpcoming ? '<div class="wl-future-lbl">Upcoming</div>'  : '') +
      '<span id="ml-as-' + iso + '" style="font-size:11px;color:var(--muted);display:block;min-height:14px;"></span>' +
      otBadge;

    // "Worked today" toggle — only for non-intern off-day rows (interns use free-text)
    var offDayToggle = (!isIntern && isOff)
      ? '<div id="ml-odt-' + iso + '" class="wl-offday-toggle">' +
          '<label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:11.5px;color:#6b7280">' +
          '<input type="checkbox" id="ml-odc-' + iso + '"' +
          ' onchange="_mlToggleOffDayWork(this,\'' + iso + '\')"' +
          (hasOffDayWork ? ' checked' : '') +
          ' style="width:13px;height:13px;accent-color:#6366f1;cursor:pointer">' +
          '<span>Worked today</span></label>' +
          '<span id="ml-odc-warn-' + iso + '" style="display:none;font-size:11px;color:#dc2626;margin-left:6px">Min 2 hrs</span>' +
          '</div>'
      : '';

    // Attendance — text input for interns, dropdown for regular employees
    var attSel = isIntern
      ? '<input type="text" class="wl-inp wl-att-sel ml-att" data-iso="' + iso + '"' +
          ' value="' + esc(att) + '" placeholder="e.g. 9, 8.5, Holiday"' +
          ' oninput="_mlInternWlOnAttChange(this)"' +
          ' onblur="if(!ML_RENDERING){ML_DIRTY[\'' + iso + '\']=true;_mlAutoSave(\'' + iso + '\');}"' +
          (isUpcoming ? ' disabled' : '') + ' style="width:100%;min-width:0">'
      : ('<select class="wl-inp wl-att-sel ml-att" data-iso="' + iso + '"' +
          ' onchange="_mlOnAttChange(\'' + iso + '\')">' +
          WL_ATTENDANCE_OPTIONS.map(function(o) {
            return '<option value="' + esc(o) + '"' + (att === o ? ' selected' : '') + '>' + esc(o) + '</option>';
          }).join('') + '</select>' + offDayToggle);

    // Extra hours — badge updated on input; disabled for off-day without work
    var hrsCell = '<input type="number" class="wl-inp wl-hrs-inp ml-hrs" id="ml-eh-' + iso + '" data-iso="' + iso + '"' +
      ' value="' + esc(isUpcoming ? '' : String(data.extraHrs || '')) + '"' +
      ' min="0" max="12" step="0.5" placeholder="—" style="width:56px;"' +
      ' oninput="ML_DIRTY[\'' + iso + '\']=true;_mlUpdateOtBadge(\'' + iso + '\')"' +
      ' onblur="_mlOnBlur(this)"' +
      (offDayHide ? ' disabled' : '') + ' />';

    // Remark
    var remCell = '<input type="text" class="wl-inp ml-remark" data-iso="' + iso + '"' +
      ' value="' + esc(data.remark || '') + '" placeholder="Remark…" style="width:90px;"' +
      ' oninput="ML_DIRTY[\'' + iso + '\']=true;"' +
      ' onblur="_mlOnBlur(this)" />';

    // Status — auto-saves via _mlAutoSave (not standalone _wlSaveStatus)
    var stCell = '<select class="wl-inp wl-status-sel"' +
      ' data-date="' + iso + '"' +
      ' data-emp="' + esc(ML_MEMBER_ID || '') + '"' +
      ' onchange="if(!ML_RENDERING){ML_DIRTY[\'' + iso + '\']=true;_mlAutoSave(\'' + iso + '\');}">' +
      WL_STATUS_OPTIONS.map(function(s) {
        return '<option value="' + esc(s) + '"' + (s === (data.status || '') ? ' selected' : '') + '>' + esc(s || '—') + '</option>';
      }).join('') + '</select>';

    // Comments — auto-saves via _mlAutoSave (not standalone _wlSaveComment)
    var cmtCell = '<input type="text" class="wl-inp ml-comment" data-date="' + iso + '"' +
      ' data-emp="' + esc(ML_MEMBER_ID || '') + '"' +
      ' value="' + esc(data.adminComments || '') + '" placeholder="Comments…" style="width:90px;"' +
      ' oninput="ML_DIRTY[\'' + iso + '\']=true;"' +
      ' onblur="_mlOnBlur(this)" />';

    tbody += '<tr class="' + rowCls + '" id="ml-tr-' + iso + '">' +
      '<td class="wl-day-cell">' + dayCell + '</td>' +
      '<td class="wl-att-cell">' + attSel + '</td>' +
      '<td class="wl-h1-cell">' + workCell(iso, '1st', data, offDayHide) + '</td>' +
      '<td class="wl-h2-cell">' + workCell(iso, '2nd', data, offDayHide) + '</td>' +
      '<td class="wl-extra-cell">' + hrsCell + '</td>' +
      '<td class="wl-remark-cell">' + remCell + '</td>' +
      '<td class="wl-status-cell">' + stCell + '</td>' +
      '<td class="wl-comments-cell">' + cmtCell + _mlDurHtml(iso) + '</td>' +
      '</tr>';
  });
  tbody += '</tbody>';

  bodyDiv.innerHTML = '<div class="wl-week-wrap"><table class="wl-week-table">' + thead + tbody + '</table></div>';

  // Populate ML_ITEMS from ML_DATA and render chips
  days.forEach(function(dayObj) {
    var iso  = _wlIso(dayObj);
    var data = ML_DATA[iso] || {};
    [['h1','work1'],['h2','work2']].forEach(function(pair) {
      var halfKey = pair[0], field = pair[1];
      var stored  = (data[field] || '').trim();
      ML_ITEMS[iso + ':' + halfKey] = [];
      if (!stored) return;
      stored.split('; ').forEach(function(text) {
        text = text.trim().replace(/\\n/g, '\n');
        if (text) ML_ITEMS[iso + ':' + halfKey].push({ type: 'custom', id: '', text: text });
      });
    });
  });
  _mlRenderAllChips();

  // Auto-resize textareas
  bodyDiv.querySelectorAll('.ml-ta').forEach(function(ta) {
    if (typeof wlAutoResize === 'function') wlAutoResize(ta);
  });

  // Post-render: re-enable off-day rows that already have saved work (CSS .wl-row-off would disable them otherwise)
  days.forEach(function(dayObj) {
    var iso = _wlIso(dayObj);
    var chk = el('ml-odc-' + iso);
    if (chk && chk.checked) _mlToggleOffDayWork(chk, iso, { skipFocus: true });
  });

  // Post-render: for intern employees, set textarea/input disabled state based on saved attendance.
  // Cells are always rendered visible; disabled state is applied here instead of via display:none.
  if (ML_EMP && ML_EMP.Role === 'Intern') {
    days.forEach(function(dayObj) {
      var iso = _wlIso(dayObj);
      var inp = bodyDiv.querySelector('input.ml-att[data-iso="' + iso + '"]');
      if (!inp) return;
      var att = inp.value.trim();
      var shouldDisable = att === '' || _internIsOffDayText(att);
      var tr = el('ml-tr-' + iso);
      if (tr) {
        tr.querySelectorAll('textarea.ml-ta, input.ml-hrs').forEach(function(e) {
          e.disabled = shouldDisable;
          e.style.opacity = shouldDisable ? '0.4' : '1';
          e.style.cursor  = shouldDisable ? 'not-allowed' : '';
        });
      }
    });
  }

  // Load work durations for the displayed week (async, non-blocking)
  ML_DURATIONS = {};
  try {
    var _mlDurStart = _wlIso(days[0]);
    var _mlDurEnd   = _wlIso(days[days.length - 1]);
    _mlApplyDurations(); // Immediately apply stale/cached data (all spans show '—')
    _mlLoadDurationsAsync(_mlDurStart, _mlDurEnd);
  } catch(_e) {}

  ML_RENDERING = false;
}

// Enable/disable work fields when "Worked today" checkbox is toggled on off-day rows.
// Mirrors _wlToggleOffDayWork for the personal WL.
function _mlToggleOffDayWork(chk, iso, opts) {
  var worked    = !!chk.checked;
  var skipFocus = opts && opts.skipFocus;
  [1, 2].forEach(function(n) {
    var workDiv = el('ml-h' + n + '-work-' + iso);
    if (workDiv) workDiv.style.display = worked ? '' : 'none';
    var halfKey = 'h' + n;
    var wrap    = el('ml-upd-' + halfKey + '-' + iso);
    if (!wrap) return;
    wrap.style.pointerEvents = worked ? 'auto' : '';
    wrap.style.opacity       = worked ? '1'    : '';
    wrap.querySelectorAll('input, button, textarea').forEach(function(inp) {
      if (inp.type === 'hidden') return;
      inp.disabled            = !worked;
      inp.style.pointerEvents = worked ? 'auto' : '';
      inp.style.opacity       = worked ? '1'    : '';
    });
  });
  var ehEl = el('ml-eh-' + iso);
  if (ehEl) {
    ehEl.disabled            = !worked;
    ehEl.style.pointerEvents = worked ? 'auto' : '';
    ehEl.style.opacity       = worked ? '1'    : '';
    if (!worked) ehEl.value = '';
    if (worked && !skipFocus) setTimeout(function() { ehEl.focus(); ehEl.select(); }, 60);
  }
  _mlUpdateOtBadge(iso);
  if (!worked) {
    ML_ITEMS[iso + ':h1'] = []; ML_ITEMS[iso + ':h2'] = [];
    _mlRenderChips(iso, 'h1'); _mlRenderChips(iso, 'h2');
    ML_DIRTY[iso] = true; _mlAutoSave(iso);
  }
}

// Show/hide +OT badge on a team modal row based on current att + extra-hrs + off-day toggle state.
function _mlUpdateOtBadge(iso) {
  var badgeEl = el('ml-ot-badge-' + iso);
  if (!badgeEl) return;
  var modal    = el('member-log-modal');
  // Handles both select (regular employees) and text input (interns)
  var attEl    = modal && (modal.querySelector('select.ml-att[data-iso="' + iso + '"]') || modal.querySelector('input.ml-att[data-iso="' + iso + '"]'));
  var att      = attEl ? attEl.value : '';
  var ehEl     = el('ml-eh-' + iso);
  var extraHrs = parseFloat((ehEl && ehEl.value) || '0') || 0;
  var odcEl    = el('ml-odc-' + iso);
  var isOffDayWorked = !!(odcEl && odcEl.checked);
  badgeEl.style.display = _wlShowsOtBadge(att, extraHrs, isOffDayWorked) ? 'inline' : 'none';
}

// Full attendance-change handler for the team member modal.
// Updates off-day toggle visibility, enables/disables work fields, fires auto-save.
function _mlOnAttChange(iso) {
  if (ML_RENDERING) return;
  var modal  = el('member-log-modal');
  var attEl  = modal && modal.querySelector('select.ml-att[data-iso="' + iso + '"]');
  var att    = attEl ? attEl.value : '';
  var isOff  = WL_OFF_TYPES.indexOf(att) !== -1;
  var odtEl  = el('ml-odt-' + iso);
  var odcEl  = el('ml-odc-' + iso);
  var tr     = el('ml-tr-' + iso);
  // Update row CSS class
  if (tr) { tr.classList.remove('wl-row-off'); if (isOff) tr.classList.add('wl-row-off'); }
  // Show/hide the "Worked today" toggle
  if (odtEl) odtEl.style.display = isOff ? '' : 'none';
  if (!isOff && odcEl) odcEl.checked = false;
  // Determine work-cell visibility: show unless it's an off-day without "Worked today" checked
  var showWork = !isOff || !!(odcEl && odcEl.checked);
  _mlToggleOffDayWork({ checked: showWork }, iso, { skipFocus: true });
  _mlUpdateOtBadge(iso);
  // _mlToggleOffDayWork handles auto-save when !showWork; cover the showWork branch here
  if (showWork) { ML_DIRTY[iso] = true; _mlAutoSave(iso); }
}

// Enter (no Shift) in a work-update textarea → add item chip
function _mlKeyDown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    var ta   = event.target;
    var iso  = ta.getAttribute('data-iso');
    var half = ta.getAttribute('data-half');
    if (iso && half) _mlAddItem(iso, half);
  }
}

// Add item to ML_ITEMS and re-render — mirrors wlAddCustom for the team modal.
// halfKey is 'h1' or 'h2' (new convention); 'half' aliases accepted for _mlOnBlur compat.
function _mlAddItem(iso, halfKey) {
  // Normalise legacy '1st'/'2nd' callers (e.g. old _mlKeyDown paths still in flight)
  if (halfKey === '1st') halfKey = 'h1';
  else if (halfKey === '2nd') halfKey = 'h2';

  var inp = el('ml-cust-' + halfKey + '-' + iso);
  if (!inp) return;
  var text = inp.value.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  text = text.split('\n').map(function(l) { return l.trimRight(); }).join('\n').trim();
  if (!text) return;

  if (!ML_ITEMS[iso + ':' + halfKey]) ML_ITEMS[iso + ':' + halfKey] = [];
  ML_ITEMS[iso + ':' + halfKey].push({ type: 'custom', id: '', text: text });

  inp.value = '';
  inp.style.height = 'auto';
  _mlRenderChips(iso, halfKey);
  ML_DIRTY[iso] = true;
  _mlAutoSave(iso);
  var saveBtn = el('ml-save-btn-' + iso);
  if (saveBtn) { saveBtn.style.visibility = 'visible'; saveBtn.className = 'wl-save-btn dirty'; }
}

// Remove a chip item by index; re-render chips for that half
function _mlRemoveItem(iso, half, idx) {
  if (!ML_DATA[iso]) return;
  var field = half === '1st' ? 'work1' : 'work2';
  var items = (ML_DATA[iso][field] || '').split('; ').filter(function(s){ return s.trim(); });
  items.splice(idx, 1);
  ML_DATA[iso][field] = items.join('; ');
  ML_DIRTY[iso] = true;
  _mlAutoSave(iso);

  var modal   = el('member-log-modal');
  var listDiv = modal.querySelector('.ml-items-' + half + '-' + iso);
  if (listDiv) {
    listDiv.innerHTML = items.map(function(item, i) { return _mlChipHtml(item.trim(), i, iso, half); }).join('');
  }

  var saveBtn = el('ml-save-btn-' + iso);
  if (saveBtn) { saveBtn.style.visibility = 'visible'; saveBtn.className = 'wl-save-btn dirty'; }
}

// Edit a chip in the member log modal: put its text back into the textarea and remove it.
function _mlEditChip(iso, half, idx) {
  if (!ML_DATA[iso]) return;
  var field = half === '1st' ? 'work1' : 'work2';
  var items = (ML_DATA[iso][field] || '').split('; ').filter(function(s) { return s.trim(); });
  if (!items[idx]) return;

  var text  = items[idx].trim();
  var modal = el('member-log-modal');
  var inp   = modal ? modal.querySelector('.ml-ta[data-iso="' + iso + '"][data-half="' + half + '"]') : null;
  if (!inp) return;

  inp.value = text;
  inp.focus();
  items.splice(idx, 1);
  ML_DATA[iso][field] = items.join('; ');
  ML_DIRTY[iso] = true;

  var listDiv = modal.querySelector('.ml-items-' + half + '-' + iso);
  if (listDiv) {
    listDiv.innerHTML = items.map(function(item, i) { return _mlChipHtml(item.trim(), i, iso, half); }).join('');
  }
  inp.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Flush pending textarea content, then persist the row via adminSubmitWorkLog / adminUpdateWorkLog
function _mlSaveEntry(iso, autoSave) {
  if (ML_SAVING[iso]) {
    if (autoSave) { _mlAutoSave(iso); }
    return;
  }
  var modal   = el('member-log-modal');
  var attEl   = modal && (modal.querySelector('select.ml-att[data-iso="' + iso + '"]') || modal.querySelector('input.ml-att[data-iso="' + iso + '"]'));
  var ta1     = modal.querySelector('textarea[data-iso="' + iso + '"][data-half="1st"]');
  var ta2     = modal.querySelector('textarea[data-iso="' + iso + '"][data-half="2nd"]');
  var hrsEl   = modal.querySelector('input.ml-hrs[data-iso="' + iso + '"]');
  var remEl   = modal.querySelector('input.ml-remark[data-iso="' + iso + '"]');
  var cmtEl   = modal.querySelector('input.ml-comment[data-date="' + iso + '"]');
  var stEl    = modal.querySelector('select.wl-status-sel[data-date="' + iso + '"]');
  var saveBtn = el('ml-save-btn-' + iso);

  if (!ML_DATA[iso]) ML_DATA[iso] = { work1: '', work2: '', attendance: 'Present', extraHrs: 0, remark: '', adminComments: '', logId: '', status: '' };

  var entry = ML_DATA[iso];
  var att     = attEl  ? attEl.value   : (entry.attendance    || 'Present');

  // Serialize ML_ITEMS → '; '-delimited string, mirrors wlGetWorkText.
  // On manual save: also flushes any pending textarea content.
  function mlGetWorkText(halfKey) {
    var key   = iso + ':' + halfKey;
    var items = ML_ITEMS[key] || [];
    var inp   = el('ml-cust-' + halfKey + '-' + iso);
    var custText = (!autoSave && inp) ? inp.value.trim() : '';
    var parts = items.map(function(it) { return it.text.replace(/\n/g, '\\n'); });
    if (custText) parts.push(custText.replace(/\n/g, '\\n'));
    return parts.join('; ');
  }
  var isLeave     = WL_LEAVE_TYPES.indexOf(att) !== -1;
  var isFullLeave = att === 'Leave Full Day';
  var work1   = isFullLeave ? '' : mlGetWorkText('h1');
  var work2   = isFullLeave ? '' : mlGetWorkText('h2');
  var extraHrs= hrsEl  ? (parseFloat(hrsEl.value) || 0) : (parseFloat(entry.extraHrs) || 0);
  var remark  = remEl  ? remEl.value   : (entry.remark        || '');
  var comments= cmtEl  ? cmtEl.value   : (entry.adminComments || '');
  var status  = stEl   ? stEl.value    : (entry.status        || '');

  if (saveBtn) saveBtn.disabled = true;

  function onDone(newLogId) {
    ML_SAVING[iso] = false;
    if (newLogId) ML_DATA[iso].logId = newLogId;
    if (ML_DIRTY[iso]) {
      _mlAutoSave(iso);
    } else {
      _wlAsStatus('ml', iso, 'saved');
      if (!autoSave) { if (saveBtn) saveBtn.disabled = false; }
    }
  }
  function onFail(err) {
    ML_SAVING[iso] = false;
    if (saveBtn) { saveBtn.disabled = false; saveBtn.style.visibility = 'visible'; }
    _wlAsStatus('ml', iso, 'error');
    if (autoSave) {
      if (ML_DIRTY[iso]) _mlAutoSave(iso); // retry after failure if still dirty
    } else {
      toast((err && err.message) || 'Save failed', 'error');
    }
  }

  _wlAsStatus('ml', iso, 'saving');
  ML_SAVING[iso] = true;
  delete ML_DIRTY[iso];   // clear dirty flag; edits arriving during GAS call will re-set it
  var existingLogId = entry.logId;

  // Intern member route — upsert to Intern_Work_Log via adminSaveInternWorkLog
  if (ML_EMP && ML_EMP.Role === 'Intern') {
    google.script.run
      .withSuccessHandler(function(r) {
        if (!r || !r.ok) { onFail({ message: (r && r.error) || 'Save failed' }); return; }
        onDone(r.logId || existingLogId);
      })
      .withFailureHandler(onFail)
      .adminSaveInternWorkLog({
        date:        iso,
        attendance:  att,
        work1stHalf: work1,
        work2ndHalf: work2,
        extraHours:  extraHrs,
        remark:      remark
      }, ML_MEMBER_ID, APP._verifiedEmail);
    return;
  }

  if (existingLogId) {
    // adminUpdateWorkLog(logId, updates, adminEmail) — updates keys are Work_Log column names
    google.script.run
      .withSuccessHandler(function(r) {
        if (!r || !r.ok) { onFail({ message: (r && r.error) || 'Update failed' }); return; }
        onDone(null);
      })
      .withFailureHandler(onFail)
      .adminUpdateWorkLog(existingLogId, {
        Attendance:               att,
        'Work Update - 1st Half': work1,    // verbatim newline-delimited string
        'Work Update - 2nd Half': work2,    // verbatim newline-delimited string
        'Extra Hours':            extraHrs,
        Remark:                   remark,
        Status:                   status,
        Comments:                 comments
      }, APP._verifiedEmail);
  } else {
    // adminSubmitWorkLog(record, targetEmpId, adminEmail) — record keys match auth.gs expectations
    google.script.run
      .withSuccessHandler(function(newId) {
        if (!newId) { onFail({ message: 'No Log ID returned' }); return; }
        onDone(newId);
      })
      .withFailureHandler(onFail)
      .adminSubmitWorkLog({
        date:         iso,
        attendance:   att,
        work1stHalf:  work1,    // verbatim newline-delimited — auth.gs maps to 'Work Update - 1st Half'
        work2ndHalf:  work2,    // verbatim newline-delimited — auth.gs maps to 'Work Update - 2nd Half'
        extraHours:   extraHrs,
        remark:       remark,
        comments:     comments,
        status:       status
      }, ML_MEMBER_ID, APP._verifiedEmail);
  }
}

// Returns a new Date set to Monday 00:00:00 of the week containing `date`
function _mlWeekMonday(date) {
  var d   = new Date(date.getFullYear(), date.getMonth(), date.getDate()); // strip time
  var day = d.getDay();                        // 0=Sun, 1=Mon, …, 6=Sat
  var offset = (day === 0) ? -6 : 1 - day;    // Sun→-6, Mon→0, Thu→-3, Sat→-5
  d.setDate(d.getDate() + offset);
  return d;
}

// Week navigation — update ML_ANCHOR then re-render or re-fetch if outside loaded range

  ML_ANCHOR = new Date(ML_ANCHOR.getTime() + 7 * 86400000);

function _mlGoToday() {
  Object.keys(ML_DEBOUNCE).forEach(function(k){ if (ML_DEBOUNCE[k]) clearTimeout(ML_DEBOUNCE[k]); }); ML_DEBOUNCE = {};
  ML_ANCHOR = _mlWeekMonday(new Date());

}

function _empColor(emp) {
  var colors = ['#4f46e5','#7c3aed','#db2777','#0891b2','#059669','#d97706','#dc2626','#0284c7','#9333ea','#0d9488'];
  var key = emp ? (emp.Emp_ID || emp.Email || emp.Name || '') : '';
  var idx = 0;
  for (var i = 0; i < key.length; i++) { idx = (idx * 31 + key.charCodeAt(i)) % colors.length; }
  return colors[Math.abs(idx) % colors.length];
}

function _tskGrpEmpById(empId) {
  if (!empId) return null;
  return (APP.employees || []).find(function(e) { return e.Emp_ID === empId || e.Email === empId; }) || null;
}
function _tskGrpProjName(projId) {
  if (!projId) return '';
  var p = (APP.projects || []).find(function(p) { return p.Proj_ID === projId || p.id === projId; });
  return p ? (p.Name || p.Proj_ID || projId) : projId;

function _tskGrpFnProjId(fnId) {
  if (!fnId || fnId === '__none__') return '';
  var fn = (APP.functions || []).find(function(f) { return f.Function_ID === fnId; });
  return fn ? (fn.Proj_ID || '') : '';
}
// Get sub-project info for a function: parent function (if any) or sub-project from project hierarchy
function _fnSubProjInfo(fnId) {
  if (!fnId || fnId === '__none__') return { name:'', id:'' };
  var fn = (APP.functions||[]).find(function(f){return f.Function_ID===fnId;});
  if (!fn) return { name:'', id:'' };
  if (fn.Parent_Fn_ID) {
    var parent = (APP.functions||[]).find(function(f){return f.Function_ID===fn.Parent_Fn_ID;});
    return parent ? { name: parent.Name||'', id: parent.Function_ID||'' } : { name:'', id:'' };
  }
  var projId = fn.Proj_ID || '';
  if (projId) {
    var proj = (APP.projects||[]).find(function(p){return p.Proj_ID===projId||p.id===projId;});
    if (proj && (proj.Parent_Proj_ID || proj.Sub_Project_ID)) {
      var subProjId = proj.Parent_Proj_ID || proj.Sub_Project_ID;
      var subProj = (APP.projects||[]).find(function(p){return p.Proj_ID===subProjId;});
      if (subProj) return { name: subProj.Name||'', id: subProj.Proj_ID||'' };
    }
  }
  return { name:'', id:'' };
}

function _tskGrpDueHtml(due, status) {
  if (!due) return '<span style="color:#94a3b8;font-size:12px">—</span>';
  if (_isClosed(status)) return '<span style="font-size:12px;color:#9ca3af;text-decoration:line-through">' + fmtDate(due) + '</span>';
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(due); d.setHours(0,0,0,0);
  var diff = Math.round((d - today) / 86400000);
  var dotColor  = diff < 0 ? '#ef4444' : diff <= 3 ? '#f59e0b' : '#16a34a';
  var txtStyle  = diff < 0 ? 'font-size:12px;color:#ef4444;font-weight:600' : 'font-size:12px;color:#374151';
  var label     = diff < 0 ? 'Overdue · ' + fmtDate(due) : fmtDate(due);
  return '<div class="tsk-gdue">' +
    '<span class="tsk-gdue-dot" style="background:' + dotColor + '"></span>' +
    '<span style="' + txtStyle + '">' + label + '</span></div>';
}

function _tskGrpFmtDate(dateStr) {
  if (!dateStr) return '—';
  var d = new Date(dateStr);
  if (isNaN(d)) return '—';
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + M[d.getMonth()] + ' ' + d.getFullYear();
}

// Date/Week-mode status pill markup — shared by _tskDateRowHtml and post-save rebuild.

// Opens an inline <select> on the status cell. kind: 'grp' (function table cell)
// or 'date' (date/week/plan flex pill wrapper). The host element is event.currentTarget.
function tskStatusDblClick(event, taskId, currentStatus, kind) {
  event.stopPropagation();
  event.preventDefault();
  var host = event.currentTarget;
  _TSK_INLINE_RESTORE[taskId] = { el: host, html: host.innerHTML, kind: kind || 'grp', _saving: false };

  var options = (TASK_STATUSES || []).map(function(s) {
    return '<option value="' + esc(s) + '"' + (s === currentStatus ? ' selected' : '') + '>' + esc(s) + '</option>';
  }).join('');

  host.innerHTML =
    '<select onclick="event.stopPropagation()" ' +
    'style="font-size:11px;width:100%;min-width:110px;box-sizing:border-box;' +
    'border:1.5px solid #2D3E51;border-radius:4px;padding:3px 4px;' +
    'background:#fff;color:#111827;cursor:pointer;">' + options + '</select>';

  var sel = host.querySelector('select');
  if (!sel) return;
  sel.focus();

  sel.addEventListener('change', function() { tskStatusSave(taskId, sel.value, currentStatus); });
  sel.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { e.stopPropagation(); _tskStatusRevert(taskId); }
  });
  // Blur → revert if nothing was committed (skip while a save is in flight).
  sel.addEventListener('blur', function() {
    setTimeout(function() {
      var r = _TSK_INLINE_RESTORE[taskId];
      if (r && !r._saving && r.el && r.el.querySelector('select')) _tskStatusRevert(taskId);
    }, 200);
  });
}

// Persist the new status via the existing updateTask backend (partial update).
// updateTask returns undefined on success and THROWS on error → withFailureHandler.
function tskStatusSave(taskId, newStatus, previousStatus) {
  var r = _TSK_INLINE_RESTORE[taskId];
  if (newStatus === previousStatus) { _tskStatusRevert(taskId); return; }
  if (r) {
    r._saving = true;
    if (r.el) {
      r.el.style.opacity = '0.5';
      var s0 = r.el.querySelector('select'); if (s0) s0.disabled = true;
    }
  }

  google.script.run
    .withSuccessHandler(function(res) {
      // Reaching here = success (errors throw). Defensive {ok:false} check only.
      if (res && res.ok === false) {
        if (r && r.el) { r.el.style.opacity = ''; r.el.innerHTML = r.html; }
        delete _TSK_INLINE_RESTORE[taskId];
        toast((res && res.error) ? res.error : 'Status update failed', 'error');
        return;
      }
      var task = (APP.tasks || []).find(function(t) { return t.Task_ID === taskId; });
      if (task) task.Status = newStatus;
      toast('Status updated', 'success');
      if (r && r.el) {
        r.el.style.opacity = '';
        _tskRebuildStatusEl(r.el, taskId, newStatus, r.kind);
      }
      delete _TSK_INLINE_RESTORE[taskId];
    })
    .withFailureHandler(function(err) {
      if (r && r.el) { r.el.style.opacity = ''; r.el.innerHTML = r.html; }
      delete _TSK_INLINE_RESTORE[taskId];
      toast((err && err.message) ? err.message : 'Status update failed', 'error');
    })
    .updateTask(taskId, { Status: newStatus }, APP._verifiedEmail);
}

// Rebuild just the edited status element with the correct per-mode renderer,
// then re-bind the dblclick (with the new status) and keep single-click suppressed.
function _tskRebuildStatusEl(el, taskId, newStatus, kind) {
  if (kind === 'date') {
    var task = (APP.tasks || []).find(function(t) { return t.Task_ID === taskId; });
    var overdue = false;
    if (task && task.Due_Date && !_isClosed(newStatus)) {
      var iso = _dateIso(task.Due_Date);
      if (iso) { var d = new Date(iso); d.setHours(0,0,0,0); var n = new Date(); n.setHours(0,0,0,0); overdue = d < n; }
    }
    el.innerHTML = _tskDatePillHtml(newStatus, overdue);
  } else {
    el.innerHTML = _tskGrpStatusHtml(newStatus);
  }
  el.ondblclick = function(e) { tskStatusDblClick(e, taskId, newStatus, kind); };
  el.onclick = function(e) { e.stopPropagation(); };
}

// Revert a cell to its pre-edit state without saving.
function _tskStatusRevert(taskId) {
  var r = _TSK_INLINE_RESTORE[taskId];
  if (r && r.el) r.el.innerHTML = r.html;

}
