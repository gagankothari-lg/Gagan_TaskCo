// ── Work Log ──────────────────────────────────────────────────────────────────
var WL_ANCHOR      = null;   // any Date in the desired week/month
var WL_MODE        = 'week'; // 'week' | 'month'
var WL_LOADED_START = null;  // 'YYYY-MM-DD' — start of currently loaded WL data range
var WL_LOADED_END   = null;  // 'YYYY-MM-DD' — end of currently loaded WL data range
var WL_RENDERING    = false; // true during renderWeekLog — prevents onchange from dirtying rows
var WL_DATA   = {};
var WL_DIRTY  = {};
var WL_SAVING = {};
var WL_DEBOUNCE = {}; // iso → setTimeout ID for personal WL 500ms debounce
var WL_ITEMS     = {};  // 'iso:h1' | 'iso:h2' → [{type,id,text}]
var WL_MTGS      = {};  // iso → [{id,title,start,end,durationMins}]
var WL_AUTO_HRS  = {}; // iso → number — auto-calculated hours from meetings (pre-fills Hrs input)
var WL_DURATIONS = {}; // iso → 'HH:MM:SS' — net work duration from Work_Duration sheet

// Returns total effective hours worked for a log entry based on attendance + extra hours.
// Present/Extra Full Day = 9h base; Extra Half Day/Leave Half Day = 4h base; else 0.
// For interns: attendance is a free-text numeric (e.g. "9", "8.5") — used directly as base.
function _attEffHours(att, extra) {
  var ex = parseFloat(extra) || 0;
  var base = { 'Present': 9, 'Extra Full Day': 9, 'Extra Half Day': 4, 'Leave Half Day': 4 };
  if (base[att] !== undefined) return base[att] + ex;
  var numericAtt = parseFloat(att);
  if (att && !isNaN(numericAtt) && numericAtt > 0) return numericAtt + ex;
  return ex;
}
var WL_PICKER_OPEN       = null;  // 'h1-iso' | 'h2-iso' currently open
var WL_DOC_LISTENER_DONE = false;

// Local YYYY-MM-DD from a Date object (avoids UTC-offset date shift for IST users)
function _localIso(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
// Parse a server-side date value (ISO UTC string or plain text) to local YYYY-MM-DD
function _dateIso(v) {
  if (!v) return '';
  var d = new Date(String(v));
  return isNaN(d.getTime()) ? '' : _localIso(d);
}
function _wlIso(d) { return _localIso(d); }

function _wlMonday(d) {
  var day = new Date(d);
  var offset = (day.getDay() + 6) % 7;   // Mon=0 … Sun=6
  day.setDate(day.getDate() - offset);
  return day;
}

function _wlWeekDays() {
  var mon = _wlMonday(WL_ANCHOR || new Date());
  var days = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(mon);
    d.setDate(mon.getDate() + i);
    days.push(_wlIso(d));
  }
  return days;
}

function _wlMonthDays() {
  var anchor = WL_ANCHOR || new Date();
  var y = anchor.getFullYear(), m = anchor.getMonth();
  var days = [];
  for (var day = new Date(y, m, 1); day.getMonth() === m; day.setDate(day.getDate() + 1))
    days.push(_wlIso(new Date(day)));
  return days;
}

function _wlCurrentDays() {
  return WL_MODE === 'month' ? _wlMonthDays() : _wlWeekDays();
}

function _wlRangeLabel() {
  if (WL_MODE === 'month') {
    var a = WL_ANCHOR || new Date();
    var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return MONTHS[a.getMonth()] + ' ' + a.getFullYear();
  }
  var days = _wlWeekDays();
  return fmtDate(days[0]) + ' – ' + fmtDate(days[6]);
}

function setWLMode(mode) {
  WL_MODE = mode;
  ['week','month'].forEach(function(m) {
    var b = el('wl-mode-' + m); if (b) b.classList.toggle('active', m === mode);
  });
  loadMyWorkLogs();
}

var WL_ATTENDANCE_OPTIONS   = ['Present','Leave Full Day','Leave Half Day','Alternate Week Off','Week Off','Holiday','Extra Full Day','Extra Half Day'];
var WL_LEAVE_OPTIONS = ['','Planned Leave','Sick Leave','Casual Leave','Emergency Leave','Other'];
var WL_STATUS_OPTIONS= ['','Tentative','On Time','Late','Absent','Half Day'];
// Leave Full Day / Leave Half Day → show Leave Type + Leave Requested fields
var WL_LEAVE_TYPES   = ['Leave Full Day','Leave Half Day'];
// Week Off / Holiday / Alternate Week Off → fully off, disable work fields
var WL_OFF_TYPES     = ['Week Off','Holiday','Alternate Week Off'];
var WL_OFF_DAY_TYPES  = WL_OFF_TYPES;                               // canonical alias
var WL_ALWAYS_OT_TYPES = ['Extra Full Day','Extra Half Day'];        // always show +OT badge

// Canonical 8 attendance options — single source of truth for abbr + colour
var WL_ATTENDANCE_STYLES = {
  'Present':            { abbr:'P',  bg:'#dcfce7', text:'#15803d' },
  'Leave Full Day':     { abbr:'LF', bg:'#fecdd3', text:'#be123c' },
  'Leave Half Day':     { abbr:'LH', bg:'#fed7aa', text:'#c2410c' },
  'Alternate Week Off': { abbr:'AW', bg:'#fde68a', text:'#92400e' },
  'Week Off':           { abbr:'W',  bg:'#fce7f3', text:'#9d174d' },
  'Holiday':            { abbr:'H',  bg:'#bfdbfe', text:'#1d4ed8' },
  'Extra Full Day':     { abbr:'EF', bg:'#14532d', text:'#ffffff' },
  'Extra Half Day':     { abbr:'EH', bg:'#065f46', text:'#ffffff' },
};
function _wlAttendanceAbbr(att) {
  var s = WL_ATTENDANCE_STYLES[att];
  return s ? s.abbr : '—';
}
function _wlAttendanceColor(att, hasOffDayWork) {
  if (!att) return '#f3f4f6';
  if (WL_OFF_DAY_TYPES.indexOf(att) !== -1 && hasOffDayWork) return '#d1fae5';
  var s = WL_ATTENDANCE_STYLES[att];
  return s ? s.bg : '#e5e7eb';
}
function _wlAttendanceTextColor(att, hasOffDayWork) {
  if (!att) return '#9ca3af';
  if (WL_OFF_DAY_TYPES.indexOf(att) !== -1 && hasOffDayWork) return '#065f46';
  var s = WL_ATTENDANCE_STYLES[att];
  return s ? s.text : '#374151';
}
// Single OT-badge rule shared by personal WL and team modal
function _wlShowsOtBadge(att, extraHrs, isOffDayWorked) {
  if (WL_ALWAYS_OT_TYPES.indexOf(att) !== -1) return true;
  if (isOffDayWorked) return true;
  if (parseFloat(extraHrs || 0) > 0) return true;
  return false;
}

// Returns a ±8-week window around WL_ANCHOR for server-side date filtering.
// Uses _localIso (not .toISOString) to stay in IST and avoid date-shift on late evenings.
function _wlDateRange() {
  var anchor = WL_ANCHOR || new Date();
  return {
    start: _localIso(new Date(anchor.getTime() - 8 * 7 * 86400000)),
    end:   _localIso(new Date(anchor.getTime() + 2 * 7 * 86400000))
  };
}

// True if the current WL_ANCHOR week falls outside the already-loaded date range.
function _wlNeedsReload() {
  if (!WL_LOADED_START || !WL_LOADED_END) return true;
  var days = _wlCurrentDays();
  return days[0] < WL_LOADED_START || days[days.length - 1] > WL_LOADED_END;
}

function loadMyWorkLogs() {
  if (!WL_ANCHOR) WL_ANCHOR = new Date();
  WL_ITEMS     = {};
  WL_MTGS      = {};
  WL_AUTO_HRS  = {};
  WL_DURATIONS = {};
  el('wl-week-label').textContent = _wlRangeLabel();
  el('wl-week-sub').textContent   = _wlRangeLabel();
  el('my-work-log-history').innerHTML = '<div class="empty-state"><div class="ei material-symbols-outlined">hourglass_empty</div><p>Loading…</p></div>';

  // Register document click listener once — closes open picker
  if (!WL_DOC_LISTENER_DONE) {
    WL_DOC_LISTENER_DONE = true;
    document.addEventListener('click', function(e) {
      if (WL_PICKER_OPEN && !e.target.closest('.wl-picker-drop') && !e.target.closest('.wl-add-item-btn')) {
        var prev = el('wl-picker-' + WL_PICKER_OPEN);
        if (prev) prev.style.display = 'none';
        WL_PICKER_OPEN = null;
      }
    }, true);
  }

  var days      = _wlCurrentDays();
  var startDate = days[0];
  var endDate   = days[days.length - 1];

  // Wider range for work-log fetch — enables lazy navigation within ±8 weeks without re-fetching
  var wlRange = _wlDateRange();

  // Phase 1: fetch work logs and render immediately (no waiting for Calendar API).
  // Phase 2: meetings load async in background, update chips + HRS without re-render.
  google.script.run
    .withSuccessHandler(function(logs) {
      // Record loaded range for lazy navigation
      WL_LOADED_START = wlRange.start;
      WL_LOADED_END   = wlRange.end;
      WL_DATA  = {};
      WL_DIRTY = {};
      (logs || []).forEach(function(l) {
        var iso = _dateIso(l.Date);
        if (!iso) return;
        var entry = {
          logId:        l.Log_ID                                                      || '',
          attendance:   l.Attendance                                                  || 'Present',
          leaveType:    l.Purpose                    || l.Leave_Type                  || '',
          leaveReq:     l['Leave Requested']         || l.Leave_Requested             || '',
          work1:        l['Work Update - 1st Half']  || l.Work_1st_Half || l.Description || '',
          work2:        l['Work Update - 2nd Half']  || l.Work_2nd_Half               || '',
          extraHrs:     l['Extra Hours']             || l.Extra_Hours   || l.Hours_Total || '',
          remark:       l.Remark                     || l.Blockers                    || '',
          status:       l.Status                                                      || '',
          adminComments:l.Comments                   || l.Admin_Comments              || ''
        };
        var existing = WL_DATA[iso];
        if (!existing) {
          WL_DATA[iso] = entry;
        } else {
          var existingLen = (existing.work1 || '').length + (existing.work2 || '').length;
          var newLen      = (entry.work1    || '').length + (entry.work2    || '').length;
          if (newLen > existingLen) WL_DATA[iso] = entry;
        }
      });
      // Initialise chip state; render without meetings (fast path)
      days.forEach(function(iso) {
        WL_ITEMS[iso + ':h1'] = WL_ITEMS[iso + ':h1'] || [];
        WL_ITEMS[iso + ':h2'] = WL_ITEMS[iso + ':h2'] || [];
      });
      renderWeekLog();
      // Phase 2: load meetings in background and update UI without blocking
      _wlLoadMeetingsAsync(days, startDate, endDate);
      // Phase 3: load work durations in background — updates chips in wl-comments-cell
      try { _wlLoadDurationsAsync(wlRange.start, wlRange.end); } catch(_e) {}
    })
    .withFailureHandler(function(err) {
      el('my-work-log-history').innerHTML =
        '<div class="empty-state"><div class="ei material-symbols-outlined">error_outline</div><p>' + esc(err.message || 'Failed to load work log') + '</p></div>';
    })
    [APP.currentUser.role === 'Intern' ? 'getInternWorkLogs' : 'getMyWorkLogs'](APP.currentUser.email, wlRange.start, wlRange.end);
}

// Phase 2: fetch meetings async and update chips + HRS after WL is already rendered.
// Silently fails — work log is fully functional without meetings.
function _wlLoadMeetingsAsync(days, startDate, endDate) {
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok) return;
      (r.meetings || []).forEach(function(m) {
        if (!WL_MTGS[m.date]) WL_MTGS[m.date] = [];
        WL_MTGS[m.date].push(m);
      });
      // wlAutoAddMeetings populates WL_ITEMS (meeting chips) and WL_AUTO_HRS
      wlAutoAddMeetings(days);
      // Re-render only chip containers and update HRS inputs — no full row re-render
      days.forEach(function(iso) {
        wlRenderChips(iso, 'h1');
        wlRenderChips(iso, 'h2');
        var hrs = WL_AUTO_HRS[iso];
        if (!hrs) return;
        var hrsEl = el('wl-hc-' + iso);
        if (hrsEl && !hrsEl.value) hrsEl.value = String(hrs);
      });
    })
    .withFailureHandler(function() { /* silent — work log works without meetings */ })
    .getMeetingsForRange(startDate, endDate, APP.currentUser.email);
}

function renderWeekLog() {
  WL_RENDERING = true;
  var days         = _wlCurrentDays();
  var today        = _wlIso(new Date());
  var DN           = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var isAdmin      = _canEditWlStatus(APP.currentUser.role); // SA/Admin/TC/TF can edit status+comments
  var isInternUser = APP.currentUser.role === 'Intern';

  function selOpts(opts, val) {
    return opts.map(function(o) {
      return '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(o || '—') + '</option>';
    }).join('');
  }

  var rows = days.map(function(iso) {
    var d       = new Date(iso + 'T00:00:00');
    var dow     = d.getDay();
    var isWknd  = (dow === 0 || dow === 6);
    var isTdy   = (iso === today);
    var data    = WL_DATA[iso] || {};
    var att     = data.attendance;
    // Pre-fill attendance when no saved log exists
    if (!att && !data.logId) {
      if      (dow === 0)                             att = 'Week Off';
      else if (dow === 6 && _isAltWeekSat(iso))      att = 'Alternate Week Off';
      else if (TL_HOLIDAYS.indexOf(iso) !== -1)      att = 'Holiday';
      else                                            att = '';
    }
    att = att || '';
    var isLeave = isInternUser ? false : WL_LEAVE_TYPES.indexOf(att) !== -1;
    var isOff   = isInternUser ? (att !== '' && _internIsOffDayText(att)) : WL_OFF_TYPES.indexOf(att) !== -1;
    var isDirty  = !!WL_DIRTY[iso];
    var isSaving = !!WL_SAVING[iso];

    // Future dates are locked for non-admin employees
    var isFuture = !isAdmin && iso > today;

    var dayLbl = DN[dow] + ' ' + iso.substring(8);
    var rowCls = 'wl-row' +
      (isTdy    ? ' wl-row-today'  : '') +
      (isWknd   ? ' wl-row-wknd'   : '') +
      (isOff    ? ' wl-row-off'    : '') +
      (isLeave  ? ' wl-row-leave'  : '') +
      (isFuture ? ' wl-row-future' : '');

    // Off-day work detection: logId + (work content OR ≥2 extra hours)
    var hasOffDayWork = isOff && !!data.logId && (!!(data.work1) || !!(data.work2) || parseFloat(data.extraHrs || 0) >= 2);
    // Disable work fields for off-days unless the employee logged work on that day
    var disWork = isOff && !hasOffDayWork ? ' disabled' : '';

    // Attendance input — text field for interns, dropdown for regular employees
    var attSel = isInternUser
      ? '<input type="text" class="wl-inp wl-att-sel" id="wl-att-' + iso + '"' +
          ' value="' + esc(att) + '" placeholder="e.g. 9, 8.5, Holiday, Leave"' +
          ' oninput="_internWlOnAttendanceChange(this,\'' + iso + '\')"' +
          ' onblur="wlMarkDirty(\'' + iso + '\')"' +
          (isFuture ? ' disabled' : '') + ' style="width:100%;min-width:0">'
      : '<select class="wl-inp wl-att-sel" id="wl-att-' + iso + '" ' +
          'onchange="wlOnAttendanceChange(\'' + iso + '\')">' +
          selOpts(WL_ATTENDANCE_OPTIONS, att) + '</select>';

    // Hours-worked calculator (inline under attendance dropdown) — hidden for interns
    // Pre-fill from: (1) existing log extra-hours reconstruction, (2) meeting-derived auto-hours
    var hrsPreFill = '';
    if (!isInternUser) {
      if (data.logId) {
        var savedEff = _attEffHours(data.attendance, data.extraHrs);
        if (savedEff > 0) hrsPreFill = String(savedEff);
      } else if (WL_AUTO_HRS[iso] && iso <= today) {
        hrsPreFill = String(WL_AUTO_HRS[iso]);
      }
    }
    var hrsCalc = isInternUser
      ? ('<div id="wl-intern-hrs-' + iso + '" style="font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-top:3px">'
        + (att && !isNaN(parseFloat(att)) && parseFloat(att) > 0 ? parseFloat(att) + ' hrs' : '—') + '</div>')
      : (
      '<div class="wl-hc-wrap">' +
      '<div class="wl-hc-row1">' +
        '<span class="wl-hc-lbl">Hrs</span>' +
        '<input type="number" class="wl-hc-inp" id="wl-hc-' + iso + '"' +
          ' min="0" max="16" step="0.5" placeholder="—"' +
          ' title="Total hours worked (0.5 steps) → auto-calculates attendance &amp; extra hours"' +
          (hrsPreFill ? ' value="' + hrsPreFill + '"' : '') +
          ' oninput="wlHrsPreview(\'' + iso + '\')"' +
          ' onblur="wlApplyHrs(\'' + iso + '\')"' +
          ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();wlApplyHrs(\'' + iso + '\')}"' +
          (isFuture ? ' disabled' : '') + '/>' +
        '<span class="wl-hc-pre" id="wl-hc-pre-' + iso + '"></span>' +
      '</div>' +
      '</div>');

    // Off-day "Worked today" toggle — always rendered (hidden for non-off rows) so wlOnAttendanceChange can reveal it
    // +OT badge: show for Extra Full/Half Day, any row with extra hrs > 0, or off-day with work logged
    var _showOt = _wlShowsOtBadge(att, data.extraHrs, isOff && hasOffDayWork);
    var offDayOtBadge = '<span id="wl-ot-badge-' + iso + '" class="wl-ot-badge"'
      + (_showOt ? '' : ' style="display:none"') + '>+OT</span>';
    var offDayToggle = '<div id="wl-odt-' + iso + '" class="wl-offday-toggle"'
      + (!isOff ? ' style="display:none"' : '')
      + '>'
      + '<label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:11.5px;color:#6b7280">'
      + '<input type="checkbox" id="wl-odc-' + iso + '"'
      + ' onchange="_wlToggleOffDayWork(this,\'' + iso + '\')"'
      + (hasOffDayWork ? ' checked' : '')
      + ' style="width:13px;height:13px;accent-color:#6366f1;cursor:pointer">'
      + '<span>Worked today</span>'
      + '</label>'
      + '<span id="wl-odc-warn-' + iso + '" style="display:none;font-size:11px;color:#dc2626;margin-left:6px">Min 2 hrs</span>'
      + '</div>';

    // 1st half cell — dual purpose
    var h1Work  = _wlBuildCell(iso, 'h1', data, !!disWork);
    var h1Leave = '<select class="wl-inp" id="wl-lt-' + iso + '" ' +
      'onchange="wlMarkDirty(\'' + iso + '\')">' +
      selOpts(WL_LEAVE_OPTIONS, data.leaveType) + '</select>';
    var isFullLeave = att === 'Leave Full Day';
    var offDayHideWork = isOff && !hasOffDayWork;
    var h1Cell = '<div id="wl-h1-work-' + iso + '"' + (isFullLeave || offDayHideWork ? ' style="display:none"' : '') + '>' + h1Work + '</div>' +
                 '<div id="wl-h1-leave-' + iso + '"' + (!isLeave ? ' style="display:none"' : '') + '>' + h1Leave + '</div>';

    // 2nd half cell — dual purpose
    var h2Work  = _wlBuildCell(iso, 'h2', data, !!disWork);
    var h2Leave = '<select class="wl-inp" id="wl-lr-' + iso + '" onchange="wlMarkDirty(\'' + iso + '\')">' +
      selOpts(['','Same Day','One Day Before','Within Same Week','One Week Before'], data.leaveReq) + '</select>';
    // Leave Full Day: work hidden, leave request shown; Leave Half Day: both shown; Present: only work shown
    var h2Cell = '<div id="wl-h2-work-' + iso + '"' + (isFullLeave || offDayHideWork ? ' style="display:none"' : '') + '>' + h2Work + '</div>' +
                 '<div id="wl-h2-leave-' + iso + '"' + (!isLeave ? ' style="display:none"' : '') + '>' + h2Leave + '</div>';

    // Extra hours
    var ehCell = '<input type="number" class="wl-inp wl-hrs-inp" id="wl-eh-' + iso + '" ' +
      'value="' + esc(String(data.extraHrs || '')) + '" min="0" max="12" step="0.5" placeholder="0" ' +
      'oninput="wlMarkDirty(\'' + iso + '\');_wlUpdateOtBadge(\'' + iso + '\')" onblur="_wlOnBlur(\'' + iso + '\')"' + disWork + '/>';

    // Remark
    var rmCell = '<input type="text" class="wl-inp" id="wl-rm-' + iso + '" ' +
      'value="' + esc(data.remark || '') + '" placeholder="Remark…" ' +
      'oninput="wlMarkDirty(\'' + iso + '\')" onblur="_wlOnBlur(\'' + iso + '\')"/>';

    // Status (admin/manager editable — direct save; employee read-only)
    var stCell;
    if (isAdmin) {
      stCell = '<select class="wl-inp wl-status-sel" id="wl-st-' + iso + '"'
        + ' data-date="' + iso + '"'
        + ' data-emp="' + esc(APP.currentUser.empId) + '"'
        + ' onchange="_wlSaveStatus(this)">'
        + selOpts(WL_STATUS_OPTIONS, data.status) + '</select>';
    } else {
      var stLabel = data.status || '—';
      var stCls   = data.status === 'On Time'   ? 'wl-badge-ok' :
                    data.status === 'Late'       ? 'wl-badge-warn' :
                    data.status === 'Absent'     ? 'wl-badge-danger' :
                    data.status === 'Tentative'  ? 'wl-badge-tentative' : 'wl-badge-none';
      stCell = '<span class="wl-status-badge ' + stCls + '">' + esc(stLabel) + '</span>';
    }

    // Admin Comments (admin editable — direct save; employee read-only)
    var acCell = isAdmin
      ? '<input type="text" class="wl-inp wl-admin-inp" id="wl-ac-' + iso + '"'
        + ' data-date="' + iso + '"'
        + ' data-emp="' + esc(APP.currentUser.empId) + '"'
        + ' value="' + esc(data.adminComments || '') + '" placeholder="Admin notes…"'
        + ' onchange="_wlSaveComment(this)"/>'
      : '<span class="wl-admin-note">' + esc(data.adminComments || '') + '</span>';

    var btnCls  = 'wl-save-btn' + (isSaving ? '' : isDirty ? ' dirty' : data.logId ? ' saved' : '');
    var btnIcon = isSaving ? icon('sync') : isDirty ? icon('save') : data.logId ? icon('check') : '—';

    return '<tr class="' + rowCls + '" id="wl-tr-' + iso + '">' +
      '<td class="wl-day-cell"><div class="wl-day-name">' + dayLbl + '</div>' +
        (isTdy    ? '<div class="wl-day-today-badge">Today</div>' : '') +
        (isFuture ? '<div class="wl-future-lbl">Upcoming</div>'  : '') +
        offDayOtBadge + '</td>' +
      '<td class="wl-att-cell">' + attSel + hrsCalc + offDayToggle + '</td>' +
      '<td class="wl-h1-cell">' + h1Cell + '</td>' +
      '<td class="wl-h2-cell">' + h2Cell + '</td>' +
      '<td class="wl-extra-cell">' + ehCell + '</td>' +
      '<td class="wl-remark-cell">' + rmCell + '</td>' +
      '<td class="wl-status-cell">' + stCell + '</td>' +
      '<td class="wl-comments-cell">' + acCell + _wlDurHtml(iso, null) + '</td>' +
      '<td class="wl-save-cell">' +
        (isInternUser ? '' :
          '<button class="' + btnCls + '" id="wl-save-btn-' + iso + '" ' +
          'onclick="saveWeekEntry(\'' + iso + '\')"' + (isSaving ? ' disabled' : '') + '>' + btnIcon + '</button>') +
        '<span id="wl-as-' + iso + '" style="font-size:11px;color:var(--muted);margin-left:4px;min-width:56px;display:inline-block;vertical-align:middle;"></span></td>' +
    '</tr>';
  }).join('');

  el('my-work-log-history').innerHTML =
    '<div class="wl-week-wrap"><table class="wl-week-table">' +
    '<thead><tr>' +
      '<th class="wl-day-cell">Day</th>' +
      '<th class="wl-att-cell">Attendance</th>' +
      '<th class="wl-h1-cell">Work Update — 1st Half</th>' +
      '<th class="wl-h2-cell">Work Update — 2nd Half</th>' +
      '<th class="wl-extra-cell">Extra Hrs</th>' +
      '<th class="wl-remark-cell">Remark</th>' +
      '<th class="wl-status-cell">Status</th>' +
      '<th class="wl-comments-cell">Comments</th>' +
      '<th class="wl-save-cell"></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';

  // Pre-populate WL_ITEMS from saved work text so existing items render as chips, not raw textarea text.
  // Splits by '; ' (canonical delimiter). Must run BEFORE _wlRenderAllChips().
  days.forEach(function(iso) {
    var data = WL_DATA[iso] || {};
    [['h1','work1'],['h2','work2']].forEach(function(pair) {
      var half = pair[0], field = pair[1];
      var stored = (data[field] || '').trim();
      if (!stored) return;
      stored.split('; ').forEach(function(text) {
        text = text.trim();
        // Restore literal \n stored in sheet back to actual newlines
        text = text.replace(/\\n/g, '\n');
        if (text) wlAddItem(iso, half, 'custom', '', text);
      });
    });
  });

  _wlRenderAllChips();
  // Fix 3: apply CSS-override for off-day rows that already have saved work — checkbox renders
  // checked but .wl-row-off CSS (pointer-events:none; opacity:.45) is still active without this call.
  days.forEach(function(iso) {
    var chk = el('wl-odc-' + iso);
    if (chk && chk.checked) _wlToggleOffDayWork(chk, iso, { skipFocus: true });
  });
  // Fix 4 (intern): restore enabled/disabled state for intern rows that already have a saved value.
  // Without this, a previously saved "9" renders with all work fields disabled until the user types again.
  if (isInternUser) {
    days.forEach(function(iso) {
      var attEl = el('wl-att-' + iso);
      if (attEl && attEl.value.trim()) _internWlOnAttendanceChange(attEl, iso);
    });
  }
  try { _wlApplyDurations(); } catch(_e) {}
  WL_RENDERING = false;
}

// Show/hide the per-row +OT badge based on current attendance and extra-hours value.
// Always call after att or extra-hrs changes so the badge stays in sync.
function _wlUpdateOtBadge(iso) {
  var badgeEl = el('wl-ot-badge-' + iso);
  if (!badgeEl) return;
  var att      = (el('wl-att-' + iso) || {}).value || '';
  var ehEl     = el('wl-eh-' + iso);
  var extraHrs = parseFloat((ehEl && ehEl.value) || '0') || 0;
  var odcEl    = el('wl-odc-' + iso);
  var isOffDayWorked = !!(odcEl && odcEl.checked);
  badgeEl.style.display = _wlShowsOtBadge(att, extraHrs, isOffDayWorked) ? 'inline' : 'none';
}

function wlOnAttendanceChange(iso) {
  var att         = (el('wl-att-' + iso) || {}).value || '';
  var isLeave     = WL_LEAVE_TYPES.indexOf(att) !== -1;
  var isFullLeave = att === 'Leave Full Day';
  var isOff       = WL_OFF_TYPES.indexOf(att)   !== -1;

  // Off-day toggle: show/hide container; work visibility depends on checkbox state
  var odtEl     = el('wl-odt-' + iso);
  var odcEl     = el('wl-odc-' + iso);
  var offWorked = isOff && !!(odcEl && odcEl.checked);
  if (odtEl) odtEl.style.display = isOff ? '' : 'none';
  // When switching away from off-type, uncheck the toggle so re-switching starts fresh
  if (!isOff && odcEl) odcEl.checked = false;

  function tog(id, show) { var e = el(id); if (e) e.style.display = show ? '' : 'none'; }
  // Work fields: visible unless full-day leave, or off-day with "Worked today" unchecked
  var showWork = !isOff || offWorked;
  tog('wl-h1-work-'  + iso, showWork && !isFullLeave);
  tog('wl-h1-leave-' + iso, isLeave);
  tog('wl-h2-work-'  + iso, showWork && !isFullLeave);
  tog('wl-h2-leave-' + iso, isLeave);

  // Disable extra-hrs and work inputs when off-day and "Worked today" is not checked
  var disableWork = isOff && !offWorked;
  var ehEl = el('wl-eh-' + iso); if (ehEl) ehEl.disabled = disableWork;
  ['h1','h2'].forEach(function(half) {
    var wrap = el('wl-upd-' + half + '-' + iso);
    if (!wrap) return;
    wrap.querySelectorAll('input, button, textarea').forEach(function(inp) {
      inp.disabled = disableWork;
    });
  });

  // Row colour class
  var tr = el('wl-tr-' + iso);
  if (tr) {
    tr.classList.remove('wl-row-off', 'wl-row-leave');
    if (isOff)   tr.classList.add('wl-row-off');
    if (isLeave) tr.classList.add('wl-row-leave');
  }
  _wlUpdateOtBadge(iso);
  if (!WL_RENDERING) { wlMarkDirty(iso); _wlAutoSave(iso); }
}

// Commit all open personal WL textarea inputs as chips and save dirty rows before navigating.
// Uses data-iso/data-half attributes added to .wl-cust-inp elements.
// saveWeekEntry fires async (fire-and-forget) — safe to navigate immediately after.
function _wlCommitAllTextareas() {
  document.querySelectorAll('.wl-cust-inp[data-iso]').forEach(function(inp) {
    if (!inp.value.trim()) return;
    var iso  = inp.getAttribute('data-iso');
    var half = inp.getAttribute('data-half');
    if (iso && half) wlAddCustom(iso, half); // adds chip + marks dirty
  });
  // Save all dirty rows now (fire-and-forget before navigation resets frontend state)
  Object.keys(WL_DIRTY).forEach(function(iso) {
    if (WL_DIRTY[iso] && !WL_SAVING[iso]) saveWeekEntry(iso, true);
  });
}

function wlNav(delta) {
  _wlCommitAllTextareas(); // commit typed content before navigating
  Object.keys(WL_DEBOUNCE).forEach(function(k){ if (WL_DEBOUNCE[k]) clearTimeout(WL_DEBOUNCE[k]); }); WL_DEBOUNCE = {};
  var d = new Date(WL_ANCHOR || new Date());
  if (WL_MODE === 'month') d.setMonth(d.getMonth() + delta);
  else d.setDate(d.getDate() + delta * 7);
  WL_ANCHOR = d;
  if (_wlNeedsReload()) {
    loadMyWorkLogs(); // outside loaded range — fetch from server
  } else {
    // Within loaded range — render from existing WL_DATA (no server call)
    el('wl-week-label').textContent = _wlRangeLabel();
    el('wl-week-sub').textContent   = _wlRangeLabel();
    var days = _wlCurrentDays();
    // Reset WL_ITEMS for this week to prevent duplicate chips on revisit
    days.forEach(function(iso) { WL_ITEMS[iso + ':h1'] = []; WL_ITEMS[iso + ':h2'] = []; });
    wlAutoAddMeetings(days);
    renderWeekLog();
  }
}

function wlNavToday() {
  _wlCommitAllTextareas(); // commit typed content before navigating
  Object.keys(WL_DEBOUNCE).forEach(function(k){ if (WL_DEBOUNCE[k]) clearTimeout(WL_DEBOUNCE[k]); }); WL_DEBOUNCE = {};
  WL_ANCHOR = new Date();
  if (_wlNeedsReload()) {
    loadMyWorkLogs();
  } else {
    el('wl-week-label').textContent = _wlRangeLabel();
    el('wl-week-sub').textContent   = _wlRangeLabel();
    var days = _wlCurrentDays();
    days.forEach(function(iso) { WL_ITEMS[iso + ':h1'] = []; WL_ITEMS[iso + ':h2'] = []; });
    wlAutoAddMeetings(days);
    renderWeekLog();
  }
}

// Standalone save for Status dropdown (called from manager-view WL status select)
function _wlSaveStatus(selectEl) {
  var dateKey   = selectEl.dataset.date;
  var empId     = selectEl.dataset.emp;
  var newStatus = selectEl.value === '—' ? '' : selectEl.value;
  selectEl.disabled = true;
  google.script.run
    .withSuccessHandler(function() { selectEl.disabled = false; })
    .withFailureHandler(function(err) {
      selectEl.disabled = false;
      var msg = (err && err.message) || 'unknown';
      if (msg.indexOf('not found') !== -1) {
        // No saved entry yet — mark dirty so status is included when the full row is saved
        if (dateKey) wlMarkDirty(dateKey);
        toast('Status will be saved when you click Save for this row.', 'info');
      } else {
        toast('Failed to save status: ' + msg, 'error');
      }
    })
    .updateWorkLogStatus(empId, dateKey, newStatus, APP._verifiedEmail);
}

// Standalone save for Comments input
function _wlSaveComment(inputEl) {
  var dateKey    = inputEl.dataset.date;
  var empId      = inputEl.dataset.emp;
  var newComment = inputEl.value.trim();
  google.script.run
    .withSuccessHandler(function() {})
    .withFailureHandler(function(err) {
      var msg = (err && err.message) || 'unknown';
      if (msg.indexOf('not found') !== -1) {
        if (dateKey) wlMarkDirty(dateKey);
        toast('Comment will be saved when you click Save for this row.', 'info');
      } else {
        toast('Failed to save comment: ' + msg, 'error');
      }
    })
    .updateWorkLogComment(empId, dateKey, newComment, APP._verifiedEmail);
}

function wlMarkDirty(iso) {
  WL_DIRTY[iso] = true;
  _wlUpdateSaveBtn(iso);
}

// ── Work Duration display helpers ──────────────────────────────────────────────

// Returns the duration HTML snippet for a given iso date (personal WL) or empId:date (team log).
// empId is null for personal WL (uses WL_DURATIONS), a string for team log (uses TL_DURATIONS).
// Always renders — shows '—' when no data, 'HH:MM:SS' when data is present.
function _wlDurHtml(iso, empId) {
  var idSuffix = empId ? (empId + '-' + iso) : iso;
  var val = empId ? (TL_DURATIONS[empId + ':' + iso] || '') : (WL_DURATIONS[iso] || '');
  var hasVal = val && val !== '00:00:00';
  var spanStyle = hasVal
    ? 'font-size:12px;font-weight:500;color:var(--color-text-primary)'
    : 'font-size:12px;font-weight:500;color:var(--color-text-secondary)';
  var spanContent = hasVal ? esc(val) : '&mdash;';
  return '<div id="wl-dur-wrap-' + idSuffix + '" ' +
    'style="margin-top:5px;padding-top:5px;border-top:0.5px solid var(--color-border-tertiary);">' +
    '<div style="display:flex;align-items:center;gap:5px;">' +
    '<i class="ti ti-clock-hour-4" aria-hidden="true" ' +
    'style="font-size:13px;color:var(--color-text-secondary);flex-shrink:0;"></i>' +
    '<span style="font-size:11px;color:var(--color-text-secondary);">Work duration</span>' +
    '<span id="wl-dur-' + idSuffix + '" style="' + spanStyle + '">' + spanContent + '</span>' +
    '</div></div>';
}

// Phase 3 for personal WL: patch duration spans in already-rendered rows.
// Days in WL_DURATIONS get their real value; days not in WL_DURATIONS keep the default '—'.
function _wlApplyDurations() {
  Object.keys(WL_DURATIONS).forEach(function(iso) {
    var span = document.getElementById('wl-dur-' + iso);
    if (!span) return;
    var hms = WL_DURATIONS[iso];
    if (!hms || hms === '00:00:00') {
      span.textContent = '—';
      span.style.color = 'var(--color-text-secondary)';
    } else {
      span.textContent = hms;
      span.style.color = 'var(--color-text-primary)';
      span.style.fontWeight = '500';
    }
  });
}

// Phase 3 async loader — personal WL.
function _wlLoadDurationsAsync(startDate, endDate) {
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok || !r.data) return;
      Object.assign(WL_DURATIONS, r.data);
      try { _wlApplyDurations(); } catch(_e) {}
    })
    .withFailureHandler(function() {})
    .getWorkDurationsForDates(APP.currentUser.email, startDate, endDate);
}

// Patch team log duration spans from TL_DURATIONS (flat 'empId:iso' → 'HH:MM:SS' map).
function _tlApplyDurations() {
  Object.keys(TL_DURATIONS).forEach(function(key) {
    var parts = key.split(':');
    if (parts.length < 2) return;
    var empId = parts[0];
    var iso   = parts.slice(1).join(':');

// Show auto-save status for a row.
// prefix: 'wl' for personal WL, 'ml' for team modal.
// state: 'saving' | 'saved' | 'error'
function _wlAsStatus(prefix, iso, state) {
  var el2 = document.getElementById(prefix + '-as-' + iso);
  if (!el2) return;
  if (state === 'saving') {
    el2.textContent     = 'Saving…';
    el2.style.color     = 'var(--muted)';
    el2.style.fontStyle = 'italic';
  } else if (state === 'saved') {
    el2.textContent     = 'Saved ✓';
    el2.style.color     = 'var(--ok)';
    el2.style.fontStyle = 'normal';
    setTimeout(function() { if (el2) el2.textContent = ''; }, 2500);
  } else if (state === 'error') {
    el2.textContent     = 'Save failed';
    el2.style.color     = 'var(--danger)';
    el2.style.fontStyle = 'normal';
  }
}

function _wlToggleOffDayWork(chk, iso, opts) {
  var worked    = chk.checked;
  var skipFocus = opts && opts.skipFocus;

  // Walk up to the enclosing <tr> via DOM traversal — avoids hardcoded ID assumptions
  var row = chk.closest('tr') || el('wl-tr-' + iso);
  if (!row) { console.warn('_wlToggleOffDayWork: row not found for', iso); return; }

  // Show/hide work-update divs and override CSS .wl-row-off rules via inline styles.
  // CSS rules: .wl-row-off .wl-upd-wrap{pointer-events:none;opacity:.45}
  //            .wl-row-off .wl-inp:not(.wl-att-sel){opacity:.45;pointer-events:none}
  // Setting '' clears the inline override and lets the CSS rule re-apply when unchecked.
  ['h1', 'h2'].forEach(function(half) {
    var workDiv = el('wl-h' + (half === 'h1' ? '1' : '2') + '-work-' + iso);
    if (workDiv) workDiv.style.display = worked ? '' : 'none';

    var wrap = el('wl-upd-' + half + '-' + iso);
    if (!wrap) return;
    wrap.style.pointerEvents = worked ? 'auto' : '';
    wrap.style.opacity       = worked ? '1'    : '';

    wrap.querySelectorAll('input, button, textarea').forEach(function(inp) {
      if (inp === chk || inp.type === 'hidden') return;
      inp.disabled            = !worked;
      inp.style.pointerEvents = worked ? 'auto' : '';
      inp.style.opacity       = worked ? '1'    : '';
    });
  });

  // Extra hours input lives in its own column outside the work wraps
  var ehEl = el('wl-eh-' + iso);
  if (ehEl) {
    ehEl.disabled            = !worked;
    ehEl.style.pointerEvents = worked ? 'auto' : '';
    ehEl.style.opacity       = worked ? '1'    : '';
    if (!worked) ehEl.value  = '';
    if (worked && !skipFocus) setTimeout(function() { ehEl.focus(); ehEl.select(); }, 60);
  }

  _wlUpdateOtBadge(iso);

  if (!worked) {
    // Clear committed chips so auto-save sends empty work content
    WL_ITEMS[iso + ':h1'] = [];
    WL_ITEMS[iso + ':h2'] = [];
    wlRenderChips(iso, 'h1');
    wlRenderChips(iso, 'h2');
    wlMarkDirty(iso);
    _wlAutoSave(iso);
  }
}

function _wlAutoSave(iso) {
  if (!iso) return;
  var _iso = iso;
  if (WL_DEBOUNCE[_iso]) { clearTimeout(WL_DEBOUNCE[_iso]); WL_DEBOUNCE[_iso] = null; }
  WL_DEBOUNCE[_iso] = setTimeout(function() {
    WL_DEBOUNCE[_iso] = null;
    if (!WL_DIRTY[_iso] || WL_SAVING[_iso]) return;
    _wlAsStatus('wl', _iso, 'saving');
    saveWeekEntry(_iso, true);
  }, 500);
}

function _mlAutoSave(iso) {
  if (!iso) return;
  var _iso = iso;
  // Show 'Saving…' immediately so the user sees feedback before the 500ms debounce fires
  if (!ML_SAVING[_iso]) _wlAsStatus('ml', _iso, 'saving');
  if (ML_DEBOUNCE[_iso]) { clearTimeout(ML_DEBOUNCE[_iso]); ML_DEBOUNCE[_iso] = null; }
  ML_DEBOUNCE[_iso] = setTimeout(function() {
    ML_DEBOUNCE[_iso] = null;
    if (!ML_DIRTY[_iso] || ML_SAVING[_iso]) return;
    _mlSaveEntry(_iso, true);
  }, 500);
}

// Blur handler for personal WL inputs. Called with (iso, half) from textarea blur,
// or (iso) from Extra Hours / Remark blur.
// Textarea blur: commits any typed content as a chip, then lets wlAddCustom's debounce save.
// Other fields: saves committed chips directly if dirty.
function _wlOnBlur(iso, half) {
  if (!iso) return;
  if (WL_DEBOUNCE[iso]) { clearTimeout(WL_DEBOUNCE[iso]); WL_DEBOUNCE[iso] = null; }
  if (half) {
    // Called from textarea blur — commit content if present
    var inp = el('wl-cust-' + half + '-' + iso);
    if (inp && inp.value.trim()) {
      wlAddCustom(iso, half); // adds chip + triggers _wlAutoSave (500ms debounce) for the save
      return;
    }
  }
  // No textarea content (or called from hrs/remark blur) — save committed chips if dirty
  if (!WL_DIRTY[iso] || WL_SAVING[iso]) return;
  _wlAsStatus('wl', iso, 'saving');
  saveWeekEntry(iso, true);
}

// Blur handler for team modal inputs. Called from textarea, hrs, and remark inputs.
// Textarea blur: commits typed content as chip, lets _mlAddItem's debounce save.
// Other fields: saves committed chips directly if dirty.
function _mlOnBlur(inputEl) {
  if (!inputEl) return;
  var iso  = inputEl.getAttribute('data-iso');
  var half = inputEl.getAttribute('data-half');
  if (!iso) return;
  if (ML_DEBOUNCE[iso]) { clearTimeout(ML_DEBOUNCE[iso]); ML_DEBOUNCE[iso] = null; }
  if (half && inputEl.tagName === 'TEXTAREA') {
    // Called from textarea blur — commit content if present
    if (inputEl.value.trim()) {
      _mlAddItem(iso, half); // adds chip + triggers _mlAutoSave (500ms debounce) for the save
      return;
    }
  }
  // No textarea content (or called from hrs/remark blur) — save committed chips if dirty
  if (!ML_DIRTY[iso] || ML_SAVING[iso]) return;
  _wlAsStatus('ml', iso, 'saving');
  _mlSaveEntry(iso, true);
}

function wlAutoResize(ta) {

}

// ── Work Log Hours Calculator ─────────────────────────────────────────────────
// Rules:
//   Regular day : <4h → Leave Full Day  | 4-<9h → Leave Half Day | ≥9h → Present
//   Off day     : <4h → keep H/WO/AWO   | 4-<9h → Extra Half Day | ≥9h → Extra Full Day
//   In both cases extra hours = hours beyond the bucket threshold (max 0 if negative).
//   Hours must be in 0.5-hour increments; non-conforming values are auto-rounded.

function _wlCalcFromHrs(iso, hrs) {
  var attEl = el('wl-att-' + iso);
  var att   = attEl ? attEl.value : '';
  var dow   = new Date(iso + 'T00:00:00').getDay(); // 0=Sun

  var OFF_BASE = ['Week Off', 'Holiday', 'Alternate Week Off'];
  var EXT_OFF  = ['Extra Full Day', 'Extra Half Day'];
  var isOffCtx = OFF_BASE.indexOf(att) !== -1 || EXT_OFF.indexOf(att) !== -1
                 || (dow === 0 && !att);

  // Determine the "base" off-day label to revert to when hours = 0
  var baseOff = OFF_BASE.indexOf(att) !== -1 ? att
              : dow === 0 ? 'Week Off'
              : dow === 6 ? 'Alternate Week Off'
              : 'Holiday';

  function xtra(v) { return Math.max(0, Math.round(v * 2) / 2); }

  if (isOffCtx) {
    if (hrs < 4) return { att: baseOff,          extra: xtra(hrs) };
    if (hrs < 9) return { att: 'Extra Half Day', extra: xtra(hrs - 4) };
                 return { att: 'Extra Full Day',  extra: xtra(hrs - 9) };
  } else {
    if (hrs < 4) return { att: 'Leave Full Day',  extra: xtra(hrs) };
    if (hrs < 9) return { att: 'Leave Half Day',  extra: xtra(hrs - 4) };
                 return { att: 'Present',          extra: xtra(hrs - 9) };
  }
}

// Update the preview label as the user types.
function wlHrsPreview(iso) {
  var inp = el('wl-hc-' + iso);
  var pre = el('wl-hc-pre-' + iso);
  if (!inp || !pre) return;
  var raw = inp.value.trim();
  if (raw === '') { pre.textContent = ''; pre.className = 'wl-hc-pre'; return; }
  var num = parseFloat(raw);
  if (isNaN(num) || num < 0 || num > 16) {
    pre.textContent = 'invalid'; pre.className = 'wl-hc-pre hc-warn'; return;
  }
  var rounded = Math.round(num * 2) / 2;
  if (Math.abs(rounded - num) > 0.001) {
    pre.textContent = '→ round to ' + rounded + 'h'; pre.className = 'wl-hc-pre hc-warn'; return;
  }
  var r = _wlCalcFromHrs(iso, rounded);
  pre.textContent = '→ ' + r.att + (r.extra > 0 ? ' +' + r.extra + 'h' : '');
  pre.className = 'wl-hc-pre hc-ok';
}

// Apply the calculated attendance & extra hours on blur / Enter.
function wlApplyHrs(iso) {
  var inp = el('wl-hc-' + iso);
  var pre = el('wl-hc-pre-' + iso);
  if (!inp || inp.value.trim() === '') return;
  var num = parseFloat(inp.value);
  if (isNaN(num) || num < 0) return;
  var hrs = Math.round(num * 2) / 2;       // snap to 0.5 step
  inp.value = hrs;

  var r = _wlCalcFromHrs(iso, hrs);

  var attEl = el('wl-att-' + iso);
  if (attEl) attEl.value = r.att;

  var ehEl = el('wl-eh-' + iso);
  if (ehEl) ehEl.value = r.extra > 0 ? r.extra : '';

  wlOnAttendanceChange(iso); // refresh row styling + work/leave toggle
  wlMarkDirty(iso);

  if (pre) {
    pre.textContent = '→ ' + r.att + (r.extra > 0 ? ' +' + r.extra + 'h' : '');
    pre.className   = 'wl-hc-pre hc-ok';
  }
}

// ── Work Log Builder ──────────────────────────────────────────────────────────

// Auto-add today's meetings to the appropriate half (before 1pm → h1, after → h2).
// Skips halves that already have saved work content.
// Also pre-calculates per-day total meeting hours → stored in WL_AUTO_HRS for the Hrs input.
function wlAutoAddMeetings(days) {
  days.forEach(function(iso) {
    var mtgs = WL_MTGS[iso] || [];
    if (!mtgs.length) return;
    var data = WL_DATA[iso] || {};
    var totalMtgMins = 0;
    mtgs.forEach(function(m) {
      if (!m.start) return;
      // Sum durations for hours auto-calc
      if (m.durationMins > 0) totalMtgMins += m.durationMins;
      var hour = new Date(m.start).getHours();
      var half = hour < 13 ? 'h1' : 'h2';
      // Don't auto-add if the half already has saved content
      var existingWork = half === 'h1' ? data.work1 : data.work2;
      if (existingWork) return;
      var key = iso + ':' + half;
      if (!WL_ITEMS[key]) WL_ITEMS[key] = [];
      if (WL_ITEMS[key].some(function(x) { return x.id === m.id; })) return;
      var timeStr = new Date(m.start).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      WL_ITEMS[key].push({ type: 'meeting', id: m.id, text: m.title + ' (' + timeStr + ')' });
    });
    // Pre-fill Hrs input only if: meetings loaded, no existing log hours, no manual extra hrs set
    if (totalMtgMins > 0 && !data.extraHrs) {
      var totalMtgHrs = Math.round(totalMtgMins / 30) / 2; // snap to 0.5h
      var dow = new Date(iso + 'T00:00:00').getDay();
      var isOffDay = (dow === 0 || dow === 6); // Sun/Sat
      // Work days: minimum 9h; extra meeting time beyond 9h is extra
      var autoHrs = isOffDay ? totalMtgHrs : Math.max(9, totalMtgHrs);
      WL_AUTO_HRS[iso] = autoHrs;
    }
  });
}

// Build the work-update builder cell HTML (chips area + custom input + picker trigger).

    // 1. Task / Project picker button (top)

        '<span class="material-symbols-outlined" style="font-size:12px;vertical-align:middle">add</span> Task / Project' +
      '</button>' +
      '<div class="wl-picker-drop" id="wl-picker-' + half + '-' + iso + '" style="display:none"></div>' +

    // 2. Custom note textarea (multi-line)

      '<textarea class="wl-cust-inp wl-inp" id="wl-cust-' + half + '-' + iso + '"' +

    '</div>' +

    // 3. Chips area (logged items — bottom)
    '<div class="wl-upd-chips" id="wl-chips-' + half + '-' + iso + '"></div>' +

  '</div>';
}

// Render chip HTML for one item.
function _wlChipHtml(it, idx, iso, half) {
  var iconMap = { meeting: 'video_call', project: 'folder_open', task: 'task_alt', subtask: 'subdirectory_arrow_right', subfn: 'check_box', custom: 'edit_note' };

    '<span class="wl-chip-del" onclick="wlRemoveItem(\'' + iso + '\',\'' + half + '\',' + idx + ')">&times;</span>' +

// Re-render chips for one half of one day.
function wlRenderChips(iso, half) {
  var chipsEl = el('wl-chips-' + half + '-' + iso);

  var items = WL_ITEMS[iso + ':' + half] || [];
  chipsEl.innerHTML = items.map(function(it, i) { return _wlChipHtml(it, i, iso, half); }).join('');

// Re-render chips for all days and halves in current view.

// Toggle the picker dropdown for a given iso+half.
function wlTogglePicker(iso, half) {
  var pickId  = 'wl-picker-' + half + '-' + iso;
  var pickEl  = el(pickId);
  if (!pickEl) return;
  var openKey = half + '-' + iso;
  var isOpen  = pickEl.style.display !== 'none';

  // Close any other open picker
  if (WL_PICKER_OPEN && WL_PICKER_OPEN !== openKey) {
    var prev = el('wl-picker-' + WL_PICKER_OPEN);
    if (prev) prev.style.display = 'none';
  }

  if (isOpen) {
    pickEl.style.display = 'none';
    WL_PICKER_OPEN = null;
  } else {
    pickEl.innerHTML = _wlPickerHtml(iso, half);
    pickEl.style.display = '';
    WL_PICKER_OPEN = openKey;
    var srch = pickEl.querySelector('.wl-picker-search');
    if (srch) srch.focus();
  }
}

// Team modal picker toggle — mirrors wlTogglePicker.
function mlTogglePicker(iso, halfKey) {

    ? _wlPickerHtml(iso, halfKey)
    : '<div style="padding:8px;font-size:12px;color:var(--muted)">No items available</div>';

// Re-filter picker items based on search query.

// Build full picker dropdown HTML (search bar + list).

  return '<input class="wl-picker-search" placeholder="Search projects, tasks…" ' +
      'oninput="wlPickerFilter(\'' + iso + '\',\'' + half + '\',this.value)"/>' +

      _wlPickerItemsHtml(iso, half, '') +
    '</div>';

// Build picker list items HTML filtered by query string.
function _wlPickerItemsHtml(iso, half, q) {
  var uid = APP.currentUser.empId;
  var key = iso + ':' + half;
  var addedIds = {};
  (WL_ITEMS[key] || []).forEach(function(x) { if (x.id) addedIds[x.id] = true; });

  // User's tasks (assigned to them)
  var myTasks = (APP.tasks || []).filter(function(t) {
    return !t._contextOnly && _parseIds(t.Assignee_IDs || t.Assignee_ID || '').indexOf(uid) !== -1;
  });

  // User's projects
  var myProjIds = new Set(myTasks.map(function(t) { return t.Proj_ID; }).filter(Boolean));
  var myProjects = (APP.projects || []).filter(function(p) {
    return myProjIds.has(p.Proj_ID) ||
           _parseIds(p.Owner_IDs || p.Owner_ID || '').indexOf(uid) !== -1;
  });

  function matchQ(str) { return !q || (str || '').toLowerCase().indexOf(q) !== -1; }

  function itemHtml(type, id, label, sub) {
    var isMaterial = type === 'project' ? 'folder_open'
                   : type === 'task'    ? 'task_alt'
                   : 'subdirectory_arrow_right';
    var added = addedIds[id];
    return '<div class="wl-picker-item' + (added ? ' wl-pi-added' : '') + '"' +
        ' data-type="' + type + '" data-id="' + esc(id) + '" data-text="' + esc(label) + '"' +
        (added ? '' : ' onclick="wlAddItemFromEl(this,\'' + iso + '\',\'' + half + '\')"') + '>' +
      '<span class="material-symbols-outlined wl-pi-icon">' + isMaterial + '</span>' +
      '<span class="wl-pi-label">' + esc(label) + '</span>' +
      (sub ? '<span class="wl-pi-sub">' + esc(sub) + '</span>' : '') +
      (added ? '<span class="wl-pi-sub" style="color:var(--ok)">✓</span>' : '') +
    '</div>';
  }

  var html = '';

  var filtProjs = myProjects.filter(function(p) { return matchQ(p.Name); });
  if (filtProjs.length) {
    html += '<div class="wl-picker-sec">Projects</div>';
    html += filtProjs.map(function(p) {
      return itemHtml('project', p.Proj_ID, p.Name || p.Proj_ID, '');
    }).join('');
  }

  var filtTasks = myTasks.filter(function(t) { return matchQ(t.Title); });
  if (filtTasks.length) {
    html += '<div class="wl-picker-sec">Tasks</div>';
    html += filtTasks.map(function(t) {
      var proj  = (APP.projects || []).find(function(p) { return p.Proj_ID === t.Proj_ID; });
      var subFn = t.SubFn_ID ? (APP.functions || []).find(function(f) { return f.Function_ID === t.SubFn_ID; }) : null;
      var sub   = subFn ? subFn.Name : (proj ? proj.Name : '');
      return itemHtml('task', t.Task_ID, t.Title || t.Task_ID, sub);
    }).join('');
  }

  if (!html) html = '<div class="wl-picker-empty">No items found</div>';
  return html;
}

// Called when user clicks a picker item.
function wlAddItemFromEl(elm, iso, half) {
  wlAddItem(iso, half, elm.getAttribute('data-type'), elm.getAttribute('data-id'), elm.getAttribute('data-text'));
}

// Add an item chip to the specified half.
function wlAddItem(iso, half, type, id, text) {
  var key = iso + ':' + half;
  if (!WL_ITEMS[key]) WL_ITEMS[key] = [];
  if (id && WL_ITEMS[key].some(function(x) { return x.id === id; })) return; // already added
  WL_ITEMS[key].push({ type: type, id: id, text: text });
  wlRenderChips(iso, half);
  // Refresh picker list to show checkmark
  var q = '';
  var srch = (el('wl-picker-' + half + '-' + iso) || {}).querySelector && el('wl-picker-' + half + '-' + iso).querySelector('.wl-picker-search');
  if (srch) q = srch.value;
  wlPickerFilter(iso, half, q);
  // Skip dirty-mark and auto-save when called from renderWeekLog() during
  // initial chip pre-population — those chips are already in the DB.
  // Matches the guard pattern in wlOnAttendanceChange.
  if (!WL_RENDERING) {
    wlMarkDirty(iso);
    _wlAutoSave(iso);
  }
}

// Remove a chip by index.
function wlRemoveItem(iso, half, idx) {
  var key = iso + ':' + half;
  if (WL_ITEMS[key]) WL_ITEMS[key].splice(idx, 1);
  wlRenderChips(iso, half);
  wlMarkDirty(iso);
  _wlAutoSave(iso);
}

// Edit a chip: put its text back into the custom input and remove it from the list.
function wlEditChip(iso, half, idx) {
  var key  = iso + ':' + half;
  var items = WL_ITEMS[key];
  if (!items || !items[idx]) return;

  var inp = el('wl-cust-' + half + '-' + iso);
  if (!inp) return;

  inp.value = items[idx].text;
  inp.focus();
  items.splice(idx, 1);
  wlRenderChips(iso, half);
  wlMarkDirty(iso);
  inp.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Add the custom note input text as a chip, then clear the input.
function wlAddCustom(iso, half) {
  var inp = el('wl-cust-' + half + '-' + iso);
  if (!inp) return;
  // Preserve multiline content — normalize line endings, trim each line, then trim whole string
  var text = inp.value.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  text = text.split('\n').map(function(l) { return l.trimRight(); }).join('\n').trim();
  if (!text) return;
  wlAddItem(iso, half, 'custom', '', text);
  inp.value = '';
  inp.style.height = 'auto';
}

// Serialize chips + custom input into the final text string for saving.
function wlGetWorkText(iso, half) {
  var key   = iso + ':' + half;
  var items = WL_ITEMS[key] || [];
  var custEl = el('wl-cust-' + half + '-' + iso);
  var custText = custEl ? custEl.value.trim() : '';
  // Store newlines as literal \n so the '; ' chip delimiter remains unambiguous
  var parts = items.map(function(it) { return it.text.replace(/\n/g, '\\n'); });
  if (custText) parts.push(custText.replace(/\n/g, '\\n'));
  return parts.join('; ');
}

function _wlUpdateSaveBtn(iso) {
  var btn = el('wl-save-btn-' + iso);
  if (!btn) return;
  var data     = WL_DATA[iso];
  var isDirty  = !!WL_DIRTY[iso];
  var isSaving = !!WL_SAVING[iso];
  btn.disabled = isSaving;
  if (isSaving)        { btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">sync</span>'; btn.className = 'wl-save-btn'; }
  else if (isDirty)    { btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">save</span>'; btn.className = 'wl-save-btn dirty'; }
  else if (data && data.logId) { btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px">check</span>'; btn.className = 'wl-save-btn saved'; }
  else                 { btn.textContent = '—';  btn.className = 'wl-save-btn'; }
}

function saveWeekEntry(iso, autoSave) {
  if (WL_SAVING[iso]) return;  // prevent concurrent saves for the same row
  var isAdmin = _isManager(APP.currentUser.role);

  function gv(id) { var e = el(id); return e ? (e.value || '').trim() : ''; }

  var att = gv('wl-att-' + iso);
  var isLeave     = WL_LEAVE_TYPES.indexOf(att) !== -1;
  var isFullLeave = att === 'Leave Full Day';
  // During auto-save, only persist already-committed chip items — skip freetext still in textarea
  // to avoid turning partial in-progress text into chips (which would then duplicate on Enter).
  // Leave Half Day keeps both work halves; only full leave clears them.
  var work1 = isFullLeave ? '' : (autoSave
    ? (WL_ITEMS[iso + ':h1'] || []).map(function(it) { return it.text.replace(/\n/g, '\\n'); }).join('; ')
    : wlGetWorkText(iso, 'h1'));
  var work2 = isFullLeave ? '' : (autoSave
    ? (WL_ITEMS[iso + ':h2'] || []).map(function(it) { return it.text.replace(/\n/g, '\\n'); }).join('; ')
    : wlGetWorkText(iso, 'h2'));
  var leaveType= isLeave ? gv('wl-lt-' + iso) : '';
  var leaveReq = isLeave ? gv('wl-lr-' + iso) : '';
  var extraHrs = parseFloat(gv('wl-eh-' + iso)) || 0;
  var remark   = gv('wl-rm-' + iso);
  var status   = isAdmin ? gv('wl-st-' + iso) : null;
  var adminCmt = isAdmin ? gv('wl-ac-' + iso) : null;

  // Off-day: "Worked today" requires ≥ 2 extra hours (manual save only — auto-save skips this gate)
  // Interns use free-text attendance so the dropdown-based off-day gate does not apply to them.
  if (!autoSave && APP.currentUser.role !== 'Intern' && WL_OFF_TYPES.indexOf(att) !== -1) {
    var _odcEl = el('wl-odc-' + iso);
    if (_odcEl && _odcEl.checked && extraHrs < 2) {
      var _warnEl = el('wl-odc-warn-' + iso);
      if (_warnEl) { _warnEl.style.display = ''; setTimeout(function() { if (_warnEl) _warnEl.style.display = 'none'; }, 3000); }
      return;
    }
  }

  if (!att && !work1 && !work2 && !leaveType && !remark && !extraHrs) {
    delete WL_DIRTY[iso];
    _wlUpdateSaveBtn(iso);
    return;
  }

  var data = WL_DATA[iso] || {};
  WL_SAVING[iso] = true;
  delete WL_DIRTY[iso];   // clear dirty flag; edits arriving during GAS call will re-set it
  _wlUpdateSaveBtn(iso);

  function onSuccess(result) {
    var patch = {
      attendance: att, leaveType: leaveType, leaveReq: leaveReq,
      work1: work1, work2: work2, extraHrs: extraHrs, remark: remark
    };
    if (isAdmin) { patch.status = status; patch.adminComments = adminCmt; }
    if (result && result.logId) patch.logId = result.logId;
    WL_DATA[iso] = Object.assign(data, patch);
    delete WL_SAVING[iso];
    _wlUpdateSaveBtn(iso);
    if (WL_DIRTY[iso]) {
      _wlAutoSave(iso); // new changes arrived during in-flight save — schedule one retry
    } else {
      if (autoSave) _wlAsStatus('wl', iso, 'saved');
      else toast('Work log saved!', 'success');
    }
  }
  function onError(err) {
    try {
      if (autoSave) {
        _wlAsStatus('wl', iso, 'error');
      } else {
        toast((err && err.message) || 'Failed to save.', 'error');
      }
    } finally {
      delete WL_SAVING[iso];
      _wlUpdateSaveBtn(iso);
      if (autoSave && WL_DIRTY[iso]) _wlAutoSave(iso); // retry once on error if still dirty
    }
  }

  // Intern route — upsert to Intern_Work_Log (handles both insert and update by date)
  if (APP.currentUser.role === 'Intern') {
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok) onSuccess({ logId: r.logId || iso });
        else {
          var msg = (r && r.error) || 'Save failed.';
          console.error('[Intern WL] saveInternWorkLog returned error:', msg);
          onError({ message: msg });
        }
      })
      .withFailureHandler(function(err) {
        var msg = (err && err.message) || 'Unknown GAS error';
        console.error('[Intern WL] saveInternWorkLog GAS failure:', msg);
        var asEl = document.getElementById('wl-as-' + iso);
        if (asEl) {
          asEl.textContent  = '⚠ ' + msg;
          asEl.style.color  = '#dc2626';
          asEl.style.fontStyle = 'normal';
          asEl.style.display = 'inline';
          setTimeout(function() { if (asEl) { asEl.textContent = ''; asEl.style.display = 'none'; } }, 5000);
        }
        delete WL_SAVING[iso];
        _wlUpdateSaveBtn(iso);
        if (autoSave && WL_DIRTY[iso]) _wlAutoSave(iso);
      })
      .saveInternWorkLog({
        date: iso, attendance: att,
        work1stHalf: work1, work2ndHalf: work2,
        extraHours: extraHrs, remark: remark
      }, APP.currentUser.email);
    return;
  }

  if (data.logId) {
    var updates = {
      Attendance:               att,
      Purpose:                  leaveType,
      'Leave Requested':        leaveReq,
      'Work Update - 1st Half': work1,
      'Work Update - 2nd Half': work2,
      'Extra Hours':            extraHrs,
      Remark:                   remark
    };
    if (isAdmin) { updates.Status = status; updates.Comments = adminCmt; }
    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onError)
      .updateWorkLog(data.logId, updates, APP.currentUser.email);
  } else {
    var record = {
      date: iso, attendance: att,
      purpose: leaveType, leaveRequested: leaveReq,
      work1stHalf: work1, work2ndHalf: work2,
      extraHours: extraHrs, remark: remark
    };
    if (isAdmin) { record.status = status; record.comments = adminCmt; }
    google.script.run
      .withSuccessHandler(function(newId) { onSuccess({ logId: newId }); })
      .withFailureHandler(onError)
      .submitWorkLog(record, APP.currentUser.email);
  }
}

// ── Team Tasks (Manager+) ─────────────────────────────────────────────────────

// Returns a Set of Emp_IDs for employees in the current user's own team.
// ── Assignment Filter State ───────────────────────────────────────────────────
// Values: 'all' | 'team' | 'to-me' | 'by-me'  — one per view
var _ASGN_FILTER = {
  'my-tsk': 'all', 'my-prj': 'all',
  'team-tsk': 'all', 'team-prj': 'all'
};

// Scope filter for All Tasks / All Projects (team name, '' = whole org)
var _ALL_SCOPE = { 'all-tsk': '', 'all-prj': '' };

function setAsgnFilter(vid, val) {
  _ASGN_FILTER[vid] = val;
  document.querySelectorAll('.asgn-tab[data-vid="' + vid + '"]').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-val') === val);
  });
  var fn = {
    'my-tsk': renderMyTasks, 'my-prj': renderMyProjects,
    'team-tsk': renderTeamTasks, 'team-prj': renderTeamProjects
  };
  if (fn[vid]) fn[vid]();
}

function setAllScope(vid, team) {
  _ALL_SCOPE[vid] = team;
  if (vid === 'all-tsk') renderAllTasks();
  if (vid === 'all-prj') renderAllProjects();
}

// Returns a Set of Emp_IDs for the given team name
function _getTeamIds(team) {
  if (!team) return null;
  var ids = new Set();
  (APP.employees || []).forEach(function(e) {
    if ((e.Team || '') === team) ids.add(e.Emp_ID);
  });
  return ids.size > 0 ? ids : null;
}

// Populates the scope select for All pages with unique team names
function _populateScopeSelect(vid) {
  var sel = el('scope-' + vid);  // 'scope-all-tsk' or 'scope-all-prj'
  if (!sel) return;
  var teams = [];
  var seen = {};
  (APP.employees || []).forEach(function(e) {
    var t = e.Team || '';
    if (t && !seen[t]) { seen[t] = true; teams.push(t); }
  });
  teams.sort();
  var cur = _ALL_SCOPE[vid] || '';
  sel.innerHTML = '<option value="">Organization (All Teams)</option>' +
    teams.map(function(t) { return '<option value="'+esc(t)+'"'+(t===cur?' selected':'')+'>'+esc(t)+'</option>'; }).join('');
}

// Filters tasks by assignment relationship to the current user or team.
function _applyAsgnTaskFilter(tasks, vid) {
  var af = _ASGN_FILTER[vid] || 'all';
  if (af === 'all') return tasks;
  var me = APP.currentUser.empId;
  var matched = {};
  if (af === 'team') {
    var myTeam = (APP.currentUser.team || '').toLowerCase();
    var myIds  = _myTeamEmpIds();
    if (!myIds) return tasks; // no team → show all
    tasks.forEach(function(t) {
      if (_belongsToMyTeam(t, myIds, myTeam)) matched[t.Task_ID] = true;
    });
  } else if (af === 'by-team') {
    var myIds2 = _myTeamEmpIds();
    if (!myIds2) return tasks;
    tasks.forEach(function(t) {
      if (t.Assigner_ID && myIds2.has(t.Assigner_ID)) matched[t.Task_ID] = true;
    });
  } else {
    tasks.forEach(function(t) {
      var match = (af === 'to-me')
        ? _parseIds(t.Assignee_IDs || t.Assignee_ID).indexOf(me) !== -1
        : t.Assigner_ID === me;
      if (match) matched[t.Task_ID] = true;
    });
  }
  return tasks.filter(function(t) { return matched[t.Task_ID]; });
}

// Filters projects by assignment relationship to the current user or team.
function _applyAsgnProjFilter(projs, vid) {
  var af = _ASGN_FILTER[vid] || 'all';
  if (af === 'all') return projs;
  var me = APP.currentUser.empId;
  if (af === 'team') {
    var myTeam = (APP.currentUser.team || '').toLowerCase();
    var myIds  = _myTeamEmpIds();
    if (!myIds) return projs;
    return projs.filter(function(p) {
      if (_parseIds(p.Owner_IDs || '').some(function(id) { return myIds.has(id); })) return true;
      return _belongsToMyTeam(p, myIds, myTeam);
    });
  }
  if (af === 'by-team') {
    var myIds2 = _myTeamEmpIds();
    if (!myIds2) return projs;
    return projs.filter(function(p) { return myIds2.has(p.Assigner_ID || ''); });
  }
  return projs.filter(function(p) {
    if (af === 'to-me') {
      return _parseIds(p.Assignee_IDs || p.Assignee_ID).indexOf(me) !== -1 ||
             _parseIds(p.Owner_IDs || '').indexOf(me) !== -1;
    }
    return p.Assigner_ID === me; // by-me
  });
}

function _myTeamEmpIds() {
  var myTeam = (APP.currentUser.team || '').toLowerCase();
  if (!myTeam) return null;
  var ids = new Set();
  (APP.employees || []).forEach(function(e) {
    if ((e.Team || '').toLowerCase() === myTeam) ids.add(e.Emp_ID);
  });
  return ids.size > 0 ? ids : null;
}

// Returns true if a task/project is assigned to the current user's team.
function _belongsToMyTeam(rec, myIds, myTeam) {
  if (rec.Assigner_ID && myIds.has(rec.Assigner_ID)) return true;
  var assigneeIds = _parseIds(rec.Assignee_IDs || rec.Assignee_ID || '');
  if (assigneeIds.some(function(id) { return myIds.has(id); })) return true;
  var assignedTeams = _parseIds(rec.Assigned_Teams || '');
  if (myTeam && assignedTeams.some(function(t) { return t.toLowerCase() === myTeam; })) return true;
  return false;
}

function renderTeamTasks() {
  _tskGrpVid = 'team';
  _populateTskFilterSelects('team');
  var tasks = APP.tasks || [];

  // For SA/Admin: backend sends all tasks; filter client-side to this admin's own team.
  // _myTeamEmpIds() can return null when team names are inconsistent (e.g. after a rename).
  // We always apply the filter — fallback to at least including the admin themselves.
  if (_isAdmin(APP.currentUser.role)) {
    var myTeam = (APP.currentUser.team || '').toLowerCase();
    var myIds  = _myTeamEmpIds() || new Set();
    myIds.add(APP.currentUser.empId); // always include the admin themselves

    var myProjIds = new Set();
    APP.projects.forEach(function(p) {
      if (_parseIds(p.Owner_IDs || '').some(function(id) { return myIds.has(id); }) ||
          _belongsToMyTeam(p, myIds, myTeam)) {
        myProjIds.add(p.Proj_ID);
      }
    });
    var includedIds = new Set();
    tasks.forEach(function(t) {
      if (_belongsToMyTeam(t, myIds, myTeam)) { includedIds.add(t.Task_ID); return; }
      var assignees = _parseIds(t.Assignee_IDs || t.Assignee_ID || '');
      if (assignees.length === 0 && myProjIds.has(t.Proj_ID)) includedIds.add(t.Task_ID);
    });
    tasks = tasks.filter(function(t) { return includedIds.has(t.Task_ID); });
  }

  tasks = _applyAsgnTaskFilter(tasks, 'team-tsk');

  // Ensure the filter bar exists + is populated in ALL group modes, then filter
  _tskInjectFilterBarForVid('team-tasks', 'team');
  _populateTskFilterSelects('team');
  // Apply column filters (multi-select) before grouping / mode dispatch
  tasks = _tskApplyColFilters(tasks, 'team');

  // Group-by toggle (5.4)
  var _grpTogTeam = el('team-tasks-grp-toggle');
  if (_grpTogTeam) _grpTogTeam.innerHTML = _tskGrpToggleHtml('team');

  var _teamMode    = _TSK_GRP_MODE['team'] || 'function';
  var _teamTblWrap = el('team-tasks-tbl-wrap');
  var _teamAltBody = el('team-tasks-alt-body');

  if (_teamMode === 'function') {
    if (_teamTblWrap) _teamTblWrap.style.display = '';
    if (_teamAltBody) { _teamAltBody.style.display = 'none'; _teamAltBody.innerHTML = ''; }
    _tskGrpVid = 'team';
    _tskGrpInjectCss();
    _tskGrpInjectHeaderControls('team-tasks');
    _tskInjectFilterBarForVid('team-tasks', 'team');
    _populateTskFilterSelects('team');
    var _teamBody = el('team-tasks-body');
    if (_teamBody) _teamBody.innerHTML = '<tr><td colspan="11" style="padding:0;border:none">' + _renderGroupedTasksHtml(tasks) + '</td></tr>';
  } else {
    if (_teamTblWrap) _teamTblWrap.style.display = 'none';
    if (_teamAltBody) {
      _teamAltBody.style.display = 'block';
      _teamAltBody.innerHTML = _teamMode === 'date'
        ? _renderDateGroupedTasksHtml(tasks, 'team')
        : _renderWeekGroupedTasksHtml(tasks, 'team');
    }
  }
}

// ── Team Projects (Manager+) ──────────────────────────────────────────────────
function renderTeamProjects() {
  var sf = elVal('tp-status');
  var q  = elVal('tp-search').toLowerCase();
  var projs = APP.projects;

  // For SA/Admin: backend sends all projects; filter client-side to this admin's own team.
  // Always apply — fallback to at least the admin themselves when team has no matching employees.
  if (_isAdmin(APP.currentUser.role)) {
    var myTeam = (APP.currentUser.team || '').toLowerCase();
    var myIds  = _myTeamEmpIds() || new Set();
    myIds.add(APP.currentUser.empId);
    projs = projs.filter(function(p) {
      if (_parseIds(p.Owner_IDs || '').some(function(id) { return myIds.has(id); })) return true;
      return _belongsToMyTeam(p, myIds, myTeam);
    });
  }

  var rows = projs.filter(function(p) {
    if (sf && p.Status !== sf) return false;
    if (q  && !String(p.Name || '').toLowerCase().includes(q) && !String(p.Description || '').toLowerCase().includes(q)) return false;
    return true;
  });
  rows = _applyAsgnProjFilter(rows, 'team-prj');
  var grid = el('team-projects-grid');
  if (!grid) return;
  grid.innerHTML = _renderProjGrouped(_sortProjHierarchy(rows));
}

// ── Team Logs (Manager+) ──────────────────────────────────────────────────────
var TL_RAW          = [];
var TL_HOLIDAYS     = [];     // ['YYYY-MM-DD', ...] admin-set holidays
var TL_DURATIONS    = {}; // 'empId:YYYY-MM-DD' → 'HH:MM:SS'
var ML_DURATIONS    = {}; // 'YYYY-MM-DD' → 'HH:MM:SS' — member log modal durations
var TL_TAB          = 'member';
var TL_MODE         = 'day';
var TL_ANCHOR       = null;   // Date object, initialised on first load
var TL_CUSTOM_START = '';     // YYYY-MM-DD, used when TL_MODE === 'custom'
var TL_CUSTOM_END   = '';

function _tlIso(d) { return _localIso(d); }

function _tlRange() {
  var d = TL_ANCHOR || new Date();
  if (TL_MODE === 'day') {
    var s = _tlIso(d);
    return { start: s, end: s, days: [s], label: d.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'short', year:'numeric' }) };
  }
  if (TL_MODE === 'week') {
    var dow = (d.getDay() + 6) % 7;
    var mon = new Date(d); mon.setDate(d.getDate() - dow);
    var days = [];
    for (var i = 0; i < 7; i++) { var x = new Date(mon); x.setDate(mon.getDate() + i); days.push(_tlIso(x)); }
    var label = mon.toLocaleDateString('en-IN', { day:'numeric', month:'short' }) + ' – ' +
                new Date(days[6]).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
    return { start: days[0], end: days[6], days: days, label: label };
  }
  if (TL_MODE === 'custom') {
    var s = TL_CUSTOM_START, e = TL_CUSTOM_END;
    if (!s || !e) return { start: s || '', end: e || '', days: [], label: 'Select a date range' };
    var days = [], cur = new Date(s + 'T00:00:00');
    var end  = new Date(e + 'T00:00:00');
    while (cur <= end) { days.push(_tlIso(new Date(cur))); cur.setDate(cur.getDate() + 1); }
    var fmt = function(iso) { return new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }); };
    return { start: s, end: e, days: days, label: fmt(s) + ' – ' + fmt(e) };
  }
  // month
  var y = d.getFullYear(), m = d.getMonth();
  var first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  var days = [];
  for (var cur = new Date(first); cur <= last; cur.setDate(cur.getDate() + 1)) days.push(_tlIso(new Date(cur)));
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return { start: _tlIso(first), end: _tlIso(last), days: days, label: MONTHS[m] + ' ' + y };
}

function _tlUpdateLabel() { var lbl = el('tl-range-label'); if (lbl) lbl.textContent = _tlRange().label; }

function tlNav(dir) {
  if (TL_MODE === 'custom') return;   // nav arrows disabled in custom mode
  var d = new Date(TL_ANCHOR || new Date());
  if (TL_MODE === 'day')   d.setDate(d.getDate() + dir);
  if (TL_MODE === 'week')  d.setDate(d.getDate() + dir * 7);
  if (TL_MODE === 'month') d.setMonth(d.getMonth() + dir);
  TL_ANCHOR = d; _tlUpdateLabel(); loadTeamLogs();
}

function tlNavToday() {
  if (TL_MODE === 'custom') return;
  TL_ANCHOR = new Date(); _tlUpdateLabel(); loadTeamLogs();
}

function setTLMode(mode) {
  TL_MODE = mode;
  ['day','week','month','custom'].forEach(function(m) {
    var b = el('tl-mode-' + m); if (b) b.classList.toggle('active', m === mode);
  });
  // Show/hide custom date bar and nav arrows
  var customBar = el('tl-custom-bar');
  var rangeBar  = document.querySelector('.tl-range-bar');
  if (customBar) customBar.classList.toggle('hidden', mode !== 'custom');
  if (rangeBar)  rangeBar.style.visibility = mode === 'custom' ? 'hidden' : '';
  // Pre-fill custom inputs with current range if switching to custom
  if (mode === 'custom' && !TL_CUSTOM_START) {
    var r = _tlRange();
    TL_CUSTOM_START = r.start || _tlIso(new Date());
    TL_CUSTOM_END   = r.end   || _tlIso(new Date());
    var fi = el('tl-cust-from'), ti = el('tl-cust-to');
    if (fi) fi.value = TL_CUSTOM_START;
    if (ti) ti.value = TL_CUSTOM_END;
  }
  _tlUpdateLabel(); if (mode !== 'custom') loadTeamLogs();
}

function tlApplyCustomRange() {
  var from = (el('tl-cust-from') || {}).value || '';
  var to   = (el('tl-cust-to')   || {}).value || '';
  if (!from || !to)   { toast('Please select both a start and end date.', 'error'); return; }
  if (from > to)      { toast('Start date must be before end date.', 'error'); return; }
  var diffDays = Math.round((new Date(to) - new Date(from)) / 86400000);
  if (diffDays > 90)  { toast('Custom range cannot exceed 90 days.', 'error'); return; }
  TL_CUSTOM_START = from;
  TL_CUSTOM_END   = to;
  _tlUpdateLabel(); loadTeamLogs();
}

function loadTeamLogs() {
  if (!TL_ANCHOR) TL_ANCHOR = new Date();
  _tlUpdateLabel();
  var tlRange = _tlRange(); // pass current view range so backend filters server-side
  el('team-logs-container').innerHTML = '<div class="empty-state"><div class="ei material-symbols-outlined">hourglass_empty</div><p>Loading…</p></div>';
  google.script.run
    .withSuccessHandler(function(r) { TL_RAW = (r && r.logs) || []; TL_HOLIDAYS = (r && r.holidays) || []; _populateMemberFilter(TL_RAW); renderTeamLogs(); try { _tlLoadDurationsAsync(tlRange.start, tlRange.end); } catch(_e) {} })
    .withFailureHandler(function(err) { el('team-logs-container').innerHTML = '<div class="empty-state"><div class="ei material-symbols-outlined">error_outline</div><p>' + esc(err.message) + '</p></div>'; })
    .getTeamWorkLogs(APP.currentUser.email, tlRange.start, tlRange.end);
}

function _populateMemberFilter(logs) {
  var seen = {}, opts = ['<option value="">All Members</option>'];
  logs.forEach(function(l) { if (!seen[l.Emp_ID]) { seen[l.Emp_ID] = true; opts.push('<option value="' + esc(l.Emp_ID) + '">' + esc(l.Emp_Name || l.Emp_ID) + '</option>'); } });
  var sel = el('tl-member'); if (sel) sel.innerHTML = opts.join('');
}

function switchTeamLogTab(tab) {
  TL_TAB = tab;
  el('tl-tab-member').classList.toggle('active', tab === 'member');
  el('tl-tab-date').classList.toggle('active',   tab === 'date');
  el('tl-member').classList.toggle('hidden', tab === 'member');
