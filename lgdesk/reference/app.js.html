// ── Sidebar resize (Part D) ────────────────────────────────────────────────────
(function() {
  var handle = document.getElementById('sb-resize-handle');
  if (!handle) return;
  var dragging = false;

  handle.addEventListener('mousedown', function(e) {
    if (_IS_MOBILE) return;
    e.preventDefault();
    dragging = true;
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', function(e) {
    if (!dragging || _IS_MOBILE) return;
    var newWidth = Math.max(180, Math.min(400, e.clientX));
    document.documentElement.style.setProperty('--sidebar', newWidth + 'px');
    SB_EXPANDED_WIDTH = newWidth;
    if (SB_COLLAPSED) {
      SB_COLLAPSED = false;
      var sidebar = document.getElementById('sidebar');
      if (sidebar) sidebar.classList.remove('sb-collapsed');
      var icon = document.getElementById('sb-collapse-icon');
      if (icon) icon.textContent = 'chevron_left';
    }
  });

  document.addEventListener('mouseup', function() {
    if (dragging) {
      dragging = false;
      document.body.style.userSelect = '';
    }
  });
})();

// ── Step Wizard ───────────────────────────────────────────────────────────────
var WZ = {
  task: { step: 1, total: 3 },
  proj: { step: 1, total: 3 },
  wlog: { step: 1, total: 2 }
};

function openWizard(type) {
  WZ[type].step = 1;
  if (type === 'task') {
    // Task wizard is now a single-page form — just update the Save button label
    var btn = el('task-wz-next');
    if (btn) btn.textContent = el('task-id').value ? 'Update Task' : 'Save Task';
  } else {
    // Multi-step wizard (project, work log, etc.)
    for (var i = 1; i <= WZ[type].total; i++) {
      var p = el(type + '-wz-p' + i);
      if (p) p.classList.toggle('active', i === 1);
    }
    _wzRender(type);
  }
  el(type + '-wizard-overlay').classList.add('show');
  el(type + '-wizard').classList.add('show');
}
function closeWizard(type) {
  el(type + '-wizard-overlay').classList.remove('show');
  el(type + '-wizard').classList.remove('show');
}

function wzNav(type, dir) {
  var state = WZ[type];
  if (dir > 0 && !_wzValidate(type, state.step)) return;
  if (dir > 0 && state.step === state.total) { _wzSubmit(type); return; }
  var next = state.step + dir;
  if (next < 1 || next > state.total) return;
  el(type + '-wz-p' + state.step).classList.remove('active');
  state.step = next;
  _wzRender(type);
  el(type + '-wz-p' + state.step).classList.add('active');
}

function _wzRender(type) {
  var state = WZ[type];
  var step = state.step, total = state.total;
  for (var i = 1; i <= total; i++) {
    var s = el(type + '-wz-s' + i);
    var l = el(type + '-wz-l' + i);
    if (s) { s.classList.toggle('active', i === step); s.classList.toggle('done', i < step); }
    if (l) { l.classList.toggle('done', i < step); }
  }
  var back = el(type + '-wz-back');
  var next = el(type + '-wz-next');
  var ctr  = el(type + '-wz-count');
  if (back) back.style.visibility = step > 1 ? 'visible' : 'hidden';
  if (ctr)  ctr.textContent = 'Step ' + step + ' of ' + total;
  if (next) {
    if (step < total) { next.textContent = 'Next →'; }
    else if (type === 'task') next.textContent = el('task-id').value ? 'Update Task' : 'Create Task';
    else if (type === 'proj') next.textContent = el('proj-id').value ? 'Update Project' : 'Create Project';
    else if (type === 'wlog') next.textContent = 'Submit Log';
  }
}

function _wzValidate(type, step) {
  if (type === 'task' && step === 1) {
    if (!el('f-t-title').value.trim()) { toast('Please enter a task title.', 'error'); return false; }
  }
  if (type === 'task' && step === 2) {
    if (!el('f-t-proj').value) { toast('Please select a project.', 'error'); return false; }
    if (!_msGetIds('ms-t-assignee') && !_msGetIds('ms-t-teams')) {
      toast('Please select at least one assignee or team.', 'error'); return false;
    }
  }
  if (type === 'proj' && step === 1) {
    if (!el('f-p-name').value.trim()) { toast('Please enter a project name.', 'error'); return false; }
  }
  return true;
}

function _wzSubmit(type) {
  if (type === 'task') saveTask();

}

// ── Task Sheet Engine ─────────────────────────────────────────────────────────
var _tskEd = null; // { taskId, col, tdEl, origHtml, isChild }

// Build Excel-style flat row list — one row per task, plus placeholder rows for
// Functions/Sub-Functions that have no tasks.
// Row structure: { task, subFn, fn, displayTask }
// displayTask === null → empty placeholder row (function/sub-function with no tasks)
// Returns a subset of APP.functions relevant to the given task list.
// Includes: functions referenced by tasks in the list, plus functions where the
// current user is directly in Assignee_IDs / Assigner_ID / Created_By.
// Parent functions of any included sub-function are appended for hierarchy display.
// Used by all three task sheet views to suppress empty placeholder rows from
// functions/sub-functions that have no tasks in the current filtered scope.
function _buildScopedFnPool(tasks) {
  var u = APP.currentUser;
  var taskFnIds = new Set();
  tasks.forEach(function(t) {
    if (t.Function_ID) taskFnIds.add(t.Function_ID);
    if (t.SubFn_ID)    taskFnIds.add(t.SubFn_ID);
  });
  var pool = (APP.functions || []).filter(function(f) {
    if (taskFnIds.has(f.Function_ID)) return true;
    return _parseIds(f.Assignee_IDs || '').indexOf(u.empId) !== -1 ||
           f.Assigner_ID === u.empId ||
           f.Created_By  === u.empId;
  });
  // Also include sub-functions whose parent function is already in the pool.
  // This shows empty sub-functions (no tasks, user not directly assigned) when their parent is in scope.
  var poolIds = new Set(pool.map(function(f) { return f.Function_ID; }));
  var parentPoolIds = new Set(
    pool.filter(function(f) { return !f.Parent_Fn_ID; }).map(function(f) { return f.Function_ID; })
  );
  (APP.functions || []).forEach(function(f) {
    if (!poolIds.has(f.Function_ID) && f.Parent_Fn_ID && parentPoolIds.has(f.Parent_Fn_ID)) {
      pool.push(f);
      poolIds.add(f.Function_ID);
    }
  });
  (APP.functions || []).forEach(function(f) {
    if (f.Parent_Fn_ID && poolIds.has(f.Function_ID) && !poolIds.has(f.Parent_Fn_ID)) {
      var parent = (APP.functions || []).find(function(p) { return p.Function_ID === f.Parent_Fn_ID; });
      if (parent) { pool.push(parent); poolIds.add(parent.Function_ID); }
    }
  });
  return pool;
}

function _buildExcelRows(tasks, fnPool) {
  var fns = fnPool || [];
  if (!fns.length) return tasks.map(function(t) { return _rowForTask(t); });

  // Set of Function_IDs in the pool — used so tasks whose function/sub-function
  // is NOT in the pool fall through to "standalone" and are still rendered,
  // rather than silently dropped during the function-tree iteration below.
  var fnIdsInPool = new Set(fns.map(function(f) { return f.Function_ID; }));

  // Group tasks by their sub-function and function
  var bySubFn = {}, byFn = {}, standalone = [];
  tasks.forEach(function(t) {
    if (t.SubFn_ID && fnIdsInPool.has(t.SubFn_ID))           { (bySubFn[t.SubFn_ID] = bySubFn[t.SubFn_ID] || []).push(t); }
    else if (t.Function_ID && fnIdsInPool.has(t.Function_ID)) { (byFn[t.Function_ID]  = byFn[t.Function_ID]  || []).push(t); }
    else                                                       { standalone.push(t); }
  });

  var rows = [];
  // Iterate top-level functions in order
  fns.filter(function(f) { return !f.Parent_Fn_ID; }).forEach(function(fn) {
    var subFns = fns.filter(function(f) { return f.Parent_Fn_ID === fn.Function_ID; });
    if (subFns.length) {
      // Function has sub-functions — emit rows under each sub-function
      subFns.forEach(function(sf) {
        var sfTasks = bySubFn[sf.Function_ID] || [];
        sfTasks.forEach(function(t) { rows.push({ task: t, subFn: sf, fn: fn, displayTask: t }); });
        if (!sfTasks.length) rows.push({ task: null, subFn: sf, fn: fn, displayTask: null });
      });
    } else {
      // Function has no sub-functions — emit tasks directly under function
      var fnTasks = byFn[fn.Function_ID] || [];
      fnTasks.forEach(function(t) { rows.push({ task: t, subFn: null, fn: fn, displayTask: t }); });
      if (!fnTasks.length) rows.push({ task: null, subFn: null, fn: fn, displayTask: null });
    }
  });
  // Standalone tasks (no function, no sub-function)
  standalone.forEach(function(t) { rows.push({ task: t, subFn: null, fn: null, displayTask: t }); });
  return rows;
}

// Reconstruct a row descriptor from a single task (used in _tskCommit and inline edits)
function _buildRowForTask(t) { return _rowForTask(t); }

// ── Column filter helpers ──────────────────────────────────────────────────────
// Multi-select filters: each select field returns an ARRAY of selected values
// (empty array = "no filter / show all"). `due` stays a single date string.
function _getTskFilters(vid) {
  return {
    fn:     _ssmGet(el('tf-' + vid + '-fn')),
    parent: _ssmGet(el('tf-' + vid + '-parent')),
    sub:    _ssmGet(el('tf-' + vid + '-sub')),
    asgn:   _ssmGet(el('tf-' + vid + '-asgn')),
    asgr:   _ssmGet(el('tf-' + vid + '-asgr')),
    proj:   _ssmGet(el('tf-' + vid + '-proj')),
    status: _ssmGet(el('tf-' + vid + '-status')),
    pri:    _ssmGet(el('tf-' + vid + '-pri')),
    due:    (el('tf-' + vid + '-due') || {}).value || ''
  };
}

// True if a task passes ALL active column filters. Within a field, ANY selected
// value matches (union/OR); across fields it's AND. Empty arrays don't filter.
function _tskTaskMatchesCols(t, f) {
  if (f.fn.length     && f.fn.indexOf(t.Function_ID) === -1)  return false;
  if (f.parent.length && f.parent.indexOf(t.SubFn_ID) === -1) return false;
  if (f.sub.length    && f.sub.indexOf(t.Task_ID)    === -1)  return false;
  if (f.asgn.length) {
    var a = _parseIds(t.Assignee_IDs || t.Assignee_ID);
    if (!f.asgn.some(function(id) { return a.indexOf(id) !== -1; })) return false;
  }
  if (f.asgr.length   && f.asgr.indexOf(t.Assigner_ID) === -1) return false;
  if (f.proj.length   && f.proj.indexOf(t.Proj_ID)     === -1) return false;
  if (f.status.length && f.status.indexOf(t.Status)    === -1) return false;
  if (f.pri.length    && f.pri.indexOf(t.Priority)     === -1) return false;
  if (f.due) {
    var ds = t.Due_Date ? String(t.Due_Date).substring(0, 10) : '';
    if (!ds || ds > f.due) return false; // "due by" semantics
  }
  return true;
}

// Single source of truth for column filtering — search + multi-select columns +
// assigned-date range + recurring. Called by every render path so all three
// group-by modes (function / date / week) filter identically.
function _tskApplyColFilters(tasks, vid) {
  vid = vid || _tskGrpVid || 'all';
  if (_tskSearchQuery) {
    tasks = tasks.filter(function(t) {
      return (t.Title || '').toLowerCase().indexOf(_tskSearchQuery) !== -1 ||
             (t.Description || '').toLowerCase().indexOf(_tskSearchQuery) !== -1 ||
             (t.Task_ID || '').toLowerCase().indexOf(_tskSearchQuery) !== -1;
    });
  }
  var f = _getTskFilters(vid);
  tasks = tasks.filter(function(t) { return _tskTaskMatchesCols(t, f); });
  // Non-multi inputs (date range + recurring) — read from the active view's bar.
  var bar = document.getElementById('tsk-filter-bar-wrap-' + vid);
  if (bar) {
    var afEl = bar.querySelector('[data-filter="adate-from"]');
    if (afEl && afEl.value) { var afTs = new Date(afEl.value).getTime();
      tasks = tasks.filter(function(t) { return t.Created_At && new Date(t.Created_At).getTime() >= afTs; }); }
    var atEl = bar.querySelector('[data-filter="adate-to"]');
    if (atEl && atEl.value) { var atTs = new Date(atEl.value).getTime() + 86400000;
      tasks = tasks.filter(function(t) { return t.Created_At && new Date(t.Created_At).getTime() <= atTs; }); }
    var rcEl = bar.querySelector('[data-filter="recurring"]');
    if (rcEl && rcEl.value) { var rq = rcEl.value.toLowerCase();
      tasks = tasks.filter(function(t) {
        var rv = (t.Recurring_Task || '').toLowerCase();
        return rq === 'none' ? (!rv || rv === 'none' || rv === 'one time' || rv === '—') : rv === rq;
      }); }
  }
  return tasks;
}

function _tskRowMatchFilters(row, f) {
  var t = row.displayTask;
  // Function filter: match by top-level Function record
  if (f.fn   && (!row.fn   || row.fn.Function_ID   !== f.fn))     return false;
  // Sub-Function filter: match by Sub-Function record
  if (f.parent && (!row.subFn || row.subFn.Function_ID !== f.parent)) return false;
  // Placeholder rows (no task) — only survive fn/sub-fn filters above; all task-level filters exclude them
  if (!t) {
    if (f.sub || f.asgn || f.asgr || f.proj || f.status || f.pri || f.due) return false;
    return true;
  }
  // Task filter: direct task ID match
  if (f.sub  && t.Task_ID !== f.sub) return false;
  if (f.asgn && _parseIds(t.Assignee_IDs || t.Assignee_ID).indexOf(f.asgn) === -1) return false;
  if (f.asgr && t.Assigner_ID !== f.asgr)   return false;
  if (f.proj && t.Proj_ID     !== f.proj)   return false;
  if (f.status && t.Status    !== f.status) return false;
  if (f.pri  && t.Priority    !== f.pri)    return false;
  if (f.due) {
    var ds = t.Due_Date ? String(t.Due_Date).substring(0, 10) : '';
    if (!ds || ds > f.due) return false;
  }
  return true;
}

// Cascade rules (single-link columns auto-fill, multi-value columns are manual):
//   Sub-Function selected → auto-fill Function + Project  (sub-fn has exactly one parent & one project)
//   Function selected     → auto-fill Project             (function belongs to exactly one project)
//   Project changed       → narrows Function + Sub-Function lists; stale selections clear automatically
//   Assignee / Status / Priority → manual only (multiple values possible)
function _populateTskFilterSelects(vid) {
  var f  = _getTskFilters(vid);          // arrays (multi-select)
  var P  = f.proj, FN = f.fn, SF = f.parent;
  var inP = function(pid) { return P.length === 0 || P.indexOf(pid) !== -1; };

  // Sorted copy — do NOT sort APP.employees in-place
  var _sortedEmpsFilter = (APP.employees || []).slice().sort(function(a, b) { return (a.Name || '').localeCompare(b.Name || ''); });

  // ── Assignee (full list — no cascade) ───────────────────────────────────────
  var asgnSel = el('tf-' + vid + '-asgn');
  if (asgnSel) {
    asgnSel.innerHTML = '<option value="">All Assignees</option>' +
      _sortedEmpsFilter.map(function(e) { return '<option value="' + esc(e.Emp_ID) + '">' + esc(e.Name) + '</option>'; }).join('');
  }

  // ── Assigner (full list — no cascade) ───────────────────────────────────────
  var asgrSel = el('tf-' + vid + '-asgr');
  if (asgrSel) {
    asgrSel.innerHTML = '<option value="">All Assigners</option>' +
      _sortedEmpsFilter.map(function(e) { return '<option value="' + esc(e.Emp_ID) + '">' + esc(e.Name) + '</option>'; }).join('');
  }

  // ── Project (full list — top of the cascade) ────────────────────────────────
  var _projOpts = '<option value="">All Projects</option>' +
    (APP.projects || []).map(function(p) { return '<option value="' + esc(p.Proj_ID) + '">' + esc(p.Name) + '</option>'; }).join('');
  var projSel = el('tf-' + vid + '-proj');
  if (projSel) projSel.innerHTML = _projOpts;
  // Also populate the inline Project column filter in the new filter bar
  var projColSel = el('tf-' + vid + '-projcol');
  if (projColSel) { var _pColCur = projColSel.value; projColSel.innerHTML = _projOpts; projColSel.value = _pColCur; }

  // ── Function (top-level; narrowed to the UNION of selected projects) ────────
  var fnSel = el('tf-' + vid + '-fn');
  if (fnSel) {
    var topFns = (APP.functions || []).filter(function(fn) { return !fn.Parent_Fn_ID && inP(fn.Proj_ID); });
    fnSel.innerHTML = '<option value="">All Functions</option>' +
      topFns.map(function(fn) { return '<option value="' + esc(fn.Function_ID) + '">' + esc(fn.Name) + '</option>'; }).join('');
    var validFn = {}; topFns.forEach(function(fn) { validFn[fn.Function_ID] = true; });
    var keptFn = FN.filter(function(id) { return validFn[id]; });
    if (keptFn.length !== FN.length) { _ssmSet(fnSel, keptFn); FN = keptFn; }
  }

  // ── Sub-Function (narrowed to UNION of selected projects + functions) ───────
  var parentSel = el('tf-' + vid + '-parent');
  if (parentSel) {
    var subFns = (APP.functions || []).filter(function(fn) {
      if (!fn.Parent_Fn_ID) return false;
      if (!inP(fn.Proj_ID)) return false;
      if (FN.length && FN.indexOf(fn.Parent_Fn_ID) === -1) return false;
      return true;
    });
    parentSel.innerHTML = '<option value="">All Sub-Functions</option>' +
      subFns.map(function(fn) { return '<option value="' + esc(fn.Function_ID) + '">' + esc(fn.Name) + '</option>'; }).join('');
    var validSf = {}; subFns.forEach(function(fn) { validSf[fn.Function_ID] = true; });
    var keptSf = SF.filter(function(id) { return validSf[id]; });
    if (keptSf.length !== SF.length) { _ssmSet(parentSel, keptSf); SF = keptSf; }
  }

  // ── Task (narrowed to UNION of selected projects + sub-functions) ───────────
  var subSel = el('tf-' + vid + '-sub');
  if (subSel) {
    var filtTasks = (APP.tasks || []).filter(function(t) {
      if (!inP(t.Proj_ID)) return false;
      if (SF.length && SF.indexOf(t.SubFn_ID) === -1) return false;
      return true;
    });
    subSel.innerHTML = '<option value="">All Tasks</option>' +
      filtTasks.map(function(t) { return '<option value="' + esc(t.Task_ID) + '">' + esc(t.Title) + '</option>'; }).join('');
    var validTk = {}; filtTasks.forEach(function(t) { validTk[t.Task_ID] = true; });
    var tk = _ssmGet(subSel);
    var keptTk = tk.filter(function(id) { return validTk[id]; });
    if (keptTk.length !== tk.length) _ssmSet(subSel, keptTk);
  }
}

function _clearTskFilters(vid) {

function _tskProgPct(status) {
  var map = {
    'Yet to Start':0,'Planning':5,
    'WIP (0%-25%)':12,'WIP (25%-50%)':37,
    'WIP (50%-75%)':62,'WIP (75%-100%)':87,
    'Review':90,
    'Done':100,'Completed':100,'Implemented':100,
    'Cancelled':0,'On Hold':0
  };
  return map.hasOwnProperty(status) ? map[status] : 0;
}

function _tskProgHtml(status, isOverdue) {
  var pct = _tskProgPct(status);
  var fillColor = isOverdue ? '#E64D3D'
                : (pct === 100 ? '#15803d'
                : (pct >= 50  ? '#22c55e'
                : (pct > 0    ? '#3b82f6'
                :               '#d1d5db')));
  return '<div style="height:3px;background:var(--color-background-secondary,#f3f4f6);' +
    'border-radius:2px;margin-top:5px;overflow:hidden;">' +
    '<div style="height:3px;width:' + pct + '%;background:' + fillColor + ';' +
    'border-radius:2px;transition:width .3s;"></div></div>' +
    '<div style="font-size:10px;color:var(--muted);margin-top:2px;">' +
    pct + '% &middot; ' + esc(status || 'Yet to Start') + '</div>';
}

function _tskDateRowHtml(task, isOverdue) {
  var priBar   = { Critical:'#7c3aed', High:'#E64D3D', Medium:'#f59e0b', Low:'#9ca3af' };
  var priBadge = {
    Critical:'background:#f5f3ff;color:#5b21b6;',
    High:    'background:#fff0ef;color:#c53030;',
    Medium:  'background:#fffbeb;color:#92400e;',
    Low:     'background:#f3f4f6;color:#6b7280;'
  };
  var pri = task.Priority || 'Low';
  var barColor   = priBar[pri]   || priBar.Low;
  var badgeStyle = priBadge[pri] || priBadge.Low;

  var fnObj      = findFn(task.SubFn_ID || task.Function_ID || '');
  var fnLabel    = fnObj ? esc(fnObj.Name || '') : '';
  var asgnerName = esc(findEmpName(task.Assigner_ID) || '');
  var subtitle   = (fnLabel ? fnLabel + ' &middot; ' : '') + 'by ' + asgnerName;

  var dotHtml = '';
  if (task.Due_Date) {
    var ds = _dateIso(task.Due_Date);
    if (ds) {
      var due = new Date(ds); due.setHours(0,0,0,0);
      var now = new Date(); now.setHours(0,0,0,0);
      var diff = Math.round((due - now) / 86400000);
      var dotColor = isOverdue ? '#E64D3D' : (diff <= 3 ? '#f59e0b' : (diff <= 14 ? '#22c55e' : '#3b82f6'));
      dotHtml = '<div style="display:flex;align-items:center;gap:5px;font-size:12px;' +
        'color:' + (isOverdue ? '#E64D3D' : '#6b7280') + ';' +
        'flex-shrink:0;white-space:nowrap;margin-top:3px;">' +
        '<div style="width:8px;height:8px;border-radius:50%;background:' + dotColor + ';flex-shrink:0;"></div>' +
        esc(fmtDate(task.Due_Date)) + '</div>';
    }
  }

  return '<div style="display:flex;align-items:flex-start;padding:10px 14px;gap:10px;' +
    'border-bottom:0.5px solid #e5e7eb;cursor:pointer;" ' +
    'onclick="openTaskDetail(\'' + esc(task.Task_ID || '') + '\')">' +

    '<div style="width:3px;min-height:40px;flex-shrink:0;background:' + barColor + ';' +
    'border-radius:0;margin-top:3px;"></div>' +

    '<div style="font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;' +
    'flex-shrink:0;margin-top:3px;' + badgeStyle + '">' + esc(pri) + '</div>' +

    '<div style="flex:1;min-width:0;">' +
    '<div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;' +
    'white-space:nowrap;margin-bottom:2px;' +
    (isOverdue ? 'color:#c53030;' : '') + '">' +
    esc(task.Title || '') + '</div>' +
    '<div style="font-size:11px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;' +
    'white-space:nowrap;">' + subtitle + '</div>' +
    _tskProgHtml(task.Status || 'Yet to Start', isOverdue) +
    '</div>' +

    '<div style="cursor:pointer;flex-shrink:0;margin-top:3px;" title="Double-click to edit status"' +
    ' onclick="event.stopPropagation()"' +
    ' ondblclick="tskStatusDblClick(event,\'' + esc(task.Task_ID || '') + '\',\'' + esc(task.Status || 'Yet to Start') + '\',\'date\')">' +
    _tskDatePillHtml(task.Status || 'Yet to Start', isOverdue) + '</div>' +

    dotHtml +
    '</div>';
}

// Buckets tasks by date. Uses string comparison on YYYY-MM-DD for safety.
function _tskBucketByDate(tasks) {
  try {
    var today = new Date(); today.setHours(0,0,0,0);
    var pad = function(n) { return ('0' + n).slice(-2); };
    var toStr = function(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
    var todayStr = toStr(today);
    var mon     = _mlWeekMonday(today);
    var sun     = new Date(mon); sun.setDate(mon.getDate() + 6);
    var nextMon = new Date(mon); nextMon.setDate(mon.getDate() + 7);
    var nextSun = new Date(nextMon); nextSun.setDate(nextMon.getDate() + 6);
    var sunStr     = toStr(sun);
    var nextSunStr = toStr(nextSun);

    var buckets = { overdue:[], today:[], thisWeek:[], nextWeek:[], later:[], noDate:[] };
    tasks.forEach(function(t) {
      var ds = _dateIso(t.Due_Date || '');
      if (!ds) { buckets.noDate.push(t); return; }
      if (ds < todayStr)    { buckets.overdue.push(t);  return; }
      if (ds === todayStr)  { buckets.today.push(t);    return; }
      if (ds <= sunStr)     { buckets.thisWeek.push(t); return; }
      if (ds <= nextSunStr) { buckets.nextWeek.push(t); return; }
      buckets.later.push(t);
    });
    return { buckets:buckets, mon:mon, sun:sun, nextMon:nextMon, nextSun:nextSun, today:today };
  } catch(e) {
    console.error('LGDesk _tskBucketByDate error:', e);
    var _n = new Date(); _n.setHours(0,0,0,0);
    var _m = _mlWeekMonday(_n);
    var _s = new Date(_m); _s.setDate(_m.getDate()+6);
    var _nm = new Date(_m); _nm.setDate(_m.getDate()+7);
    var _ns = new Date(_nm); _ns.setDate(_nm.getDate()+6);
    return { buckets:{ overdue:[], today:[], thisWeek:[], nextWeek:[], later:[], noDate:(tasks||[]) },
             mon:_m, sun:_s, nextMon:_nm, nextSun:_ns, today:_n };
  }
}

function _tskDateLabel(d) {
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + months[d.getMonth()];
}

}

function _pwRenderBody() {
  var _pwBodyEl = el('pw-body');
  if (!_pwBodyEl) { console.error('LGDesk: pw-body element not found'); return; }
  try {
  var u = APP.currentUser;
  var tasks = (APP.tasks || []).filter(function(t) {
    if (_isClosed(t.Status)) return false;
    var inAssignees = _parseIds(t.Assignee_IDs || '').indexOf(u.empId) !== -1;
    var isAssigner  = (t.Assigner_ID || '') === u.empId;
    return inAssignees || isAssigner;
  });

  var pad     = function(n) { return ('0' + n).slice(-2); };
  var toStr   = function(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
  var todayStr = toStr(new Date());
  var months   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  var anchorStr = toStr(_PW_ANCHOR);
  var overdue = tasks.filter(function(t) {
    var ds = _dateIso(t.Due_Date || '');
    return ds && ds < anchorStr;
  });
  overdue.sort(function(a,b){ return _dateIso(a.Due_Date||'') < _dateIso(b.Due_Date||'') ? -1 : 1; });

  var byDay = [[],[],[],[],[],[],[]];
  tasks.forEach(function(t) {
    var ds = _dateIso(t.Due_Date || '');
    if (!ds || ds < anchorStr) return;
    var dayDate = new Date(_PW_ANCHOR);
    for (var i = 0; i < 7; i++) {
      if (toStr(dayDate) === ds) { byDay[i].push(t); break; }
      dayDate.setDate(dayDate.getDate() + 1);
    }
  });

  var noDate = tasks.filter(function(t) { return !_dateIso(t.Due_Date || ''); });

  var html = '<div style="background:#fff;border:0.5px solid #e5e7eb;border-radius:8px;overflow:hidden;">';

  // Overdue bucket
  html += _pwBucketHeader('Overdue', overdue.length);
  if (overdue.length === 0) {
    html += '<div style="padding:12px 14px;font-size:12px;color:#6b7280;font-style:italic;">No overdue tasks — all clear</div>';
  } else {
    overdue.forEach(function(t){ html += _tskDateRowHtml(t, true); });
  }

  // Day rows Mon–Sun
  var priOrder = { Critical:0, High:1, Medium:2, Low:3 };
  for (var i = 0; i < 7; i++) {
    var dayDate = new Date(_PW_ANCHOR); dayDate.setDate(_PW_ANCHOR.getDate() + i);
    var dStr    = toStr(dayDate);
    var isToday  = dStr === todayStr;
    var isWeekend = i >= 5;
    var dayLabel = dayNames[i] + ', ' + dayDate.getDate() + ' ' + months[dayDate.getMonth()];
    var dayTasks = byDay[i].slice().sort(function(a,b){
      return (priOrder[a.Priority||'Low']||3) - (priOrder[b.Priority||'Low']||3);
    });

    var dhBg = isToday ? 'background:#ddeaf5;' : (isWeekend ? 'background:#f9fafb;opacity:.85;' : 'background:#f9fafb;');
    html += '<div style="display:flex;align-items:center;justify-content:space-between;' +
      'padding:7px 14px;font-size:12px;font-weight:500;' +
      'border-top:0.5px solid #e5e7eb;border-bottom:0.5px solid #e5e7eb;' + dhBg + '">' +
      '<span style="color:' + (isToday ? '#2D3E51' : '#374151') + ';">' + esc(dayLabel) + '</span>';
    if (isToday) {
      html += '<span style="background:#2D3E51;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;">Today</span>';
    } else if (isWeekend) {
      html += '<span style="font-size:11px;color:#9ca3af;">Weekend</span>';
    } else if (dayTasks.length > 0) {
      html += '<span style="background:#E64D3D;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;">' + dayTasks.length + '</span>';
    } else {
      html += '<span style="font-size:11px;color:#9ca3af;">0 tasks</span>';
    }
    html += '</div>';

    if (dayTasks.length === 0) {
      html += '<div style="padding:10px 14px;font-size:12px;color:#9ca3af;font-style:italic;">' +
        (isToday ? 'Nothing due today' : 'No tasks due') + '</div>';
    } else {
      dayTasks.forEach(function(t){ html += _tskDateRowHtml(t, false); });
    }
  }

  // No due date
  if (noDate.length > 0) {
    html += '<div style="display:flex;align-items:center;gap:8px;padding:7px 14px;' +
      'font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;' +
      'background:#f9fafb;border-top:0.5px solid #e5e7eb;border-bottom:0.5px solid #e5e7eb;color:#6b7280;">' +
      '<i class="ti ti-calendar-off" aria-hidden="true" style="font-size:13px;"></i>' +
      'No due date' +
      '<span style="background:#9ca3af;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;">' + noDate.length + '</span>' +
      '</div>';
    noDate.forEach(function(t){ html += _tskDateRowHtml(t, false); });
  }

  html += '</div>';
  _pwBodyEl.innerHTML = html;
  } catch(e) {
    console.error('LGDesk _pwRenderBody error:', e);
    _pwBodyEl.innerHTML = '<div style="padding:20px;color:#6b7280;">Error loading weekly plan. Check console.</div>';
  }
}

function _pwBucketHeader(label, count) {

function dashUbToggle(key) {

function _dashRenderUpcoming(containerId) {
  var container = document.getElementById(containerId);

  var tasks = (APP.tasks || []).filter(function(t) {
    if (_isClosed(t.Status)) return false;
    return _parseIds(t.Assignee_IDs || '').indexOf(APP.currentUser.empId) !== -1;
  }).sort(function(a, b) {
    var da = _dateIso(a.Due_Date || '') || '9999';
    var db = _dateIso(b.Due_Date || '') || '9999';
    return da < db ? -1 : da > db ? 1 : 0;
  });

  var bd       = _tskBucketByDate(tasks);

  var totalAll = tasks.length;

  function _ubSection(key, icon, headerLabel, dateRange, items, defaultOpen, bgStyle, borderColor, labelColor, isOverdue) {
    var isOpen = (_dashUbOpen.hasOwnProperty(key)) ? _dashUbOpen[key] : defaultOpen;

      '<span style="color:' + labelColor + ';">' + esc(headerLabel) +
      (dateRange ? ' <span style="font-weight:400;">&middot; ' + dateRange + '</span>' : '') + '</span>' +
      '<span style="background:' + cntBg + ';color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;">' + items.length + '</span>' +
      '<i class="ti ti-chevron-down" id="dash-ub-' + key + '-ico" aria-hidden="true" style="font-size:13px;margin-left:auto;transition:transform .2s;' + icoRot + '"></i>' +

    '<div style="display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;">' +
    '<i class="ti ti-sort-descending-2" aria-hidden="true" style="font-size:16px;color:#2D3E51;"></i>My Upcoming Tasks</div>' +

      'background:#fff5f5;', '#fecaca', '#c53030', true) +
    _ubSection('today',    'ti-calendar-event', 'Today',      '', b.today, true,
      'background:#ddeaf5;', '#bcd6ee', '#2D3E51', false) +
    _ubSection('thisweek', 'ti-calendar-week', 'This week', monLabel+'&ndash;'+sunLabel, b.thisWeek, true,
      'background:#f9fafb;', '#e5e7eb', '#6b7280', false) +
    _ubSection('nextweek', 'ti-calendar-week', 'Next week', nxMLabel+'&ndash;'+nxSLabel, b.nextWeek, true,
      'background:#f9fafb;', '#e5e7eb', '#6b7280', false) +

    '<span style="font-size:11px;color:#6b7280;">' + totalAll + ' open' +

  _TSK_GRP_MODE[scope] = mode;

  if      (scope === 'my')   renderMyTasks();
  else if (scope === 'team') renderTeamTasks();

}

function _tskGrpToggleHtml(scope) {

  return '<div style="background:#fff;border:0.5px solid #e5e7eb;border-radius:8px;overflow:hidden;">' +

    _bucket('nw','ti-calendar-week','Next week',nxMLabel+'&ndash;'+nxSLabel,b.nextWeek,false,'background:#f9fafb;','#e5e7eb','#6b7280') +

    _bucket('nd','ti-calendar-off','No due date','',b.noDate,false,'background:#f9fafb;','#e5e7eb','#6b7280') +
    '</div>';
}

function _renderWeekGroupedTasksHtml(tasks, scope) {
  var nonClosed = tasks.filter(function(t){ return !_isClosed(t.Status); });
  var pad     = function(n){ return ('0'+n).slice(-2); };
  var toStr   = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
  var today   = new Date(); today.setHours(0,0,0,0);
  var todayMonStr = toStr(_mlWeekMonday(today));

  var weekMap   = {};
  var weekOrder = [];
  var overdue   = [];
  var noDate    = [];

  nonClosed.forEach(function(t) {
    var ds = _dateIso(t.Due_Date || '');
    if (!ds) { noDate.push(t); return; }
    if (ds < toStr(today)) { overdue.push(t); return; }
    var dDate = new Date(ds); dDate.setHours(0,0,0,0);
    var wMon  = _mlWeekMonday(dDate);
    var wKey  = toStr(wMon);
    if (!weekMap[wKey]) { weekMap[wKey] = []; weekOrder.push({ key:wKey, mon:wMon }); }
    weekMap[wKey].push(t);
  });
  weekOrder.sort(function(a,b){ return a.key < b.key ? -1 : 1; });

  var html = '<div style="background:#fff;border:0.5px solid #e5e7eb;border-radius:8px;overflow:hidden;">';

  // Overdue
  var ovBg = (overdue.length > 0 ? '#e53e3e' : '#9ca3af');
  html += '<div style="display:flex;align-items:center;gap:8px;padding:7px 14px;' +
    'font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;' +
    'background:#fff5f5;border-bottom:0.5px solid #fecaca;">' +
    '<i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:13px;color:#E64D3D;"></i>' +
    '<span style="color:#c53030;">Overdue</span>' +
    '<span style="background:' + ovBg + ';color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;">' + overdue.length + '</span></div>';
  if (overdue.length === 0) {
    html += '<div style="padding:12px 14px;font-size:12px;color:#6b7280;font-style:italic;">No overdue tasks</div>';
  } else {
    overdue.forEach(function(t){ html += _tskDateRowHtml(t, true); });
  }

  weekOrder.forEach(function(w) {
    var wTasks  = weekMap[w.key];
    var wSun    = new Date(w.mon); wSun.setDate(w.mon.getDate() + 6);
    var wLabel  = 'Week of ' + _tskDateLabel(w.mon) + ' – ' + _tskDateLabel(wSun);
    var isCurr  = w.key === todayMonStr;
    var hdBg    = isCurr ? 'background:#ddeaf5;' : 'background:#f9fafb;';
    var hdColor = isCurr ? '#2D3E51' : '#6b7280';
    html += '<div style="display:flex;align-items:center;gap:8px;padding:7px 14px;' +
      'font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;' + hdBg +
      'border-top:0.5px solid #e5e7eb;border-bottom:0.5px solid #e5e7eb;">' +
      '<i class="ti ti-calendar-week" aria-hidden="true" style="font-size:13px;color:' + hdColor + ';"></i>' +
      '<span style="color:' + hdColor + ';">' + esc(wLabel) + '</span>' +
      (isCurr ? '<span style="background:#2D3E51;color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:400;text-transform:none;">current week</span>' : '') +
      '<span style="background:#2D3E51;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;margin-left:auto;">' + wTasks.length + '</span>' +
      '</div>';
    wTasks.sort(function(a,b){ return (_dateIso(a.Due_Date||'')||'9999') < (_dateIso(b.Due_Date||'')||'9999') ? -1 : 1; });
    wTasks.forEach(function(t){ html += _tskDateRowHtml(t, false); });
  });

  if (weekOrder.length === 0 && overdue.length === 0) {
    html += '<div style="padding:20px 14px;text-align:center;font-size:13px;color:#6b7280;">No upcoming tasks</div>';
  }

  if (noDate.length > 0) {
    html += '<div style="display:flex;align-items:center;gap:8px;padding:7px 14px;' +
      'font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;' +
      'background:#f9fafb;border-top:0.5px solid #e5e7eb;border-bottom:0.5px solid #e5e7eb;color:#6b7280;">' +
      '<i class="ti ti-calendar-off" aria-hidden="true" style="font-size:13px;"></i>' +
      'No due date<span style="background:#9ca3af;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:500;">' + noDate.length + '</span></div>';
    noDate.forEach(function(t){ html += _tskDateRowHtml(t, false); });
  }

  html += '</div>';
  return html;
}

function _tskSortClick(vid, col) {
  var s = _tskSort[vid];
  _tskSort[vid] = (s && s.col === col)
    ? { col: col, dir: s.dir * -1 }
    : { col: col, dir: 1 };
  if (vid === 'my')   renderMyTasks();
  else if (vid === 'team') renderTeamTasks();
  else renderAllTasks();
}

function _sortTskRows(rows, col, dir) {
  var PRI = { Critical: 0, High: 1, Medium: 2, Low: 3 };
  return rows.slice().sort(function(a, b) {
    var va, vb;
    switch (col) {
      case 'function':
        va = a.fn ? a.fn.Name.toLowerCase() : '';
        vb = b.fn ? b.fn.Name.toLowerCase() : '';
        break;
      case 'sub-fn':
        va = a.subFn ? a.subFn.Name.toLowerCase() : '';
        vb = b.subFn ? b.subFn.Name.toLowerCase() : '';
        break;
      case 'task':
        va = (a.displayTask ? a.displayTask.Title.toLowerCase() : '');
        vb = (b.displayTask ? b.displayTask.Title.toLowerCase() : '');
        break;
      case 'assignee': {
        var ta = a.displayTask, tb = b.displayTask;
        var ea = ta ? findEmp((_parseIds(ta.Assignee_IDs || ta.Assignee_ID))[0] || '') : null;
        var eb = tb ? findEmp((_parseIds(tb.Assignee_IDs || tb.Assignee_ID))[0] || '') : null;
        va = ea ? ea.Name.toLowerCase() : '';
        vb = eb ? eb.Name.toLowerCase() : '';
        break;
      }
      case 'assigner': {
        var asgnA = a.displayTask ? findEmp(a.displayTask.Assigner_ID || '') : null;
        var asgnB = b.displayTask ? findEmp(b.displayTask.Assigner_ID || '') : null;
        va = asgnA ? (asgnA.Name || asgnA.name || '').toLowerCase() : (a.displayTask ? (a.displayTask.Assigner_Name || '') : '').toLowerCase();
        vb = asgnB ? (asgnB.Name || asgnB.name || '').toLowerCase() : (b.displayTask ? (b.displayTask.Assigner_Name || '') : '').toLowerCase();
        break;
      }
      case 'project': {
        var pa = a.displayTask ? findProj(a.displayTask.Proj_ID) : null;
        var pb = b.displayTask ? findProj(b.displayTask.Proj_ID) : null;
        va = pa ? pa.Name.toLowerCase() : '';
        vb = pb ? pb.Name.toLowerCase() : '';
        break;
      }
      case 'status':
        va = (a.displayTask && a.displayTask.Status)   || '';
        vb = (b.displayTask && b.displayTask.Status)   || '';
        break;
      case 'priority':
        va = (a.displayTask && PRI[a.displayTask.Priority] !== undefined) ? PRI[a.displayTask.Priority] : 99;
        vb = (b.displayTask && PRI[b.displayTask.Priority] !== undefined) ? PRI[b.displayTask.Priority] : 99;
        return (va - vb) * dir;
      case 'due':
        va = (a.displayTask && a.displayTask.Due_Date) ? String(a.displayTask.Due_Date).substring(0, 10) : '9999-99-99';
        vb = (b.displayTask && b.displayTask.Due_Date) ? String(b.displayTask.Due_Date).substring(0, 10) : '9999-99-99';
        break;
      default: return 0;
    }
    if (va < vb) return -1 * dir;
    if (va > vb) return  1 * dir;
    return 0;
  });
}

function _tskUpdateSortHeaders(vid, sort) {
  ['function','sub-fn','task','assignee','assigner','project','status','priority','due'].forEach(function(col) {
    var sp = el('ts-si-' + vid + '-' + col);
    if (!sp) return;
    sp.textContent = (!sort || sort.col !== col) ? '' : (sort.dir === 1 ? ' ▲' : ' ▼');
  });
}

// fnPool: optional — when provided, only those functions are used to build hierarchy rows.
// "My Tasks" passes a user-scoped pool; "Team Tasks" / "All Tasks" omit it (defaults to APP.functions).
function _renderTskSheet(tasks, bodyId, cols, canEdit, filters, fnPool) {
  var body = el(bodyId);
  if (!body) return;
  var vidMap = { 'my-tasks-body': 'my', 'team-tasks-body': 'team', 'all-tasks-body': 'all' };
  var vid = vidMap[bodyId] || '';
  var isManagerRole = _isManager(APP.currentUser.role);
  var rows = _buildExcelRows(tasks, fnPool !== undefined ? fnPool : (APP.functions || []));
  if (filters) {
    rows = rows.filter(function(row) { return _tskRowMatchFilters(row, filters); });
  }
  var sort = _tskSort[vid];
  if (sort && sort.col) rows = _sortTskRows(rows, sort.col, sort.dir);
  _tskUpdateSortHeaders(vid, sort);

  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="' + (cols.length + 2) + '" class="ts-empty">No tasks found. Click "+ Add task" below to create one.</td></tr>';
    _tskRendered[vid] = 0;
    return;
  }

  // Store full row list on the body element for scroll-based appending
  body._tskRows      = rows;
  body._tskCols      = cols;
  body._tskCanEdit   = canEdit;
  body._tskIsManager = isManagerRole;

  // Render first page immediately
  var firstBatch = rows.slice(0, _TSK_PAGE_SIZE);
  body.innerHTML = firstBatch.map(function(row) {
    var t = row.displayTask;
    var canDeleteRow = t ? (isManagerRole || t.Assigner_ID === APP.currentUser.empId) : false;
    return _tskRowHtml(row, cols, canEdit, canDeleteRow);
  }).join('');
  _tskRendered[vid] = firstBatch.length;

  // Remove any existing scroll listener for this view before adding a new one
  var scrollEl = el('main');
  if (!scrollEl) return;
  if (body._tskScrollHandler) {
    scrollEl.removeEventListener('scroll', body._tskScrollHandler);
  }

  // If all rows fit in first batch, no scroll listener needed
  if (rows.length <= _TSK_PAGE_SIZE) return;

  // Scroll listener: append next batch when user nears the bottom
  body._tskScrollHandler = function() {
    var rendered = _tskRendered[vid];
    if (rendered >= body._tskRows.length) {
      scrollEl.removeEventListener('scroll', body._tskScrollHandler);
      return;
    }
    // Trigger when within 300px of bottom of #main scroll container
    var distFromBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight;
    if (distFromBottom > 300) return;

    var nextBatch = body._tskRows.slice(rendered, rendered + _TSK_PAGE_SIZE);
    var fragment = nextBatch.map(function(row) {
      var t = row.displayTask;
      var canDeleteRow = t ? (body._tskIsManager || t.Assigner_ID === APP.currentUser.empId) : false;
      return _tskRowHtml(row, body._tskCols, body._tskCanEdit, canDeleteRow);
    }).join('');
    body.insertAdjacentHTML('beforeend', fragment);
    _tskRendered[vid] += nextBatch.length;

    if (_tskRendered[vid] >= body._tskRows.length) {
      scrollEl.removeEventListener('scroll', body._tskScrollHandler);
    }
  };

  scrollEl.addEventListener('scroll', body._tskScrollHandler);
}

function _tskRowHtml(row, cols, canEdit, canDelete) {
  var isManager = canDelete; // back-compat alias used below
  var t    = row.displayTask;

  // Placeholder row — function or sub-function exists but has no tasks yet
  if (!t) {
    var phFnId   = row.fn    ? row.fn.Function_ID    : '';
    var phSfId   = row.subFn ? row.subFn.Function_ID : '';
    var phRowId  = 'ts-ph-' + esc(phSfId || phFnId);
    var phEditId = esc(phSfId || phFnId);
    var isManager = _isManager(APP.currentUser.role);
    // The most specific entity (subFn if present, else fn) holds Status/Priority/Assignee/Deadline
    var phData   = row.subFn || row.fn || {};
    var phPri    = phData.Priority || '';
    return '<tr id="' + phRowId + '" class="ts-placeholder-row">' +
      '<td class="ts-pribar' + (phPri ? ' p-' + esc(phPri) : '') + '"></td>' +

              ? '<span class="ts-ph-name" style="overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%">' + esc(row.fn.Name) + '</span>' +
                '<div class="ts-id-tag">' + esc(row.fn.Function_ID) + '</div>'

        }
        if (col === 'sub-fn') {
          return '<td class="ts-td ts-ph-sf-cell" data-col="sub-fn"' +
            (phSfId ? ' data-ph-fn="' + esc(phSfId) + '"' : '') + '>' +
            (row.subFn
              ? '<div style="min-width:0"><span class="ts-ph-name" style="font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(row.subFn.Name) + '</span>' +
                '<div class="ts-id-tag">' + esc(row.subFn.Function_ID) + '</div></div>'
              : (row.fn && isManager
                  ? '<button class="ts-ph-add-btn" onclick="_phAddSubFn(\'' + esc(row.fn.Function_ID) + '\',\'' + esc(row.fn.Proj_ID || '') + '\')">' +
                      '<span class="material-symbols-outlined" style="font-size:12px">add</span> Add Sub-Fn' +

                  : '')
            ) + '</td>';
        }
        if (col === 'task') {
          return '<td class="ts-td" data-col="task">' +
            '<button class="ts-ph-add-btn" onclick="_phAddTask(\'' + esc(phFnId) + '\',\'' + esc(phSfId) + '\')">' +
              '<span class="material-symbols-outlined" style="font-size:12px">add</span> Add Task' +

        }
        // Render live data for assignee / assigner / status / priority / due / project
        return '<td class="ts-td ts-ro" data-col="' + col + '">' + _phCellHtml(phData, col) + '</td>';
      }).join('') +
      '<td class="ts-actions-cell" style="padding:4px 6px">' +
        '<div style="display:flex;align-items:center;gap:1px">' +
          (isManager ? '<button class="ts-edit-btn" onclick="_phRowFullEdit(\'' + phEditId + '\')" title="Edit"><span class="material-symbols-outlined" style="font-size:15px">edit</span></button>' : '') +
          (isManager ? '<button class="ts-del-btn"  onclick="_phRowConfirmDelete(\'' + phEditId + '\')" title="Delete"><span class="material-symbols-outlined" style="font-size:15px">delete</span></button>' : '') +
          '<button class="ts-open-btn" onclick="openFunctionDetail(\'' + phEditId + '\')" title="Open detail"><span class="material-symbols-outlined" style="font-size:17px">open_in_new</span></button>' +
        '</div>' +
      '</td>' +
    '</tr>';
  }

  var proj = findProj(t.Proj_ID);
  var assigneeIds = _parseIds(t.Assignee_IDs || t.Assignee_ID);
  var emp  = assigneeIds.length ? findEmp(assigneeIds[0]) : null; // primary for display
  var asgn = t.Assigner_Name || findEmpName(t.Assigner_ID);
  var tid  = esc(t.Task_ID);

  var _tskClosedCls = _isClosed(t.Status) ? ' tsk-status-closed' : '';
  return '<tr id="ts-row-' + tid + '" class="tsk-pri-' + esc((t.Priority || '').toLowerCase()) + _tskClosedCls + '">' +
    '<td class="ts-pribar p-' + esc(t.Priority || '') + '"></td>' +
    cols.map(function(col) {
      var ro = _tskColRo(col, row, isManager);
      var clickAttr = ' data-col="' + col + '"';
      return '<td class="ts-td' + (ro ? ' ts-ro' : '') + '"' + clickAttr + '>' +
        _tskCellHtml(row, col, proj, emp, asgn) + '</td>';
    }).join('') +
    '<td class="ts-actions-cell" style="padding:4px 6px;white-space:nowrap">' +
      '<div style="display:flex;align-items:center;gap:1px">' +
        (canEdit  ? '<button class="ts-edit-btn" onclick="_tskRowEditStart(\'' + tid + '\')" title="Edit row"><span class="material-symbols-outlined" style="font-size:15px">edit</span></button>' : '') +
        (isManager ? '<button class="ts-del-btn" onclick="confirmDeleteTask(\'' + tid + '\')" title="Delete task"><span class="material-symbols-outlined" style="font-size:15px">delete</span></button>' : '') +
        '<button class="ts-open-btn" onclick="openTaskDetail(\'' + tid + '\')" title="Open detail"><span class="material-symbols-outlined" style="font-size:17px">open_in_new</span></button>' +
        '<button class="btn btn-ghost" style="padding:2px 5px;font-size:11px;color:var(--accent)" data-att-badge="' + t.Task_ID + '" onclick="openTaskDetail(\'' + tid + '\')" title="Attachments" ' + ((ATT_COUNTS[t.Task_ID] || 0) > 0 ? '' : 'style="display:none"') + '>📎 ' + (ATT_COUNTS[t.Task_ID] || 0) + '</button>' +
      '</div>' +
    '</td>' +
  '</tr>';
}

// ── Placeholder row helpers (Functions/Sub-Functions with no tasks) ───────────

// Render read-only cell content for a fn/sf placeholder row column
function _phCellHtml(phData, col) {
  if (!phData) return '';
  var o = function(val, lbl, sel) { return '<option value="' + esc(val) + '"' + (sel ? ' selected' : '') + '>' + esc(lbl || val) + '</option>'; };
  switch (col) {
    case 'assignee': {
      var ids = _parseIds(phData.Assignee_IDs || '');
      if (!ids.length) return '<span style="color:var(--muted)">—</span>';
      if (ids.length === 1) {
        var e0 = findEmp(ids[0]);
        var dept = e0 ? [e0['Team'], e0['Sub_Department']].filter(Boolean).join(' / ') : '';
        var nameHtml = e0
          ? '<span class="avatar-sm" style="margin-right:4px">' + (e0.Name || '?').charAt(0).toUpperCase() + '</span>' + esc(e0.Name || ids[0])
          : esc(ids[0]);
        return '<div class="ts-cell-meta"><div>' + nameHtml + '</div>' + (dept ? '<div class="ts-cell-dept">' + esc(dept) + '</div>' : '') + '</div>';
      }
      var avs = ids.slice(0, 3).map(function(id) {
        var e = findEmp(id);
        return '<span class="avatar-sm" title="' + esc(e ? e.Name : id) + '" style="margin-right:-4px;border:2px solid var(--surface)">' + (e ? (e.Name || '?').charAt(0).toUpperCase() : '?') + '</span>';
      }).join('');
      return '<div style="display:flex;align-items:center">' + avs + (ids.length > 3 ? '<span style="font-size:11px;color:var(--muted);margin-left:8px">+' + (ids.length - 3) + '</span>' : '') + '</div>';
    }
    case 'assigner': {
      var asgnEmp = phData.Assigner_ID ? findEmp(phData.Assigner_ID) : null;
      if (!asgnEmp) return '<span style="color:var(--muted)">—</span>';
      var meta = [asgnEmp.Team, asgnEmp.Sub_Department].filter(Boolean).join(' / ');
      return '<div class="ts-cell-meta"><div><span class="avatar-sm" style="margin-right:4px">' + (asgnEmp.Name || '?').charAt(0).toUpperCase() + '</span>' + esc(asgnEmp.Name) + '</div>' + (meta ? '<div class="ts-cell-dept">' + esc(meta) + '</div>' : '') + '</div>';
    }
    case 'status':   return pill(phData.Status || '');
    case 'priority': return badge(phData.Priority || '');
    case 'due':      return deadlineHtml(phData.Deadline || '', phData.Status || '');
    case 'project': {
      var proj = findProj(phData.Proj_ID);
      return proj ? esc(proj.Name) : '<span style="color:var(--muted)">—</span>';
    }
    default: return '';
  }
}

// Create an edit input for a fn/sf placeholder row column
function _phMakeInp(phData, col) {
  var o = function(val, lbl, sel) { return '<option value="' + esc(val) + '"' + (sel ? ' selected' : '') + '>' + esc(lbl || val) + '</option>'; };
  var _sortedEmpsPh = (APP.employees || []).slice().sort(function(a, b) { return (a.Name || '').localeCompare(b.Name || ''); });
  var inp;
  switch (col) {
    case 'assignee':
      inp = document.createElement('select'); inp.className = 'ts-input ts-asgn-pop';
      inp.multiple = true;
      var curIds = _parseIds(phData.Assignee_IDs || '');
      inp.innerHTML = _sortedEmpsPh.map(function(e) { return o(e.Emp_ID, e.Name, curIds.indexOf(e.Emp_ID) !== -1); }).join('');
      break;
    case 'assigner':
      inp = document.createElement('select'); inp.className = 'ts-input';
      inp.innerHTML = '<option value="">— None —</option>' +
        _sortedEmpsPh.map(function(e) { return o(e.Emp_ID, e.Name, e.Emp_ID === (phData.Assigner_ID || '')); }).join('');
      break;
    case 'status':
      inp = document.createElement('select'); inp.className = 'ts-input';
      inp.innerHTML = [''].concat(TASK_STATUSES).map(function(s) { return o(s, s || '— Status —', s === (phData.Status || '')); }).join('');
      break;
    case 'priority':
      inp = document.createElement('select'); inp.className = 'ts-input';
      inp.innerHTML = ['Low','Medium','High','Critical'].map(function(p) { return o(p, p, p === (phData.Priority || '')); }).join('');
      break;
    case 'due':
      inp = document.createElement('input'); inp.className = 'ts-input'; inp.type = 'date';
      inp.value = phData.Deadline ? String(phData.Deadline).substring(0, 10) : '';
      break;
    default:
      inp = document.createElement('span');
  }
  return inp;
}

var _phRowEd = null;

// Full-row inline edit — mirrors _tskRowEditStart but for fn/sf placeholder rows
function _phRowFullEdit(phId) {
  if (_phRowEd) _phRowCancelEdit(_phRowEd.phId);
  var tr = el('ts-ph-' + phId);
  if (!tr) return;

  var fnCell = tr.querySelector('[data-col="function"]');
  var sfCell = tr.querySelector('[data-col="sub-fn"]');
  var fnId   = fnCell ? (fnCell.getAttribute('data-ph-fn') || '') : '';
  var sfId   = sfCell ? (sfCell.getAttribute('data-ph-fn') || '') : '';
  var fn     = fnId ? (APP.functions || []).find(function(f) { return f.Function_ID === fnId; }) : null;
  var sf     = sfId ? (APP.functions || []).find(function(f) { return f.Function_ID === sfId; }) : null;
  // Most specific entity: sf if present, else fn (Status/Priority/Assignee belong here)
  var target = sf || fn;

  var origCells = {};
  tr.querySelectorAll('td[data-col]').forEach(function(td) {
    origCells[td.getAttribute('data-col')] = td.innerHTML;
  });

  var kh = function(e) {
    if ((e.key === 'Enter' || e.key === 's') && e.ctrlKey) { e.preventDefault(); _phRowSave(phId); }
    if (e.key === 'Escape') { e.preventDefault(); _phRowCancelEdit(phId); }
  };

  // Function name input
  if (fnCell && fn) {
    fnCell.classList.add('editing'); fnCell.onclick = null;
    var fi = document.createElement('input');
    fi.className = 'ts-input'; fi.id = 'ph-ed-fn-' + phId; fi.value = fn.Name;
    fi.addEventListener('keydown', kh);
    fnCell.innerHTML = ''; fnCell.appendChild(fi);
  }

  // Sub-Function name input
  if (sfCell && sf) {
    sfCell.classList.add('editing'); sfCell.onclick = null;
    var si = document.createElement('input');
    si.className = 'ts-input'; si.id = 'ph-ed-sf-' + phId; si.value = sf.Name;
    si.addEventListener('keydown', kh);
    sfCell.innerHTML = ''; sfCell.appendChild(si);
  }

  // Other editable columns — edit target (sf || fn)
  var editableCols = ['assignee', 'assigner', 'status', 'priority', 'due'];
  if (target) {
    tr.querySelectorAll('td[data-col]').forEach(function(td) {
      var col = td.getAttribute('data-col');
      if (editableCols.indexOf(col) === -1) return;
      td.classList.add('editing'); td.onclick = null;
      var inp = _phMakeInp(target, col);
      inp.addEventListener('keydown', kh);
      td.innerHTML = ''; td.appendChild(inp);
    });
  }

  var actTd = tr.querySelector('.ts-actions-cell');
  var origActions = actTd ? actTd.innerHTML : '';
  if (actTd) {
    actTd.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;gap:4px">' +
        '<button class="ts-ab ok" onclick="_phRowSave(\'' + phId + '\')" title="Save (Ctrl+Enter)"><span class="material-symbols-outlined" style="font-size:14px">check</span></button>' +
        '<button class="ts-ab cl" onclick="_phRowCancelEdit(\'' + phId + '\')" title="Cancel (Esc)"><span class="material-symbols-outlined" style="font-size:14px">close</span></button>' +
      '</div>';
  }
  tr.classList.add('ts-row-editing');
  _phRowEd = { phId: phId, fnId: fnId, sfId: sfId, target: target, origCells: origCells, origActions: origActions };

  var firstInp = tr.querySelector('td.editing .ts-input:not(.ts-asgn-pop)');
  if (firstInp) { firstInp.focus(); if (firstInp.select) firstInp.select(); }
}

function _phRowSave(phId) {
  if (!_phRowEd || _phRowEd.phId !== phId) return;
  var ed = _phRowEd; _phRowEd = null;
  var tr = el('ts-ph-' + phId);
  if (!tr) return;

  var fn     = ed.fnId ? (APP.functions || []).find(function(f) { return f.Function_ID === ed.fnId; }) : null;
  var sf     = ed.sfId ? (APP.functions || []).find(function(f) { return f.Function_ID === ed.sfId; }) : null;
  var target = sf || fn;

  // Name changes
  var fnInp = el('ph-ed-fn-' + phId);
  var sfInp = el('ph-ed-sf-' + phId);
  var namePending = [];
  if (fn && fnInp) { var nv = fnInp.value.trim(); if (nv && nv !== fn.Name) namePending.push({ rec: fn, name: nv }); }
  if (sf && sfInp) { var nv2 = sfInp.value.trim(); if (nv2 && nv2 !== sf.Name) namePending.push({ rec: sf, name: nv2 }); }

  // Field changes on target (Status/Priority/Assignee/Assigner/Deadline)
  var colToField = { assignee: 'Assignee_IDs', assigner: 'Assigner_ID', status: 'Status', priority: 'Priority', due: 'Deadline' };
  var fieldUpdates = {};
  if (target) {
    tr.querySelectorAll('td[data-col].editing').forEach(function(td) {
      var col = td.getAttribute('data-col');
      var fld = colToField[col]; if (!fld) return;
      var inp = td.querySelector('.ts-input'); if (!inp) return;
      var newVal = (inp.tagName === 'SELECT' && inp.multiple)
        ? Array.from(inp.selectedOptions).map(function(o) { return o.value; }).join(',')
        : inp.value;
      var curVal = (fld === 'Deadline' && target[fld]) ? String(target[fld]).substring(0, 10) : (target[fld] || '');
      if (curVal !== newVal) fieldUpdates[fld] = newVal;
    });
  }

  // Restore row visually
  tr.classList.remove('ts-row-editing');
  var actTd = tr.querySelector('.ts-actions-cell');
  if (actTd) actTd.innerHTML = ed.origActions;
  tr.querySelectorAll('td[data-col]').forEach(function(td) {
    td.classList.remove('editing');
    var col = td.getAttribute('data-col');
    if (ed.origCells[col] !== undefined) td.innerHTML = ed.origCells[col];
  });

  // Apply name changes in-memory + server
  namePending.forEach(function(u) {
    var origName = u.rec.Name;
    u.rec.Name = u.name;
    var nameSpan = (u.rec.Function_ID === ed.fnId)
      ? tr.querySelector('[data-col="function"] .ts-ph-name')
      : tr.querySelector('[data-col="sub-fn"] .ts-ph-name');
    if (nameSpan) nameSpan.textContent = u.name;
    google.script.run
      .withSuccessHandler(function() { toast('Saved.', 'ok'); })
      .withFailureHandler(function(err) {
        toast(err.message || 'Save failed', 'error');
        u.rec.Name = origName;
        if (nameSpan) nameSpan.textContent = origName;
      })
      .updateFunction(u.rec.Function_ID, { Name: u.name }, APP._verifiedEmail);
  });

  // Apply field changes on target in-memory + server
  if (target && Object.keys(fieldUpdates).length) {
    Object.keys(fieldUpdates).forEach(function(k) { target[k] = fieldUpdates[k]; });
    // Re-render the changed cells with fresh data
    var phData = target;
    tr.querySelectorAll('td[data-col]').forEach(function(td) {
      var col = td.getAttribute('data-col');
      if (!colToField[col]) return;
      td.innerHTML = _phCellHtml(phData, col);
    });
    // Update pribar if priority changed
    if (fieldUpdates.Priority) {
      var bar = tr.querySelector('.ts-pribar');
      if (bar) bar.className = 'ts-pribar p-' + fieldUpdates.Priority;
    }
    google.script.run
      .withSuccessHandler(function() { toast('Saved.', 'ok'); })
      .withFailureHandler(function(err) {
        toast(err.message || 'Save failed', 'error');
        // Revert in-memory
        Object.keys(fieldUpdates).forEach(function(k) { target[k] = (ed.origCells[k] || ''); });
        refresh();
      })
      .updateFunction(target.Function_ID, fieldUpdates, APP._verifiedEmail);
  }
}

function _phRowCancelEdit(phId) {
  if (!_phRowEd || _phRowEd.phId !== phId) return;
  var ed = _phRowEd; _phRowEd = null;
  var tr = el('ts-ph-' + phId);
  if (!tr) return;
  tr.classList.remove('ts-row-editing');
  var actTd = tr.querySelector('.ts-actions-cell');
  if (actTd) actTd.innerHTML = ed.origActions;
  tr.querySelectorAll('td[data-col]').forEach(function(td) {
    td.classList.remove('editing');
    var col = td.getAttribute('data-col');
    if (ed.origCells[col] !== undefined) td.innerHTML = ed.origCells[col];
  });
}

function _phRowConfirmDelete(phId) {
  var tr = el('ts-ph-' + phId);
  if (!tr) return;
  var sfCell = tr.querySelector('.ts-ph-sf-cell[data-ph-fn]');
  var fnCell = tr.querySelector('.ts-ph-fn-cell[data-ph-fn]');
  var targetId = (sfCell && sfCell.getAttribute('data-ph-fn')) || (fnCell && fnCell.getAttribute('data-ph-fn')) || '';
  if (targetId) confirmDeleteFunction(targetId);
}

// Inline rename for a Function or Sub-Function name cell (single-cell quick edit)
function _phCellEdit(tdEl) {
  var fnId = tdEl.getAttribute('data-ph-fn');
  if (!fnId) return;
  var fn = (APP.functions || []).find(function(f) { return f.Function_ID === fnId; });
  if (!fn) return;
  var origHtml = tdEl.innerHTML;
  var origName = fn.Name;
  var isSf = tdEl.classList.contains('ts-ph-sf-cell');
  tdEl.classList.add('editing');
  var inp = document.createElement('input');
  inp.className = 'ts-input';
  inp.type = 'text';
  inp.value = fn.Name;
  tdEl.innerHTML = '';
  tdEl.appendChild(inp);
  inp.focus(); inp.select();

  var committed = false;
  function commit() {
    if (committed) return; committed = true;
    var newName = inp.value.trim();
    tdEl.classList.remove('editing');
    if (!newName) { tdEl.innerHTML = origHtml; committed = false; return; }
    fn.Name = newName;
    if (isSf) {
      tdEl.innerHTML = '<div style="min-width:0"><span class="ts-ph-name" style="font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(newName) + '</span><div class="ts-id-tag">' + esc(fn.Function_ID) + '</div></div>';
    } else {
      tdEl.innerHTML = '<span class="ts-ph-name" style="overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%">' + esc(newName) + '</span><div class="ts-id-tag">' + esc(fn.Function_ID) + '</div>';
    }
    if (newName === origName) return;
    google.script.run
      .withSuccessHandler(function() { toast('Renamed.', 'ok'); })
      .withFailureHandler(function(err) {
        toast(err.message || 'Rename failed', 'error');
        fn.Name = origName; tdEl.innerHTML = origHtml;
      })
      .updateFunction(fnId, { Name: newName }, APP._verifiedEmail);
  }
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { committed = true; tdEl.classList.remove('editing'); tdEl.innerHTML = origHtml; }
  });
  inp.addEventListener('blur', function() { setTimeout(commit, 180); });
}

// Edit button in placeholder row actions cell — focuses the right name cell
function _phRowEdit(phId) { _phRowFullEdit(phId); }

// "+ Add Task" — navigate to My Tasks, pre-fill fn/sf filters, open batch add
function _phAddTask(fnId, sfId) {
  navigate('my-tasks');
  setTimeout(function() {
    _populateTskFilterSelects('my');
    if (fnId) _ssmSet(el('tf-my-fn'),     [fnId]);

  }, 250);
}

// Open batch-add panel pre-wired to create a Sub-Function under fnId
function _phAddSubFn(fnId, projId) {
  navigate('my-tasks');
  setTimeout(function() {
    _populateTskFilterSelects('my');
    _tskBatchOpen('my');
    setTimeout(function() {
      var n = 0; // first batch row
      // Select the parent function
      var fnSel = el('atm-fn-' + n);
      if (fnSel && fnId) { fnSel.value = fnId; _atmFnChange(n); }
      // Select the project
      if (projId) { var ps = el('atm-proj-' + n); if (ps) ps.value = projId; }
      // Switch sub-fn column to new-name mode

      if (sfInp) sfInp.focus();

  }, 250);
}

function _tskColRo(col, row, isManager) {
  if (col === 'function') return true;   // lookup — always read-only
  if (col === 'sub-fn')   return true;   // lookup — always read-only
  if (col === 'task')     return false;  // task title — always editable
  if (col === 'assignee') return !isManager;
  if (col === 'assigner') return true;
  return false;
}

function _tskCellHtml(row, col, proj, emp, asgn) {
  var t = row.displayTask;
  switch (col) {
    case 'function': {
      var fn = row.fn;
      if (!fn) return '<span style="color:var(--muted);font-style:italic">—</span>';
      var _fnDesc = (fn.Description || '').trim();
      var _fnDescHtml = _fnDesc
        ? '<span style="font-size:10px;color:var(--muted2);display:block;overflow:hidden;' +
          'text-overflow:ellipsis;white-space:nowrap;max-width:100%;margin-top:1px" title="' + esc(_fnDesc) + '">' +
          esc(_fnDesc.length > 50 ? _fnDesc.substring(0, 47) + '…' : _fnDesc) + '</span>'
        : '';
      return '<div style="min-width:0">' +
        '<span style="font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis">' +
          esc(fn.Name) +
        '</span>' +
        _fnDescHtml +
      '</div>';
    }
    case 'sub-fn': {
      var sf = row.subFn;
      if (!sf) return '<span style="color:var(--muted2)">—</span>';
      var _sfDesc = (sf.Description || '').trim();
      var _sfDescHtml = _sfDesc

    case 'assignee': {

}

function _tskEdit(taskId, col, tdEl) {
  if (_tskEd) _tskCancelEdit();
  var t = APP.tasks.find(function(x) { return x.Task_ID === taskId; });
  if (!t) return;
  var isChild = tdEl.closest('tr') && tdEl.closest('tr').classList.contains('ts-row-sub');
  _tskEd = { taskId: taskId, col: col, tdEl: tdEl, origHtml: tdEl.innerHTML, isChild: !!isChild };
  tdEl.classList.add('editing');
  var inp = _tskMakeInp(t, col);
  tdEl.innerHTML = '';
  tdEl.appendChild(inp);
  if (inp.tagName === 'INPUT') { inp.focus(); inp.select(); } else inp.focus();
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); _tskCommit(); }
    if (e.key === 'Escape') { e.preventDefault(); _tskCancelEdit(); }
  });
  inp.addEventListener('blur', function() {
    setTimeout(function() {
      if (_tskEd && _tskEd.taskId === taskId && _tskEd.col === col) _tskCommit();
    }, 160);
  });
}

function _tskMakeInp(t, col) {
  var o = function(val, lbl, sel) {
    return '<option value="' + esc(val) + '"' + (sel ? ' selected' : '') + '>' + esc(lbl || val) + '</option>';
  };
  var inp;
  switch (col) {
    case 'title':
    case 'task':
      inp = document.createElement('input');
      inp.className = 'ts-input'; inp.type = 'text'; inp.value = t.Title || '';
      break;
    case 'project':
      inp = document.createElement('select'); inp.className = 'ts-input';
      inp.innerHTML = APP.projects.map(function(p) { return o(p.Proj_ID, p.Name, p.Proj_ID === t.Proj_ID); }).join('');
      break;
    case 'assignee':
      inp = document.createElement('select'); inp.className = 'ts-input ts-asgn-pop';
      inp.multiple = true;
      var curIds = _parseIds(t.Assignee_IDs || t.Assignee_ID);
      inp.innerHTML = (APP.employees || []).slice().sort(function(a, b) { return (a.Name || '').localeCompare(b.Name || ''); }).map(function(e) { return o(e.Emp_ID || e['Emp_ID'], e.Name || e.name, curIds.indexOf(e.Emp_ID || e['Emp_ID']) !== -1); }).join('');
      break;
    case 'status':
      inp = document.createElement('select'); inp.className = 'ts-input';
      inp.innerHTML = [''].concat(TASK_STATUSES).map(function(s) { return o(s, s || '— Select status —', s === t.Status); }).join('');
      break;
    case 'priority':
      inp = document.createElement('select'); inp.className = 'ts-input';
      inp.innerHTML = ['Low','Medium','High','Critical'].map(function(p) { return o(p, p, p === t.Priority); }).join('');
      break;
    case 'due':
      inp = document.createElement('input');
      inp.className = 'ts-input'; inp.type = 'date';
      inp.value = t.Due_Date ? String(t.Due_Date).substring(0, 10) : '';
      break;
    default:
      inp = document.createElement('span');
  }
  return inp;
}

function _tskCommit() {
  if (!_tskEd) return;
  var ed = _tskEd; _tskEd = null;
  var inp = ed.tdEl.querySelector('.ts-input');
  if (!inp) { ed.tdEl.classList.remove('editing'); ed.tdEl.innerHTML = ed.origHtml; return; }
  var newVal = inp.tagName === 'SELECT' && inp.multiple
    ? Array.from(inp.selectedOptions).map(function(o) { return o.value; }).join(',')
    : inp.value;
  ed.tdEl.classList.remove('editing');
  var fldMap = { title:'Title', 'task':'Title', project:'Proj_ID', assignee:'Assignee_IDs', status:'Status', priority:'Priority', due:'Due_Date' };
  var fld = fldMap[ed.col];
  if (!fld) { ed.tdEl.innerHTML = ed.origHtml; return; }
  var t = APP.tasks.find(function(x) { return x.Task_ID === ed.taskId; });
  if (!t) { ed.tdEl.innerHTML = ed.origHtml; return; }
  var curVal = (fld === 'Due_Date' && t[fld]) ? String(t[fld]).substring(0, 10) : (t[fld] || '');
  if (curVal === newVal) { ed.tdEl.innerHTML = ed.origHtml; return; }
  t[fld] = newVal;
  var row  = _buildRowForTask(t);
  var proj = findProj(t.Proj_ID), emp = findEmp((_parseIds(t.Assignee_IDs || t.Assignee_ID))[0] || ''), asgn = t.Assigner_Name || findEmpName(t.Assigner_ID);
  ed.tdEl.innerHTML = _tskCellHtml(row, ed.col, proj, emp, asgn);
  if (ed.col === 'priority') {
    var bar = ed.tdEl.closest('tr').querySelector('.ts-pribar');
    if (bar) bar.className = 'ts-pribar p-' + newVal;
  }
  var rec = {}; rec[fld] = newVal;
  google.script.run
    .withFailureHandler(function(err) {
      toast(err.message || 'Save failed', 'error');
      t[fld] = curVal;
      ed.tdEl.innerHTML = _tskCellHtml(_buildRowForTask(t), ed.col, findProj(t.Proj_ID), findEmp((_parseIds(t.Assignee_IDs || t.Assignee_ID))[0] || ''), asgn);
    })
    .updateTask(ed.taskId, rec, APP.currentUser.email);
}

function _tskCancelEdit() {
  if (!_tskEd) return;
  var ed = _tskEd; _tskEd = null;
  ed.tdEl.classList.remove('editing');
  ed.tdEl.innerHTML = ed.origHtml;
}

// ── Task Sheet: Full-row Inline Edit ─────────────────────────────────────────
var _tskRowEd = null;

function _tskRowEditStart(taskId) {
  if (_tskRowEd) _tskRowEditCancel(_tskRowEd.taskId);
  if (_tskEd)    _tskCancelEdit();
  var t  = APP.tasks.find(function(x) { return x.Task_ID === taskId; });
  if (!t) return;
  var tr = el('ts-row-' + taskId);
  if (!tr) return;

  var isManager = _isManager(APP.currentUser.role);
  var row       = _buildRowForTask(t);
  var origCells = {};

  tr.querySelectorAll('td[data-col]').forEach(function(td) {
    var col = td.getAttribute('data-col');
    origCells[col] = td.innerHTML;
    var ro = _tskColRo(col, row, isManager);
    if (ro) return;
    td.classList.add('editing');
    td.onclick = null;
    var inp = _tskMakeInp(t, col);
    inp.addEventListener('keydown', function(e) {
      if ((e.key === 'Enter' || e.key === 's') && e.ctrlKey) { e.preventDefault(); _tskRowEditSave(taskId); }
      if (e.key === 'Escape') { e.preventDefault(); _tskRowEditCancel(taskId); }
    });
    td.innerHTML = '';
    td.appendChild(inp);
  });

  var actTd = tr.querySelector('.ts-actions-cell');
  var origActions = actTd ? actTd.innerHTML : '';
  if (actTd) {
    actTd.innerHTML =
      '<div style="display:flex;align-items:center;justify-content: center;gap:4px">' +
        '<button class="ts-ab ok" onclick="_tskRowEditSave(\'' + taskId + '\')" title="Save (Ctrl+Enter)"><span class="material-symbols-outlined" style="font-size:14px">check</span></button>' +
        '<button class="ts-ab cl" onclick="_tskRowEditCancel(\'' + taskId + '\')" title="Cancel (Esc)"><span class="material-symbols-outlined" style="font-size:14px">close</span></button>' +
      '</div>';
  }

  tr.classList.add('ts-row-editing');
  _tskRowEd = { taskId: taskId, origCells: origCells, origActions: origActions };

  // Focus title/task input first; fall back to first non-floating input
  var titleInp = tr.querySelector('td[data-col="title"] .ts-input, td[data-col="task"] .ts-input');
  var firstInp = titleInp || tr.querySelector('td.editing .ts-input:not(.ts-asgn-pop)');
  if (firstInp) { firstInp.focus(); if (firstInp.select) firstInp.select(); }
}

function _tskRowEditSave(taskId) {
  if (!_tskRowEd || _tskRowEd.taskId !== taskId) return;
  var ed = _tskRowEd; _tskRowEd = null;
  var t  = APP.tasks.find(function(x) { return x.Task_ID === taskId; });
  var tr = el('ts-row-' + taskId);
  if (!t || !tr) { _tskRowEditCancel(taskId); return; }

  var fldMap = { 'task':'Title', title:'Title', assignee:'Assignee_IDs',
                 project:'Proj_ID', status:'Status', priority:'Priority', due:'Due_Date' };
  var rec = {};

  tr.querySelectorAll('td[data-col].editing').forEach(function(td) {
    var col = td.getAttribute('data-col');
    var fld = fldMap[col]; if (!fld) return;
    var inp = td.querySelector('.ts-input'); if (!inp) return;
    var newVal = (inp.tagName === 'SELECT' && inp.multiple)
      ? Array.from(inp.selectedOptions).map(function(o) { return o.value; }).join(',')
      : inp.value;
    var curVal = (fld === 'Due_Date' && t[fld]) ? String(t[fld]).substring(0, 10) : (t[fld] || '');
    if (curVal !== newVal) rec[fld] = newVal;
  });

  tr.classList.remove('ts-row-editing');
  var actTd = tr.querySelector('.ts-actions-cell');
  if (actTd) actTd.innerHTML = ed.origActions;

  // Optimistically update in-memory and re-render row cells
  Object.keys(rec).forEach(function(fld) { t[fld] = rec[fld]; });
  _tskRowEditRedisplay(tr, t);

  if (!Object.keys(rec).length) return; // nothing changed

  google.script.run
    .withSuccessHandler(function() { toast('Task updated.', 'success'); })
    .withFailureHandler(function(err) {
      toast(err.message || 'Save failed', 'error');
      refresh();
    })
    .updateTask(taskId, rec, APP.currentUser.email);
}

function _tskRowEditCancel(taskId) {
  if (!_tskRowEd || _tskRowEd.taskId !== taskId) return;
  var ed = _tskRowEd; _tskRowEd = null;
  var tr = el('ts-row-' + taskId);
  if (!tr) return;
  tr.classList.remove('ts-row-editing');
  var actTd = tr.querySelector('.ts-actions-cell');
  if (actTd) actTd.innerHTML = ed.origActions;
  // Restore all cells and re-attach click handlers
  var t = APP.tasks.find(function(x) { return x.Task_ID === taskId; });
  if (t) { _tskRowEditRedisplay(tr, t); return; }
  // Fallback: restore raw HTML
  tr.querySelectorAll('td[data-col]').forEach(function(td) {
    td.classList.remove('editing');
    var col = td.getAttribute('data-col');
    if (ed.origCells[col] !== undefined) td.innerHTML = ed.origCells[col];
  });
}

function _tskRowEditRedisplay(tr, t) {
  var isManager = _isManager(APP.currentUser.role);
  var row  = _buildRowForTask(t);
  var proj = findProj(t.Proj_ID);
  var emp  = findEmp((_parseIds(t.Assignee_IDs || t.Assignee_ID))[0] || '');
  var asgn = t.Assigner_Name || findEmpName(t.Assigner_ID);
  tr.querySelectorAll('td[data-col]').forEach(function(td) {
    var col = td.getAttribute('data-col');
    var ro  = _tskColRo(col, row, isManager);
    td.classList.remove('editing');
    td.innerHTML = _tskCellHtml(row, col, proj, emp, asgn);
    td.onclick = null;
    if (!ro) {
      (function(c) { td.onclick = function() { _tskEdit(t.Task_ID, c, td); }; }(col));
    }
  });
}

// ── Task Sheet: Inline quick-add row under a Sub-Function context ──────────────
// Triggered when the user clicks "+ Task" on a sub-function row in the task table.

function _tskSubKey(event, subFnId) {

}

function _tskSaveSubAdd(subFnId) {
  var title = ((el('ts-sub-title-' + subFnId) || {}).value || '').trim();
  if (!title) { toast('Task title is required.', 'error'); var t = el('ts-sub-title-' + subFnId); if(t) t.focus(); return; }
  var sfn   = (APP.functions || []).find(function(f) { return f.Function_ID === subFnId; });
  var fnId  = sfn ? sfn.Parent_Fn_ID || '' : '';
  var rec = {
    Title:           title,
    Description:     '',

    SubFn_ID:        subFnId,
    Function_ID:     fnId,

    Due_Date:        (el('ts-sub-due-' + subFnId) || {}).value || '',

  };
  var btn = el('ts-sub-save-' + subFnId);

  google.script.run

// ── Task Sheet: Add Row (static thead rows — show/hide) ───────────────────────

// ── Batch Add Tasks (inline panel) ────────────────────────────────────────────
var _atmVid = '';
var _atmIdx = 0;

// Maps view id to the main task tbody id
function _atmBodyId(vid) {
  return vid === 'my' ? 'my-tasks-body' : vid === 'team' ? 'team-tasks-body' : 'all-tasks-body';
}

function _tskBatchOpen(vid) {
  // Close any other open panel first
  ['my', 'team', 'all'].forEach(function(v) {
    if (v !== vid) {
      var r = el('ts-add-' + v); if (r) r.classList.add('hidden');
      var t = el('ts-trig-' + v); if (t) t.classList.remove('hidden');
      // Clear any leftover batch rows from the other view's main tbody
      var ob = el(_atmBodyId(v));
      if (ob) Array.prototype.slice.call(ob.querySelectorAll('.atm-data-row')).forEach(function(row) { row.parentNode.removeChild(row); });
    }
  });
  _atmVid = vid;
  _atmIdx = 0;
  var addRow   = el('ts-add-'  + vid);
  var trigRow  = el('ts-trig-' + vid);
  var mainBody = el(_atmBodyId(vid));
  if (!addRow || !mainBody) return;
  // Clear any leftover batch rows
  Array.prototype.slice.call(mainBody.querySelectorAll('.atm-data-row')).forEach(function(row) { row.parentNode.removeChild(row); });
  var btn = el('atm-save-' + vid);
  if (btn) { btn.disabled = false; btn.textContent = 'Save All'; }
  addRow.classList.remove('hidden');
  if (trigRow) trigRow.classList.add('hidden');
  _atmAddRow();
  setTimeout(function() {
    var inp = mainBody.querySelector('.atm-title-inp');
    if (inp) inp.focus();
    addRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 60);
}

function _tskBatchClose(vid) {

  if (trigRow) trigRow.classList.remove('hidden');

  var mainBody = el(_atmBodyId(vid));
  if (mainBody) Array.prototype.slice.call(mainBody.querySelectorAll('.atm-data-row')).forEach(function(row) { row.parentNode.removeChild(row); });
}

function _atmAddRow() {

  var _empRows = (APP.employees || []).filter(function(e){ return e.Emp_ID && e.Name; });
  if (vid === 'my') {

  } else {

      _empRows.map(function(e) {
        return '<option value="' + esc(e.Emp_ID) + '">' + esc(e.Name) + '</option>';
      }).join('');
    asgnHtml =
      '<select id="atm-asgn-' + n + '" onchange="_atmAsgnChange(' + n + ')" data-ss="1" style="width:100%">' + empOpts + '</select>' +
      '<div class="atm-dept-chip hidden" id="atm-dept-' + n + '"></div>';

  var asgrOpts = '<option value="">— Assigned By —</option>' +
    (APP.employees || []).map(function(e) {

      return '<option value="' + esc(e.Emp_ID) + '"' + selected + '>' + esc(e.Name) + '</option>';
    }).join('');

  // Row cells ordered to match _TSK_COL_SPEC. All IDs preserved for _atmSaveAll.
  // Uses explicit min-width + inline styles on every input so cells never collapse.

    (function() {

  if (f.parent.length) {

  // Dept chip for My view from current user
  if (vid === 'my') {

function _atmShowDept(n, emp) {

  if (!empId) { var chip = el('atm-dept-' + n); if (chip) chip.classList.add('hidden'); return; }
  var emp = (APP.employees || []).find(function(e) { return e.Emp_ID === empId; });
  if (emp) _atmShowDept(n, emp);
