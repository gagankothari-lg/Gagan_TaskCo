<script>
// Icon helper — returns a Material Symbols span
function icon(name) { return '<span class="material-symbols-outlined">' + name + '</span>'; }
// Empty-state icon wrappers
function eiIcon(name)  { return '<div class="ei material-symbols-outlined">'    + name + '</div>'; }
function kpIcon(name)  { return '<div class="kp-ei material-symbols-outlined">' + name + '</div>'; }

// ── App State ──────────────────────────────────────────────────────────────────
var APP = {
  currentUser: null,
  tasks:       [],
  projects:    [],
  employees:   [],
  view:        'dashboard',
  _taskId:     null,   // task currently open in detail / progress modal
  _verifiedEmail: null,
  _sessToken:  null    // localStorage session token
};

var _SESS_KEY = 'tm_sess'; // localStorage key

// ── Mobile Layout Enforcer ────────────────────────────────────────────────────
// Inline styles + runtime <style> injection — both bypass GAS CDN CSS caching.
// Called on DOMContentLoaded AND resize so layout is always correct.
var _MOB_STYLE_ID = '_rsp_fonts';
var _IS_MOBILE    = window.innerWidth <= 768;
var _MOB_NAV_OPEN = false;

function _applyMobileLayout() {
  var w         = window.innerWidth;
  var isMobile  = w <= 768;
  _IS_MOBILE = isMobile;
  var sidebar   = document.getElementById('sidebar');
  var main      = document.getElementById('main');
  var btn       = document.getElementById('mob-menu-btn');
  var hdName    = document.getElementById('hd-name');
  var header    = document.getElementById('header');
  var overlay   = document.getElementById('sidebar-overlay');
  if (isMobile) {
    // ── 1. Inline layout overrides (beat any cached CSS) ──────────────────────
    var mobOpen = _MOB_NAV_OPEN;
    if (sidebar) {
      // Slide-in drawer: always rendered, off-screen by default, slides in with .mob-open
      sidebar.style.display      = 'flex';
      sidebar.style.flexDirection= 'column';
      sidebar.style.position     = 'fixed';
      sidebar.style.top          = 'var(--hh)';
      sidebar.style.left         = mobOpen ? '0' : '-280px';
      sidebar.style.bottom       = '0';
      sidebar.style.width        = '260px';
      sidebar.style.maxWidth     = '260px';
      sidebar.style.zIndex       = '200';
      sidebar.style.transition   = 'left .25s ease';
      sidebar.style.boxShadow    = mobOpen ? '6px 0 32px rgba(0,0,0,.3)' : '';
    }
    if (main)    { main.style.marginLeft = '0'; main.style.overflowX = 'hidden'; }
    if (btn)     { btn.style.display = 'flex'; }
    if (hdName)  { hdName.style.display = 'none'; }
    if (header)  { header.style.padding = '0 10px'; header.style.gap = '8px'; }
    // overlay visibility is handled by CSS (.mob-open class) — no inline override needed

    // ── 2. Hide non-essential features on mobile (inline styles) ───────────────
    var _HIDE_VIEWS = ['calendar','meetings','org-chart','directory','team-tasks','team-mgmt','org-page','forms'];
    document.querySelectorAll('.nav-item').forEach(function(n) {
      if (_HIDE_VIEWS.indexOf(n.dataset.view) !== -1) n.style.display = 'none';
    });
    var chatsWrap = document.getElementById('nav-chats-wrap');
    if (chatsWrap) chatsWrap.style.display = 'none';
    var dashStats = document.getElementById('dash-stats');
    if (dashStats) dashStats.style.display = 'none';
    var sbWrap = document.getElementById('dash-scoreboard-wrap');
    if (sbWrap) sbWrap.style.display = 'none';
    var btnForms = document.getElementById('dash-btn-forms');
    if (btnForms) btnForms.style.display = 'none';
    // Also hide role-badge on mobile
    document.querySelectorAll('.role-badge').forEach(function(r) { r.style.display = 'none'; });

    // ── 3. Font-size + typography injection (one-time) ───────────────────────────
    if (!document.getElementById(_MOB_STYLE_ID)) {
      var s = document.createElement('style');
      s.id = _MOB_STYLE_ID;
      s.textContent =
        'body{font-size:16px!important}' +
        '.nav-item,.nav-item-ext{font-size:16px!important;padding:11px 16px!important;min-height:48px!important}' +
        '.nav-icon{font-size:24px!important;width:28px!important}' +
        '.nav-sec{font-size:13px!important;letter-spacing:.8px!important}' +
        '.nav-badge{font-size:13px!important;padding:2px 8px!important}' +
        '.ph-left .ph-title{font-size:24px!important}' +
        '.ph-left .ph-sub{font-size:15px!important}' +
        '.section-title{font-size:19px!important;margin-bottom:16px!important}' +
        '.btn{font-size:16px!important;padding:12px 22px!important;min-height:48px!important}' +
        '.btn.btn-sm{font-size:14px!important;padding:9px 16px!important}' +
        '.tl-tab{font-size:15px!important;padding:10px 18px!important;min-height:48px!important}' +
        '.fc,input,select,textarea,.inp,.sel,.ms-display{font-size:16px!important}' +
        '.ts-title{font-size:15px!important}' +
        '.ts-meta{font-size:13px!important}' +
        '.card-title{font-size:16px!important}' +
        '.pill,.badge-pri{font-size:13px!important;padding:4px 12px!important}' +
        '.wl-week-label,.tl-range-label,.ml-week-lbl{font-size:15px!important}' +
        '.h-logo{font-size:18px!important}' +
        '#user-chip{font-size:15px!important}' +
        '#main{margin-left:0!important;overflow-x:hidden!important}' +
        '.view{padding:16px 12px!important;max-width:100%!important;box-sizing:border-box!important}' +
        '.task-sheet-wrap{margin:0 0 16px!important;-webkit-overflow-scrolling:touch!important;scrollbar-width:thin!important}' +
        '.task-sheet{min-width:320px!important}' +
        '.task-sheet th:nth-child(5),.task-sheet td:nth-child(5){display:none!important}' +
        '.task-sheet th:nth-child(9),.task-sheet td:nth-child(9){display:none!important}' +
        '.task-sheet th:nth-child(10),.task-sheet td:nth-child(10){display:none!important}' +
        '.ts-open-btn,.ts-edit-btn,.ts-del-btn{opacity:1!important;width:32px!important;height:32px!important}' +
        '.ph-actions{flex-wrap:wrap!important;width:100%!important;max-width:100%!important}';
      document.head.appendChild(s);
    }
    document.body.style.minWidth              = '0';
    document.documentElement.style.minWidth   = '0';
  } else {
    // ── Desktop: remove all inline overrides ──────────────────────────────────
    if (sidebar) {
      ['display','flexDirection','position','top','left','bottom','width','maxWidth','zIndex','transition','boxShadow']
        .forEach(function(p){ sidebar.style[p] = ''; });
    }
    if (main)    { main.style.marginLeft = ''; main.style.overflowX = ''; }
    if (btn)     { btn.style.display = ''; }
    if (hdName)  { hdName.style.display = ''; }
    if (header)  { header.style.padding = ''; header.style.gap = ''; }
    // Restore hidden elements
    document.querySelectorAll('.nav-item').forEach(function(n) { n.style.display = ''; });
    var chatsWrap = document.getElementById('nav-chats-wrap');
    if (chatsWrap) chatsWrap.style.display = '';
    var dashStats = document.getElementById('dash-stats');
    if (dashStats) dashStats.style.display = '';
    var sbWrap = document.getElementById('dash-scoreboard-wrap');
    if (sbWrap) sbWrap.style.display = '';
    var btnForms = document.getElementById('dash-btn-forms');
    if (btnForms) btnForms.style.display = '';
    document.querySelectorAll('.role-badge').forEach(function(r) { r.style.display = ''; });
    var existing = document.getElementById(_MOB_STYLE_ID);
    if (existing) existing.parentNode.removeChild(existing);
    document.body.style.minWidth              = '';
    document.documentElement.style.minWidth   = '';
  }
}

_applyMobileLayout(); // run immediately (synchronous, before DOMContentLoaded)

window.addEventListener('resize', _applyMobileLayout);

// ── Auto-login on page load ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  _applyMobileLayout(); // apply responsive layout before login flow runs
  var saved = null;
  try { saved = localStorage.getItem(_SESS_KEY); } catch(e) {}
  // Guard: no token, empty string, or corrupted localStorage value → show login cleanly
  if (!saved || saved === 'null' || saved === 'undefined' || saved.trim() === '') {
    try { localStorage.removeItem(_SESS_KEY); } catch(e) {}
    return;
  }

  // Token exists — attempt silent restore
  var statusEl = el('login-status');
  if (statusEl) statusEl.textContent = 'Restoring session…';
  var formWrap = el('login-form-wrap');
  if (formWrap) formWrap.style.opacity = '0.4';

  google.script.run
    .withSuccessHandler(function(r) {
      if (formWrap) formWrap.style.opacity = '';
      if (!r || !r.ok) {
        // Clear token only on definitive auth failure (expired TTL or unknown token)
        if (r && (r.reason === 'expired' || r.reason === 'not_found')) {
          try { localStorage.removeItem(_SESS_KEY); } catch(e) {}
          APP._sessToken = null;
          if (statusEl) statusEl.textContent = r.reason === 'expired'
            ? 'Session expired. Please sign in again.'
            : '';
          return;
        }
        // Transient error (reason:'error', 'payload_error', or no response) —
        // keep token for next page load, fall back to login form silently.
        if (statusEl) statusEl.textContent = '';
        return;
      }
      APP._sessToken = saved;
      onPayloadLoaded(r);
    })
    .withFailureHandler(function() {
      // GAS execution error — transient. Keep token, restore form silently.
      if (formWrap) formWrap.style.opacity = '';
      if (statusEl) statusEl.textContent = '';
    })
    .validateSession(saved);

  // Listen for OAuth popup success messages (Chat / Forms / Tasks auth)
  window.addEventListener('message', function(ev) {
    if (ev.data === 'chat_connected') {
      DIR_CHAT_CONNECTED = true;
      _navPopulateTeamChats();
      toast('Google Chat connected! Click "Sync Spaces" in the sidebar to create your spaces.', 'ok');
    }
  });
});

var ROLES         = ['Super Admin','Admin','Team Captain','Team Facilitator','Team Member','Intern'];
var ADMIN_ROLES   = ['Super Admin','Admin'];
var MANAGER_ROLES = ['Super Admin','Admin','Team Captain','Team Facilitator'];
function _isAdmin(role)   { return ADMIN_ROLES.indexOf(role)   !== -1; }
function _isManager(role) { return MANAGER_ROLES.indexOf(role) !== -1; }
// Who can set/edit Work Log Status and Comments (same set as _isManager)
function _canEditWlStatus(role) { return MANAGER_ROLES.indexOf(role) !== -1; }

// Returns the roles the current user is allowed to assign to a target employee.
// Mirrors the server-side _allowedNewRoles() in auth.gs.
function _allowedNewRoles(actorRole, targetCurrentRole) {
  if (actorRole === 'Super Admin')
    return ['Team Member','Intern','Team Facilitator','Team Captain','Admin','Super Admin'];
  if (actorRole === 'Admin') {
    if (targetCurrentRole === 'Super Admin' || targetCurrentRole === 'Admin') return [];
    return ['Team Member','Intern','Team Facilitator','Team Captain','Admin'];
  }
  if (actorRole === 'Team Captain') {
    if (targetCurrentRole !== 'Team Member' && targetCurrentRole !== 'Intern') return [];
    return ['Team Member','Intern','Team Facilitator','Team Captain'];
  }
  return [];
}

// Parses a comma-separated ID string into a clean array.
function _parseIds(str) {
  return String(str || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
}

// ── Multi-select widget ───────────────────────────────────────────────────────
var _msOpen = null; // currently open ms-wrap id

function _msToggle(wrapId) {
  var dd = el(wrapId + '-dd');
  if (!dd) return;
  var isOpen = !dd.classList.contains('hidden');
  if (_msOpen && _msOpen !== wrapId) {
    var prevDd = el(_msOpen + '-dd');
    if (prevDd) prevDd.classList.add('hidden');
  }
  dd.classList.toggle('hidden', isOpen);
  _msOpen = isOpen ? null : wrapId;
}

document.addEventListener('click', function(e) {
  if (_msOpen && !e.target.closest('#' + _msOpen)) {
    var dd = el(_msOpen + '-dd');
    if (dd) dd.classList.add('hidden');
    _msOpen = null;
  }
});

// Builds the dropdown for a multi-select widget from an array of {value, label, sub} items.
function _msBuild(wrapId, items, currentIds) {
  var dd = el(wrapId + '-dd');
  if (!dd) return;
  var selected = {};
  _parseIds(currentIds).forEach(function(id) { selected[id] = true; });
  dd.innerHTML = items.map(function(item) {
    var chk = selected[item.value] ? ' checked' : '';
    return '<label class="ms-item">' +
      '<input type="checkbox" value="' + esc(item.value) + '"' + chk + ' onchange="_msChange(\'' + wrapId + '\')">' +
      '<span><div class="ms-item-name">' + esc(item.label) + '</div>' +
      (item.sub ? '<div class="ms-item-sub">' + esc(item.sub) + '</div>' : '') +
      '</span></label>';
  }).join('');
  _msRefresh(wrapId);
}

function _msChange(wrapId) {
  _msRefresh(wrapId);
}

// Maps a multi-select widget ID to its hidden input field ID
function _msHiddenId(wrapId) {
  var map = {
    'ms-t-assignee':   'f-t-assignee-ids',
    'ms-p-owner':      'f-p-owner',
    'ms-p-teams':      'f-p-teams',
    'ms-t-teams':      'f-t-teams',
    'mtg-asgn-teams':  'f-mtg-teams',   // meeting attendee — teams
    'mtg-asgn-people': 'f-mtg-people'   // meeting attendee — individuals
  };
  return map[wrapId] || null;
}

function _msRefresh(wrapId) {
  var dd       = el(wrapId + '-dd');
  var chips    = el(wrapId + '-chips');
  var ph       = el(wrapId + '-ph');
  var hidden   = el(_msHiddenId(wrapId));
  if (!dd || !chips || !hidden) return;

  var checked  = Array.from(dd.querySelectorAll('input[type=checkbox]:checked'));
  var ids      = checked.map(function(c) { return c.value; });
  hidden.value = ids.join(',');

  chips.innerHTML = checked.map(function(c) {
    var lbl = c.closest('.ms-item').querySelector('.ms-item-name').textContent;
    return '<span class="ms-chip">' + esc(lbl) +
      '<span class="ms-chip-x" onclick="_msRemove(\'' + wrapId + '\',\'' + esc(c.value) + '\',event)">×</span>' +
    '</span>';
  }).join('');

  if (ph) ph.style.display = ids.length ? 'none' : '';
}

function _msRemove(wrapId, val, evt) {
  evt && evt.stopPropagation();
  var dd = el(wrapId + '-dd');
  if (!dd) return;
  var cb = dd.querySelector('input[value="' + val + '"]');
  if (cb) { cb.checked = false; _msRefresh(wrapId); }
}

function _msGetIds(wrapId) {
  var hidden = el(_msHiddenId(wrapId));
  return hidden ? hidden.value : '';
}

function _msSetIds(wrapId, idsStr) {
  var dd = el(wrapId + '-dd');
  if (!dd) return;
  var selected = {};
  _parseIds(idsStr).forEach(function(id) { selected[id] = true; });
  dd.querySelectorAll('input[type=checkbox]').forEach(function(cb) {
    cb.checked = !!selected[cb.value];
  });
  _msRefresh(wrapId);
}

// Unified status list for Projects, Tasks, and Sub-tasks
// "Legacy" statuses (from personal sheet migration) appended after the main list
var TASK_STATUSES = [
  'Yet to Start','Planning',
  'WIP (0%-25%)','WIP (25%-50%)','WIP (50%-75%)','WIP (75%-100%)',
  'Review','On Hold','Cancelled','Done',
  'WIP','Shared','Implemented','Stuck'
];

/* ═══════════════════════════════════════════════════════════
   SEARCHABLE SELECT  —  portal-based, never clipped by tables
   Add  data-ss="1"  to any <select>, then call _ssInitAll(container)
   ═══════════════════════════════════════════════════════════ */
(function(){
  var openDrop=null, openSel=null;
  function closeAll(){if(openDrop)openDrop.style.display='none';openDrop=null;openSel=null;}
  document.addEventListener('click',function(e){if(openDrop&&!openDrop.contains(e.target))closeAll();},true);
  window.addEventListener('scroll',function(e){
    // Do NOT close while the user is scrolling INSIDE the open dropdown list —
    // only close when the page (or an outside element) scrolls, since the
    // position:fixed portal would otherwise detach from its trigger.
    if(openDrop&&e.target&&e.target.nodeType===1&&openDrop.contains(e.target))return;
    closeAll();
  },true);

  function _ssInit(sel){
    if(!sel||sel._ss)return;
    sel._ss=true;
    sel.style.display='none';

    var valTxt=document.createElement('span');
    valTxt.style.cssText='flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px';
    var cur=sel.options[sel.selectedIndex];
    valTxt.textContent=cur?cur.text:'—';

    var arrow=document.createElement('span');
    arrow.textContent='▾';
    arrow.style.cssText='color:#9ca3af;font-size:10px;flex-shrink:0;margin-left:4px;transition:transform .15s';

    var btn=document.createElement('div');
    btn.setAttribute('tabindex','0');
    btn.style.cssText='display:flex;align-items:center;padding:4px 8px;border:1px solid #e2e8f0;border-radius:4px;'
      +'cursor:pointer;background:#fff;min-height:28px;user-select:none;width:100%;box-sizing:border-box;gap:4px';
    btn.appendChild(valTxt);btn.appendChild(arrow);

    var drop=document.createElement('div');
    drop.style.cssText='display:none;position:fixed;z-index:2147483647;background:#fff;'
      +'border:1px solid #d1d5db;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.16);overflow:hidden';
    document.body.appendChild(drop);

    var srch=document.createElement('input');
    srch.type='text';srch.placeholder='Search…';
    srch.style.cssText='width:100%;padding:8px 12px;border:none;border-bottom:1px solid #e2e8f0;'
      +'font-size:13px;outline:none;box-sizing:border-box;background:#fafafa';
    srch.addEventListener('click',function(e){e.stopPropagation();});
    srch.addEventListener('keydown',function(e){e.stopPropagation();});
    srch.addEventListener('input',function(){render(this.value);});

    var lst=document.createElement('div');
    lst.style.cssText='overflow-y:auto';
    drop.appendChild(srch);drop.appendChild(lst);

    function render(q){
      lst.innerHTML='';q=(q||'').trim().toLowerCase();
      var n=0;
      for(var i=0;i<sel.options.length;i++){
        var o=sel.options[i];
        if(q&&o.text.toLowerCase().indexOf(q)<0)continue;
        var isChosen=(String(o.value)===String(sel.value));
        (function(o,isChosen){
          var d=document.createElement('div');
          d.textContent=o.text;
          d.style.cssText='padding:8px 14px;cursor:pointer;font-size:12.5px;white-space:nowrap;'
            +(isChosen?'background:#eff6ff;color:#1d4ed8;font-weight:600':'color:#111827');
          d.addEventListener('mouseover',function(){if(!isChosen)d.style.background='#f3f4f6';});
          d.addEventListener('mouseout',function(){if(!isChosen)d.style.background='';});
          d.addEventListener('mousedown',function(e){
            e.preventDefault();e.stopPropagation();
            sel.value=o.value;
            sel.dispatchEvent(new Event('change',{bubbles:true}));
            valTxt.textContent=o.text;
            closeAll();
          });
          lst.appendChild(d);
        }(o,isChosen));
        n++;
      }
      if(!n)lst.innerHTML='<div style="padding:10px 14px;color:#9ca3af;font-size:12px;font-style:italic">No results</div>';
    }

    function openMe(e){
      e.stopPropagation();
      if(openDrop===drop){closeAll();return;}
      closeAll();
      var r=btn.getBoundingClientRect();
      var below=window.innerHeight-r.bottom-6;
      var above=r.top-6;
      var openUp=below<180&&above>below;
      var maxH=Math.min(openUp?above:below,280);
      drop.style.left=r.left+'px';
      drop.style.width=Math.max(r.width,200)+'px';
      drop.style.maxHeight=maxH+'px';
      lst.style.maxHeight=Math.max(maxH-48,80)+'px';
      if(openUp){drop.style.bottom=(window.innerHeight-r.top+2)+'px';drop.style.top='auto';}
      else{drop.style.top=(r.bottom+2)+'px';drop.style.bottom='auto';}
      drop.style.display='block';openDrop=drop;openSel=sel;
      arrow.style.transform='rotate(180deg)';
      srch.value='';render('');
      setTimeout(function(){srch.focus();},30);
    }

    btn.addEventListener('click',openMe);
    btn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openMe(e);}});
    sel.addEventListener('change',function(){
      var o=sel.options[sel.selectedIndex];valTxt.textContent=o?o.text:'—';
      if(openDrop===drop)render('');
    });
    new MutationObserver(function(){if(drop.style.display==='none')arrow.style.transform='';})
      .observe(drop,{attributes:true,attributeFilter:['style']});

    sel.parentNode.insertBefore(btn,sel);
  }

  window._ssInit=_ssInit;
  window._ssInitAll=function(container){
    (container||document).querySelectorAll('select[data-ss]').forEach(_ssInit);
  };
  window._ssClose=closeAll;
}());
/* ═══════════════════════════════════════════════════════════
   END SEARCHABLE SELECT
   ═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   MULTI-SELECT PORTAL  —  checkbox multi-select for task filters
   Visual sibling of single-select _ssInit (portal + search). The native
   <select> is hidden; selections are stored on it as dataset.ssmVals
   (JSON array of option values) and a 'change' event is dispatched so the
   element's existing onchange handler (re-render) fires.
   ═══════════════════════════════════════════════════════════ */
var _ssmActivePortal = null;

// Read selected values (array). Never throws → [] on any problem.
function _ssmGet(idOrEl) {
  var e = (typeof idOrEl === 'string') ? el(idOrEl) : idOrEl;
  if (!e) return [];
  try { return JSON.parse(e.dataset.ssmVals || '[]'); } catch(_e) { return []; }
}
// Set selections programmatically (no change event) — used by the cascade.
function _ssmSet(idOrEl, vals) {
  var e = (typeof idOrEl === 'string') ? el(idOrEl) : idOrEl;
  if (e && e._ssmSetVals) e._ssmSetVals(vals || []);
}
// Clear selections programmatically (no change event).
function _ssmClear(idOrEl) { _ssmSet(idOrEl, []); }

function _ssInitMulti(sel, label) {
  if (!sel || sel._ssmDone) return;
  sel._ssmDone = true;
  sel._ss = true; // also block single-select _ssInit from ever touching it
  if (sel.hasAttribute && sel.hasAttribute('data-ss')) sel.removeAttribute('data-ss');

  var placeholder = 'All ' + (label || '');
  var selected    = _ssmGet(sel);

  function _opts() {
    var out = [];
    Array.prototype.forEach.call(sel.options, function(o) {
      if (!o.value) return; // skip the "All …" placeholder (value '')
      out.push({ v: o.value, l: (o.text || '').trim() });
    });
    return out;
  }
  function _labelFor(v) {
    for (var i = 0; i < sel.options.length; i++) if (sel.options[i].value === v) return sel.options[i].text;
    return v;
  }
  function _persist() {
    sel.dataset.ssmVals = JSON.stringify(selected);
    sel.dispatchEvent(new Event('change', { bubbles: true }));
  }

  sel.style.display = 'none';
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;display:block;width:100%;';
  sel.parentNode.insertBefore(wrap, sel);
  wrap.appendChild(sel);

  var trig = document.createElement('div');
  trig.className = 'ssm-trigger';
  trig.style.cssText = 'display:flex;align-items:center;gap:4px;padding:3px 6px;min-height:26px;'
    + 'background:#fff;border:1px solid #e2e8f0;border-radius:3px;cursor:pointer;'
    + 'font-size:11.5px;user-select:none;box-sizing:border-box;width:100%;';
  wrap.appendChild(trig);

  function _trigInner() {
    var n = selected.length, left, right;
    if (n === 0) {
      left = '<span style="flex:1;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(placeholder) + '</span>';
    } else if (n === 1) {
      left = '<span style="flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(_labelFor(selected[0])) + '</span>';
    } else {
      left = '<span style="flex:1;color:var(--text);white-space:nowrap;">'
        + '<span style="display:inline-flex;align-items:center;justify-content:center;background:#2D3E51;color:#fff;'
        + 'border-radius:9px;padding:0 6px;font-size:10.5px;font-weight:600;margin-right:4px;">' + n + '</span>selected</span>';
    }
    right = n > 0
      ? '<span class="ssm-clr" title="Clear" style="color:#E64D3D;font-size:15px;line-height:1;flex-shrink:0;padding:0 2px;cursor:pointer;">&times;</span>'
      : '<span class="material-symbols-outlined" aria-hidden="true" style="font-size:16px;color:#9ca3af;flex-shrink:0;">expand_more</span>';
    return left + right;
  }
  function _updTrig() { trig.innerHTML = _trigInner(); }
  _updTrig();

  // Programmatic set (used by the cascade to prune stale selections).
  sel._ssmSetVals = function(vals) {
    selected = (vals || []).slice();
    sel.dataset.ssmVals = JSON.stringify(selected);
    _updTrig();
    if (portal && portal.isConnected) {
      var l = portal.querySelector('.ssm-list'), s = portal.querySelector('.ssm-srch');
      if (l) _renderList(l, s ? s.value : '');
    }
  };

  var portal = null, _onDocDown = null, _onScroll = null;

  function _renderList(listEl, q) {
    if (!listEl) return;
    q = (q || '').toLowerCase();
    var rows = _opts().filter(function(o){ return !q || o.l.toLowerCase().indexOf(q) !== -1; });
    if (!rows.length) { listEl.innerHTML = '<div style="padding:9px 12px;font-size:12px;color:#9ca3af;font-style:italic;">No results</div>'; return; }
    listEl.innerHTML = rows.map(function(o) {
      var on = selected.indexOf(o.v) !== -1;
      var box = '<span style="width:14px;height:14px;flex-shrink:0;border-radius:3px;border:1.5px solid ' + (on ? '#2D3E51' : '#cbd5e1') + ';'
        + 'background:' + (on ? '#2D3E51' : 'transparent') + ';display:inline-flex;align-items:center;justify-content:center;">'
        + (on ? '<span class="material-symbols-outlined" aria-hidden="true" style="font-size:11px;color:#fff;">check</span>' : '') + '</span>';
      return '<div class="ssm-opt" data-v="' + esc(o.v) + '" style="display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:12px;'
        + (on ? 'background:rgba(45,62,81,.06);color:#2D3E51;font-weight:600;' : 'color:#111827;') + '">'
        + box + '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(o.l) + '</span></div>';
    }).join('');
  }

  function _closePortal() {
    if (_onDocDown) { document.removeEventListener('mousedown', _onDocDown, true); _onDocDown = null; }
    if (_onScroll)  { window.removeEventListener('scroll', _onScroll, true); _onScroll = null; }
    if (portal && portal.isConnected) portal.remove();
    if (_ssmActivePortal === portal) _ssmActivePortal = null;
    portal = null;
  }

  function _openPortal() {
    if (_ssmActivePortal && _ssmActivePortal._ssmClose) _ssmActivePortal._ssmClose();
    var r = trig.getBoundingClientRect();
    portal = document.createElement('div');
    portal._ssmClose = _closePortal;
    var below = window.innerHeight - r.bottom - 6, above = r.top - 6;
    var openUp = below < 200 && above > below;
    var maxH = Math.min(openUp ? above : below, 260);
    portal.style.cssText = 'position:fixed;z-index:2147483647;background:#fff;border:1px solid #d1d5db;border-radius:6px;'
      + 'box-shadow:0 8px 28px rgba(0,0,0,.16);display:flex;flex-direction:column;overflow:hidden;'
      + 'left:' + Math.round(r.left) + 'px;width:' + Math.round(Math.max(r.width, 200)) + 'px;max-height:' + maxH + 'px;'
      + (openUp ? 'bottom:' + Math.round(window.innerHeight - r.top + 2) + 'px;' : 'top:' + Math.round(r.bottom + 2) + 'px;');

    var srchWrap = document.createElement('div');
    srchWrap.style.cssText = 'padding:7px 8px 5px;flex-shrink:0;border-bottom:1px solid #eef0f3;';
    var inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = 'Search…'; inp.className = 'ssm-srch';
    inp.style.cssText = 'width:100%;box-sizing:border-box;padding:5px 8px;font-size:12px;border:1px solid #e2e8f0;border-radius:4px;outline:none;background:#fafafa;';
    inp.addEventListener('click', function(e){ e.stopPropagation(); });
    inp.addEventListener('mousedown', function(e){ e.stopPropagation(); });
    srchWrap.appendChild(inp);
    portal.appendChild(srchWrap);

    var list = document.createElement('div');
    list.className = 'ssm-list';
    list.style.cssText = 'overflow-y:auto;flex:1;padding:3px 0;';
    portal.appendChild(list);
    _renderList(list, '');

    list.addEventListener('mousedown', function(e) {
      e.preventDefault(); e.stopPropagation();
      var opt = e.target.closest ? e.target.closest('.ssm-opt') : null;
      if (!opt) return;
      var v = opt.getAttribute('data-v'), i = selected.indexOf(v);
      if (i === -1) selected.push(v); else selected.splice(i, 1);
      _updTrig(); _renderList(list, inp.value); _persist();
    });
    inp.addEventListener('input', function(){ _renderList(list, inp.value); });
    list.addEventListener('wheel', function(e){ e.stopPropagation(); }, { passive: true });
    list.addEventListener('touchmove', function(e){ e.stopPropagation(); }, { passive: true });

    document.body.appendChild(portal);
    _ssmActivePortal = portal;
    setTimeout(function(){ inp.focus(); }, 20);

    _onDocDown = function(e) {
      if (portal && (portal.contains(e.target) || wrap.contains(e.target))) return;
      _closePortal();
    };
    document.addEventListener('mousedown', _onDocDown, true);
    // Close on page scroll, but NOT when scrolling inside the portal list.
    _onScroll = function(e) {
      if (portal && e.target && e.target.nodeType === 1 && portal.contains(e.target)) return;
      _closePortal();
    };
    window.addEventListener('scroll', _onScroll, true);
  }

  trig.addEventListener('mousedown', function(e) {
    e.stopPropagation();
    var t = e.target;
    var isClr = t && ((t.classList && t.classList.contains('ssm-clr')) || (t.closest && t.closest('.ssm-clr')));
    if (isClr) {
      selected = []; _updTrig();
      if (portal && portal.isConnected) {
        var l = portal.querySelector('.ssm-list'), s = portal.querySelector('.ssm-srch');
        if (l) _renderList(l, s ? s.value : '');
      }
      _persist();
      return;
    }
    if (portal && portal.isConnected) _closePortal(); else _openPortal();
  });

  if (sel.dataset.ssmVals === undefined) sel.dataset.ssmVals = JSON.stringify(selected);
}

// Build <optgroup>-based team multi-select
function buildTeamSelect(selectEl) {
  selectEl.innerHTML = '';
  Object.keys(TEAM_HIERARCHY).forEach(function(div) {
    var grp = document.createElement('optgroup');
    grp.label = div;
    var divOpt = document.createElement('option');
    divOpt.value = div; divOpt.textContent = div;

// ── Login ─────────────────────────────────────────────────────────────────────
function login() {
  var email    = (el('login-email').value    || '').trim();
  var password =  el('login-password').value || '';
  if (!email || !password) {
    showLoginError('Enter your email and password.');
    return;
  }

  var btn = el('btn-login');
  btn.disabled    = true;
  btn.textContent = 'Signing in...';
  el('login-error').classList.remove('show');

  google.script.run
    .withSuccessHandler(function(r) {
      btn.disabled    = false;
      btn.textContent = 'Sign In →';
      if (!r || !r.ok) {
        showLoginError(r && r.error ? r.error : 'Could not verify your account.');
        return;
      }
      APP._verifiedEmail = r.email;
      // Save session token immediately — don't wait for the enterDashboard round-trip
      if (r.token) {
        APP._sessToken = r.token;
        try { localStorage.setItem(_SESS_KEY, r.token); } catch(e) {}
      }
      el('luc-avatar').textContent = r.name.charAt(0).toUpperCase();
      el('luc-name').textContent   = r.name;
      el('luc-email').textContent  = r.email;
      el('luc-role').textContent   = r.role;
      el('luc-team').textContent   = r.team || '';
      var lucDes = el('luc-designation');
      if (r.designation) { lucDes.textContent = r.designation; lucDes.style.display = ''; }
      else { lucDes.style.display = 'none'; }
      el('login-form-wrap').classList.add('hidden');
      el('login-user-card').classList.add('show');
      el('login-status').textContent = 'Account verified. Click below to continue.';
      el('btn-enter').classList.remove('hidden');
    })
    .withFailureHandler(function(err) {
      btn.disabled    = false;
      btn.textContent = 'Sign In →';
      showLoginError(err.message);
    })
    .loginWithPassword(email, password);
}

function showLoginError(msg) {
  var errEl = el('login-error');
  errEl.textContent = msg;
  errEl.classList.add('show');
  el('login-status').textContent = '';
}

// ── Forgot Password ────────────────────────────────────────────────────────────
function showForgotPw() {
  el('login-form-wrap').style.display = 'none';
  el('forgot-pw-wrap').style.display  = 'block';
  el('login-error').classList.remove('show');
  el('login-status').textContent = 'Reset your password';
  // pre-fill email if already typed
  var e = (el('login-email').value || '').trim();
  if (e) el('fp-email').value = e;
}

function hideForgotPw() {
  el('forgot-pw-wrap').style.display  = 'none';
  el('login-form-wrap').style.display = 'block';
  el('login-status').textContent      = 'Sign in with your registered work email';
  el('login-error').classList.remove('show');
  // reset steps
  el('fp-step1').style.display = 'block';
  el('fp-step2').style.display = 'none';
  el('fp-otp').value = el('fp-newpw').value = el('fp-confirmpw').value = '';
}

function sendResetCode() {
  var email = (el('fp-email').value || '').trim();
  if (!email) { showLoginError('Please enter your email.'); return; }
  var btn = el('btn-send-code');
  _btnLoading(btn, 'Sending…');
  el('login-error').classList.remove('show');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn, 'Send Reset Code');
      if (!r || !r.ok) { showLoginError(r && r.error || 'Failed to send code.'); return; }
      el('fp-step1').style.display = 'none';
      el('fp-step2').style.display = 'block';
      el('login-status').textContent = 'Code sent! Check your email.';
      el('fp-otp').focus();
    })
    .withFailureHandler(function(e) { _btnReset(btn, 'Send Reset Code'); showLoginError(e.message || 'Error'); })
    .requestPasswordReset(email);
}

function resetPasswordSubmit() {
  var email   = (el('fp-email').value   || '').trim();
  var otp     = (el('fp-otp').value     || '').trim();
  var newpw   =  el('fp-newpw').value   || '';
  var confirm =  el('fp-confirmpw').value || '';
  if (!otp)               { showLoginError('Please enter the reset code.');    return; }
  if (!newpw)             { showLoginError('Please enter a new password.');    return; }
  if (newpw.length < 6)   { showLoginError('Password must be at least 6 characters.'); return; }
  if (newpw !== confirm)  { showLoginError('Passwords do not match.');         return; }
  var btn = el('btn-reset-pw');
  _btnLoading(btn, 'Resetting…');
  el('login-error').classList.remove('show');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn, 'Reset Password');
      if (!r || !r.ok) { showLoginError(r && r.error || 'Reset failed.'); return; }
      hideForgotPw();
      el('login-status').textContent = 'Password reset! Please sign in.';
      el('login-email').value = email;
      el('login-password').value = '';
      el('login-password').focus();
    })
    .withFailureHandler(function(e) { _btnReset(btn, 'Reset Password'); showLoginError(e.message || 'Error'); })
    .resetPasswordWithOTP(email, otp, newpw);
}

var _PROFILE_DIVISIONS = [];

function openProfileModal(initialTab) {
  // Close presence menu if open
  var pm = el('pres-menu'); if (pm) pm.classList.add('hidden');
  switchProfileTab(initialTab || 'info');
  el('profile-loading').style.display = 'block';
  el('profile-body').style.display    = 'none';
  el('pf-error').style.display   = 'none';
  el('pf-success').style.display = 'none';
  openModal('profile-modal');
  // Populate team dropdown (TEAM_HIERARCHY is defined client-side)
  _PROFILE_DIVISIONS = Object.keys(TEAM_HIERARCHY);
  var teamSel = el('pf-team');
  teamSel.innerHTML = '<option value="">— No Change —</option>' +
    _PROFILE_DIVISIONS.map(function(d) { return '<option value="' + esc(d) + '">' + esc(d) + '</option>'; }).join('');
  el('fg-pf-subdept').style.display = 'none';
  onPfTeamChange();
  google.script.run
    .withSuccessHandler(function(r) {
      el('profile-loading').style.display = 'none';
      if (!r || !r.ok) { el('pf-error').textContent = r && r.error || 'Failed to load profile.'; el('pf-error').style.display = 'block'; return; }
      el('profile-body').style.display = 'block';
      el('pf-avatar').textContent = (r.firstName || r.email).charAt(0).toUpperCase();
      el('pf-name').textContent   = (r.firstName + ' ' + r.lastName).trim() || r.email;
      el('pf-email').textContent  = r.email;
      el('pf-role-badge').innerHTML = '<span class="luc-badge">' + esc(r.role) + '</span>' +
        (r.team ? '&nbsp;<span style="font-size:12px;color:var(--muted)">' + esc(r.team) + '</span>' : '');
      el('pf-designation').value = r.designation || '';
      // Pre-select current team
      if (r.team) el('pf-team').value = r.team;
      onPfTeamChange(r.sub_department);
      el('pf-manager').value = r.managerEmail || '';
      // Pending notice
      if (r.pending) {
        var parts = [];
        if (r.pending.newTeam)         parts.push('Team → ' + r.pending.newTeam);
        if (r.pending.newSubDept)      parts.push('Sub-dept → ' + r.pending.newSubDept);
        if (r.pending.newManagerEmail) parts.push('Manager → ' + r.pending.newManagerEmail);
        el('pf-pending-text').textContent = 'Pending approval (' + r.pending.requestedAt + '): ' + parts.join(', ');
        el('pf-pending-notice').style.display = 'block';
      } else {
        el('pf-pending-notice').style.display = 'none';
      }
    })
    .withFailureHandler(function(e) {
      el('profile-loading').style.display = 'none';
      el('pf-error').textContent = e.message || 'Error'; el('pf-error').style.display = 'block';
    })
    .getMyProfile(APP._verifiedEmail);
}

function onPfTeamChange(preselectedSubDept) {

function saveProfileUpdate() {

  var newSubDept     = el('pf-subdept').value;
  var newManagerEmail = (el('pf-manager').value || '').trim();

  var btn = el('btn-save-profile');

        el('pf-success').textContent = 'Designation updated successfully!';
      } else {
        el('pf-success').textContent = 'Designation updated. Team/Manager change submitted for approval!';

function savePasswordChange() {

  var newpw   = el('cp-new').value      || '';
  var confirm = el('cp-confirm').value  || '';

    .withFailureHandler(function(err) {

      el('btn-enter').textContent = 'Enter Dashboard →';

    .getInitialPayload(APP._verifiedEmail);
}

function onPayloadLoaded(p) {
  if (!p || !p.ok) {
    var msg = p && p.error ? p.error : 'Server did not respond — check Apps Script Execution Logs.';
    showLoginError(msg);
    el('btn-enter').disabled    = false;
    el('btn-enter').textContent = 'Enter Dashboard →';
    return;
  }

  // Persist session token if we just came from a password login (not auto-login restore)
  if (!APP._sessToken && APP._verifiedEmail) {
    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.ok && r.token) {
          APP._sessToken = r.token;
          try { localStorage.setItem(_SESS_KEY, r.token); } catch(e) {}
        }
      })
      .withFailureHandler(function() {})
      .createSession(APP._verifiedEmail);
  }

  APP.currentUser    = p.currentUser;
  APP._verifiedEmail = p.currentUser.email; // ensure always set (session-restore path skips loginWithPassword)
  APP.tasks       = p.tasks       || [];
  APP.projects    = p.projects    || [];
  APP.employees   = p.employees   || [];
  APP.functions   = p.functions   || [];
  APP._pendingLeaveCount = p.pendingLeaveCount || 0;
  APP.currentUser.hasMisAccess = !!p.hasMisAccess;

  var u = APP.currentUser;

  // Header user chip
  el('hd-avatar').textContent = u.name.charAt(0).toUpperCase();
  el('hd-name').textContent   = u.name;
  el('hd-role').textContent   = u.role;

  // Reveal role-gated nav items
  var adminRoles   = ['Super Admin','Admin'];
  var managerRoles = ['Super Admin','Admin','Team Captain','Team Facilitator'];

  if (managerRoles.indexOf(u.role) !== -1) {
    document.querySelectorAll('.nav-mgr-only').forEach(function(e) { e.classList.remove('hidden'); });
  }
  if (adminRoles.indexOf(u.role) !== -1) {
    document.querySelectorAll('.nav-admin-only').forEach(function(e) { e.classList.remove('hidden'); });
  }
  // MIS Report nav — gated by the MIS_Access sheet (a permission, not a role)
  if (u.hasMisAccess) {
    var _misNav = el('nav-mis-report');
    if (_misNav) _misNav.classList.remove('hidden');
  }
  // Import Tasks (#nav-import-btn) is pinned at sidebar top — no hidden class, no gate needed

  populateSelects();
  updateBadges();
  updateLeaveBadge(APP._pendingLeaveCount);
  if (typeof google !== 'undefined' && google.script && google.script.run &&
      typeof google.script.run.getPendingDueDateCount === 'function') {
    _ddrUpdateBadge();
  }

  // Transition from login to app
  el('login-screen').classList.add('hidden');
  el('app').classList.add('visible');

  // Re-apply mobile layout AFTER role-based unhide (manager roles above just ran)
  _applyMobileLayout();

  // Use attachment counts already bundled in the initial payload (no extra round-trip)
  if (p.attCounts) ATT_COUNTS = p.attCounts;

  _presStart();           // start presence system
  // Clock + week-glance widgets now live in the global header — boot once, stay live on every view
  loadWorkDuration();
  _wlWidgetWeekOffset = 0;
  _wlLoadWidgetWeek();
  _startMeetReminder();   // start 5-min meeting reminder checks
  _loadNavTeamChats();    // populate Team Chats in sidebar
  navigate('dashboard');
  _applyMobileLayout();
  window.removeEventListener('resize', _applyMobileLayout);
  window.addEventListener('resize', _applyMobileLayout);
}

// ── Logout ────────────────────────────────────────────────────────────────────
function logout() {
  var token = APP._sessToken;
  try { localStorage.removeItem(_SESS_KEY); } catch(e) {}
  APP._sessToken = null;
  // Invalidate server-side token (fire-and-forget)
  if (token) {
    google.script.run
      .withSuccessHandler(function() { location.reload(); })
      .withFailureHandler(function()  { location.reload(); })
      .invalidateSession(token);
  } else {
    location.reload();
  }
}

// ── Navigation ────────────────────────────────────────────────────────────────
var _MOB_BLOCKED_VIEWS = ['calendar','meetings','org-chart','directory','team-tasks','team-mgmt','org-page','forms'];

function navigate(view) {
  if (typeof _ssClose === 'function') _ssClose(); // close any open searchable dropdown
  if (_IS_MOBILE && _MOB_NAV_OPEN) closeMobNav();
  // Clean up task sheet scroll listeners when leaving task views
  ['my-tasks-body', 'team-tasks-body', 'all-tasks-body'].forEach(function(bodyId) {
    var b = el(bodyId);
    if (b && b._tskScrollHandler) {
      var sc = el('main');
      if (sc) sc.removeEventListener('scroll', b._tskScrollHandler);
      b._tskScrollHandler = null;
    }
  });
  // Stop team-clock tickers when leaving the dashboard
  if (view !== 'dashboard') _teamClockStopTickers();
  // Cancel pending WL debounces when leaving work-log view
  if (view !== 'work-log') { Object.keys(WL_DEBOUNCE).forEach(function(k){ if (WL_DEBOUNCE[k]) clearTimeout(WL_DEBOUNCE[k]); }); WL_DEBOUNCE = {}; }

  // On mobile, redirect blocked views to dashboard
  if (window.innerWidth <= 768 && _MOB_BLOCKED_VIEWS.indexOf(view) !== -1) {
    view = 'dashboard';
  }

  document.querySelectorAll('.view').forEach(function(v) {
    v.classList.remove('active');
    v.classList.add('hidden');
  });
  var target = el('view-' + view);
  if (target) { target.classList.remove('hidden'); target.classList.add('active'); }

  document.querySelectorAll('.nav-item').forEach(function(n) {
    n.classList.toggle('active', n.dataset.view === view);
  });

  APP.view = view;

  if (view === 'dashboard')   renderDashboard();
  if (view === 'plan-week')   renderPlanWeek();
  if (view === 'my-tasks')    renderMyTasks();
  if (view === 'my-projects') renderMyProjects();
  if (view === 'work-log')    loadMyWorkLogs();
  if (view === 'team-tasks')    renderTeamTasks();
  if (view === 'team-projects') renderTeamProjects();
  if (view === 'team-logs')   loadTeamLogs();
  if (view === 'mis-report')  renderMisReport();
  if (view === 'all-tasks')   renderAllTasks();
  if (view === 'all-projects')   renderAllProjects();
  if (view === 'team-mgmt')      renderTeamMgmt();
  if (view === 'org-page')       renderOrgPage();
  if (view === 'calendar')       loadCalendarData();
  if (view === 'my-leaves')      loadMyLeaves();
  if (view === 'leave-approvals')loadLeaveApprovals();
  if (view === 'holidays')       navigate('calendar'); // holidays managed from Calendar
  if (view === 'directory')      loadDirectory();
  if (view === 'meetings')       loadMeetings();
  if (view === 'org-chart')      renderOrgChart();
  if (view === 'forms')          renderForms();
  if (view === 'form-editor')    {} // already rendered via gfOpenEditor
  if (view === 'form-fill')      {} // already rendered via gfOpenFill
  if (_IS_MOBILE) _applyMobileLayout(); // re-apply after view renders new DOM
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function renderDashboard() {
  var u = APP.currentUser, t = APP.tasks, p = APP.projects;

  // Greeting & date
  var hr = new Date().getHours();
  var greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  el('dash-greeting').textContent = greet + ', ' + u.name + '!';
  el('dash-date').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  var myTasks = t.filter(function(x) { return _parseIds(x.Assignee_IDs || x.Assignee_ID).indexOf(u.empId) !== -1; });
  var open    = myTasks.filter(function(x) { return _isOpen(x.Status); });
  var inprog  = myTasks.filter(function(x) { return _isActive(x.Status); });
  var review  = myTasks.filter(function(x) { return x.Status === 'On Hold'; });
  var done    = myTasks.filter(function(x) { return _isDone(x.Status); });

  var myProjIds = new Set(myTasks.map(function(x) { return x.Proj_ID; }));
  // Also pull in parent projects so the P → P1 hierarchy is visible
  (p || []).forEach(function(proj) {
    if (proj.Parent_Proj_ID && myProjIds.has(proj.Proj_ID)) {
      myProjIds.add(proj.Parent_Proj_ID);
    }
  });
  var myProjs = p.filter(function(x) { return myProjIds.has(x.Proj_ID); });
  // Sort: top-level projects first, then sub-projects grouped under them
  myProjs.sort(function(a, b) {
    var aRoot = a.Parent_Proj_ID || a.Proj_ID;
    var bRoot = b.Parent_Proj_ID || b.Proj_ID;
    if (aRoot !== bRoot) return aRoot < bRoot ? -1 : 1;
    // Same root: parent before child
    if (!a.Parent_Proj_ID && b.Parent_Proj_ID) return -1;
    if (a.Parent_Proj_ID  && !b.Parent_Proj_ID) return 1;
    return 0;
  });

  el('dash-stats').innerHTML =
    statCard('My Tasks',      myTasks.length, 'total assigned')  +
    statCard('Open',          open.length,    'pending')          +
    statCard('In Progress',   inprog.length,  'active now')       +
    statCard('Under Review',  review.length,  'awaiting approval')+
    statCard('Done',          done.length,    'finished')         +
    statCard('Projects',      myProjs.length, 'involved in');

  // Upcoming tasks — collapsible date buckets (5.3)
  try { _dashRenderUpcoming('dash-my-tasks'); } catch(e) { console.error('_dashRenderUpcoming:', e); }

  // My projects — compact cards on the left panel; auto-select the first one
  var projList = myProjs.slice(0, 10);
  el('dash-my-projects').innerHTML = projList.length
    ? projList.map(function(p, i) { return _dashProjCompact(p, i === 0); }).join('')
    : '<div style="color:var(--muted);font-size:13px;padding:10px 0">No projects assigned yet.</div>';
  if (projList.length) _renderProjHierarchy(projList[0].Proj_ID);

  // ── Scoreboard title — set synchronously from client role ────────────────
  var sbTitleEl = el('dash-sb-title');
  if (sbTitleEl) {
    sbTitleEl.textContent = _isAdmin(u.role)   ? 'Company Scoreboard'
                          : _isManager(u.role) ? 'Team Scoreboard'
                          :                      'Personal Scoreboard';
  }

  // ── Async: notice board, on-leave, scoreboard ─────────────────────────────
  el('dash-notice-board').innerHTML = '<div style="color:var(--muted);font-size:13px;padding:10px 0">Loading...</div>';
  el('dash-on-leave').innerHTML     = '<div style="color:var(--muted);font-size:13px;padding:10px 0">Loading...</div>';
  el('dash-scoreboard').innerHTML   = '<div style="color:var(--muted);font-size:13px;padding:10px 0">Loading...</div>';
  google.script.run
    .withSuccessHandler(function(d) {
      if (!d || !d.ok) {
        var msg = '<div style="color:var(--muted);font-size:12px">' + ((d && d.error) ? esc(d.error) : 'Could not load data.') + '</div>';
        console.error('getDashboardExtras error:', d && d.error);
        el('dash-notice-board').innerHTML = msg;
        el('dash-on-leave').innerHTML     = msg;
        el('dash-scoreboard').innerHTML   = msg;
        return;
      }
      _renderNoticeBoard(d.notices    || []);
      _renderOnLeave    (d.onLeave    || []);
      _renderScoreboard (d.scores     || [], d.scoreScope || 'company');
    })
    .withFailureHandler(function(err) {
      var msg = '<div style="color:var(--muted);font-size:12px">Could not load data.</div>';
      el('dash-notice-board').innerHTML = msg;
      el('dash-on-leave').innerHTML     = msg;
      el('dash-scoreboard').innerHTML   = msg;
    })
    .getDashboardExtras(APP._verifiedEmail);

  // Load team clock status widget (TC/TF/Admin only — hides itself for TM)
  _teamClockLoad();

  // Re-apply mobile hides now that all dashboard elements exist
  _postDashRender();
}

// ── Work Log Week Widget (dashboard header) ────────────────────────────────────
var _wlWidgetWeekOffset = 0;

// ── Week-glance widget: 3-row layout with day letters (BUG 5 restore) ─────────
// Signature unchanged; _wlWidgetNav wiring unchanged.
function _buildWlWeekWidget(weekData, isoStart, isoEnd) {
  var DAYS       = ['M','T','W','T','F','S','S'];
  var totalHrs   = weekData.reduce(function(s,d){ return s + (d.hrs||0); }, 0);
  var daysLogged = weekData.filter(function(d){ return !!d.attendance; }).length;

  var h = '<div id="wl-week-widget" style="display:flex;flex-direction:column;' +
    'align-items:center;gap:2px;justify-content:center;height:46px;">';

  // Row 1: day letters aligned above the dots
  h += '<div style="display:flex;align-items:center;gap:4px;">';
  h += '<span style="width:14px;display:inline-block;"></span>';
  DAYS.forEach(function(d) {
    h += '<span style="font-size:7px;color:rgba(255,255,255,0.45);width:11px;text-align:center;display:inline-block;">' + d + '</span>';
  });
  h += '<span style="width:14px;display:inline-block;"></span>';
  h += '</div>';

  // Row 2: ‹ attendance dots ›
  h += '<div style="display:flex;align-items:center;gap:4px;">';
  h += '<button onclick="_wlWidgetNav(-1)" title="Previous week"' +
    ' style="background:none;border:none;cursor:pointer;font-size:11px;' +
    'color:rgba(255,255,255,0.5);width:14px;line-height:1;padding:0;">&#8249;</button>';

  weekData.forEach(function(day) {
    var info = _attDot(day.attendance);
    var cls  = info ? ('tlm-dot ' + info.cls) : 'tlm-dot missing';
    var lbl  = info ? info.lbl : '';
    h += '<div class="' + cls + '" style="width:11px;height:11px;font-size:6px;' +
      'cursor:default;" title="' + esc(day.attendance || 'No data') + '">' + lbl + '</div>';
  });

  h += '<button onclick="_wlWidgetNav(1)" title="Next week"' +
    ' style="background:none;border:none;cursor:pointer;font-size:11px;' +
    'color:rgba(255,255,255,0.5);width:14px;line-height:1;padding:0;">&#8250;</button>';
  h += '</div>';

  // Row 3: date range + summary
  var hrsTxt = totalHrs > 0 ? totalHrs + 'h &middot; ' : '';
  var rangeTxt = '';
  if (isoStart && isoEnd) {
    var _fmtD = function(iso) {
      var d = new Date(iso + 'T00:00:00');
      return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    };
    rangeTxt = _fmtD(isoStart) + '&ndash;' + _fmtD(isoEnd) + ' | ';
  }
  h += '<div style="font-size:9px;color:rgba(255,255,255,0.75);white-space:nowrap;">' +
    rangeTxt + hrsTxt + daysLogged + ' logged</div>';

  h += '</div>';
  return h;
}

function _wlWidgetNav(delta) {
  _wlWidgetWeekOffset += delta;
  _wlLoadWidgetWeek();
}

function _wlLoadWidgetWeek() {
  var today  = new Date(); today.setHours(0,0,0,0);
  var dow    = today.getDay();
  var monday = new Date(today);
  monday.setDate(today.getDate() - ((dow + 6) % 7) + (_wlWidgetWeekOffset * 7));
  var isoStart = _localIso(monday);
  var _wlWidgetSunday = new Date(monday); _wlWidgetSunday.setDate(monday.getDate() + 6);
  var isoEnd   = _localIso(_wlWidgetSunday);
  var widget   = document.getElementById('wl-week-widget');
  if (widget) widget.style.opacity = '0.5';
  google.script.run
    .withSuccessHandler(function(r) {
      if (widget) widget.style.opacity = '1';
      if (!r || !r.ok || !r.data) return;
      var container = document.getElementById('wl-widget-container');
      if (container) container.innerHTML = _buildWlWeekWidget(r.data, isoStart, isoEnd);
    })
    .withFailureHandler(function(err) {
      if (widget) widget.style.opacity = '1';
      console.error('WL widget load error:', err);
    })
    .getMyWlWeekSummary(APP._verifiedEmail, isoStart, isoEnd);
}

            : '') +

          ? '<div style="font-size:10px;color:var(--muted);margin-top:4px">Visible until ' + esc(n.expiresAt) + '</div>'
          : '') +
        (fmtDate ? '<div class="nb-date">' + esc(n.type) + ' &nbsp;·&nbsp; ' + fmtDate + '</div>' : '') +
        (isMeeting
          ? '<div class="nb-meet-actions" onclick="event.stopPropagation()">' +
              (n.meetLink ? '<a href="' + esc(n.meetLink) + '" target="_blank" class="nb-meet-join">' + icon('video_call') + ' Join</a>' : '') +
              (n.meetId   ? '<button class="nb-meet-view" onclick="goToMeeting(\'' + esc(n.meetId) + '\')">' + icon('open_in_new') + ' View</button>' : '') +
            '</div>'
          : '') +

          ? '<div style="margin-top:8px"><a href="' + esc(n.formUrl) + '" target="_blank" class="nb-form-fill"><span class="material-symbols-outlined" style="font-size:14px">edit</span> Fill Form</a></div>'
          : '') +
      '</div>' +
      (isAdmin && n.manual ? '<button class="nb-del" onclick="_nbDelete(this,\'' + esc(n.id) + '\')" title="Remove"><span class="material-symbols-outlined">close</span></button>' : '') +
    '</div>';
  });
  html += '</div>';
  el_.innerHTML = html;

function _nbTogglePost() {
  var panel = el('nb-post-panel');
  if (!panel) return;
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden')) {
    // Set today's date and reset new fields to defaults
    var inp = el('nb-date');
    if (inp) inp.value = _localIso(new Date());
    var visEl = el('nb-visibility');
    if (visEl) visEl.value = 'Organisation';
    var today = new Date();
    function _annFmtDate(d) {
      return d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0');
    }
    var startEl = el('ann-start-date');
    var endEl   = el('ann-end-date');
    if (startEl) startEl.value = _annFmtDate(today);
    if (endEl) {
      var defEnd = new Date(today);
      defEnd.setDate(defEnd.getDate() + 7);
      endEl.value = _annFmtDate(defEnd);
    }
    var t = el('nb-title'); if (t) t.focus();
  }
}

function _nbSave(btn) {
  var title = (el('nb-title').value || '').trim();
  if (!title) { toast('Title is required.', 'error'); return; }
  var _annStart = el('ann-start-date') ? el('ann-start-date').value : '';
  var _annEnd   = el('ann-end-date')   ? el('ann-end-date').value   : '';
  if (_annStart && _annEnd && _annEnd < _annStart) {
    toast('End date must be after start date.', 'error');
    return;
  }
  var record = {
    type:       el('nb-type').value,
    priority:   el('nb-priority').value,
    title:      title,
    message:    (el('nb-message').value || '').trim(),
    visibility: (el('nb-visibility') ? el('nb-visibility').value : 'Organisation'),
    startDate:  _annStart,
    endDate:    _annEnd
  };
  _btnLoading(btn, 'Posting…');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn);
      if (!r || !r.ok) { toast(r && r.error ? r.error : 'Failed to post.', 'error'); return; }
      toast('Announcement posted!', 'success');
      _nbTogglePost();
      ['nb-title','nb-message'].forEach(function(id) { var e = el(id); if (e) e.value = ''; });
      el('nb-type').value = 'General'; el('nb-priority').value = 'Normal';

      var today2 = new Date();

        if (d && d.ok) { _renderNoticeBoard(d.notices || []); }
      }).getDashboardExtras(APP._verifiedEmail);
    })
    .withFailureHandler(function(err) { _btnReset(btn); toast(err.message || 'Error', 'error'); })
    .createAnnouncement(record, APP._verifiedEmail);

function _annApplyTemplate(type) {
  var visEl   = el('nb-visibility');
  var startEl = el('ann-start-date');
  var endEl   = el('ann-end-date');
  var priEl   = el('nb-priority');

  var today = new Date();
  function _fmtDate(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  }
  function _addDays(d, n) { var r = new Date(d); r.setDate(r.getDate()+n); return r; }

  if (type === 'org') {
    if (visEl)   visEl.value   = 'Organisation';
    if (startEl) startEl.value = _fmtDate(today);
    if (endEl)   endEl.value   = _fmtDate(_addDays(today, 7));
    if (priEl)   priEl.value   = 'Normal';
  } else if (type === 'leads') {
    if (visEl)   visEl.value   = 'TCs & TFs';
    if (startEl) startEl.value = _fmtDate(today);
    if (endEl)   endEl.value   = _fmtDate(_addDays(today, 14));
    if (priEl)   priEl.value   = 'High';
  } else if (type === 'tc') {
    if (visEl)   visEl.value   = 'TCs Only';
    if (startEl) startEl.value = _fmtDate(today);
    if (endEl)   endEl.value   = _fmtDate(_addDays(today, 30));
    if (priEl)   priEl.value   = 'High';
  }
}

function _nbDelete(btn, annId) {
  if (!confirm('Remove this announcement?')) return;
  _btnLoading(btn, '');
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok) { _btnReset(btn); toast(r && r.error ? r.error : 'Failed.', 'error'); return; }
      toast('Announcement removed.', 'success');

      '<td style="text-align:center"><span class="sb-pill sb-done">' + s.done + '</span></td>' +

      '<td style="text-align:center">' + s.logs + '</td>' +

      (_SB_SHOW_ALL ? 'Show Top 10' : 'Show All ' + scores.length + ' Members') + '</button>';
