// RFC-4180 compliant CSV parser.
// Processes the entire text character-by-character so quoted fields with
// embedded newlines (including blank lines) are handled correctly.
function _parseCsv(text) {
  var rows = [], row = [], cur = '', inQ = false;
  var i = 0, len = text.length;

  while (i < len) {
    var c = text[i];

    if (inQ) {
      if (c === '"') {
        if (i + 1 < len && text[i + 1] === '"') {
          cur += '"'; i++;          // escaped double-quote ""
        } else {
          inQ = false;              // closing quote — field continues until , or newline
        }
      } else {
        cur += c;                   // any character inside quotes, including \n and blank lines
      }
    } else {
      if (c === '"') {
        inQ = true;
      } else if (c === ',') {
        row.push(cur); cur = '';
      } else if (c === '\r') {
        if (i + 1 < len && text[i + 1] === '\n') {
          // \r\n — handled when \n is processed
        } else {
          // Bare \r (old Mac) — treat as row end
          row.push(cur); cur = '';
          if (row.some(function(cell) { return cell.trim(); })) rows.push(row);
          row = [];
        }
      } else if (c === '\n') {
        row.push(cur); cur = '';
        if (row.some(function(cell) { return cell.trim(); })) rows.push(row);
        row = [];
      } else {
        cur += c;
      }
    }
    i++;
  }

  // Handle last row if file has no trailing newline
  if (cur || row.length) {
    row.push(cur);
    if (row.some(function(cell) { return cell.trim(); })) rows.push(row);
  }

  return rows;
}
function _parseCsvLine(line) {
  var result = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else { inQ = !inQ; }
    } else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

// Parse CSV values into LG Desk row objects.
// Enforces hierarchy rules: Sub-Function requires a parent Function.
// Rows starting with # are treated as comments and skipped.
// Returns array with an attached .skipped property for hierarchy violations.
function _migCsvToRows(values) {
  if (!values || values.length < 2) return [];
  var rawHeaders = values[0].map(function(h) {
    return String(h || '').toLowerCase().replace(/\s+/g, ' ').trim();
  });

  var ALIASES = {
    'function':                 ['function', 'functions', 'fn', 'func'],
    'function description':     ['function description', 'fn description', 'fn desc', 'function desc'],
    'sub-function':             ['sub-function', 'sub function', 'sub-functions', 'sub functions',
                                 'subfunction', 'subfunctions', 'sub - function', 'sub_function', 'sf'],
    'sub-function description': ['sub-function description', 'sub function description',
                                 'subfn description', 'sf description', 'sub-fn desc'],
    'task title':               ['task title', 'task', 'tasks', 'task name', 'title'],
    'task description':         ['task description', 'task desc', 'description', 'desc',
                                 'notes', 'remark', 'remarks', 'note'],
    'assigner':                 ['assigner', 'given by', 'assigned by', 'given_by', 'created by'],
    'assignees':                ['assignees', 'assignee', 'task executor',
                                 'assigned to', 'executor', 'task_executor'],
    'status':                   ['status', 'task status'],
    'priority':                 ['priority', 'task priority'],
    'recurring':                ['recurring', 'recurring task', 'recurrence',
                                 'recurring_task', 'recurring functions', 'recurring_functions'],
    'start date':               ['start date', 'start_date', 'startdate'],
    'deadline':                 ['deadline', 'end date', 'end_date'],
    'due date':                 ['due date', 'due_date', 'due', 'task due date'],
    'estimated hours':          ['estimated hours', 'estimated_hours', 'est hours',
                                 'est. hours', 'hours', 'est_hours'],
    'links':                    ['links', 'link', 'related links', 'url', 'urls',
                                 'file link', 'file_link', 'attachment']
  };

  var colIdx = {};
  Object.keys(ALIASES).forEach(function(canonical) {
    colIdx[canonical] = -1;
    for (var i = 0; i < rawHeaders.length; i++) {
      if (ALIASES[canonical].indexOf(rawHeaders[i]) !== -1) { colIdx[canonical] = i; break; }
    }
  });

  function cv(row, key) {
    var i = colIdx[key];
    if (i === -1 || i === undefined || i >= row.length) return '';
    return String(row[i] || '').trim();
  }

  // Sheet validation accepts ONLY these status values
  var STATUS_SHEET_VALID = [
    'Yet to Start', 'Planning',
    'WIP (0%-25%)', 'WIP (25%-50%)', 'WIP (50%-75%)', 'WIP (75%-100%)',
    'Review', 'On Hold', 'Cancelled', 'Done'
  ];
  var STATUS_ALIAS = {
    'wip':          'WIP (0%-25%)', 'in progress':  'WIP (0%-25%)',
    'in-progress':  'WIP (0%-25%)', 'started':      'WIP (0%-25%)',
    'active':       'WIP (0%-25%)', 'completed':    'Done',
    'complete':     'Done',         'finished':     'Done',
    'closed':       'Done',         'implemented':  'Done',
    'shared':       'Review',       'in review':    'Review',
    'under review': 'Review',       'stuck':        'On Hold',
    'blocked':      'On Hold',      'paused':       'On Hold',
    'hold':         'On Hold',      'canceled':     'Cancelled'
  };
  function normaliseStatus(raw) {
    if (!raw) return 'Yet to Start';
    var lower = raw.trim().toLowerCase();
    var exact = STATUS_SHEET_VALID.filter(function(v) { return v.toLowerCase() === lower; })[0];
    if (exact) return exact;
    return STATUS_ALIAS[lower] || 'Yet to Start';
  }

  var PRIORITY_VALID  = ['Low','Medium','High','Critical'];
  var RECURRING_VALID = ['One Time','Daily','Weekly','Alternate Week','Bi Weekly',
    'Monthly','Bi Monthly','Quarterly','Bi Yearly','Yearly'];

  function normalise(val, list, def) {
    if (!val) return def;
    var lower = val.toLowerCase();
    for (var k = 0; k < list.length; k++) {
      if (list[k].toLowerCase() === lower) return list[k];
    }
    return def;
  }
  function normaliseDate(raw) {
    if (!raw) return '';
    var s = raw.trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return m[3] + '-' + ('0'+m[2]).slice(-2) + '-' + ('0'+m[1]).slice(-2);
    return '';
  }
  function normaliseLinks(raw) {
    if (!raw) return '';
    return raw.split('\n').map(function(l) { return l.trim(); }).filter(Boolean).join('\n');
  }

  var rows    = [];
  var skipped = [];

  for (var r = 1; r < values.length; r++) {
    var row   = values[r];
    var first = String(row[0] || '').trim();

    // Skip comment rows
    if (first.charAt(0) === '#') continue;

    var fnName = cv(row, 'function');
    var subFn  = cv(row, 'sub-function');
    var task   = cv(row, 'task title');

    // Skip completely empty rows
    if (!fnName && !subFn && !task) continue;

    // HIERARCHY RULE: Sub-Function CANNOT exist without a parent Function
    if (subFn && !fnName) {
      skipped.push({
        rowNum:  r + 1,
        content: subFn || task || '(empty)',
        reason:  'Sub-function "' + esc(subFn) + '" has no parent Function. ' +
                 'A Sub-function must always be paired with a Function name in the same row.'
      });
      continue;
    }

    rows.push({
      rowNum:                 r + 1,
      'function':             fnName,
      functionDescription:    cv(row, 'function description'),
      subFunctionName:        subFn,
      subFunctionDescription: cv(row, 'sub-function description'),
      title:                  task,
      taskDescription:        cv(row, 'task description'),
      parentTitle:            task ? subFn : '',
      isStructureOnly:        !task,
      givenBy:                cv(row, 'assigner'),
      givenById:              '',
      assignees:              cv(row, 'assignees'),
      executor:               cv(row, 'assignees'),
      executorId:             '',
      status:   normaliseStatus(cv(row, 'status')),
      priority: normalise(cv(row, 'priority'),  PRIORITY_VALID,  'Medium'),
      recurring:normalise(cv(row, 'recurring'), RECURRING_VALID, 'One Time'),
      recurringTask: normalise(cv(row, 'recurring'), RECURRING_VALID, 'One Time'),
      startDate:  normaliseDate(cv(row, 'start date')),
      deadline:   normaliseDate(cv(row, 'deadline')),
      dueDate:    normaliseDate(cv(row, 'due date')),
      estimatedHours: parseFloat(cv(row, 'estimated hours')) || '',
      links:      normaliseLinks(cv(row, 'links'))
    });
  }

  rows.skipped = skipped;
  return rows;
}

function migCsvPreview() {
  var input = el('mig-csv-file');
  var msg   = el('mig-csv-msg');
  if (!input.files[0]) { msg.textContent = 'No file selected.'; msg.style.color = 'var(--danger)'; return; }

  var btn = el('mig-csv-preview-btn');
  btn.disabled = true;
  msg.textContent = 'Parsing CSV…'; msg.style.color = 'var(--muted)';

  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var values = _parseCsv(e.target.result);
      _migCsvRows = _migCsvToRows(values);
      btn.disabled = false;

      // Show hierarchy-violation warnings for skipped rows
      var skipped = _migCsvRows.skipped || [];
      var csvMsg  = el('mig-csv-msg');
      if (skipped.length) {
        var warnHtml = '<div style="background:#fff3e0;border:1px solid #ffb74d;' +
          'border-radius:6px;padding:8px 12px;margin-bottom:8px;font-size:12px">' +
          '<strong style="color:#e65100">⚠ ' + skipped.length + ' row(s) skipped due to hierarchy errors:</strong>' +
          '<ul style="margin:4px 0 0 16px;padding:0">' +
          skipped.map(function(s) { return '<li>Row ' + s.rowNum + ': ' + esc(s.reason) + '</li>'; }).join('') +
          '</ul></div>';
        if (csvMsg) { csvMsg.innerHTML = warnHtml; csvMsg.style.color = ''; }
      } else {
        if (csvMsg) csvMsg.textContent = '';
      }

      if (!_migCsvRows.length) {
        if (csvMsg && !skipped.length) { csvMsg.textContent = 'No importable rows found.'; csvMsg.style.color = 'var(--danger)'; }
        return;
      }
      _migPreviewRows = _migCsvRows;
      _migRenderPreview({
        sheetName: input.files[0].name, spreadsheetName: '',
        rows: _migCsvRows, totalRows: _migCsvRows.length,
        skipped: _migCsvRows.skipped || [],
        availableTabs: [], unmatchedAssigners: [], unmatchedExecutors: []
      });
      _migShowStep(2);
    } catch(err) {
      btn.disabled = false;
      msg.textContent = 'CSV parse error: ' + err.message; msg.style.color = 'var(--danger)';
    }
  };
  reader.onerror = function() {
    btn.disabled = false;
    msg.textContent = 'Failed to read file.'; msg.style.color = 'var(--danger)';
  };
  reader.readAsText(input.files[0]);
}

function _migShowStep(n) {
  el('mig-step-1').style.display = n === 1 ? 'block' : 'none';
  el('mig-step-2').style.display = n === 2 ? 'block' : 'none';
  el('mig-step-3').style.display = n === 3 ? 'block' : 'none';
}

function migBack() { _migShowStep(1); }

// Extract spreadsheet ID from a full URL or raw ID
function _migExtractId(urlOrId) {
  var m = String(urlOrId || '').match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : String(urlOrId || '').trim();
}

function migLoadPreview() {
  var rawUrl    = el('mig-sheet-url').value.trim();
  var sheetName = (el('mig-sheet-name').value || '').trim();
  var msg       = el('mig-step1-msg');

  if (!rawUrl) { msg.textContent = 'Paste a sheet URL or ID.'; msg.style.color = 'var(--danger)'; return; }

  var sheetId = _migExtractId(rawUrl);
  msg.textContent = 'Loading preview…';
  msg.style.color = 'var(--muted)';
  var btn = el('mig-preview-btn');
  btn.disabled = true;
  el('mig-tabs-hint').style.display = 'none';

  google.script.run
    .withSuccessHandler(function(r) {
      btn.disabled = false;
      if (!r || !r.ok) {
        msg.textContent = r ? r.error : 'Failed to read sheet.';
        msg.style.color = 'var(--danger)';
        return;
      }
      // Show available tabs hint whenever we have the data
      if (r.availableTabs && r.availableTabs.length > 1) {
        el('mig-tabs-list').textContent = r.availableTabs.join(', ');
        el('mig-tabs-hint').style.display = 'block';
      }
      if (!r.rows || !r.rows.length) {
        msg.textContent = 'No importable rows found in this worksheet.';
        msg.style.color = 'var(--muted)';
        return;
      }
      msg.textContent = '';
      _migPreviewRows = r.rows;
      _migRenderPreview(r);
      _migShowStep(2);
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      var raw = (err && err.message) || '';
      // Translate the raw GAS permission error into a human-readable action
      var friendly = raw.toLowerCase().indexOf('permission') !== -1 || raw.toLowerCase().indexOf('access') !== -1
        ? 'Permission denied. Share this Google Sheet with ' +
          (el('mig-deployer-email').textContent || 'the deployer account') +
          ' (Viewer access) and try again.'
        : (raw || 'Error loading preview. Please try again.');
      msg.innerHTML = friendly;
      msg.style.color = 'var(--danger)';
    })
    .migrationPreview(APP.currentUser.email, sheetId, sheetName);
}

function _migRenderPreview(r) {
  var displayName = r.spreadsheetName
    ? r.spreadsheetName + (r.sheetName && r.sheetName !== r.spreadsheetName ? ' › ' + r.sheetName : '')
    : (r.sheetName || 'Import File');
  el('mig-sheet-name').textContent = displayName;

  // Count entity types
  var counts = { fns: 0, subfns: 0, tasks: 0 };
  r.rows.forEach(function(row) {
    if (row.isStructureOnly && !row.subFunctionName) counts.fns++;
    else if (row.isStructureOnly)                    counts.subfns++;
    else                                             counts.tasks++;
  });
  el('mig-row-count').textContent =
    '(' + r.rows.length + ' rows: ' + counts.fns + ' function' + (counts.fns !== 1 ? 's' : '') +
    ', ' + counts.subfns + ' sub-function' + (counts.subfns !== 1 ? 's' : '') +
    ', ' + counts.tasks + ' task' + (counts.tasks !== 1 ? 's' : '') + ')';

  // Warnings: hierarchy skips + unmatched names
  var warnDiv  = el('mig-unmatched-warn');
  var skipped  = r.skipped || [];
  var warnParts = [];
  if (skipped.length) {
    warnParts.push(
      '<strong style="color:var(--danger)">⚠ ' + skipped.length +
      ' row(s) skipped (hierarchy violation):</strong>' +
      '<ul style="margin:4px 0 0 16px;padding:0">' +
      skipped.map(function(s) {
        return '<li style="margin-bottom:2px">Row ' + s.rowNum + ': ' + esc(s.reason) + '</li>';
      }).join('') + '</ul>'
    );
  }
  if (r.unmatchedAssigners && r.unmatchedAssigners.length)
    warnParts.push('Unmatched Assigner names (will default to you): ' + r.unmatchedAssigners.join(', '));
  if (r.unmatchedExecutors && r.unmatchedExecutors.length)
    warnParts.push('Unmatched Assignee names (will default to you): ' + r.unmatchedExecutors.join(', '));

  if (warnParts.length) {
    warnDiv.innerHTML = warnParts.join('<br>');
    warnDiv.style.display = 'block';
  } else {
    warnDiv.style.display = 'none';
  }

  // Build preview table rows
  var tbody = el('mig-preview-body');
  tbody.innerHTML = '';
  r.rows.forEach(function(row) {
    var tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid var(--border)';

    var typeLabel, typeStyle;
    if (row.isStructureOnly && !row.subFunctionName) {
      typeLabel = 'Function'; typeStyle = 'background:#e8f5e9;color:#2e7d32';
    } else if (row.isStructureOnly) {
      typeLabel = 'Sub-Fn';   typeStyle = 'background:#e3f2fd;color:#1565c0';
    } else {
      typeLabel = 'Task';     typeStyle = 'background:#fff3e0;color:#e65100';
    }

    var assigneeVal = row.assignees || row.executor || '';
    var assigneeLabel = assigneeVal
      ? (!row.executorId && assigneeVal
          ? '<span style="color:#856404">' + esc(assigneeVal) + ' ⚠</span>'
          : esc(assigneeVal))
      : '—';
    var assignerLabel = row.givenBy
      ? (!row.givenById
          ? '<span style="color:#856404">' + esc(row.givenBy) + ' ⚠</span>'
          : esc(row.givenBy))
      : '—';

    tr.innerHTML =
      '<td style="padding:5px;text-align:center">' +
        '<input type="checkbox" class="mig-row-cb" data-row="' + row.rowNum + '" checked/></td>' +
      '<td style="padding:5px;text-align:center">' +
        '<span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;' +
          'white-space:nowrap;' + typeStyle + '">' + typeLabel + '</span></td>' +
      '<td style="padding:5px;max-width:110px;overflow:hidden;text-overflow:ellipsis;' +
        'white-space:nowrap" title="' + esc(row['function'] || '') + '">' +
        esc(row['function'] || '—') + '</td>' +
      '<td style="padding:5px;max-width:110px;overflow:hidden;text-overflow:ellipsis;' +
        'white-space:nowrap" title="' + esc(row.subFunctionName || '') + '">' +
        esc(row.subFunctionName || '—') + '</td>' +
      '<td style="padding:5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        (row.isStructureOnly
          ? '<em style="color:var(--muted);font-size:11px">structure only</em>'
          : '<strong>' + esc(row.title) + '</strong>') + '</td>' +
      '<td style="padding:5px;max-width:100px;overflow:hidden;text-overflow:ellipsis;' +
        'white-space:nowrap">' + assignerLabel + '</td>' +
      '<td style="padding:5px;max-width:130px;overflow:hidden;text-overflow:ellipsis;' +
        'white-space:nowrap">' + assigneeLabel + '</td>' +
      '<td style="padding:5px">' + pill(row.status || 'Yet to Start') + '</td>' +
      '<td style="padding:5px">' + badge(row.priority || 'Medium') + '</td>' +
      '<td style="padding:5px;font-size:11px;color:var(--muted);white-space:nowrap">' +
        esc(row.dueDate || row.deadline || '—') + '</td>';
    tbody.appendChild(tr);
  });
  el('mig-check-all').checked = true;
}

function migSelectAll(checked) {
  document.querySelectorAll('.mig-row-cb').forEach(function(cb) { cb.checked = checked; });
  el('mig-check-all').checked = checked;
}

function migToggleAll(masterCb) {
  document.querySelectorAll('.mig-row-cb').forEach(function(cb) { cb.checked = masterCb.checked; });
}

function migConfirmImport() {
  var selectedRowNums = [];
  document.querySelectorAll('.mig-row-cb:checked').forEach(function(cb) {
    selectedRowNums.push(parseInt(cb.dataset.row, 10));
  });
  if (!selectedRowNums.length) {
    el('mig-step2-msg').textContent = 'Select at least one row to import.';
    el('mig-step2-msg').style.color = 'var(--danger)';
    return;
  }

  var btn = el('mig-import-btn');
  btn.disabled = true; btn.textContent = 'Importing…';
  el('mig-step2-msg').textContent = '';

  function _onSuccess(r) {
    btn.disabled = false; btn.textContent = 'Import Selected →';
    if (!r || !r.ok) {
      el('mig-step2-msg').textContent = r ? r.error : 'Import failed.';
      el('mig-step2-msg').style.color = 'var(--danger)'; return;
    }
    el('mig-result-msg').textContent = '✓ Imported ' + r.total + ' item' + (r.total !== 1 ? 's' : '') + ' successfully!';
    var parts = [];
    if (r.created)    parts.push(r.created    + ' function/sub-function' + (r.created    !== 1 ? 's' : ''));
    if (r.subCreated) parts.push(r.subCreated + ' task'                  + (r.subCreated !== 1 ? 's' : ''));
    var projName = '';
    var srcSel = _migSourceTab === 'csv' ? el('mig-proj-select-csv') : el('mig-proj-select');
    if (srcSel && srcSel.value) projName = srcSel.options[srcSel.selectedIndex].textContent;
    var dest = projName ? 'into "' + projName + '"' : 'without a project (unassigned)';
    el('mig-result-sub').textContent = (parts.length ? parts.join(' + ') + ' ' : '') + dest + '.';
    _migShowStep(3);
  }
  function _onFail(err) {
    btn.disabled = false; btn.textContent = 'Import Selected →';
    el('mig-step2-msg').textContent = (err && err.message) || 'Import failed.';
    el('mig-step2-msg').style.color = 'var(--danger)';
  }

  if (_migSourceTab === 'csv') {
    // CSV path — send selected rows directly (no sheet access needed)
    var projId   = el('mig-proj-select-csv').value;
    var selSet   = {};
    selectedRowNums.forEach(function(n) { selSet[n] = true; });
    var rowsToSend = _migCsvRows.filter(function(r) { return selSet[r.rowNum]; });
    google.script.run
      .withSuccessHandler(_onSuccess)
      .withFailureHandler(_onFail)
      .migrationImportDirectRows(APP.currentUser.email, projId, rowsToSend);
  } else {
    // URL path — re-read from the sheet server-side
    var sheetId   = _migExtractId(el('mig-sheet-url').value);
    var projId2   = el('mig-proj-select').value;
    var sheetName = (el('mig-sheet-name').value || '').trim();
    google.script.run
      .withSuccessHandler(_onSuccess)
      .withFailureHandler(_onFail)
      .migrationImport(APP.currentUser.email, sheetId, projId2, selectedRowNums, sheetName);
  }
}

// ─── WEEKLY SUMMARY + MIS REPORT ──────────────────────────────────────────────
// Weeks are keyed by their Monday's calendar date ('YYYY-MM-DD'). The whole org
// is IST, so the local Monday date equals the backend's UTC-Monday key.

var _WS_BULLETS   = [];    // current bullet array shown in modal
var _WS_EDIT_IDX  = null;  // which bullet index is currently being edited (null = none)
var _WS_CUR_START = '';    // weekStart of the currently open summary

function _wsLocalMonday(d) {
  var x   = new Date(d.getFullYear(), d.getMonth(), d.getDate()); // strip time
  var day = x.getDay();                          // 0=Sun … 6=Sat
  x.setDate(x.getDate() + (day === 0 ? -6 : 1 - day));
  return x;
}
function _wsIso(d) {
  return d.getFullYear() + '-' +
    ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
    ('0' + d.getDate()).slice(-2);
}
function _wsFmtRangeLabel(weekStart, weekEnd) {
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var f = function(iso) {
    var d = new Date(iso + 'T00:00:00Z');
    return days[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + months[d.getUTCMonth()];
  };
  var yr = new Date(weekEnd + 'T00:00:00Z').getUTCFullYear();
  return f(weekStart) + ' – ' + f(weekEnd) + ' ' + yr;
}

function openWeeklySummaryModal() {
  var anchor    = (typeof WL_ANCHOR !== 'undefined' && WL_ANCHOR) ? new Date(WL_ANCHOR) : new Date();
  var monDate   = _wsLocalMonday(anchor);
  var weekStart = _wsIso(monDate);
  var endDate   = new Date(monDate.getFullYear(), monDate.getMonth(), monDate.getDate() + 6);
  var weekEnd   = _wsIso(endDate);

  _WS_CUR_START = weekStart;
  _WS_EDIT_IDX  = null;
  var sub = el('ws-modal-sub');
  if (sub) sub.innerHTML =
    '<span>' + esc(_wsFmtRangeLabel(weekStart, weekEnd)) + '</span>' +
    '<span style="font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--border);' +
    'border-radius:4px;padding:1px 6px;letter-spacing:.06em;text-transform:uppercase;' +
    'vertical-align:middle;margin-left:6px">editable</span>';
  el('ws-modal-body').innerHTML   = '<div class="empty-state"><div class="ei">⏳</div><p>Loading summary…</p></div>';
  el('ws-modal-footer').innerHTML = '';
  openModal('weekly-summary-modal');

  google.script.run
    .withSuccessHandler(function(r) { _wsRenderModalContent(r, weekStart); })
    .withFailureHandler(function() { _wsRenderModalError('Failed to load summary. Please try again.'); })
    .getWeeklySummary(APP._verifiedEmail, weekStart);
}

function _wsRenderModalContent(r, weekStart) {
  var body   = el('ws-modal-body');
  var footer = el('ws-modal-footer');
  if (!body || !footer) return;

  if (!r || !r.ok) { _wsRenderModalError((r && r.error) ? r.error : 'Failed to load summary.'); return; }

  _WS_CUR_START = weekStart;
  _WS_EDIT_IDX  = null;

  if (!r.found) {
    body.innerHTML =
      '<div style="text-align:center;padding:36px 16px">' +
      '<span class="material-symbols-outlined" style="font-size:34px;color:var(--muted)">description</span>' +
      '<div style="font-size:14px;font-weight:600;color:var(--text);margin:10px 0 4px">No summary for this week yet</div>' +
      '<div style="font-size:12px;color:var(--muted);line-height:1.6">Summaries are auto-generated every Monday at 12 AM UTC.<br>' +
      'You can generate it now if your work logs are filled in.</div></div>';
    footer.innerHTML =
      '<div></div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn btn-ghost btn-sm" onclick="closeModal(\'weekly-summary-modal\')">Close</button>' +
        '<button class="btn btn-accent btn-sm" onclick="_wsGenerateNow(\'' + esc(weekStart) + '\')" ' +
        'style="display:flex;align-items:center;gap:4px">' +
          '<span class="material-symbols-outlined" style="font-size:16px">auto_awesome</span>Generate Now' +
        '</button>' +
      '</div>';
    return;
  }

  // Parse content string into bullet array
  _WS_BULLETS = (r.content || '').split('\n')
    .map(function(l) { return l.trim().replace(/^[•\-]\s*/, ''); })
    .filter(Boolean);

  _wsRenderBullets(body, weekStart);

  var genDate  = _wsFormatTs(r.generatedAt);
  var editNote = r.isEdited ? ' · edited' : '';
  footer.innerHTML =
    '<div style="font-size:11.5px;color:var(--muted)">Generated ' + esc(genDate) + esc(editNote) + '</div>' +
    '<div style="display:flex;gap:8px">' +
      '<button class="btn btn-ghost btn-sm" onclick="_wsCopyAll()" ' +
      'style="display:flex;align-items:center;gap:4px">' +
        '<span class="material-symbols-outlined" style="font-size:16px">content_copy</span>Copy' +
      '</button>' +
      '<button class="btn btn-ghost btn-sm" onclick="closeModal(\'weekly-summary-modal\')">Close</button>' +
    '</div>';
}

function _wsRenderModalError(msg) {
  var body = el('ws-modal-body');
  if (body) body.innerHTML =
    '<div style="text-align:center;padding:36px 16px;color:var(--danger);font-size:13px">' +
    '<span class="material-symbols-outlined" style="font-size:28px;display:block;margin-bottom:8px">error</span>' +
    esc(msg) + '</div>';
  var footer = el('ws-modal-footer');
  if (footer) footer.innerHTML =
    '<div></div><button class="btn btn-ghost btn-sm" onclick="closeModal(\'weekly-summary-modal\')">Close</button>';
}

// ── Option C: per-bullet inline edit ────────────────────────────────────────

function _wsRenderBullets(body, weekStart) {
  if (!body) body = el('ws-modal-body');
  if (!body) return;
  var qs = esc(weekStart);
  var html =
    '<div style="font-size:12px;font-weight:500;color:var(--muted);margin-bottom:12px">' +
    'Click any point to edit</div>' +
    '<div id="ws-bullet-list">';

  _WS_BULLETS.forEach(function(b, i) {
    html += _wsBulletRowHtml(b, i, qs);
  });

  html +=
    '<div onclick="_wsAddBullet(\'' + qs + '\')" ' +
    'style="display:flex;align-items:center;gap:8px;padding:8px 12px;' +
    'color:var(--muted);font-size:13px;cursor:pointer;border-radius:var(--r);' +
    'border:1.5px dashed var(--border);margin-top:6px;transition:border-color .15s;" ' +
    'onmouseenter="this.style.borderColor=\'var(--p)\';this.style.color=\'var(--p)\'" ' +
    'onmouseleave="this.style.borderColor=\'var(--border)\';this.style.color=\'var(--muted)\'">' +
      '<span style="font-size:18px;line-height:1">+</span> Add a point' +
    '</div>';

  html += '</div>';
  body.innerHTML = html;
}

function _wsBulletRowHtml(text, idx, qs) {
  if (!text || !text.trim() || text === '​') return ''; // skip empty/placeholder bullets
  return '<div onclick="_wsStartEditBullet(' + idx + ',\'' + qs + '\')" ' +
    'style="display:flex;align-items:flex-start;gap:10px;padding:9px 12px;' +
    'border-radius:var(--r);cursor:pointer;border:1px solid transparent;' +
    'margin-bottom:4px;transition:background .12s,border-color .12s;" ' +
    'onmouseenter="this.style.background=\'#eef1f4\';this.style.borderColor=\'#dde2e8\'" ' +
    'onmouseleave="this.style.background=\'transparent\';this.style.borderColor=\'transparent\'">' +
      '<span style="width:7px;height:7px;border-radius:50%;background:var(--danger);' +
      'flex-shrink:0;margin-top:7px"></span>' +
      '<span style="font-size:13.5px;color:var(--text);line-height:1.6;flex:1;' +
      'word-break:break-word;overflow-wrap:break-word">' + esc(text) + '</span>' +
    '</div>';
}

function _wsStartEditBullet(idx, weekStart) {
  _WS_EDIT_IDX = idx;
  var list = document.getElementById('ws-bullet-list');
  if (!list) return;
  var target = list.children[idx];
  if (!target) return;
  var qs = esc(weekStart);
  var safeText = (_WS_BULLETS[idx] || '').replace(/​/g, '');
  target.outerHTML =
    '<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:4px;">' +
      '<textarea id="ws-ta-' + idx + '" rows="2" ' +
      'style="flex:1;border:1.5px solid var(--p);border-radius:var(--r);' +
      'padding:9px 12px;font-size:13.5px;line-height:1.6;font-family:inherit;' +
      'outline:none;resize:vertical;color:var(--text);background:#fff;' +
      'word-break:break-word;overflow-wrap:break-word;">' +
        esc(safeText) +
      '</textarea>' +
      '<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">' +

        // Save — navy filled
        '<button onclick="_wsConfirmBullet(' + idx + ',\'' + qs + '\')" ' +
        'title="Save" style="display:flex;align-items:center;justify-content:center;' +
        'width:32px;height:32px;background:#2D3E51;color:#fff;border:none;' +
        'border-radius:6px;cursor:pointer;transition:background .12s;" ' +
        'onmouseenter="this.style.background=\'#1e2d3d\'" ' +
        'onmouseleave="this.style.background=\'#2D3E51\'">' +
          '<span class="material-symbols-outlined" style="font-size:16px">check</span>' +
        '</button>' +

        // Cancel — ghost bordered
        '<button onclick="_wsCancelBullet(\'' + qs + '\')" ' +
        'title="Cancel" style="display:flex;align-items:center;justify-content:center;' +
        'width:32px;height:32px;background:transparent;border:1px solid var(--border);' +
        'border-radius:6px;cursor:pointer;color:var(--muted);transition:background .12s;" ' +
        'onmouseenter="this.style.background=\'#f4f5f7\'" ' +
        'onmouseleave="this.style.background=\'transparent\'">' +
          '<span class="material-symbols-outlined" style="font-size:16px">undo</span>' +
        '</button>' +

        // Delete — red bordered
        '<button onclick="_wsDeleteBullet(' + idx + ',\'' + qs + '\')" ' +
        'title="Delete this point" style="display:flex;align-items:center;justify-content:center;' +
        'width:32px;height:32px;background:transparent;border:1px solid #fca5a5;' +
        'border-radius:6px;cursor:pointer;color:#dc2626;transition:background .12s;" ' +
        'onmouseenter="this.style.background=\'#fef2f2\'" ' +
        'onmouseleave="this.style.background=\'transparent\'">' +
          '<span class="material-symbols-outlined" style="font-size:16px">delete</span>' +
        '</button>' +

      '</div>' +
    '</div>';
  var ta = document.getElementById('ws-ta-' + idx);
  if (ta) { ta.focus(); ta.select(); }
}

function _wsConfirmBullet(idx, weekStart) {
  var ta = document.getElementById('ws-ta-' + idx);
  if (!ta) return;
  var newText = ta.value.trim();
  if (!newText) {
    // Empty save — discard the placeholder bullet entirely
    _WS_BULLETS.splice(idx, 1);
    _WS_EDIT_IDX = null;
    _wsRenderBullets(null, weekStart);
    return;
  }
  _WS_BULLETS[idx] = newText;
  _WS_EDIT_IDX = null;
  _wsRenderBullets(null, weekStart);
  _wsPersist(weekStart);
}

function _wsCancelBullet(weekStart) {
  // Remove if this was a newly-added placeholder (empty or zero-width space)
  if (_WS_EDIT_IDX !== null) {
    var v = _WS_BULLETS[_WS_EDIT_IDX] || '';
    if (!v.trim() || v === '​') _WS_BULLETS.splice(_WS_EDIT_IDX, 1);
  }
  _WS_EDIT_IDX = null;
  _wsRenderBullets(null, weekStart);
}

function _wsDeleteBullet(idx, weekStart) {
  _WS_BULLETS.splice(idx, 1);
  _WS_EDIT_IDX = null;
  _wsRenderBullets(null, weekStart);
  _wsPersist(weekStart);
}

function _wsAddBullet(weekStart) {
  // Push a zero-width space as placeholder so _wsBulletRowHtml skips rendering it
  // (the empty guard returns '' for this), avoiding a floating crimson dot.
  _WS_BULLETS.push('​');
  _wsRenderBullets(null, weekStart);
  var newIdx = _WS_BULLETS.length - 1;
  setTimeout(function() {
    _wsStartEditBullet(newIdx, weekStart);
    // _wsStartEditBullet strips ​ from safeText so textarea starts clean
  }, 30);
}

function _wsPersist(weekStart) {
  var content = _WS_BULLETS.map(function(b) { return '• ' + b; }).join('\n');
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok) { toast((r && r.error) || 'Auto-save failed', 'error'); return; }
      var footer = el('ws-modal-footer');
      if (footer) {
        var hint = footer.querySelector('.ws-saved-hint');
        if (!hint) {
          hint = document.createElement('span');
          hint.className = 'ws-saved-hint';
          hint.style.cssText = 'font-size:11.5px;transition:color .2s';
          footer.insertBefore(hint, footer.firstChild);
        }
        hint.textContent = 'Saved ✓'; hint.style.color = 'var(--ok)';
        setTimeout(function() { if (hint) { hint.textContent = ''; } }, 2500);
      }
    })
    .withFailureHandler(function() { toast('Auto-save failed', 'error'); })
    .saveWeeklySummary(APP._verifiedEmail, weekStart, content);
}

function _wsCopyAll() {
  var text = _WS_BULLETS.map(function(b) { return '• ' + b; }).join('\n');
  if (!text) { toast('Nothing to copy', 'error'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(function() { toast('Copied to clipboard', 'success'); })
      .catch(function() { _wsCopyFallback(text); });
  } else { _wsCopyFallback(text); }
}

function _wsFormatTs(raw) {
  if (!raw) return '';
  try {
    var d = new Date(raw);
    if (isNaN(d.getTime())) return String(raw).split('T')[0];
    var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var h = d.getHours(), m = d.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return d.getDate() + ' ' + M[d.getMonth()] + ' ' + d.getFullYear() + ', ' +
           h + ':' + (m < 10 ? '0' + m : m) + ' ' + ampm;
  } catch(e) { return ''; }
}

function _wsGenerateNow(weekStart) {
  el('ws-modal-body').innerHTML =
    '<div class="empty-state"><div class="ei">⏳</div><p>Generating summary with AI…<br>this may take 10–20 seconds</p></div>';
  el('ws-modal-footer').innerHTML = '';
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok) { _wsRenderModalError(r && r.error ? r.error : 'Generation failed.'); return; }
      google.script.run
        .withSuccessHandler(function(r2) { _wsRenderModalContent(r2, weekStart); })
        .withFailureHandler(function() { _wsRenderModalError('Summary was saved but failed to reload. Close and reopen Weekly Summary.'); })
        .getWeeklySummary(APP._verifiedEmail, weekStart);
    })
    .withFailureHandler(function(err) { _wsRenderModalError('Generation failed: ' + (err && err.message ? err.message : 'unknown error')); })
    .generateMyWeeklySummary(APP._verifiedEmail, weekStart);
}

function _wsCopyText(text) {
  if (!text) { toast('Nothing to copy', 'error'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(function() { toast('Copied to clipboard', 'success'); })
      .catch(function() { _wsCopyFallback(text); });
  } else { _wsCopyFallback(text); }
}
function _wsCopyToClipboard() { _wsCopyAll(); }
function _wsCopyFallback(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copied to clipboard', 'success'); }
  catch (e) { toast('Copy failed — please copy manually', 'error'); }
  document.body.removeChild(ta);
}

// ── MIS Report (access-gated) ────────────────────────────────────────────────

function renderMisReport() {
  if (!APP.currentUser || !APP.currentUser.hasMisAccess) {
    el('mis-controls').innerHTML = '';
    el('mis-body').innerHTML =
      '<div style="text-align:center;padding:48px;color:var(--muted)">' +
      '<span class="material-symbols-outlined" style="font-size:32px;display:block;margin-bottom:8px">lock</span>' +
      'You do not have access to the MIS Report.</div>';
    return;
  }
  var defWeek = _wsIso(_wsLocalMonday(new Date(Date.now() - 7 * 86400000))); // last week's Monday
  el('mis-controls').innerHTML =
    '<label style="font-size:12px;color:var(--muted)">Week of</label>' +
    '<input type="date" id="mis-week-input" class="fc" value="' + defWeek + '" ' +
    'onchange="_misOnWeekPick(this.value)" style="width:auto;padding:5px 8px">' +
    '<button class="btn btn-accent btn-sm" onclick="exportMisReport()">' +
    '<span class="material-symbols-outlined" style="font-size:16px">content_copy</span>Copy All</button>';
  loadMisReport(defWeek);
}

// Snap any picked day to its Monday (stored Week_Start keys are always Mondays),
// reflect the snap back into the picker, then load. Build the date from y-m-d
// parts in LOCAL time so day-of-week math matches _wsLocalMonday (new Date('YYYY-MM-DD')
// would parse as UTC midnight and shift the day in IST).
function _misOnWeekPick(val) {
  if (!val) return;
  var p = String(val).split('-');
  if (p.length !== 3) { loadMisReport(val); return; }
  var picked = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  var mon    = _wsIso(_wsLocalMonday(picked));
  var inp    = el('mis-week-input');
  if (inp && inp.value !== mon) inp.value = mon;
  loadMisReport(mon);
}

function loadMisReport(weekStart) {
  el('mis-body').innerHTML = '<div class="empty-state"><div class="ei">⏳</div><p>Loading…</p></div>';
  google.script.run
    .withSuccessHandler(function(r) { _misRenderSummaries(r, weekStart); })
    .withFailureHandler(function() {
      el('mis-body').innerHTML = '<div style="text-align:center;padding:32px;color:var(--danger)">Failed to load MIS report.</div>';
    })
    .getMisSummaries(APP._verifiedEmail, weekStart);
}

function _misRenderSummaries(r, weekStart) {
  var body = el('mis-body');
  if (!r || !r.ok) {
    body.innerHTML = '<div style="text-align:center;padding:32px;color:var(--danger)">' +
      esc(r && r.error ? r.error : 'Failed to load.') + '</div>';
    return;
  }
  if (!r.summaries || !r.summaries.length) {
    body.innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted);font-size:13px">' +
      'No summaries found for the week of ' + esc(weekStart) + '.<br>' +
      'Summaries are generated every Monday at 12 AM UTC.</div>';
    body.dataset.summariesJson = '[]';
    return;
  }
  var html = '<div style="display:flex;flex-direction:column;gap:14px;padding:4px 0">';
  r.summaries.forEach(function(s) {
    var bullets = String(s.content || '').split('\n').map(function(line) {
      var l = line.trim().replace(/^[•\-]\s*/, '');
      return l ? '<li style="margin-bottom:5px;font-size:13px;line-height:1.5;color:var(--text)">' + esc(l) + '</li>' : '';
    }).join('');
    html +=
      '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
      '<div style="font-size:14px;font-weight:600;color:var(--text)">' + esc(s.empName || s.email) + '</div>' +
      (s.isEdited ? '<span style="font-size:11px;color:var(--muted)">✎ Edited</span>' : '') + '</div>' +
      '<ul style="margin:0;padding-left:18px">' + bullets + '</ul></div>';
  });
  html += '</div>';
  body.innerHTML = html;
  body.dataset.summariesJson = JSON.stringify(r.summaries);
}

function exportMisReport() {
  var body = el('mis-body');
  var summaries = [];
  try { summaries = JSON.parse(body.dataset.summariesJson || '[]'); } catch (e) {}
  if (!summaries.length) { toast('No data to copy', 'error'); return; }
  var text = summaries.map(function(s) {
    return '=== ' + (s.empName || s.email) + ' ===\n' + (s.content || '');
  }).join('\n\n');
  _wsCopyText(text);
}

</script>
