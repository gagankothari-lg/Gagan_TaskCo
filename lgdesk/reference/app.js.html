    cont.innerHTML = '<div class="empty-state"><div class="ei material-symbols-outlined">group</div><p>No team members found.</p></div>';
    return;
  }
  cont.innerHTML = employees.map(_dirCardHtml).join('');
}

function renderCompanyDirectory(employees) {
  var cont = el('dir-company-container');
  if (!employees.length) {
    cont.innerHTML = '<div class="empty-state"><div class="ei material-symbols-outlined">group</div><p>No members found.</p></div>';
    return;
  }

  // Group by team (preserve insertion order of teams as they appear)
  var teamOrder = [];
  var teamGroups = {};
  employees.forEach(function(e) {
    var team = e.team || 'Unassigned';
    if (!teamGroups[team]) { teamGroups[team] = []; teamOrder.push(team); }
    teamGroups[team].push(e);
  });

  cont.innerHTML = teamOrder.map(function(team) {
    var members = teamGroups[team];
    return '<div class="dir-team-section">' +
      '<div class="dir-team-header">' +
        '<span class="material-symbols-outlined" style="font-size:16px">group</span>' +
        esc(team) +
        '<span class="dir-team-count">' + members.length + ' member' + (members.length !== 1 ? 's' : '') + '</span>' +
      '</div>' +
      '<div class="dir-grid">' + members.map(_dirCardHtml).join('') + '</div>' +
    '</div>';
  }).join('');
}

// ── Chat sidebar links (Team + General) ──────────────────────────────────────
var DIR_GENERAL_SPACE  = null;  // { spaceId, uri }
var DIR_CHAT_CONNECTED = false; // whether any admin has Chat OAuth connected

function _loadNavTeamChats() {
  google.script.run
    .withSuccessHandler(function(cfg) {
      DIR_TEAM_SPACES    = (cfg && cfg.teams)     || {};
      DIR_GENERAL_SPACE  = (cfg && cfg.general)   || null;
      DIR_CHAT_CONNECTED = !!(cfg && cfg.connected);
      _navPopulateTeamChats();
    })
    .withFailureHandler(function() {})
    .getChatSpaceConfig(APP.currentUser.email);
}

// Connect Google Chat via OAuth2 (same flow as Forms / Tasks)
function connectChat() {
  var btn = el('btn-connect-chat');
  if (btn) _btnLoading(btn, 'Connecting…');
  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) _btnReset(btn, 'Connect Google Chat');
      if (!r || !r.ok) { toast(r && r.error || 'Failed to get auth URL', 'error'); return; }
      window.open(r.url, '_blank', 'width=500,height=650');
      toast('Complete Google Chat authorization in the popup, then click "Sync Spaces".', 'info');
    })
    .withFailureHandler(function(e) {
      if (btn) _btnReset(btn, 'Connect Google Chat');
      toast(e.message || 'Error', 'error');
    })
    .chatGetAuthUrl(APP.currentUser.email);
}

// Trigger full sync of all spaces (Team + General + Projects)
function syncChat() {
  var btn = el('btn-sync-chat');
  if (btn) _btnLoading(btn, 'Syncing…');
  toast('Syncing Chat spaces — this may take up to a minute…', 'info');
  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) _btnReset(btn, 'Sync Spaces');
      if (!r || !r.ok) { toast(r && r.error || 'Sync failed', 'error'); return; }
      toast('Chat spaces synced! Refreshing links…', 'ok');
      _loadNavTeamChats(); // refresh sidebar with new space links
    })
    .withFailureHandler(function(e) {
      if (btn) _btnReset(btn, 'Sync Spaces');
      toast(e.message || 'Sync error', 'error');
    })
    .syncChatSpacesFromUI(APP.currentUser.email);
}

function _navPopulateTeamChats() {
  var sec  = el('nav-tc-sec');
  var list = el('nav-tc-list');
  if (!sec || !list) return;

  var u         = APP.currentUser;
  var myTeam    = u.team || '';
  var isAdmin   = _isAdmin(u.role);
  var html      = '';
  var spaceHtml = '';

  // Team chat — only the user's own team space
  if (myTeam && DIR_TEAM_SPACES[myTeam] && DIR_TEAM_SPACES[myTeam].uri) {
    spaceHtml += '<a href="' + esc(DIR_TEAM_SPACES[myTeam].uri) + '" target="_blank" class="nav-item-ext">' +
      '<span class="nav-icon"><span class="material-symbols-outlined">group</span></span>' +
      esc(myTeam) + ' Chat' +
      '<span class="nav-ext-arrow material-symbols-outlined">open_in_new</span>' +
    '</a>';
  }

  // General chat — visible to everyone
  if (DIR_GENERAL_SPACE && DIR_GENERAL_SPACE.uri) {
    spaceHtml += '<a href="' + esc(DIR_GENERAL_SPACE.uri) + '" target="_blank" class="nav-item-ext">' +
      '<span class="nav-icon"><span class="material-symbols-outlined">forum</span></span>' +
      'General Chat' +
      '<span class="nav-ext-arrow material-symbols-outlined">open_in_new</span>' +
    '</a>';
  }

  if (!isAdmin && !spaceHtml) {
    // Non-admin with no spaces — hide section
    sec.classList.add('hidden');
    list.innerHTML = '';
    return;
  }

  sec.classList.remove('hidden');
  html += spaceHtml;

  // Admin controls below the space links
  if (isAdmin) {
    html += '<div style="padding:6px 12px 10px;display:flex;flex-direction:column;gap:6px">';
    if (!DIR_CHAT_CONNECTED) {
      // Not yet connected — show Connect button
      html += '<button id="btn-connect-chat" class="btn btn-outline" style="width:100%;font-size:12px;padding:5px 10px" onclick="connectChat()">' +
        '<span class="material-symbols-outlined" style="font-size:13px;vertical-align:middle;margin-right:3px">add_link</span>' +
        'Connect Google Chat</button>';
    } else {
      // Connected — show Sync button (always useful to re-add new members)
      html += '<button id="btn-sync-chat" class="btn btn-outline" style="width:100%;font-size:12px;padding:5px 10px" onclick="syncChat()">' +
        '<span class="material-symbols-outlined" style="font-size:13px;vertical-align:middle;margin-right:3px">sync</span>' +
        'Sync Spaces</button>';
    }
    html += '</div>';
  }

  list.innerHTML = html;
}

// ── Presence ───────────────────────────────────────────────────────────────────
var PRES           = {};           // email → 'online'|'away'|'dnd'|'offline'
var PRES_MY_STATUS = 'online';
var _PRES_PING_IV  = null;
var _PRES_REF_IV   = null;
var _PRES_IDLE_T   = null;
var PRES_IDLE_MS   = 5 * 60 * 1000;  // 5 min idle → away
var PRES_PING_MS   = 3 * 60 * 1000;  // ping every 3 min

function _presClass(s)  { return 'pres-' + ({'online':'online','away':'away','dnd':'dnd'}[s] || 'offline'); }
function _presLabel(s)  { return {'online':'Online','away':'Away','dnd':'Do Not Disturb','offline':'Offline'}[s] || 'Offline'; }

// ── Meeting Reminder (5 min before) ───────────────────────────────────────────
var _MEET_REMINDED = {};        // calEventId → true  (don't pop again this session)
var _meetReminderTimer = null;

function _startMeetReminder() {
  if (_meetReminderTimer) return;
  _meetReminderCheck(); // immediate first check
  _meetReminderTimer = setInterval(_meetReminderCheck, 60 * 1000); // every 60 s
}

function _meetReminderCheck() {
  if (!APP._verifiedEmail) return;
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok) return;
      var meetings = r.meetings || [];
      _updateMeetingsBadge(meetings.length);
      var now = Date.now();
      meetings.forEach(function(m) {
        if (!m.start || _MEET_REMINDED[m.id]) return;
        var diff = new Date(m.start).getTime() - now;
        // Trigger if meeting is 0 – 6 minutes away
        if (diff >= 0 && diff <= 6 * 60 * 1000) {
          _MEET_REMINDED[m.id] = true;
          _showMeetReminderPopup(m);
        }
      });
    })
    .getMeetings(APP._verifiedEmail);
}

function _showMeetReminderPopup(m) {
  var popup = el('meet-reminder-popup');
  if (!popup) return;
  var nameEl = el('mrp-name');
  if (nameEl) nameEl.textContent = m.title || 'Upcoming Meeting';
  var joinBtn = el('mrp-join-btn');
  if (joinBtn) {
    if (m.meetLink) { joinBtn.href = m.meetLink; joinBtn.style.display = ''; }
    else joinBtn.style.display = 'none';
  }
  popup.classList.remove('hidden');
  // Auto-dismiss after 3 minutes
  setTimeout(function() { popup.classList.add('hidden'); }, 3 * 60 * 1000);
  // Browser notification if permission already granted
  try {
    if (window.Notification && Notification.permission === 'granted') {
      new Notification('⏰ ' + (m.title || 'Meeting') + ' starts in 5 minutes', {
        body: m.meetLink ? 'Click to join' : 'Check your calendar',
        icon: ''
      });
    }
  } catch(ex) {}
}

function _dismissMeetReminder() {
  var popup = el('meet-reminder-popup');
  if (popup) popup.classList.add('hidden');
}

// Start presence system — called once after enterDashboard.
function _presStart() {
  _presPing('online');
  _presRefreshAll(); // load initial map

  // Re-ping periodically to stay "alive"
  _PRES_PING_IV = setInterval(function() {
    if (PRES_MY_STATUS !== 'dnd' && PRES_MY_STATUS !== 'offline') {
      _presPing(PRES_MY_STATUS);
    }
  }, PRES_PING_MS);

  // Re-fetch all presence every 60 s (update dots while directory is open)
  _PRES_REF_IV = setInterval(function() {
    if (APP.view === 'directory') _presRefreshAll();
  }, 60 * 1000);

  // Idle detection — mouse/keyboard activity resets the timer
  _presResetIdleTimer();
  ['mousemove','click','keydown','touchstart','scroll'].forEach(function(ev) {
    document.addEventListener(ev, _presActivityHandler, { passive: true });
  });
}

function _presActivityHandler() {
  // Coming back from auto-away (but not if user manually set away/dnd/offline)
  if (PRES_MY_STATUS === 'away' && !PRES_MY_STATUS._manual) {
    PRES_MY_STATUS = 'online';
    _presPing('online');
    _presUpdateHdDot();
  }
  _presResetIdleTimer();
}

function _presResetIdleTimer() {
  clearTimeout(_PRES_IDLE_T);
  _PRES_IDLE_T = setTimeout(function() {
    if (PRES_MY_STATUS === 'online') {
      PRES_MY_STATUS = 'away';
      _presPing('away');
      _presUpdateHdDot();
    }
  }, PRES_IDLE_MS);
}

function _presPing(status) {
  google.script.run.setMyPresence(status, APP.currentUser.email);
}

function _presRefreshAll() {
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok) return;
      PRES = r.presence || {};
      // Update own status dot in header
      var mine = PRES[APP.currentUser.email];
      if (mine && mine !== PRES_MY_STATUS && !['dnd','offline'].includes(PRES_MY_STATUS)) {
        // Don't overwrite manual statuses
      }
      _presUpdateHdDot();
      // Update all visible card dots
      _presUpdateCards();
    })
    .getAllPresence(APP.currentUser.email);
}

function _presUpdateCards() {
  document.querySelectorAll('.pres-card-dot[data-email]').forEach(function(dot) {
    var email  = dot.dataset.email;
    var status = PRES[email] || 'offline';
    dot.className = 'pres-dot pres-card-dot ' + _presClass(status);
    dot.title     = _presLabel(status);
  });
}

function _presUpdateHdDot() {
  var dot = el('hd-status-dot');
  if (!dot) return;
  var s = PRES_MY_STATUS;
  dot.className = 'pres-dot ' + _presClass(s);
  dot.parentElement.title = 'Status: ' + _presLabel(s) + ' — click to change';
  // Highlight active menu item
  ['online','away','dnd','offline'].forEach(function(k) {
    var item = el('pmi-' + k);
    if (item) item.classList.toggle('active-status', k === s);
  });
}

function togglePresMenu(e) {
  e.stopPropagation();
  var m = el('pres-menu');
  var isOpen = !m.classList.contains('hidden');
  m.classList.toggle('hidden', isOpen);
  if (!isOpen) {
    setTimeout(function() {
      document.addEventListener('click', function _closeMenu() {
        el('pres-menu').classList.add('hidden');
        document.removeEventListener('click', _closeMenu);
      });
    }, 0);
  }
}

function setPresStatus(status) {
  PRES_MY_STATUS = status;
  PRES[APP.currentUser.email] = status;
  _presPing(status);
  _presUpdateHdDot();
  _presUpdateCards();
  el('pres-menu').classList.add('hidden');
  // Reset idle timer so auto-away doesn't immediately override a manual status
  if (status !== 'away') _presResetIdleTimer();
}

// ── Chat Window (Google Chat as a side-panel-style popup) ─────────────────────
function openChatWindow(url, name) {
  var w    = 420;
  var h    = screen.availHeight;
  var left = screen.availLeft + screen.availWidth - w;
  var top  = screen.availTop;
  var win  = window.open(
    url, 'gchat_' + (name || 'chat'),
    'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top +
    ',toolbar=no,menubar=no,location=no,status=no,scrollbars=yes,resizable=yes'
  );
  if (win) win.focus();
}

// ── Loading state helpers ─────────────────────────────────────────────────────
// Call _btnLoading(btn, 'Saving…') before a google.script.run call.
// Call _btnReset(btn) in both success and failure handlers.
function _btnLoading(btn, text) {
  if (!btn) return;
  btn._origHTML     = btn.innerHTML;
  btn._origDisabled = btn.disabled;
  btn.disabled      = true;
  var spinnerClass  = (btn.classList.contains('btn-ghost') || btn.classList.contains('btn-outline'))
                        ? 'btn-spinner-dark' : 'btn-spinner';
  btn.innerHTML = '<span class="' + spinnerClass + '"></span> ' + (text || 'Loading…');
}
function _btnReset(btn) {
  if (!btn) return;
  btn.disabled = btn._origDisabled || false;
  if (btn._origHTML !== undefined) { btn.innerHTML = btn._origHTML; delete btn._origHTML; }
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function el(id)   { return document.getElementById(id); }
function elVal(id){ var e = el(id); return e ? e.value : ''; }
function esc(s)   {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function findProj(id) { return APP.projects.find(function(p) { return p.Proj_ID === id; }); }
function findEmp(id)  { return APP.employees.find(function(e) { return e.Emp_ID  === id; }); }
function findEmpName(id) { var e = findEmp(id); return e ? e.Name : (id || '—'); }
function findFn(id)   { return (APP.functions || []).find(function(f) { return f.Function_ID === id; }); }
function findFnName(id) { var f = findFn(id); return f ? f.Name : ''; }
function isTopFn(fn)  { return fn && !fn.Parent_Fn_ID; }
function isSubFn(fn)  { return fn && !!fn.Parent_Fn_ID; }
// Build row descriptor for a task: { task, subFn, fn, displayTask }
function _rowForTask(t) {
  if (!t) return { task: null, subFn: null, fn: null, displayTask: null };
  var subFn = t.SubFn_ID ? ((APP.functions || []).find(function(f) { return f.Function_ID === t.SubFn_ID; }) || null) : null;
  var fn    = subFn && subFn.Parent_Fn_ID
    ? ((APP.functions || []).find(function(f) { return f.Function_ID === subFn.Parent_Fn_ID; }) || null)
    : (t.Function_ID ? ((APP.functions || []).find(function(f) { return f.Function_ID === t.Function_ID && !f.Parent_Fn_ID; }) || null) : null);
  return { task: t, subFn: subFn, fn: fn, displayTask: t };
}

// ── Assignment Chain Renderer ─────────────────────────────────────────────────
// Parses Assignment_History JSON and returns HTML showing the full chain.
// titleLabel: optional heading override. Pass '' to suppress heading, undefined = default 'Assignment Chain'.
function _renderAssignChain(historyJson, titleLabel) {
  var history = [];
  try { if (historyJson) history = JSON.parse(historyJson); } catch(e) {}
  if (!history.length) return '';
  var title = titleLabel !== undefined ? titleLabel : 'Assignment Chain';
  return '<div class="assign-chain">' +
    (title ? '<div class="assign-chain-title">' + esc(title) + '</div>' : '') +
    history.map(function(entry, i) {
      var byName  = findEmpName(entry.by);
      var toNames = (entry.to || []).map(function(id) { return findEmpName(id); });
      var teamStr = (entry.teams && entry.teams.length) ? ' [via: ' + entry.teams.join(', ') + ']' : '';
      var dateStr = entry.at ? fmtDate(entry.at) : '';
      return (i > 0 ? '<div class="assign-chain-arrow">↓</div>' : '') +
        '<div class="assign-chain-step">' +
          '<span class="assign-chain-by">' + esc(byName) + '</span>' +
          '<span class="assign-chain-sep"> → </span>' +
          '<span class="assign-chain-to">' + (toNames.length ? toNames.map(esc).join(', ') : '—') + esc(teamStr) + '</span>' +
          (dateStr ? '<span class="assign-chain-date">' + esc(dateStr) + '</span>' : '') +
        '</div>';
    }).join('') +
  '</div>';
}

// Full assignment chain for a task:
// - Admin/Super Admin: shows the project-level chain then the task-level chain
//   so they see the complete path: SA→TC (project) then TC→TM (task/sub-task).
// - Everyone else: shows only the task's own direct chain.
function _renderTaskAssignChain(task) {
  var html = '';
  // Show project-level assignment history for all users
  if (task.Proj_ID) {
    var proj = findProj(task.Proj_ID);
    if (proj && proj.Assignment_History) {
      html += _renderAssignChain(proj.Assignment_History, 'Project Assignment');
    }
  }
  html += _renderAssignChain(task.Assignment_History, 'Task Assignment');
  return html;
}

function _parseHours(v) {
  if (!v) return 0;
  var s = String(v);
  // GAS stores numeric 0 as a date artifact "1899-12-30..."
  if (s.indexOf('1899-12-30') !== -1) return 0;
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function fmtDate(v) {
  if (!v) return '—';
  var d = new Date(v);
  return isNaN(d.getTime()) ? String(v).substring(0, 10) : d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function deadlineHtml(due, status) {
  if (!due) return '<span class="tc-deadline unscheduled">Unscheduled</span>';
  // Closed tasks (Done/Cancelled/Implemented/Completed) — plain muted date, no overdue badge
  if (status && _isClosed(status)) {
    return '<span class="tc-deadline ok" style="opacity:0.55">' + fmtDate(due) + '</span>';
  }
  var today = new Date(); today.setHours(0,0,0,0);
  var d     = new Date(due); d.setHours(0,0,0,0);
  var diff  = Math.round((d - today) / 86400000);
  var cls_  = diff < 0 ? 'tc-deadline' : diff <= 3 ? 'tc-deadline warn' : 'tc-deadline ok';
  var label = diff < 0  ? '⚠ Overdue ' + fmtDate(due) :
              diff === 0 ? '🔴 Today' :
              diff <= 3  ? '🟠 ' + fmtDate(due) :
                           '🟢 ' + fmtDate(due);
  return '<span class="' + cls_ + '">' + label + '</span>';
}

function pill(s) {
  if (!s) return '<span class="pill pill-none">—</span>';
  var cls = String(s).replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'');
  return '<span class="pill pill-' + cls + '">' + esc(s) + '</span>';
}
function badge(s){ return '<span class="badge badge-' + String(s||'').toLowerCase() + '">' + esc(s) + '</span>'; }

function emptyState(title, sub) {
  return '<div class="empty-state"><div class="ei material-symbols-outlined">inbox</div><p><strong>' + esc(title) + '</strong>' +
    (sub ? '<br>' + esc(sub) : '') + '</p></div>';
}

function toast(msg, type) {
  var d = document.createElement('div');
  d.className = 'toast' + (type ? ' ' + type : '');
  d.textContent = msg;
  el('toasts').appendChild(d);
  setTimeout(function() { d.remove(); }, 3500);
}

function _ocRolePri(r) { return _OC_ROLE_PRIORITY[r] || 99; }

var _ocExpanded = {};
var _ocTeamNodes = [];
var _ocParentOf = {};         // childId → parentId
var _ocSiblingExpanded = {};  // parentId → currently-expanded childId

// ── Zoom / Pan state ──
var _ocZoom = 1, _ocPanX = 0, _ocPanY = 0;
var _ocDrag = false, _ocDragSX = 0, _ocDragSY = 0, _ocDragPX = 0, _ocDragPY = 0;
var _ocListenersAttached = false;

function _ocApplyTransform(animate) {
  var vp = el('oc-viewport');
  if (!vp) return;
  vp.style.transition = animate ? 'transform 0.25s ease' : 'none';
  vp.style.transform = 'translate(' + _ocPanX + 'px,' + _ocPanY + 'px) scale(' + _ocZoom + ')';
  var label = el('oc-zoom-label');
  if (label) label.textContent = Math.round(_ocZoom * 100) + ' %';
}

function ocZoom(dir) {
  var wrap = el('org-chart-wrap');
  if (!wrap) return;
  var rect = wrap.getBoundingClientRect();
  var cx = rect.width / 2, cy = rect.height / 2;
  var newZ = Math.max(0.2, Math.min(3, _ocZoom + dir * 0.15));
  var ratio = newZ / _ocZoom;
  _ocPanX = cx - ratio * (cx - _ocPanX);
  _ocPanY = cy - ratio * (cy - _ocPanY);
  _ocZoom = Math.round(newZ * 100) / 100;
  _ocApplyTransform(true);
}

function ocResetView() {
  var vp = el('oc-viewport');
  var wrap = el('org-chart-wrap');
  if (!vp || !wrap) { _ocZoom = 1; _ocPanX = 0; _ocPanY = 0; _ocApplyTransform(true); return; }
  // Temporarily remove transform to measure natural content size
  vp.style.transition = 'none';
  vp.style.transform = 'translate(0,0) scale(1)';
  // Measure the full viewport (including its padding) — this is what gets scaled
  var vpW = vp.scrollWidth;
  var vpH = vp.scrollHeight;
  var wW = wrap.clientWidth;
  var wH = wrap.clientHeight;
  var fitZoom = Math.min(wW / (vpW || 1), wH / (vpH || 1), 1);
  fitZoom = Math.max(0.2, Math.round(fitZoom * 100) / 100);
  _ocZoom = fitZoom;
  _ocPanX = (wW - vpW * fitZoom) / 2;
  _ocPanY = (wH - vpH * fitZoom) / 2;
  requestAnimationFrame(function() { _ocApplyTransform(true); });
}

function ocFindMe() {
  var myTeam = (APP.currentUser && APP.currentUser.team) || '';
  if (!myTeam) { ocResetView(); return; }
  // Find the team card element
  var idx = -1;
  _ocTeamNodes.forEach(function(n, i) { if (n.name === myTeam) idx = i; });
  if (idx === -1) { ocResetView(); return; }
  // Expand root if needed, then highlight the team
  if (!_ocExpanded['root']) _ocToggle('root');
  var card = el('oc-card-root_' + idx);
  var wrap = el('org-chart-wrap');
  var vp = el('oc-viewport');
  if (!card || !wrap || !vp) return;
  // Temporarily reset transform to get un-scaled coords
  vp.style.transition = 'none';
  vp.style.transform = 'translate(0,0) scale(1)';
  var cRect = card.getBoundingClientRect();
  var wRect = wrap.getBoundingClientRect();
  var cardCX = cRect.left + cRect.width / 2 - wRect.left;
  var cardCY = cRect.top + cRect.height / 2 - wRect.top;
  _ocZoom = 1;
  _ocPanX = wRect.width / 2 - cardCX;
  _ocPanY = wRect.height / 2 - cardCY;
  _ocApplyTransform(true);
  // Highlight with brief animation
  card.style.boxShadow = '0 0 0 3px #1a73e8, 0 4px 20px rgba(26,115,232,.3)';
  setTimeout(function() { card.style.boxShadow = ''; }, 2000);
}

function _ocOnWheel(e) {
  e.preventDefault();
  // Scroll = pan; Ctrl+Scroll = zoom
  if (e.ctrlKey || e.metaKey) {
    var delta = e.deltaY > 0 ? -0.08 : 0.08;
    var newZ = Math.max(0.2, Math.min(3, _ocZoom + delta));
    var wrap = el('org-chart-wrap');
    var rect = wrap.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var ratio = newZ / _ocZoom;
    _ocPanX = mx - ratio * (mx - _ocPanX);
    _ocPanY = my - ratio * (my - _ocPanY);
    _ocZoom = Math.round(newZ * 100) / 100;
  } else {
    _ocPanX -= e.deltaX || 0;
    _ocPanY -= e.deltaY || 0;
  }
  _ocApplyTransform(false);
}

function _ocOnMouseDown(e) {
  // Allow clicks on buttons/links inside the chart
  if (e.target.closest('button, a, .oc-xbtn, .oc-zoom-bar')) return;
  if (e.button !== 0) return;
  _ocDrag = true; _ocDragSX = e.clientX; _ocDragSY = e.clientY;
  _ocDragPX = _ocPanX; _ocDragPY = _ocPanY;
  el('org-chart-wrap').classList.add('oc-dragging');
  e.preventDefault();
}
function _ocOnMouseMove(e) {
  if (!_ocDrag) return;
  _ocPanX = _ocDragPX + (e.clientX - _ocDragSX);
  _ocPanY = _ocDragPY + (e.clientY - _ocDragSY);
  _ocApplyTransform(false);
}
function _ocOnMouseUp() {
  if (!_ocDrag) return;
  _ocDrag = false;
  var w = el('org-chart-wrap');
  if (w) w.classList.remove('oc-dragging');
}

function _ocAttachListeners() {
  if (_ocListenersAttached) return;
  var wrap = el('org-chart-wrap');
  if (!wrap) return;
  wrap.addEventListener('wheel', _ocOnWheel, { passive: false });
  wrap.addEventListener('mousedown', _ocOnMouseDown);
  window.addEventListener('mousemove', _ocOnMouseMove);
  window.addEventListener('mouseup', _ocOnMouseUp);
  // Touch support for mobile
  wrap.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1 || e.target.closest('button, a, .oc-xbtn, .oc-zoom-bar')) return;
    _ocDrag = true; _ocDragSX = e.touches[0].clientX; _ocDragSY = e.touches[0].clientY;
    _ocDragPX = _ocPanX; _ocDragPY = _ocPanY;
  }, { passive: true });
  wrap.addEventListener('touchmove', function(e) {
    if (!_ocDrag || e.touches.length !== 1) return;
    _ocPanX = _ocDragPX + (e.touches[0].clientX - _ocDragSX);
    _ocPanY = _ocDragPY + (e.touches[0].clientY - _ocDragSY);
    _ocApplyTransform(false);
    e.preventDefault();
  }, { passive: false });
  wrap.addEventListener('touchend', function() { _ocDrag = false; });
  _ocListenersAttached = true;
}

function renderOrgChart() {
  _ocExpanded = {};
  _ocParentOf = {};
  _ocSiblingExpanded = {};
  _ocZoom = 1; _ocPanX = 0; _ocPanY = 0;
  var container = el('org-chart-container');
  if (!container) return;
  container.innerHTML = '<div style="text-align:center;padding:48px 0;color:var(--muted)">' +
    '<span class="material-symbols-outlined" style="font-size:36px;display:block;margin-bottom:8px">hourglass_empty</span>Loading org chart…</div>';

  google.script.run
    .withSuccessHandler(function(r) {
      if (!r.ok) {
        container.innerHTML = '<p style="color:var(--danger);padding:24px">Error: ' + esc(r.error || 'Failed to load') + '</p>';
        return;
      }
      _buildOrgChart(r.employees);
    })
    .withFailureHandler(function(err) {
      container.innerHTML = '<p style="color:var(--danger);padding:24px">Error: ' + esc(err.message) + '</p>';
    })
    .getOrgChartData();
}

function _buildOrgChart(employees) {
  _ocExpanded = {};
  _ocParentOf = {};
  _ocSiblingExpanded = {};

  // ── Group employees: team → subDept → []
  var teamMap = {};
  employees.forEach(function(e) {
    var d = e.team    || 'Other';
    var s = e.subDept || '';
    if (!teamMap[d]) teamMap[d] = {};
    if (!teamMap[d][s]) teamMap[d][s] = [];
    teamMap[d][s].push(e);
  });

  // ── Build team nodes: ALL from TEAM_HIERARCHY + any extra from data
  // Never skip a team/sub-dept even if it has 0 employees
  var teamOrder = Object.keys(TEAM_HIERARCHY).concat(
    Object.keys(teamMap).filter(function(d) { return !(d in TEAM_HIERARCHY); })
  );

  _ocTeamNodes = teamOrder.map(function(teamName) {
    var subMap = teamMap[teamName] || {};
    var color  = _OC_TEAM_COLORS[teamName] || '#455a64';

    // Employees whose Sub_Department is blank → direct team members
    var teamDirectEmps = subMap[''] || [];

    // Sub-dept order: all from TEAM_HIERARCHY (even empty) + extras from data
    var predefined = TEAM_HIERARCHY[teamName] || [];
    var extraSubs  = Object.keys(subMap).filter(function(s) {
      return s !== '' && predefined.indexOf(s) === -1;
    });
    var subOrder = predefined.concat(extraSubs);

    var subNodes = subOrder.map(function(subName) {
      var subEmps = subMap[subName] || [];
      var sorted  = subEmps.slice().sort(function(a, b) { return _ocRolePri(a.role) - _ocRolePri(b.role); });
      var subHead   = sorted[0] || null;
      var subDeputy = sorted[1] && sorted[1].name !== (subHead ? subHead.name : '') ? sorted[1] : null;
      return {
        name:    subName,
        head:    subHead   ? subHead.name   : '',
        role:    subHead   ? subHead.role   : '',
        deputy:  subDeputy ? subDeputy.name : '',
        count:   subEmps.length,
        color:   color,
        members: subEmps.map(function(e) { return e.name + ' (' + e.role + ')'; }),
        children: []
      };
    });

    // Team head: highest-priority role across all members in this team
    var allInTeam = [];
    Object.keys(subMap).forEach(function(s) { allInTeam = allInTeam.concat(subMap[s]); });
    var teamHead = _ocTopByRole(allInTeam);

    return {
      name:     teamName,
      head:     teamHead ? teamHead.name : '',
      role:     teamHead ? teamHead.role : '',
      count:    allInTeam.length,
      color:    color,
      members:  teamDirectEmps.map(function(e) { return e.name + ' (' + e.role + ')'; }),
      children: subNodes
    };
  });

  var root = {
    name: 'Leveraged Growth', role: 'Company', head: '', count: employees.length,
    color: '#1a237e', isRoot: true, children: _ocTeamNodes
  };

  var container = el('org-chart-container');
  container.innerHTML = '';
  var tree = document.createElement('div');
  tree.className = 'oc-tree';
  tree.id = 'oc-tree-inner';
  container.appendChild(tree);

  // Root card
  var rootWrap = document.createElement('div');
  rootWrap.className = 'oc-root-wrap';
  rootWrap.innerHTML = _ocRenderCard(root, 'root');
  tree.appendChild(rootWrap);

  // Pre-build ALL flat rows (each level as sibling, never nested)
  _ocBuildFlatRows(tree, root, 'root');
  _ocRenderLegend();
  _ocAttachListeners();
  _ocApplyTransform(false);
  _ocToggle('root'); // auto-expand root to show teams
  // Auto-fit after layout settles
  requestAnimationFrame(function() { requestAnimationFrame(function() { ocResetView(); }); });
}

// Returns initials (up to 2 chars) from a full name
function _ocInitials(name) {
  if (!name) return '?';
  var parts = name.trim().split(/\s+/);
  return (parts.length >= 2 ? parts[0][0] + parts[parts.length-1][0] : parts[0].substring(0,2)).toUpperCase();
}

// Lightens a hex color by factor (0–1) for avatar backgrounds
function _ocLighten(hex, factor) {
  factor = factor || 0.82;
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgb('+Math.round(r+(255-r)*factor)+','+Math.round(g+(255-g)*factor)+','+Math.round(b+(255-b)*factor)+')';
}

// Recursively pre-build every expandable group as a sibling <ul> in the tree.
// This means the team row NEVER changes when a child row appears — no width/height shifts.
function _ocBuildFlatRows(tree, node, id) {
  if (!node.children || !node.children.length) return;

  var row = document.createElement('ul');
  row.className = 'oc-flat-row';
  row.id = 'oc-ul-' + id;

  node.children.forEach(function(child, i) {
    var childId = id + '_' + i;
    _ocParentOf[childId] = id;   // record parent so toggle can find siblings
    var li = document.createElement('li');
    li.id = 'oc-li-' + childId;
    li.innerHTML = _ocRenderCard(child, childId);
    // Member panel lives inside the li (leaf only)
    if (!child.children || !child.children.length) {
      li.innerHTML += _ocRenderMemPanel(child, childId);
    }
    row.appendChild(li);
  });

  tree.appendChild(row);

  // Recurse for grandchildren — their rows also go straight into tree
  node.children.forEach(function(child, i) {
    _ocBuildFlatRows(tree, child, id + '_' + i);
  });
}

// Renders the card HTML string for a node
function _ocRenderCard(node, id) {
  var hasChildren = node.children && node.children.length > 0;
  var hasMembers  = node.members  && node.members.length > 0;
  var hasDeputies = node.deputies && node.deputies.length > 0;
  var color       = node.color || '#455a64';
  var html = '<div class="oc-node"><div class="oc-card' + (node.isRoot ? ' oc-root-card' : '') + '" id="oc-card-' + id + '">';

  // Avatar + name/head/role
  html += '<div class="oc-ct">';
  if (node.isRoot) {
    html += '<div class="oc-av" style="background:#d0f0ec;color:#00897b"><span class="material-symbols-outlined" style="font-size:20px">corporate_fare</span></div>';
  } else if (node.head) {
    html += '<div class="oc-av" style="background:' + _ocLighten(color) + ';color:' + color + '">' + _ocInitials(node.head) + '</div>';
  } else {
    html += '<div class="oc-av" style="background:#f1f3f4;color:#9aa0a6"><span class="material-symbols-outlined" style="font-size:18px">group</span></div>';
  }
  html += '<div class="oc-ci">';
  html += '<div class="oc-name">' + esc(node.name) + '</div>';
  if (node.head) html += '<div class="oc-head">' + esc(node.head) + '</div>';
  if (node.role && !node.isRoot) html += '<div class="oc-role">' + esc(node.role) + '</div>';
  html += '</div></div>'; // /oc-ci /oc-ct

  // Employee count
  html += '<div class="oc-es"><div class="oc-el">Employees</div>';
  html += '<div class="oc-ec">' + (node.count || 0) + ' ' + (node.count === 1 ? 'employee' : 'employees') + '</div></div>';

  // Deputies
  if (node.deputy) {
    html += '<div class="oc-ds"><div class="oc-dl">Deputy supervisor</div>';
    html += '<div class="oc-dr"><div class="oc-dav">' + _ocInitials(node.deputy) + '</div><div class="oc-dn">' + esc(node.deputy) + '</div></div></div>';
  }
  if (hasDeputies) {
    html += '<div class="oc-ds"><div class="oc-dl">Deputy supervisors</div>';
    node.deputies.forEach(function(d) {
      html += '<div class="oc-dr"><div class="oc-dav">' + _ocInitials(d) + '</div><div class="oc-dn">' + esc(d) + '</div></div>';
    });
    html += '</div>';
  }

  // Expand button — label depends on node level:
  //   Root        → "X teams"
  //   Team (L1)   → "X departments" or "no departments"
  //   Dept (L2+)  → "X members" or "no members"
  var isTeamLevel = !node.isRoot && id.split('_').length === 2; // e.g. "root_0"
  if (hasChildren || node.isRoot) {
    var cnt = node.children ? node.children.length : 0;
    var childLabel = node.isRoot ? (cnt + ' team' + (cnt !== 1 ? 's' : ''))
                                 : (cnt + ' department' + (cnt !== 1 ? 's' : ''));
    html += '<button class="oc-xbtn" id="oc-btn-' + id + '" onclick="_ocToggle(\'' + id + '\')">';
    html += '<span>' + childLabel + '</span>';
    html += '<span class="material-symbols-outlined" id="oc-tog-' + id + '" style="font-size:16px">expand_more</span></button>';
  } else if (isTeamLevel) {
    // Team with no departments — show "no departments" but allow expanding members if any
    var teamLbl = hasMembers ? node.count + ' member' + (node.count !== 1 ? 's' : '') : 'no departments';
    html += '<button class="oc-xbtn' + (!hasMembers ? ' oc-nosub' : '') + '" id="oc-btn-' + id + '"' +
            (hasMembers ? ' onclick="_ocToggle(\'' + id + '\')"' : '') + '>';
    html += '<span>' + teamLbl + '</span>';
    if (hasMembers) html += '<span class="material-symbols-outlined" id="oc-tog-' + id + '" style="font-size:16px">expand_more</span>';
    html += '</button>';
  } else {
    // Department leaf — show member count
    var mLabel = hasMembers ? node.count + ' member' + (node.count !== 1 ? 's' : '') : 'no members';
    html += '<button class="oc-xbtn' + (!hasMembers ? ' oc-nosub' : '') + '" id="oc-btn-' + id + '"' +
            (hasMembers ? ' onclick="_ocToggle(\'' + id + '\')"' : '') + '>';
    html += '<span>' + mLabel + '</span>';
    if (hasMembers) html += '<span class="material-symbols-outlined" id="oc-tog-' + id + '" style="font-size:16px">expand_more</span>';
    html += '</button>';
  }

  html += '</div></div>'; // /oc-card /oc-node
  return html;
}

// Renders the collapsible member panel (leaf nodes only)
function _ocRenderMemPanel(node, id) {
  var html = '<div class="oc-members-panel" id="oc-mem-' + id + '">';
  if (node.members && node.members.length) {
    node.members.forEach(function(m) {
      var parts = m.split(' ('), mName = parts[0], mRole = parts[1] ? parts[1].replace(')', '') : '';
      html += '<div class="oc-member-item"><div class="oc-mav">' + _ocInitials(mName) + '</div>';
      html += '<div><div class="oc-mn">' + esc(mName) + '</div>';
      if (mRole) html += '<div class="oc-mr">' + esc(mRole) + '</div>';
      html += '</div></div>';
    });
  } else {
    html += '<div style="font-size:11px;color:#9ca3af;padding:10px 0;text-align:center">No members assigned yet</div>';
  }
  html += '</div>';
  return html;
}

// Collapse a node and all its expanded descendants recursively
function _ocCollapseTree(id) {
  if (!_ocExpanded[id]) return;
  _ocExpanded[id] = false;
  var ul  = el('oc-ul-'  + id);
  var mem = el('oc-mem-' + id);
  var tog = el('oc-tog-' + id);
  if (ul)  { ul.style.display = 'none'; ul.style.marginLeft = ''; ul.style.alignSelf = ''; }
  if (mem) { mem.classList.remove('show'); }
  if (tog) { tog.textContent = 'expand_more'; }
  // Collapse the child that was expanded under this node (if any)
  var expandedChild = _ocSiblingExpanded[id];
  if (expandedChild) {
    _ocCollapseTree(expandedChild);
    delete _ocSiblingExpanded[id];
  }
}

// Centers a child row under its parent card, accounting for current zoom level
function _ocPositionRow(ul, id) {
  var parentCard = el('oc-card-' + id);
  var tree = el('oc-tree-inner');
  if (!parentCard || !tree) return;
  var z = _ocZoom || 1;
  var pRect = parentCard.getBoundingClientRect();
  var tRect = tree.getBoundingClientRect();
  var parentCenterX = (pRect.left + pRect.width / 2 - tRect.left) / z;
  var rowW  = ul.scrollWidth;
  var treeW = tree.scrollWidth;
  var ideal = parentCenterX - rowW / 2;
  var marginLeft = Math.max(0, Math.min(treeW - rowW, ideal));
  ul.style.alignSelf = 'flex-start';
  ul.style.marginLeft = marginLeft + 'px';
  ul.style.setProperty('--oc-conn-x', (parentCenterX - marginLeft) + 'px');
}

function _ocToggle(id) {
  // If in nested (expand-all) mode, exit it first by collapsing back to flat layout
  var tree = el('oc-tree-inner');
  if (tree && tree.classList.contains('oc-nested-mode')) {
    tree.classList.remove('oc-nested-mode');
    var rows = Array.from(document.querySelectorAll('.oc-flat-row'));
    rows.forEach(function(ul) {
      if (ul.parentElement !== tree) tree.appendChild(ul);
      ul.style.display = 'none';
      ul.style.marginLeft = '';
      ul.style.alignSelf = '';
      ul.style.removeProperty('--oc-conn-x');
    });
    Object.keys(_ocExpanded).forEach(function(k) {
      if (k !== 'root') {
        _ocExpanded[k] = false;
        var t2 = el('oc-tog-' + k); if (t2) t2.textContent = 'expand_more';
        var m2 = el('oc-mem-' + k); if (m2) m2.classList.remove('show');
      }
    });
    _ocSiblingExpanded = {};
    // Keep root expanded
    var rootUl = el('oc-ul-root');
    if (rootUl) rootUl.style.display = 'flex';
  }

  var willExpand = !_ocExpanded[id];

  // ── Single-expansion: collapse the previous sibling at this level ──────────
  var parentId = _ocParentOf[id];
  if (parentId !== undefined) {
    var prevSibling = _ocSiblingExpanded[parentId];
    if (prevSibling && prevSibling !== id) {
      _ocCollapseTree(prevSibling);
    }
    if (willExpand) {
      _ocSiblingExpanded[parentId] = id;
    } else {
      delete _ocSiblingExpanded[parentId];
    }
  }

  _ocExpanded[id] = willExpand;

  var ul  = el('oc-ul-'  + id);
  var mem = el('oc-mem-' + id);
  var tog = el('oc-tog-' + id);

  if (ul) {
    ul.style.display = willExpand ? 'flex' : 'none';
    if (willExpand && parentId !== undefined) {
      requestAnimationFrame(function() { _ocPositionRow(ul, id); });
    } else if (!willExpand) {
      ul.style.marginLeft = '';
      ul.style.alignSelf = '';
    }
  }
  if (mem) mem.classList.toggle('show', willExpand);
  if (tog) tog.textContent = willExpand ? 'expand_less' : 'expand_more';
}

function orgExpandAll() {
  var tree = el('oc-tree-inner');
  if (tree) tree.classList.add('oc-nested-mode');

  // Expand root row (teams)
  _ocExpanded['root'] = true;
  var rootUl = el('oc-ul-root');
  if (rootUl) {
    rootUl.style.display = 'flex';
    rootUl.style.marginLeft = '';
    rootUl.style.alignSelf = '';
    rootUl.style.removeProperty('--oc-conn-x');
  }
  var rootTog = el('oc-tog-root');
  if (rootTog) rootTog.textContent = 'expand_less';

  // Nest each child UL inside its parent LI and expand
  _ocNestExpand(_ocTeamNodes, 'root');
}

function _ocNestExpand(children, parentId) {
  if (!children) return;
  children.forEach(function(child, i) {
    var childId = parentId + '_' + i;

    // Nest child UL inside parent LI so it sits visually beneath its own card
    var childUl = el('oc-ul-' + childId);
    var parentLi = el('oc-li-' + childId);
    if (childUl && parentLi && childUl.parentElement !== parentLi) {
      parentLi.appendChild(childUl);
    }
    if (childUl) {
      _ocExpanded[childId] = true;
      childUl.style.display = 'flex';
      childUl.style.marginLeft = '';
      childUl.style.alignSelf = '';
      childUl.style.removeProperty('--oc-conn-x');
      var tog = el('oc-tog-' + childId);
      if (tog) tog.textContent = 'expand_less';
    }

    // Show member panels for leaf nodes
    var mem = el('oc-mem-' + childId);
    if (mem) {
      _ocExpanded[childId] = true;
      mem.classList.add('show');
      var mtog = el('oc-tog-' + childId);
      if (mtog) mtog.textContent = 'expand_less';
    }

    _ocNestExpand(child.children, childId);
  });
}

function orgCollapseAll() {
  // Reset all state
  _ocSiblingExpanded = {};

  // Move all nested ULs back to tree root (restore flat layout)
  var tree = el('oc-tree-inner');
  if (tree) {
    tree.classList.remove('oc-nested-mode');
    var rows = Array.from(document.querySelectorAll('.oc-flat-row'));
    rows.forEach(function(ul) {
      if (ul.parentElement !== tree) tree.appendChild(ul);
      ul.style.display = 'none';
      ul.style.marginLeft = '';
      ul.style.alignSelf = '';
      ul.style.removeProperty('--oc-conn-x');
    });
  }

  // Reset all expanded flags and toggle icons
  Object.keys(_ocExpanded).forEach(function(id) {
    _ocExpanded[id] = false;
    var tog = el('oc-tog-' + id);
    if (tog) tog.textContent = 'expand_more';
    var mem = el('oc-mem-' + id);
    if (mem) mem.classList.remove('show');
  });

  // Re-expand just root to show teams
  _ocToggle('root');
}

function _ocRenderLegend() {
  var html = '';
  _ocTeamNodes.forEach(function(d) {
    html += '<div class="oc-legend-item"><div class="oc-legend-dot" style="background:' + d.color + '"></div>' + esc(d.name) + '</div>';
  });
  var legend = el('oc-legend');
  if (legend) legend.innerHTML = html;
}

function renderForms() {
  var myL = el('forms-my-list');
  if(myL) myL.innerHTML = '<div class="forms-empty"><span class="material-symbols-outlined" style="font-size:24px;color:var(--muted);display:block;margin-bottom:4px">hourglass_empty</span>Loading forms…</div>';
  google.script.run.withSuccessHandler(function(r) {
    if(!r || r.needsAuth) { _gfShowConnect(); return; }
    if(!r.ok) { _gfShowConnect(); return; }
    FORMS_DATA = (r.forms || []).map(function(f) {
      return { Form_ID: f.id, Title: f.name, Created_At: f.createdTime, Modified_At: f.modifiedTime };
    });
    _gfRenderList();
  }).withFailureHandler(function() { _gfShowConnect(); })
  .gfListMyForms(APP.currentUser.email);
}
function _gfShowConnect() {
  var myL = el('forms-my-list');
  if(myL) myL.innerHTML = '<div class="forms-empty"><span class="material-symbols-outlined" style="font-size:40px;color:#673ab7;display:block;margin-bottom:8px">description</span>' +
    '<p style="font-weight:500;margin:8px 0 4px">Connect your Google Forms</p>' +
    '<p style="font-size:12px;color:#70757a;margin:0 0 16px">Forms will be created in your own Google account.</p>' +
    '<button class="gf-send-btn" onclick="_gfConnect(this)" style="margin:0 auto">Connect Google Forms</button></div>';
}
function _gfConnect(btn) {
  _btnLoading(btn, 'Connecting…');
  google.script.run.withSuccessHandler(function(r) {
    _btnReset(btn, 'Connect Google Forms');
    if(!r || !r.ok) { toast(r && r.error || 'Failed','error'); return; }
    window.open(r.url, '_blank', 'width=500,height=650');
    toast('Complete authorization in the popup, then click Refresh.','info');
  }).withFailureHandler(function(e) { _btnReset(btn, 'Connect Google Forms'); toast(e.message||'Error','error'); })
  .formsGetAuthUrl(APP.currentUser.email);
}
function _gfRenderList() {
  // Pre-load sharing metadata so _gfRowCard can show current sharing status
  google.script.run.withSuccessHandler(function(r) {
    if (r && r.ok) {
      (r.forms || []).forEach(function(f) { FORMS_META[f.Form_ID] = { Status: f.Status, Visibility: f.Visibility }; });
    }
    var myL = el('forms-my-list');
    if (myL) myL.innerHTML = FORMS_DATA.length ? FORMS_DATA.map(function(f) { return _gfRowCard(f); }).join('') : '<div class="forms-empty"><span class="material-symbols-outlined" style="font-size:40px;color:var(--muted);display:block;margin-bottom:8px">description</span>No forms yet. Click "+ New Form" to create one.</div>';
  }).withFailureHandler(function() {
    var myL = el('forms-my-list');
    if (myL) myL.innerHTML = FORMS_DATA.length ? FORMS_DATA.map(function(f) { return _gfRowCard(f); }).join('') : '<div class="forms-empty"><span class="material-symbols-outlined" style="font-size:40px;color:var(--muted);display:block;margin-bottom:8px">description</span>No forms yet.</div>';
  }).gfGetMyFormsMeta(APP.currentUser.email);
  // Load shared forms
  google.script.run.withSuccessHandler(function(r) {
    var shSec = el('forms-shared-section');
    var shL   = el('forms-shared-list');
    if(!shSec || !shL) return;
    var forms = (r && r.ok && r.forms) ? r.forms : [];
    if(!forms.length) { shSec.style.display = 'none'; return; }
    shSec.style.display = '';
    shL.innerHTML = forms.map(function(f) {
      var vis = f.Visibility === 'Team' ? '<span style="font-size:11px;background:#e8f5e9;color:#2e7d32;padding:1px 6px;border-radius:8px">Team</span>' : '<span style="font-size:11px;background:#e3f2fd;color:#1565c0;padding:1px 6px;border-radius:8px">Org</span>';
      return '<div class="form-row-card">' +
        '<div class="form-row-icon" style="background:#7b1fa2"><span class="material-symbols-outlined" style="font-size:20px;color:#fff">description</span></div>' +
        '<div class="form-row-info"><div class="form-row-name">'+esc(f.Title||'Untitled')+' '+vis+'</div>' +
        '<div class="form-row-meta">Shared with you &middot; '+fmtDate(f.Created_At)+'</div></div>' +
        '<div class="form-row-actions">' +
          (f.Responder_URL ? '<a href="'+esc(f.Responder_URL)+'" target="_blank" style="display:inline-flex;align-items:center;padding:4px 10px;background:#7b1fa2;color:#fff;border-radius:16px;font-size:12px;font-weight:500;text-decoration:none;gap:4px"><span class="material-symbols-outlined" style="font-size:14px">edit</span>Fill</a>' : '') +
        '</div></div>';
    }).join('');
  }).withFailureHandler(function() {
    var shSec = el('forms-shared-section'); if(shSec) shSec.style.display = 'none';
  }).gfGetSharedForms(APP.currentUser.email);
}
function _gfRowCard(f) {
  // Shared state: look up current sharing info from FORMS_META if available
  var meta      = (FORMS_META && FORMS_META[f.Form_ID]) || {};
  var isActive  = meta.Status === 'Active';
  var vis       = meta.Visibility || 'All';
  var shareLabel = isActive
    ? '<span style="background:#e8f5e9;color:#2e7d32;font-size:10px;font-weight:600;padding:1px 7px;border-radius:8px;margin-left:6px">' + (vis === 'Team' ? 'Shared · Team' : 'Shared · Org') + '</span>'
    : '<span style="background:#f5f5f5;color:#9ca3af;font-size:10px;font-weight:600;padding:1px 7px;border-radius:8px;margin-left:6px">Draft</span>';
  return '<div class="form-row-card" onclick="gfOpenForm(\''+esc(f.Form_ID)+'\')">' +
    '<div class="form-row-icon" style="background:#673ab7"><span class="material-symbols-outlined" style="font-size:20px;color:#fff">description</span></div>' +
    '<div class="form-row-info"><div class="form-row-name">'+esc(f.Title||'Untitled')+shareLabel+'</div>' +
    '<div class="form-row-meta">'+(f.responseCount||0)+' responses &middot; '+fmtDate(f.Created_At)+'</div></div>' +
    '<div class="form-row-actions">' +
      '<button onclick="event.stopPropagation();_gfOpenShareModal(\''+esc(f.Form_ID)+'\',\''+esc(f.Title||'Untitled')+'\')" title="Share to Notice Board" style="color:#1a73e8"><span class="material-symbols-outlined" style="font-size:18px">share</span></button>' +
      '<button onclick="event.stopPropagation();window.open(\''+esc(f.editUrl||'')+'\',\'_blank\')" title="Edit in Google Forms"><span class="material-symbols-outlined" style="font-size:18px">open_in_new</span></button>' +
      '<button onclick="event.stopPropagation();_gfDeleteForm(\''+esc(f.Form_ID)+'\')" title="Delete"><span class="material-symbols-outlined" style="font-size:18px">delete</span></button>' +
    '</div></div>';
}

// ── Form Share Modal ──────────────────────────────────────────────────────────
var FORMS_META = {}; // Form_ID → { Status, Visibility } cached from sheet

function _gfOpenShareModal(formId, title) {
  var meta  = FORMS_META[formId] || {};
  var modal = el('gf-share-modal');
  if (!modal) return;
  el('gf-share-title').textContent = title;
  el('gf-share-formid').value      = formId;
  el('gf-share-vis').value         = meta.Visibility || 'All';
  // Toggle button label
  var isActive = meta.Status === 'Active';
  var btn = el('gf-share-post-btn');
  btn.textContent = isActive ? 'Update Sharing' : 'Post to Notice Board';
  btn.style.background = isActive ? '#1558b0' : '#1a73e8';
  el('gf-unshare-btn').style.display = isActive ? '' : 'none';
  modal.classList.remove('hidden');
}

function _gfSubmitShare(btn) {
  var formId = el('gf-share-formid').value;
  var vis    = el('gf-share-vis').value;
  _btnLoading(btn, 'Sharing…');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn, 'Post to Notice Board');
      if (!r || !r.ok) { toast(r && r.error || 'Failed to share.', 'error'); return; }
      FORMS_META[formId] = { Status: 'Active', Visibility: vis };
      toast('Form shared on Notice Board (' + (vis === 'Team' ? 'Team only' : 'Organisation') + ')!', 'success');
      el('gf-share-modal').classList.add('hidden');
      _gfRenderList();
    })
    .withFailureHandler(function(e) { _btnReset(btn, 'Post to Notice Board'); toast(e.message || 'Error', 'error'); })
    .gfSetFormSharing(formId, vis, true, APP.currentUser.email);
}

function _gfUnshare(btn) {
  var formId = el('gf-share-formid').value;
  if (!confirm('Remove this form from the Notice Board?')) return;
  _btnLoading(btn, 'Removing…');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn, 'Remove from Board');
      if (!r || !r.ok) { toast(r && r.error || 'Failed.', 'error'); return; }
      FORMS_META[formId] = { Status: 'Closed', Visibility: 'All' };
      toast('Form removed from Notice Board.', 'success');
      el('gf-share-modal').classList.add('hidden');
      _gfRenderList();
    })
    .withFailureHandler(function(e) { _btnReset(btn, 'Remove from Board'); toast(e.message || 'Error', 'error'); })
    .gfSetFormSharing(formId, 'All', false, APP.currentUser.email);
}

// ── Create / Open ────────────────────────────────────────────────────────────
function gfNewForm(tpl) {
  var t = tpl ? GF_TEMPLATES[tpl] : null;
  gfState = {
    formId: null, title: t ? t.title : 'Untitled form', description: t ? t.desc : '',
    questions: t ? t.qs.map(function(q,i){return Object.assign({id:'q_'+Date.now()+'_'+i},q);}) : [],
    focusIdx: -1,
    settings: { collectEmail:false, limitOne:false, visibility:'All', status:'Draft' }
  };
  _gfOpenEditor();
}
function gfOpenForm(formId) {
  toast('Loading form…','info');
  google.script.run.withSuccessHandler(function(r) {
    if(!r || r.needsAuth) { _gfShowConnect(); navigate('forms'); return; }
    if(!r.ok) { toast(r.error || 'Failed to load','error'); return; }
    var form = r.form;
    gfState = {
      formId: formId,
      title: form.title || 'Untitled form',
      description: form.description || '',
      questions: form.questions || [],
      focusIdx: -1,
      settings: { collectEmail:false, limitOne:false, visibility:'All', status: form.acceptingResponses ? 'Active' : 'Closed' }
    };
    _gfOpenEditor();
  }).withFailureHandler(function(e) { toast(e.message||'Error','error'); })
  .gfGetForm(formId, APP.currentUser.email);
}
function _gfOpenEditor() {
  el('gf-topbar-title').value = gfState.title;
  gfSwitchTab('questions');
  navigate('form-editor');
  _gfRenderQuestions();
}
function gfBackToList() {
  navigate('forms');
}

// ── Tab switching ────────────────────────────────────────────────────────────
function gfSwitchTab(tab) {
  ['questions','responses','settings'].forEach(function(t){
    var b = el('gf-body-'+t); if(b) b.style.display = t===tab ? '' : 'none';
    var tb = el('gf-tab-'+t); if(tb) tb.classList.toggle('active', t===tab);
  });
  if(tab==='questions') _gfRenderQuestions();
  if(tab==='responses') _gfRenderResponses();
  if(tab==='settings') _gfRenderSettings();
}

// ── Render questions (editor) ────────────────────────────────────────────────
function _gfRenderQuestions() {
  var wrap = el('gf-editor-scroll');
  if(!wrap) return;
  // Title card
  var html = '<div class="gf-title-card" onclick="_gfFocus(-1)"><input class="gf-title-input" value="'+esc(gfState.title)+'" placeholder="Untitled form" oninput="gfState.title=this.value;el(\'gf-topbar-title\').value=this.value" onclick="event.stopPropagation()"/><textarea class="gf-desc-input" placeholder="Form description" rows="1" oninput="gfState.description=this.value" onclick="event.stopPropagation()">'+esc(gfState.description)+'</textarea></div>';
  // Questions
  gfState.questions.forEach(function(q, i) {
    var focused = i === gfState.focusIdx;
    var ti = GF_TYPES.find(function(t){return t.id===q.type;}) || {label:q.type,icon:'help'};
    var hasOpts = ['choice','checkbox','dropdown'].indexOf(q.type)!==-1;
    html += '<div class="gf-q-card'+(focused?' gf-focused':'')+'" onclick="_gfFocus('+i+')">';
    html += '<div class="gf-q-body">';
    // Top: question input + type select
    html += '<div class="gf-q-top">';
    html += '<input class="gf-q-title-input" value="'+esc(q.label||'')+'" placeholder="Question" onchange="gfState.questions['+i+'].label=this.value" onclick="event.stopPropagation()"/>';
    if(focused) {
      html += '<select class="gf-q-type-select" onchange="gfState.questions['+i+'].type=this.value;_gfInitType('+i+',this.value);_gfRenderQuestions()" onclick="event.stopPropagation()">';
      GF_TYPES.forEach(function(t){ html += '<option value="'+t.id+'"'+(t.id===q.type?' selected':'')+'>'+t.label+'</option>'; });
      html += '</select>';
    }
    html += '</div>';
    // Options body
    if(hasOpts) {
      html += '<div class="gf-opts">';
      (q.options||[]).forEach(function(opt, oi) {
        var icon = q.type==='checkbox'?'check_box_outline_blank':q.type==='dropdown'?'arrow_right':'radio_button_unchecked';
        html += '<div class="gf-opt-row"><span class="gf-opt-icon"><span class="material-symbols-outlined">'+icon+'</span></span>';
        html += '<input class="gf-opt-input" value="'+esc(opt)+'" onchange="gfState.questions['+i+'].options['+oi+']=this.value" onclick="event.stopPropagation()"/>';
        if(focused) html += '<button class="gf-opt-del" onclick="event.stopPropagation();gfState.questions['+i+'].options.splice('+oi+',1);_gfRenderQuestions()"><span class="material-symbols-outlined" style="font-size:18px">close</span></button>';
        html += '</div>';
      });
      if(focused) {
        html += '<div class="gf-add-opt" onclick="event.stopPropagation();gfState.questions['+i+'].options.push(\'Option \'+(gfState.questions['+i+'].options.length+1));_gfRenderQuestions()">';
        html += '<span class="gf-add-opt-icon"><span class="material-symbols-outlined">'+(q.type==='checkbox'?'check_box_outline_blank':'radio_button_unchecked')+'</span></span>';
        html += '<span>Add option</span></div>';
      }
      html += '</div>';
    }
    if(q.type==='short' && !focused) html += '<div style="padding:4px 12px;color:#dadce0;border-bottom:1px dotted #dadce0;font-size:14px;max-width:50%">Short answer text</div>';
    if(q.type==='long' && !focused) html += '<div style="padding:4px 12px;color:#dadce0;border-bottom:1px dotted #dadce0;font-size:14px">Long answer text</div>';
    if(q.type==='date' && !focused) html += '<div style="padding:8px 12px;color:#70757a;font-size:14px;display:flex;align-items:center;gap:8px"><span>Month, Day, Year</span><span class="material-symbols-outlined" style="font-size:20px">calendar_today</span></div>';
    if(q.type==='time' && !focused) html += '<div style="padding:8px 12px;color:#70757a;font-size:14px;display:flex;align-items:center;gap:8px"><span>Time</span><span class="material-symbols-outlined" style="font-size:20px">schedule</span></div>';
    if(q.type==='scale') {
      html += '<div class="gf-scale-row">';
      html += '<select onchange="gfState.questions['+i+'].min=parseInt(this.value);_gfRenderQuestions()" onclick="event.stopPropagation()">';
      [0,1].forEach(function(v){html+='<option'+(v===(q.min||1)?' selected':'')+'>'+v+'</option>';});
      html += '</select><label>to</label><select onchange="gfState.questions['+i+'].max=parseInt(this.value);_gfRenderQuestions()" onclick="event.stopPropagation()">';
      [2,3,4,5,6,7,8,9,10].forEach(function(v){html+='<option'+(v===(q.max||5)?' selected':'')+'>'+v+'</option>';});
      html += '</select></div>';
      if(focused) html += '<div style="padding:4px 12px;display:flex;gap:12px"><input class="gf-opt-input" placeholder="Label (optional)" value="'+esc(q.minLabel||'')+'" onchange="gfState.questions['+i+'].minLabel=this.value" onclick="event.stopPropagation()" style="max-width:180px"/><input class="gf-opt-input" placeholder="Label (optional)" value="'+esc(q.maxLabel||'')+'" onchange="gfState.questions['+i+'].maxLabel=this.value" onclick="event.stopPropagation()" style="max-width:180px"/></div>';
    }
    html += '</div>'; // /gf-q-body
    // Footer
    if(focused) {
      html += '<div class="gf-q-footer">';
      html += '<button class="gf-q-footer-btn" onclick="event.stopPropagation();_gfDupeQ('+i+')" title="Duplicate"><span class="material-symbols-outlined">content_copy</span></button>';
      html += '<button class="gf-q-footer-btn" onclick="event.stopPropagation();_gfDelQ('+i+')" title="Delete"><span class="material-symbols-outlined">delete</span></button>';
      html += '<div class="gf-q-req-toggle"><span>Required</span><label class="gf-switch"><input type="checkbox" '+(q.required?'checked':'')+' onchange="gfState.questions['+i+'].required=this.checked" onclick="event.stopPropagation()"/><span class="gf-switch-sl"></span></label></div>';
      html += '</div>';
    }
    html += '</div>'; // /gf-q-card
  });
  // Floating toolbar
  html += '<div class="gf-float-toolbar" id="gf-float-toolbar">';
  html += '<button class="gf-float-btn" onclick="_gfAddQ(\'short\')" title="Add question"><span class="material-symbols-outlined">add_circle_outline</span></button>';
  html += '<button class="gf-float-btn" onclick="_gfAddQ(\'section\')" title="Add section"><span class="material-symbols-outlined">view_agenda</span></button>';
  html += '<button class="gf-float-btn" onclick="_gfAddQ(\'choice\')" title="Multiple choice"><span class="material-symbols-outlined">radio_button_checked</span></button>';
  html += '<button class="gf-float-btn" onclick="_gfAddQ(\'checkbox\')" title="Checkboxes"><span class="material-symbols-outlined">check_box</span></button>';
  html += '<button class="gf-float-btn" onclick="_gfAddQ(\'dropdown\')" title="Dropdown"><span class="material-symbols-outlined">arrow_drop_down_circle</span></button>';
  html += '</div>';
  wrap.innerHTML = html;
}

function _gfFocus(idx) {
  if (gfState.focusIdx === idx) return;
  gfState.focusIdx = idx;
  _gfRenderQuestions();
}

function _gfInitType(i, type) {
  var q = gfState.questions[i];
  if(['choice','checkbox','dropdown'].indexOf(type)!==-1 && !q.options) q.options = ['Option 1'];
  if(type==='scale') { q.min=q.min||1; q.max=q.max||5; q.minLabel=q.minLabel||''; q.maxLabel=q.maxLabel||''; }
}
function _gfAddQ(type) {
  var q = {id:'q_'+Date.now(),type:type,label:'',required:false};
  if(['choice','checkbox','dropdown'].indexOf(type)!==-1) q.options=['Option 1'];
  if(type==='scale'){q.min=1;q.max=5;q.minLabel='';q.maxLabel='';}
  var idx = gfState.focusIdx >= 0 ? gfState.focusIdx + 1 : gfState.questions.length;
  gfState.questions.splice(idx,0,q);
  gfState.focusIdx = idx;
  _gfRenderQuestions();
}
function _gfDelQ(i){ gfState.questions.splice(i,1); gfState.focusIdx=Math.min(gfState.focusIdx,gfState.questions.length-1); _gfRenderQuestions(); }
function _gfDupeQ(i){ var c=JSON.parse(JSON.stringify(gfState.questions[i])); c.id='q_'+Date.now(); gfState.questions.splice(i+1,0,c); gfState.focusIdx=i+1; _gfRenderQuestions(); }

// ── Undo/Redo (simple snapshot) ──────────────────────────────────────────────
var _gfHistory=[],_gfHistoryIdx=-1;
function gfUndo(){ if(_gfHistoryIdx>0){_gfHistoryIdx--;gfState.questions=JSON.parse(_gfHistory[_gfHistoryIdx]);_gfRenderQuestions();} }
function gfRedo(){ if(_gfHistoryIdx<_gfHistory.length-1){_gfHistoryIdx++;gfState.questions=JSON.parse(_gfHistory[_gfHistoryIdx]);_gfRenderQuestions();} }
function _gfSnapshot(){ var s=JSON.stringify(gfState.questions); _gfHistory=_gfHistory.slice(0,_gfHistoryIdx+1); _gfHistory.push(s); _gfHistoryIdx=_gfHistory.length-1; }

// ── Save / Send ──────────────────────────────────────────────────────────────
function gfSend() {
  _gfSave(function() {
    toast('Form published!','success');
    if(gfState.formId) window.open('https://docs.google.com/forms/d/' + gfState.formId + '/edit', '_blank');
  });
}
function gfPreview() {
  if(gfState.formId) {
    window.open('https://docs.google.com/forms/d/' + gfState.formId + '/viewform', '_blank');
  } else {
    var fakeForm = { Form_ID:'preview', Title:gfState.title, Description:gfState.description, Fields:JSON.stringify(gfState.questions), Status:'Active' };
    _gfOpenFill(fakeForm);
  }
}
function gfSettings() { gfSwitchTab('settings'); }

function _gfSave(cb) {
  if(!gfState.title.trim()){toast('Title is required.','error');return;}
  // Check connection first
  google.script.run.withSuccessHandler(function(connected) {
    if(!connected) {
      toast('Please connect Google Forms first.','error');
      navigate('forms');
      _gfShowConnect();
      return;
    }
    _gfDoSave(cb);
  }).withFailureHandler(function() { _gfDoSave(cb); })
  .formsIsConnected(APP.currentUser.email);
}
function _gfDoSave(cb) {
  toast('Saving to Google Forms…','info');
  if(gfState.formId) {
    google.script.run.withSuccessHandler(function(r) {
      if(!r) { toast('Failed','error'); return; }
      if(r.needsAuth) { toast('Please connect Google Forms first.','error'); navigate('forms'); _gfShowConnect(); return; }
      if(!r.ok){toast(r.error||'Failed','error');return;}
      toast('Form updated!','success');
      if(cb)cb();
    }).withFailureHandler(function(e){toast(e.message||'Error','error');})
    .gfUpdateForm(gfState.formId, gfState.title, gfState.description, JSON.stringify(gfState.questions), JSON.stringify(gfState.settings), APP.currentUser.email);
  } else {
    // Create new form
    google.script.run.withSuccessHandler(function(r) {
      if(!r) { toast('Failed','error'); return; }
      if(r.needsAuth) { toast('Please connect Google Forms first.','error'); navigate('forms'); _gfShowConnect(); return; }
      if(!r.ok){toast(r.error||'Failed','error');return;}
      gfState.formId = r.formId;
      toast('Form created!','success');
      if(cb)cb();
    }).withFailureHandler(function(e){toast(e.message||'Error','error');})
    .gfPublishForm(gfState.title, gfState.description, JSON.stringify(gfState.questions), JSON.stringify(gfState.settings), APP.currentUser.email);
  }
}

// ── Settings tab ─────────────────────────────────────────────────────────────
function _gfRenderSettings() {
  var s = gfState.settings;
  var html = '<div style="background:#fff;border:1px solid #dadce0;border-radius:8px;padding:24px;margin-top:24px">';
  html += '<h3 style="font-size:16px;font-weight:500;color:#202124;margin:0 0 20px">Form Settings</h3>';
  html += '<div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:14px;color:#202124">Collect email addresses</span><label class="gf-switch"><input type="checkbox" '+(s.collectEmail?'checked':'')+' onchange="gfState.settings.collectEmail=this.checked"/><span class="gf-switch-sl"></span></label></div>';
  html += '<div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:14px;color:#202124">Limit to 1 response per person</span><label class="gf-switch"><input type="checkbox" '+(s.limitOne?'checked':'')+' onchange="gfState.settings.limitOne=this.checked"/><span class="gf-switch-sl"></span></label></div>';
  html += '<div style="margin-bottom:16px"><label style="font-size:14px;color:#202124;display:block;margin-bottom:6px">Status</label><select class="gf-q-type-select" style="min-width:200px" onchange="gfState.settings.status=this.value"><option'+(s.status==='Draft'?' selected':'')+'>Draft</option><option'+(s.status==='Active'?' selected':'')+'>Active</option><option'+(s.status==='Closed'?' selected':'')+'>Closed</option></select></div>';
  html += '<div style="margin-bottom:16px"><label style="font-size:14px;color:#202124;display:block;margin-bottom:6px">Visibility</label><select class="gf-q-type-select" style="min-width:200px" onchange="gfState.settings.visibility=this.value"><option value="All"'+(s.visibility==='All'?' selected':'')+'>Everyone in organization</option><option value="Team"'+(s.visibility==='Team'?' selected':'')+'>My team only</option></select></div>';
  html += '<div style="padding-top:12px;border-top:1px solid #dadce0"><button class="gf-send-btn" onclick="_gfSave()" style="background:#1a73e8"><span class="material-symbols-outlined" style="font-size:18px">save</span> Save Settings</button></div>';
  html += '</div>';
  el('gf-settings-content').innerHTML = html;
}

// ── Responses tab ────────────────────────────────────────────────────────────
function _gfRenderResponses() {
  var wrap = el('gf-responses-content');
  if(!wrap) return;
  if(!gfState.formId || gfState.formId === 'preview') {
    wrap.innerHTML='<div class="forms-empty" style="margin-top:40px">Publish the form first to see responses.</div>';
    return;
  }
  wrap.innerHTML = '<div class="forms-empty"><span class="material-symbols-outlined" style="font-size:24px;color:var(--muted);display:block;margin-bottom:4px">hourglass_empty</span>Loading responses…</div>';
  google.script.run.withSuccessHandler(function(r) {
    if(!r||!r.ok) { wrap.innerHTML='<div class="forms-empty">'+esc(r&&r.error||'Failed')+'</div>'; return; }
    var resps = r.responses || [];
    var html = '<div class="gf-resp-summary"><div class="gf-resp-count">'+r.count+'</div><div class="gf-resp-label">response'+(r.count!==1?'s':'')+'</div></div>';
    // Per-question summary
    gfState.questions.forEach(function(q) {
      if(q.type==='section') return;
      var answers = resps.map(function(resp){ return resp.answers[q.label] || ''; }).filter(Boolean);
      if(!answers.length) return;
      html += '<div class="gf-resp-chart"><div class="gf-resp-q">'+esc(q.label)+'</div>';
      if(['choice','checkbox','dropdown','scale'].indexOf(q.type)!==-1) {
        var counts={};
        answers.forEach(function(a){a.split(', ').forEach(function(v){counts[v]=(counts[v]||0)+1;});});
        var total=answers.length;
        Object.keys(counts).forEach(function(k){
          var pct = Math.round(counts[k]/total*100);
          html+='<div class="gf-resp-bar-row"><div class="gf-resp-bar-label" title="'+esc(k)+'">'+esc(k)+'</div><div class="gf-resp-bar"><div class="gf-resp-bar-fill" style="width:'+pct+'%"></div></div><div class="gf-resp-bar-count">'+counts[k]+' ('+pct+'%)</div></div>';
        });
      } else {
        answers.slice(0,10).forEach(function(a){ html+='<div style="padding:6px 0;border-bottom:1px solid #f1f3f4;font-size:13px;color:#202124">'+esc(a)+'</div>'; });
        if(answers.length>10) html+='<div style="padding:6px 0;font-size:13px;color:#70757a">…and '+(answers.length-10)+' more</div>';
      }
      html+='</div>';
    });
    html += '<div style="text-align:center;padding:16px"><a href="https://docs.google.com/forms/d/'+esc(gfState.formId)+'/edit#responses" target="_blank" style="color:#673ab7;font-weight:500;text-decoration:none">View all responses in Google Forms →</a></div>';
    wrap.innerHTML = html;
  }).withFailureHandler(function(e) { wrap.innerHTML='<div class="forms-empty">'+esc(e.message||'Failed')+'</div>'; })
  .gfGetResponses(gfState.formId, APP.currentUser.email);
}

// ── Delete form ──────────────────────────────────────────────────────────────
function _gfDeleteForm(formId) {
  if(!confirm('Delete this form? It will be moved to trash.')) return;
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok) { toast(r&&r.error||'Failed','error'); return; }
    toast('Form deleted.','success'); renderForms();
  }).withFailureHandler(function(e){toast(e.message||'Failed','error');})
  .gfDeleteForm(formId, APP.currentUser.email);
}

// ── Form Fill (respondent view — Google Forms style) ─────────────────────────
function _gfOpenFill(form) {
  var qs=[]; try{qs=JSON.parse(form.Fields||'[]');}catch(e){}
  var html = '<div class="ff-title-card"><div class="ff-title">'+esc(form.Title)+'</div>';
  if(form.Description) html+='<div class="ff-desc">'+esc(form.Description)+'</div>';
  html += '<div class="ff-required-note">* Indicates required question</div></div>';

  qs.forEach(function(q,i){
    if(q.type==='section'){html+='<div class="ff-q-card" style="border-top:10px solid #673ab7;padding:20px 24px"><div style="font-size:18px;font-weight:400;color:#202124">'+esc(q.label)+'</div></div>';return;}
    html+='<div class="ff-q-card"><div class="ff-q-title">'+esc(q.label)+(q.required?'<span class="ff-req"> *</span>':'')+'</div>';
    if(q.type==='short') html+='<input class="ff-input" id="ff-'+i+'" placeholder="Your answer"/>';
    if(q.type==='long') html+='<textarea class="ff-textarea" id="ff-'+i+'" placeholder="Your answer" rows="3"></textarea>';
    if(q.type==='email') html+='<input type="email" class="ff-email-input" id="ff-'+i+'" placeholder="Your email"/>';
    if(q.type==='number') html+='<input type="number" class="ff-number-input" id="ff-'+i+'" placeholder="Your answer"/>';
    if(q.type==='phone') html+='<input type="tel" class="ff-input" id="ff-'+i+'" placeholder="Your phone number"/>';
    if(q.type==='url') html+='<input type="url" class="ff-input" id="ff-'+i+'" placeholder="https://"/>';
    if(q.type==='date') html+='<input type="date" class="ff-date-input" id="ff-'+i+'"/>';
    if(q.type==='time') html+='<input type="time" class="ff-time-input" id="ff-'+i+'"/>';
    if(q.type==='file') html+='<div style="padding:12px;border:2px dashed #dadce0;border-radius:8px;text-align:center;color:#70757a;font-size:13px;cursor:pointer"><span class="material-symbols-outlined" style="font-size:24px;display:block;margin-bottom:4px">upload_file</span>Click to upload</div>';
    if(q.type==='choice'){(q.options||[]).forEach(function(opt){html+='<div class="ff-radio-row"><input type="radio" name="ff-'+i+'" value="'+esc(opt)+'" id="ff-'+i+'-'+esc(opt)+'"/><label for="ff-'+i+'-'+esc(opt)+'">'+esc(opt)+'</label></div>';});}
    if(q.type==='checkbox'){(q.options||[]).forEach(function(opt){html+='<div class="ff-check-row"><input type="checkbox" name="ff-'+i+'" value="'+esc(opt)+'" id="ff-'+i+'-'+esc(opt)+'"/><label for="ff-'+i+'-'+esc(opt)+'">'+esc(opt)+'</label></div>';});}
    if(q.type==='dropdown'){html+='<select class="ff-select" id="ff-'+i+'"><option value="">Choose</option>';(q.options||[]).forEach(function(opt){html+='<option value="'+esc(opt)+'">'+esc(opt)+'</option>';});html+='</select>';}
    if(q.type==='scale'){html+='<div class="ff-scale-wrap">';if(q.minLabel)html+='<span class="ff-scale-lbl">'+esc(q.minLabel)+'</span>';for(var s=(q.min||1);s<=(q.max||5);s++){html+='<div class="ff-scale-opt" data-name="ff-'+i+'" data-val="'+s+'" onclick="_ffSelectScale(this)">'+s+'</div>';}if(q.maxLabel)html+='<span class="ff-scale-lbl">'+esc(q.maxLabel)+'</span>';html+='</div>';}
    html+='</div>';
  });

  html+='<div class="ff-submit-area"><button class="ff-submit-btn" id="ff-submit-btn" onclick="_gfSubmit(\''+esc(form.Form_ID||'')+'\')">Submit</button><button class="ff-clear-btn" onclick="_gfClearFill()">Clear form</button></div>';
  el('ff-wrap').innerHTML = html;
  navigate('form-fill');
}
function _ffSelectScale(el_){
  var name=el_.getAttribute('data-name');
  document.querySelectorAll('.ff-scale-opt[data-name="'+name+'"]').forEach(function(o){o.classList.remove('selected');});
  el_.classList.add('selected');
}
function _gfClearFill(){
  el('ff-wrap').querySelectorAll('input,textarea,select').forEach(function(inp){
    if(inp.type==='radio'||inp.type==='checkbox') inp.checked=false;
    else inp.value='';
  });
  el('ff-wrap').querySelectorAll('.ff-scale-opt.selected').forEach(function(o){o.classList.remove('selected');});
}
function _gfSubmit(formId){
  if(!formId||formId==='preview'){toast('This is a preview — responses are not saved.','info');return;}
  var form=FORMS_DATA.find(function(f){return f.Form_ID===formId;});
  if(!form){toast('Form not found.','error');return;}
  var qs=[];try{qs=JSON.parse(form.Fields||'[]');}catch(e){}
  var answers={},missing=[];
  qs.forEach(function(q,i){
    if(q.type==='section')return;
    var val='';
    if(q.type==='choice'||q.type==='scale'){
      if(q.type==='scale'){var sel=document.querySelector('.ff-scale-opt.selected[data-name="ff-'+i+'"]');val=sel?sel.getAttribute('data-val'):'';}
      else{var chk=document.querySelector('input[name="ff-'+i+'"]:checked');val=chk?chk.value:'';}
    }else if(q.type==='checkbox'){val=Array.from(document.querySelectorAll('input[name="ff-'+i+'"]:checked')).map(function(b){return b.value;}).join(', ');}
    else{var inp=el('ff-'+i);val=inp?inp.value:'';}
    answers[q.label]=val;
    if(q.required&&!String(val).trim())missing.push(q.label);
  });
  if(missing.length){toast('Please fill required: '+missing[0],'error');return;}
  var btn=el('ff-submit-btn');_btnLoading(btn,'Submitting…');
  google.script.run.withSuccessHandler(function(){_btnReset(btn,'Submit');el('ff-wrap').innerHTML='<div class="ff-title-card" style="text-align:center;padding:40px 24px"><span class="material-symbols-outlined" style="font-size:48px;color:#673ab7;display:block;margin-bottom:12px">check_circle</span><div class="ff-title" style="font-size:20px">Your response has been recorded.</div><div style="margin-top:16px"><button class="ff-clear-btn" onclick="navigate(\'forms\')">Back to Forms</button></div></div>';})
    .withFailureHandler(function(e){_btnReset(btn,'Submit');toast(e.message||'Failed','error');})
    .submitFormResponse(formId,JSON.stringify(answers),APP.currentUser.email);
}

var _ATT_REC_SECS     = 0;
