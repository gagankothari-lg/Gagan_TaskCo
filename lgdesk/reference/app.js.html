var _tskSearchTimer  = null;
var _tskSearchQuery  = '';
var _tskGrpSortMap   = {};   // { safeId: { col, dir } } — per-group sort state
var _tskGrpTaskCache = {};   // { safeId: [task, ...] } — cached for per-group re-sort
var _tskGrpGroupSort = { active: false, dir: 1 }; // group-level A-Z ordering
var _tskGrpVid       = 'all'; // which view is currently active ('all'|'my'|'team')

function _tskGrpSearchDebounced(val) {
  _tskSearchQuery = (val || '').trim().toLowerCase();
  clearTimeout(_tskSearchTimer);
  _tskSearchTimer = setTimeout(_tskGrpRerender, 220);
}

// Per-group sort — only re-renders that group's tbody (no full re-render)
function _tskGrpSetSort(grpId, col) {
  if (!_tskGrpSortMap[grpId]) _tskGrpSortMap[grpId] = { col: null, dir: 1 };
  var s = _tskGrpSortMap[grpId];
  if (s.col === col) { s.dir = (s.dir === 1) ? -1 : 1; }
  else               { s.col = col; s.dir = 1; }

  var tbody = document.getElementById('tsk-grp-tbody-' + grpId);
  if (!tbody) return;

  var tasks = (_tskGrpTaskCache[grpId] || []).slice();
  var sc = s.col, sd = s.dir;
  tasks.sort(function(a, b) {
    var av, bv;
    if (sc === 'subFnName') {
      av = (APP.functions||[]).find(function(f){return f.Function_ID===a.SubFn_ID;});
      bv = (APP.functions||[]).find(function(f){return f.Function_ID===b.SubFn_ID;});
      av = av ? av.Name : ''; bv = bv ? bv.Name : '';
    } else if (sc === 'assignerName') {
      var ea = _tskGrpEmpById(a.Assigner_ID), eb = _tskGrpEmpById(b.Assigner_ID);
      av = ea ? ((ea.First_Name||'')+' '+(ea.Last_Name||'')).trim() : '';
      bv = eb ? ((eb.First_Name||'')+' '+(eb.Last_Name||'')).trim() : '';
    } else if (sc === 'Created_At' || sc === 'Due_Date') {
      return ((a[sc] ? new Date(a[sc]).getTime() : 0) - (b[sc] ? new Date(b[sc]).getTime() : 0)) * sd;
    } else { av = String(a[sc]||'').toLowerCase(); bv = String(b[sc]||'').toLowerCase(); }
    av = String(av).toLowerCase(); bv = String(bv).toLowerCase();
    return av < bv ? -sd : av > bv ? sd : 0;
  });

  tbody.innerHTML = tasks.map(_renderGroupedRow).join('');

  // Update arrows in this group's thead only
  var thead = document.getElementById('tsk-grp-thead-' + grpId);
  if (thead) {
    thead.querySelectorAll('[data-sort-col]').forEach(function(th) {
      var arrow = th.querySelector('.tsk-sort-arrow');
      if (!arrow) return;
      if (th.getAttribute('data-sort-col') === sc) {
        arrow.textContent = sd === 1 ? '↑' : '↓'; arrow.style.color = '#6366f1';
      } else {
        arrow.textContent = '↕'; arrow.style.color = '#d1d5db';
      }
    });
  }
}

// Re-render grouped view with current filter-bar values + search + col filters + sort.
// Uses _tskGrpVid to know which view's filters to read.
function _tskGrpRerender() {
  var vid = _tskGrpVid || 'all';
  // Date/Week modes render through the full view renderer (which applies the
  // same column filters); only function mode renders the grouped table here.
  var _mode = _TSK_GRP_MODE[vid] || 'function';
  if (_mode !== 'function') {
    if (vid === 'my')   return renderMyTasks();
    if (vid === 'team') return renderTeamTasks();
    return renderAllTasks();
  }
  // Map vid to body element and scope key
  var bodyIds = { all: 'all-tasks-body', my: 'my-tasks-body', team: 'team-tasks-body' };
  var body = el(bodyIds[vid] || 'all-tasks-body');
  if (!body) return;
  var tasks = APP.tasks || [];

  // For 'all' view: apply scope filter
  if (vid === 'all') {
    var scopeTeam = _ALL_SCOPE['all-tsk'] || '';
    if (scopeTeam) {
      var scopeIds = _getTeamIds(scopeTeam);
      if (scopeIds) tasks = tasks.filter(function(t) { return _belongsToMyTeam(t, scopeIds, scopeTeam.toLowerCase()); });
    }
    tasks = _applyAsgnTaskFilter(tasks, 'all-tsk');
  } else if (vid === 'my') {
    var u = APP.currentUser;
    var af = _ASGN_FILTER['my-tsk'] || 'all';
    tasks = tasks.filter(function(t) {
      var toMe = _parseIds(t.Assignee_IDs || t.Assignee_ID).indexOf(u.empId) !== -1;
      var byMe = t.Assigner_ID === u.empId;
      return (af === 'to-me') ? toMe : (af === 'by-me') ? byMe : (toMe || byMe);
    });
  } else if (vid === 'team') {
    if (_isAdmin(APP.currentUser.role)) {
      var myTeam2 = (APP.currentUser.team || '').toLowerCase();
      var myIds2  = _myTeamEmpIds() || new Set();
      myIds2.add(APP.currentUser.empId);
      tasks = tasks.filter(function(t) { return _belongsToMyTeam(t, myIds2, myTeam2); });
    }
    tasks = _applyAsgnTaskFilter(tasks, 'team-tsk');
  }

  // Apply all column filters (multi-select aware) — single source of truth.
  tasks = _tskApplyColFilters(tasks, vid);

  body.innerHTML = '<tr><td colspan="11" style="padding:0;border:none">' +
    _renderGroupedTasksHtml(tasks) + '</td></tr>';
}

        h += '<label style="display:inline-flex;align-items:center;gap:2px;cursor:pointer;font-size:11px;color:#6b7280" title="Select all tasks">';
        h += '<input type="checkbox" id="tsk-chk-all" onchange="_tskSelectAll(this.checked)" onclick="event.stopPropagation()"'
          + ' style="width:13px;height:13px;accent-color:#6366f1;cursor:pointer;flex-shrink:0">';
        h += '<span style="font-size:11px;white-space:nowrap">All</span></label>';
        h += '<button onclick="event.stopPropagation();_tskClearFilters()" title="Clear all filters"'
          + ' style="padding:1px 6px;border:1px solid #e2e8f0;border-radius:3px;cursor:pointer;'
          + 'font-size:11px;color:#9ca3af;background:#fff;flex-shrink:0;white-space:nowrap;line-height:1.4">';
        h += '&#10005; Clear</button>';
        h += '</div>';
        break;
    }
    h += '</td>';
  });
  h += '</tr></tbody></table></div>';
  return h;
}

// Inject aligned filter bar for a given view (runs once per view).
// viewId: 'all-tasks' | 'my-tasks' | 'team-tasks' — matches the DOM id prefix.
// vid:    'all' | 'my' | 'team' — used in element IDs and render calls.
function _tskInjectFilterBarForVid(viewId, vid) {
  if (document.getElementById('tsk-filter-bar-wrap-' + vid)) return; // already injected
  var viewSel = '#view-' + viewId;
  var oldFilterRow = document.querySelector(viewSel + ' .ts-filter-row');
  if (oldFilterRow) oldFilterRow.remove();
  var oldHdrRow = document.querySelector(viewSel + ' .task-sheet thead tr:first-child');
  if (oldHdrRow) oldHdrRow.style.display = 'none';
  var wrap = document.querySelector(viewSel + ' .task-sheet-wrap');
  if (wrap) {
    wrap.insertAdjacentHTML('beforebegin', _tskBuildFilterBar(vid));
    setTimeout(function() { _tskInitFilterWidgets(vid); }, 0);
  }
}
// Backward-compat alias used by existing All Tasks calls
function _tskInjectFilterBar() { _tskInjectFilterBarForVid('all-tasks', 'all'); }

function _renderGroupedTasksHtml(tasks) {
  // Apply search query
  if (_tskSearchQuery) {
    tasks = tasks.filter(function(t) {
      return (t.Title || '').toLowerCase().indexOf(_tskSearchQuery) !== -1 ||
             (t.Description || '').toLowerCase().indexOf(_tskSearchQuery) !== -1 ||
             (t.Task_ID || '').toLowerCase().indexOf(_tskSearchQuery) !== -1;
    });
  }

  // Assigned date range filter (new aligned bar inputs)
  var _adFrom = el('flt-adate-from');
  var _adTo   = el('flt-adate-to');
  if (_adFrom && _adFrom.value) {
    var _fromTs = new Date(_adFrom.value).getTime();
    tasks = tasks.filter(function(t) { return t.Created_At && new Date(t.Created_At).getTime() >= _fromTs; });
  }
  if (_adTo && _adTo.value) {
    var _toTs = new Date(_adTo.value).getTime() + 86400000;
    tasks = tasks.filter(function(t) { return t.Created_At && new Date(t.Created_At).getTime() <= _toTs; });
  }
  // Recurring filter
  var _recFlt = el('flt-recurring');
  if (_recFlt && _recFlt.value) {
    var _recQ = _recFlt.value.toLowerCase();
    tasks = tasks.filter(function(t) {
      var rv = (t.Recurring_Task || '').toLowerCase();
      if (_recQ === 'none') return !rv || rv === 'none' || rv === 'one time' || rv === '—';
      return rv === _recQ;
    });
  }

  if (!tasks.length) {
    return '<div style="padding:24px;text-align:center;color:#94a3b8;font-size:13px">No tasks match the current filters.</div>';
  }

  // Group by Function_ID, preserving first-appearance order
  var groups = {}, order = [];
  tasks.forEach(function(t) {
    var key = t.Function_ID || '__none__';
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(t);
  });
  // Apply group A-Z sort if active, then always push __none__ to end
  if (_tskGrpGroupSort.active) {
    var _gs = _tskGrpGroupSort.dir;
    order.sort(function(a, b) {
      if (a === '__none__') return 1;
      if (b === '__none__') return -1;
      var fa = (APP.functions||[]).find(function(f){return f.Function_ID===a;});
      var fb = (APP.functions||[]).find(function(f){return f.Function_ID===b;});
      var na = (fa?fa.Name:a).toLowerCase(), nb = (fb?fb.Name:b).toLowerCase();
      return na < nb ? -_gs : na > nb ? _gs : 0;
    });
  }
  var noneIdx = order.indexOf('__none__');
  if (noneIdx > -1 && noneIdx !== order.length - 1) { order.splice(noneIdx,1); order.push('__none__'); }

  // Selection bar (hidden until rows are checked)
  var html =
    '<div id="tsk-selection-bar" style="display:none;align-items:center;gap:10px;'
    + 'padding:8px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;'
    + 'margin-bottom:8px;font-size:13px">'
    + '<span id="tsk-sel-count" style="font-weight:500;color:#1d4ed8"></span>'
    + '<button onclick="_tskSelectAll(false)" style="padding:4px 10px;background:#fff;'
    + 'border:1px solid #e2e8f0;border-radius:4px;cursor:pointer;font-size:12px;color:#374151">'
    + 'Clear selection</button>'
    + '</div>'
    + '<div class="tsk-grp-wrap">';

  order.forEach(function(fnId, idx) {
    var grpTasks   = groups[fnId];
    var fnRec      = fnId === '__none__' ? null : (APP.functions || []).find(function(f) { return f.Function_ID === fnId; });
    var fnName     = fnRec ? fnRec.Name : '(No function)';
    var clr        = _TSK_GRP_COLORS[idx % _TSK_GRP_COLORS.length];
    var isCollapsed = !!_tskGrpState[fnId];
    var safeId = fnId.replace(/[^a-zA-Z0-9_-]/g, '_');

    // Cache tasks for per-group sort
    _tskGrpTaskCache[safeId] = grpTasks.slice();

    html += '<div class="tsk-grp">';
    // Header — 3-section layout (Function · Project · Sub-Project)
    // Fix: fn.Proj_ID is the direct project; if it has a parent, direct=sub-project, parent=main
    var _directProjId   = _tskGrpFnProjId(fnId);
    var _directProj     = _directProjId ? (APP.projects||[]).find(function(p){return p.Proj_ID===_directProjId||p.id===_directProjId;}) : null;
    var _parentProjId   = _directProj ? (_directProj.Parent_Proj_ID || '') : '';
    var _parentProjName = _parentProjId ? _tskGrpProjName(_parentProjId) : '';
    var _mainProjId     = _parentProjId ? _parentProjId   : _directProjId;
    var _mainProjName   = _parentProjId ? _parentProjName : (_directProjId ? _tskGrpProjName(_directProjId) : '');
    var _subProjId      = _parentProjId ? _directProjId   : '';
    var _subProjName    = _parentProjId ? _tskGrpProjName(_directProjId) : '';
    var _isNone         = (fnId === '__none__');

    html += '<div class="tsk-grp-hdr" onclick="_tskGrpToggle(\'' + esc(fnId) + '\')" style="padding:0;display:flex;align-items:stretch">';

    if (!_isNone) {
      html += '<div style="display:flex;align-items:center;flex:1;gap:0;overflow:hidden">';
      // Left accent bar
      html += '<div style="width:4px;background:' + clr.dot + ';align-self:stretch;flex-shrink:0"></div>';
      // Section 1: FUNCTION
      html += '<div style="padding:8px 12px;border-right:1px solid #e2e8f0;min-width:150px;display:flex;flex-direction:column;justify-content:center;gap:1px">';
      html += '<div style="font-size:9.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9ca3af">Function</div>';
      html += '<div style="font-size:13px;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px">' + esc(fnName) + '</div>';
      html += '<div style="font-size:10px;color:' + clr.dot + ';font-weight:500">' + esc(fnId) + '</div>';
      html += '</div>';
      // Section 2: PROJECT (main/parent project)
      html += '<div style="padding:8px 12px;border-right:1px solid #e2e8f0;min-width:120px;display:flex;flex-direction:column;justify-content:center;gap:1px">';
      html += '<div style="font-size:9.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9ca3af">Project</div>';
      if (_mainProjName) {
        html += '<div style="font-size:12px;font-weight:500;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px">' + esc(_mainProjName) + '</div>';
        html += '<div style="font-size:10px;color:#9ca3af">' + esc(_mainProjId) + '</div>';
      } else {
        html += '<div style="font-size:12px;color:#d1d5db">—</div>';
      }
      html += '</div>';
      // Section 3: SUB-PROJECT (child/direct project when it has a parent)
      html += '<div style="padding:8px 12px;border-right:1px solid #e2e8f0;min-width:110px;display:flex;flex-direction:column;justify-content:center;gap:1px">';
      html += '<div style="font-size:9.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9ca3af">Sub-project</div>';
      if (_subProjName) {
        html += '<div style="font-size:12px;font-weight:500;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px">' + esc(_subProjName) + '</div>';
        html += '<div style="font-size:10px;color:#9ca3af">' + esc(_subProjId) + '</div>';
      } else {
        html += '<div style="font-size:12px;color:#d1d5db">—</div>';
      }
      html += '</div>';
      // Right: badge + chevron
      html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;margin-left:auto;flex-shrink:0">';
      html += '<span class="tsk-grp-badge" style="background:' + clr.bb + ';color:' + clr.bt + '">' +
        grpTasks.length + ' task' + (grpTasks.length !== 1 ? 's' : '') + '</span>';
      html += '<span class="tsk-grp-chev' + (isCollapsed ? ' closed' : '') + '" id="tsk-grp-chev-' + safeId + '">▾</span>';
      html += '</div>';
      html += '</div>'; // end flex row
    } else {
      // "(No function)" simple header
      html += '<div style="display:flex;align-items:center;gap:8px;padding:9px 14px;flex:1">';
      html += '<span class="tsk-grp-dot" style="background:#94a3b8"></span>';
      html += '<span class="tsk-grp-name" style="color:#6b7280;font-style:italic">(No function)</span>';
      html += '<span class="tsk-grp-badge" style="background:#f1f5f9;color:#64748b">' +
        grpTasks.length + ' task' + (grpTasks.length !== 1 ? 's' : '') + '</span>';
      html += '<span class="tsk-grp-chev' + (isCollapsed ? ' closed' : '') + '" id="tsk-grp-chev-' + safeId + '" style="margin-left:auto">▾</span>';
      html += '</div>';
    }

    html += '</div>'; // end .tsk-grp-hdr
    // Body
    html += '<div class="tsk-grp-body' + (isCollapsed ? ' closed' : '') + '" id="tsk-grp-body-' + safeId + '">';
    html += '<div class="tsk-grp-scroll"><table class="tsk-grp-table">';
    html += _tskGrpTheadHtml(safeId);
    html += '<tbody id="tsk-grp-tbody-' + safeId + '">';
    grpTasks.forEach(function(t) { html += _renderGroupedRow(t); });
    html += '</tbody></table></div></div></div>';
  });

  html += '</div>'; // close tsk-grp-wrap
  return html;
}

// ── Filter clear + row selection ──────────────────────────────────────────────

// Apply all data-filter attributes from the active filter bar to the task list
function _tskApplyFilterBar(tasks) {
  var vid  = _tskGrpVid || 'all';
  var fbar = document.getElementById('tsk-filter-bar-wrap-' + vid);
  if (!fbar) return tasks;
  function fv(attr) {
    var fEl = fbar.querySelector('[data-filter="' + attr + '"]');
    return (fEl && fEl.value) ? fEl.value : '';
  }
  var sf = fv('subfn');
  if (sf) tasks = tasks.filter(function(t){ return (t.SubFn_ID||'') === sf; });
  var tk = fv('task');
  if (tk) tasks = tasks.filter(function(t){ return t.Task_ID === tk; });
  var ae = fv('assignee');
  if (ae) tasks = tasks.filter(function(t){
    return String(t.Assignee_IDs||'').split(',').map(function(s){return s.trim();}).indexOf(ae) !== -1;
  });
  var ar = fv('assigner');
  if (ar) tasks = tasks.filter(function(t){ return (t.Assigner_ID||'') === ar; });
  var rc = fv('recurring');
  if (rc) tasks = tasks.filter(function(t){
    var v = (t.Recurring_Task||'').toLowerCase();
    return rc === 'none' ? (!v || v === 'none' || v === '—') : v === rc.toLowerCase();
  });
  var st = fv('status');
  if (st) tasks = tasks.filter(function(t){ return (t.Status||'') === st; });
  var pr = fv('priority');
  if (pr) tasks = tasks.filter(function(t){ return (t.Priority||'') === pr; });
  var dd = fv('due');
  if (dd) tasks = tasks.filter(function(t){
    return t.Due_Date && new Date(t.Due_Date).toDateString() === new Date(dd).toDateString();
  });
  var adFromEl = fbar.querySelector('[data-filter="adate-from"]');
  if (adFromEl && adFromEl.value) { var _afTs = new Date(adFromEl.value).getTime();
    tasks = tasks.filter(function(t){ return t.Created_At && new Date(t.Created_At).getTime() >= _afTs; }); }
  var adToEl = fbar.querySelector('[data-filter="adate-to"]');
  if (adToEl && adToEl.value) { var _atTs = new Date(adToEl.value).getTime() + 86400000;
    tasks = tasks.filter(function(t){ return t.Created_At && new Date(t.Created_At).getTime() <= _atTs; }); }
  return tasks;
}

var _tskSelectedIds = {}; // taskId → boolean

function _tskClearFilters() {
  var vid = _tskGrpVid || 'all';
  // Clear all 8 multi-select filter widgets
  ['fn','proj','parent','sub','asgn','asgr','status','pri'].forEach(function(k) {
    _ssmClear(el('tf-' + vid + '-' + k));
  });
  // Clear non-multi inputs (assigned-date range, recurring, due) in the active bar
  var fbar = document.getElementById('tsk-filter-bar-wrap-' + vid);
  if (fbar) {
    fbar.querySelectorAll('input[type="date"]').forEach(function(inp) { inp.value = ''; });
    var rec = fbar.querySelector('[data-filter="recurring"]');
    if (rec) rec.selectedIndex = 0;
  }
  var srch = el('tsk-search-input');
  if (srch) { srch.value = ''; _tskSearchQuery = ''; }
  var cnt = el('tsk-search-count');
  if (cnt) cnt.textContent = '';
  _tskGrpRerender();
}

function _tskSelectAll(checked) {
  document.querySelectorAll('.tsk-row-chk').forEach(function(chk) {
    chk.checked = checked;
    var taskId = chk.dataset.taskId;
    if (taskId) _tskSelectedIds[taskId] = checked;
  });
  _tskUpdateSelectionBar();
}

function _tskToggleRow(chk, taskId) {
  _tskSelectedIds[taskId] = chk.checked;
  var all = el('tsk-chk-all');
  if (all) {
    var chks = document.querySelectorAll('.tsk-row-chk');
    var n = document.querySelectorAll('.tsk-row-chk:checked').length;
    all.indeterminate = n > 0 && n < chks.length;
    all.checked = n === chks.length && chks.length > 0;
  }
  _tskUpdateSelectionBar();
}

function _tskUpdateSelectionBar() {
  var count = Object.keys(_tskSelectedIds).filter(function(k){ return _tskSelectedIds[k]; }).length;
  var bar = el('tsk-selection-bar');
  if (!bar) return;
  if (count > 0) {
    bar.style.display = 'flex';
    var lbl = el('tsk-sel-count');
    if (lbl) lbl.textContent = count + ' task' + (count !== 1 ? 's' : '') + ' selected';
  } else {
    bar.style.display = 'none';
    _tskSelectedIds = {};
  }
}

function renderAllTasks() {
  _tskGrpVid = 'all';
  _tskInjectFilterBar();           // inject aligned bar (no-op if already done)
  _populateTskFilterSelects('all'); // populate selects — now finds them in new bar
  // Non-admin managers only see their team's data; pre-select their team if not set
  if (!_isAdmin(APP.currentUser.role) && _isManager(APP.currentUser.role) && !_ALL_SCOPE['all-tsk']) {
    _ALL_SCOPE['all-tsk'] = APP.currentUser.team || '';
  }
  _populateScopeSelect('all-tsk');
  var tasks = APP.tasks || [];
  var scopeTeam = _ALL_SCOPE['all-tsk'] || '';
  if (scopeTeam) {
    var scopeIds = _getTeamIds(scopeTeam);
    if (scopeIds) {
      tasks = tasks.filter(function(t) { return _belongsToMyTeam(t, scopeIds, scopeTeam.toLowerCase()); });
    }
  }
  // Apply assignment filter (e.g. "by me / to me" tabs if used in this view)
  tasks = _applyAsgnTaskFilter(tasks, 'all-tsk');

  // Apply column filters (multi-select) before grouping / mode dispatch
  tasks = _tskApplyColFilters(tasks, 'all');

  // Group-by toggle (5.4)
  var _grpTogAll = el('all-tasks-grp-toggle');
  if (_grpTogAll) _grpTogAll.innerHTML = _tskGrpToggleHtml('all');

  var _allMode    = _TSK_GRP_MODE['all'] || 'function';
  var _allTblWrap = el('all-tasks-tbl-wrap');
  var _allAltBody = el('all-tasks-alt-body');

  if (_allMode === 'function') {
    if (_allTblWrap) _allTblWrap.style.display = '';
    if (_allAltBody) { _allAltBody.style.display = 'none'; _allAltBody.innerHTML = ''; }
    _tskGrpInjectCss();
    _tskGrpInjectHeaderControls('all-tasks');
    var body = el('all-tasks-body');
    if (body) {
      body.innerHTML = '<tr><td colspan="11" style="padding:0;border:none">' +
        _renderGroupedTasksHtml(tasks) + '</td></tr>';
    }
  } else {
    if (_allTblWrap) _allTblWrap.style.display = 'none';
    if (_allAltBody) {
      _allAltBody.style.display = 'block';
      _allAltBody.innerHTML = _allMode === 'date'
        ? _renderDateGroupedTasksHtml(tasks, 'all')
        : _renderWeekGroupedTasksHtml(tasks, 'all');
    }
  }
}

function _loadPendingRegs(elId, myOnly) {

  '</div>';
}

// ── Due Date Change Request UI ─────────────────────────────────────────────────

function openDueDateRequestModal(entityType, entityId, entityTitle, currentDate) {
  _DDR_ENTITY = { type: entityType, id: entityId, title: entityTitle, currentDate: currentDate };
  var labelEl = el('ddr-entity-label');
  if (labelEl) labelEl.textContent = entityType + ': ' + entityTitle;
  var currEl = el('ddr-current-date');
  if (currEl) currEl.value = currentDate ? fmtDate(currentDate) : 'Unscheduled';
  var newEl = el('ddr-new-date');
  if (newEl) newEl.value = '';
  var reasonEl = el('ddr-reason');
  if (reasonEl) reasonEl.value = '';
  var errEl = el('ddr-error');
  if (errEl) errEl.style.display = 'none';
  openModal('ddr-modal');
}

function submitDueDateRequest(btn) {
  if (!_DDR_ENTITY) return;
  var newDate = (el('ddr-new-date')  || {}).value || '';
  var reason  = ((el('ddr-reason')   || {}).value || '').trim();
  var errEl   = el('ddr-error');

  if (!newDate) {
    if (errEl) { errEl.textContent = 'Please select a new date.'; errEl.style.display = 'block'; }
    return;
  }
  if (!reason) {
    if (errEl) { errEl.textContent = 'Please provide a reason.'; errEl.style.display = 'block'; }
    return;
  }
  if (errEl) errEl.style.display = 'none';
  _btnLoading(btn, 'Submitting…');

  var record = {
    entityType:    _DDR_ENTITY.type,
    entityId:      _DDR_ENTITY.id,
    entityTitle:   _DDR_ENTITY.title,
    currentDate:   _DDR_ENTITY.currentDate || '',
    requestedDate: newDate,
    reason:        reason
  };

  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn, 'Submit Request');
      if (!r || !r.ok) {
        if (errEl) { errEl.textContent = r && r.error ? r.error : 'Failed to submit.'; errEl.style.display = 'block'; }
        return;
      }
      closeModal('ddr-modal');
      if (r.direct) {
        toast('Due date updated!', 'success');
        refresh();
      } else {
        toast('Request submitted! The assigner will review it.', 'ok');
        _ddrUpdateBadge();
      }
    })
    .withFailureHandler(function(err) {
      _btnReset(btn, 'Submit Request');
      if (errEl) { errEl.textContent = (err && err.message) || 'Error'; errEl.style.display = 'block'; }
    })
    .requestDueDateChange(record, APP._verifiedEmail);
}

function _ddrUpdateBadge() {
  if (typeof google === 'undefined' || !google.script || !google.script.run ||
      typeof google.script.run.getPendingDueDateCount !== 'function') return;
  google.script.run
    .withSuccessHandler(function(r) {
      var n = (r && r.ok) ? (r.count || 0) : 0;
      var b = el('badge-ddr');
      if (b) { b.textContent = n; b.classList.toggle('hidden', n === 0); }
    })
    .withFailureHandler(function() {})
    .getPendingDueDateCount(APP._verifiedEmail);
}

function _loadPendingDueDateRequests(elId) {
  var cont = el(elId);
  if (!cont) return;
  cont.innerHTML = '';
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok) { cont.innerHTML = ''; return; }
      cont.innerHTML = _renderDueDateRequestCards(r.requests || []);
    })
    .withFailureHandler(function() { cont.innerHTML = ''; })
    .getDueDateRequests(APP._verifiedEmail);
}

function _renderDueDateRequestCards(reqs) {
  if (!reqs.length) return '';
  return '<div class="pending-reg-section">' +
    '<h3>Pending Due Date Change Requests (' + reqs.length + ')</h3>' +
    reqs.map(function(r) {
      var from = r.Current_Date   ? fmtDate(r.Current_Date)   : 'Unscheduled';
      var to   = r.Requested_Date ? fmtDate(r.Requested_Date) : '—';
      return '<div class="reg-card" style="background:#e8eaf6;border-color:#9fa8da">' +
        '<div class="reg-card-hd">' +
          '<div>' +
            '<div class="reg-card-name">' + esc(r.Entity_Title || r.Entity_ID) + '</div>' +
            '<div class="reg-card-email">' + esc(r.Entity_Type) + ' \xb7 ' + esc(r.Entity_ID) + '</div>' +
          '</div>' +
          '<span class="badge" style="background:#e8eaf6;color:#3949ab;border:1px solid #9fa8da">Date Change</span>' +
        '</div>' +
        '<div class="reg-card-meta">' +
          '<strong>From:</strong> ' + esc(from) + ' → <strong>' + esc(to) + '</strong>' +
          ' &nbsp;|&nbsp; <strong>By:</strong> ' + esc(r.Requestor_Name || r.Requestor_ID) +
          ' &nbsp;|&nbsp; ' + fmtDate(r.Created_At) +
        '</div>' +
        (r.Reason ? '<div class="reg-card-msg">"' + esc(r.Reason) + '"</div>' : '') +
        '<div class="reg-card-actions">' +
          '<button class="btn btn-sm btn-accent" onclick="approveDueDateReq(this,\'' + esc(r.Request_ID) + '\')">Approve</button>' +
          '<button class="btn btn-sm btn-danger"  onclick="rejectDueDateReq(this,\'' + esc(r.Request_ID) + '\')">Reject</button>' +
        '</div>' +
      '</div>';
    }).join('') +
  '</div>';
}

function approveDueDateReq(btn, reqId) {
  if (!confirm('Approve this due date change?')) return;
  _btnLoading(btn, 'Approving…');
  google.script.run
    .withSuccessHandler(function(r) {

function rejectDueDateReq(btn, reqId) {

    .withSuccessHandler(function(r) {

      if (!r || !r.ok) { toast((r && r.error) || 'Failed.', 'error'); return; }
      toast('Request rejected.', 'warn');

      if (APP.view === 'org-page') renderOrgPage(); else renderTeamMgmt();

function _loadPendingProfileUpdates(elId) {
  var cont = el(elId);

function approveProfileUpd(btn, reqId) {

// ── Team Management (Manager+) ────────────────────────────────────────────────
function renderTeamMgmt() {
  var u = APP.currentUser;
  // All managers (including SA/Admin) see requests where they are the designated manager
  if (_isManager(u.role)) {
    _loadPendingRegs('team-pending-registrations', true);
    _loadPendingProfileUpdates('team-pending-profile-updates');
    _loadPendingDueDateRequests('team-pending-ddr');
  }

  // Render only members from the current user's team
  var myTeam = u ? (u.team || '') : '';
  var teamMembers = (APP.employees || []).filter(function(e) {
    return e.Team === myTeam || e.Sub_Department === myTeam;
  });
  el('team-mgmt-body').innerHTML = teamMembers.length
    ? teamMembers.map(function(e) {
        var mgr  = findEmp(e.Manager_ID);
        var open = APP.tasks.filter(function(t) {
          return _parseIds(t.Assignee_IDs || t.Assignee_ID).indexOf(e.Emp_ID || e['Emp_ID']) !== -1 && _isOpen(t.Status);
        }).length;
        // TC can only change roles within their own team
        var sameTeam  = u.role !== 'Team Captain' || (e.Team === u.team || e.Sub_Department === u.team);
        var canChange = e.Emp_ID !== u.empId && sameTeam && _allowedNewRoles(u.role, e.Role).length > 0;
        return '<tr>' +
          '<td><div style="display:flex;align-items:center;gap:8px">' +
            '<span class="avatar-sm">' + e.Name.charAt(0).toUpperCase() + '</span>' +
            '<div><div style="font-weight:600">' + esc(e.Name) + '</div>' +
            '<div style="font-size:11px;color:var(--muted)">' + esc(e.Email) + '</div></div>' +
          '</div></td>' +
          '<td>' + pill(e.Role) + '</td>' +
          '<td>' + esc(e.Team || '—') + '</td>' +
          '<td>' + esc(mgr ? mgr.Name : '—') + '</td>' +
          '<td><strong>' + open + '</strong></td>' +
          '<td>' + (canChange ? '<button class="btn btn-ghost" style="font-size:11px;padding:3px 10px" onclick="openChangeRoleModal(\'' + esc(e.Emp_ID) + '\',\'' + esc(e.Name) + '\',\'' + esc(e.Role) + '\')">Change Role</button>' : '—') + '</td>' +
        '</tr>';
      }).join('')
    : '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--muted)">No members found for your team</td></tr>';
}

// ── Organisation Page (Admin/Super Admin) ─────────────────────────────────────
// Shows ALL pending registration requests + all active employees.
function renderOrgPage() {
  // myOnly=false → admins see all requests across all teams
  _loadPendingRegs('org-pending-registrations', false);

  _loadPendingDueDateRequests('org-pending-ddr');

  // Render all employees
  var u    = APP.currentUser;
  var rows = (APP.employees || []).map(function(e) {
    var mgr        = findEmp(e.Manager_ID);
    var open       = APP.tasks.filter(function(t) {
      return _parseIds(t.Assignee_IDs || t.Assignee_ID).indexOf(e.Emp_ID || e['Emp_ID']) !== -1 && _isOpen(t.Status);
    }).length;
    var canChange  = e.Emp_ID !== u.empId && _allowedNewRoles(u.role, e.Role).length > 0;
    return '<tr>' +
      '<td><div style="display:flex;align-items:center;gap:8px">' +

        '<div><div style="font-weight:600">' + esc(e.Name) + '</div>' +
        '<div style="font-size:11px;color:var(--muted)">' + esc(e.Email) + '</div></div>' +
      '</div></td>' +
      '<td>' + pill(e.Role) + '</td>' +

      '<td>' + esc(mgr ? mgr.Name : '—') + '</td>' +
      '<td><strong>' + open + '</strong></td>' +
      '<td>' + (canChange ? '<button class="btn btn-ghost" style="font-size:11px;padding:3px 10px" onclick="openChangeRoleModal(\'' + esc(e.Emp_ID) + '\',\'' + esc(e.Name) + '\',\'' + esc(e.Role) + '\')">Change Role</button>' : '—') + '</td>' +

    ? rows.join('')
    : '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--muted)">No employees found</td></tr>';

// ── Registration Actions ──────────────────────────────────────────────────────
function approveReg(btn, reqId) {
  if (!confirm('Approve this registration request?')) return;

  google.script.run
    .withSuccessHandler(function(result) {

// ── Task Detail Modal ─────────────────────────────────────────────────────────
function openTaskDetail(taskId) {
  var t = APP.tasks.find(function(x) { return x.Task_ID === taskId; });
  if (!t) return;
  APP._taskId = taskId;

  var assigneeIds = _parseIds(t.Assignee_IDs || t.Assignee_ID);
  var proj     = findProj(t.Proj_ID);
  var asgn     = t.Assigner_Name || findEmpName(t.Assigner_ID);
  var asgnEmp  = t.Assigner_ID ? findEmp(t.Assigner_ID) : null;
  var asgnMeta = asgnEmp
    ? [asgnEmp.Designation || asgnEmp.designation, asgnEmp.Role || asgnEmp.role, asgnEmp.Team || asgnEmp.team].filter(Boolean).join(' · ')
    : '';

  el('tdm-title').textContent = t.Title;
  var _tdmSub = el('tdm-subtitle');
  if (_tdmSub) _tdmSub.textContent = 'Task \xb7 ' + t.Task_ID;

  var subFnRec = t.SubFn_ID ? (APP.functions || []).find(function(f) { return f.Function_ID === t.SubFn_ID; }) : null;
  var fnRec    = subFnRec && subFnRec.Parent_Fn_ID
    ? (APP.functions || []).find(function(f) { return f.Function_ID === subFnRec.Parent_Fn_ID; })
    : (t.Function_ID ? (APP.functions || []).find(function(f) { return f.Function_ID === t.Function_ID; }) : null);

  var estHrs = _parseHours(t.Estimated_Hours);
  var actHrs = _parseHours(t.Actual_Hours);
  var hrsPct = estHrs > 0 ? Math.min(100, Math.round(actHrs / estHrs * 100)) : 0;
  var hrsBarColor = hrsPct >= 100 ? 'var(--ok)' : hrsPct >= 60 ? 'var(--p2)' : 'var(--warn)';

  // ── Top strip: Status | Priority | Due Date | Recurring ──
  var strip =
    '<div style="display:flex;flex-wrap:wrap;gap:6px 12px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px">' +
      '<div style="flex:1;min-width:90px">' +
        '<div class="stat-label" style="margin-bottom:4px">Status</div>' + pill(t.Status) +
      '</div>' +
      '<div style="flex:1;min-width:80px">' +
        '<div class="stat-label" style="margin-bottom:4px">Priority</div>' + badge(t.Priority) +
      '</div>' +
      '<div style="flex:1;min-width:110px">' +
        '<div class="stat-label" style="margin-bottom:4px">Due Date</div>' +
        deadlineHtml(t.Due_Date, t.Status) +
        ((!_isAdmin(APP.currentUser.role) && t.Assigner_ID !== APP.currentUser.empId)
          ? '<button class="btn btn-ghost" style="font-size:11px;padding:2px 8px;margin-top:5px;display:block" ' +
              'onclick="openDueDateRequestModal(\'Task\',\'' + esc(t.Task_ID) + '\',' +
              'APP.tasks.find(function(x){return x.Task_ID===\'' + esc(t.Task_ID) + '\'}).Title,' +
              '\'' + esc(t.Due_Date ? String(t.Due_Date).substring(0,10) : '') + '\')">' +
              '<span class="material-symbols-outlined" style="font-size:12px;vertical-align:middle">edit_calendar</span>' +
              ' Request Change</button>'
          : '') +
      '</div>' +
      (t.Recurring_Task && t.Recurring_Task !== 'One Time' ?
        '<div style="flex:1;min-width:80px">' +
          '<div class="stat-label" style="margin-bottom:4px">Recurring</div>' +
          '<span style="font-size:12px;font-weight:500;color:var(--p)">↻ ' + esc(t.Recurring_Task) + '</span>' +
        '</div>' : '') +
    '</div>';

  // ── Context cards: Project / Function / Sub-Function ──
  var ctxItems = [];
  if (proj) ctxItems.push(['Project',
    '<span style="font-weight:600;font-size:13px">' + esc(proj.Name) + '</span>'
  ]);
  if (fnRec) ctxItems.push(['Function',
    '<div>' +
      '<div style="font-size:13px;font-weight:500">' + esc(fnRec.Name) + '</div>' +
      (fnRec.Description && fnRec.Description.trim()
        ? '<div style="font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4">' +
            esc(fnRec.Description.length > 120
              ? fnRec.Description.substring(0, 117) + '…'
              : fnRec.Description) + '</div>'
        : '') +
    '</div>'
  ]);
  if (subFnRec) ctxItems.push(['Sub-Function',
    '<div>' +
      '<div style="font-size:13px;font-weight:500">' + esc(subFnRec.Name) + '</div>' +
      (subFnRec.Description && subFnRec.Description.trim()
        ? '<div style="font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4">' +
            esc(subFnRec.Description.length > 120
              ? subFnRec.Description.substring(0, 117) + '…'
              : subFnRec.Description) + '</div>'
        : '') +
    '</div>'
  ]);
  var ctxHtml = ctxItems.length ?
    '<div class="tdm-grid2" style="margin-bottom:12px">' +
      ctxItems.map(function(item) {
        return '<div class="tdm-card">' +
          '<div class="stat-label" style="margin-bottom:3px">' + item[0] + '</div>' +
          item[1] + '</div>';
      }).join('') +
    '</div>' : '';

  // ── People: Assigned To + Assigned By ──
  var chips = assigneeIds.map(function(id) {
    var e = findEmp(id); return '<span class="ms-chip" style="font-size:12px">' + esc(e ? e.Name : id) + '</span>';
  }).join(' ') || '<span style="color:var(--muted);font-size:13px">—</span>';
  var asgnByHtml = asgn
    ? '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
        '<span class="avatar-sm">' + asgn.charAt(0).toUpperCase() + '</span>' +
        '<div><div style="font-weight:500;font-size:13px;line-height:1.3">' + esc(asgn) + '</div>' +
        (asgnMeta ? '<div style="font-size:11px;color:var(--muted)">' + esc(asgnMeta) + '</div>' : '') + '</div>' +
      '</div>'
    : '<span style="color:var(--muted);font-size:13px">—</span>';

    '<div class="tdm-grid2" style="margin-bottom:12px">' +
      '<div class="tdm-card"><div class="stat-label" style="margin-bottom:6px">Assigned To</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:4px">' + chips + '</div></div>' +
      '<div class="tdm-card"><div class="stat-label" style="margin-bottom:6px">Assigned By</div>' + asgnByHtml + '</div>' +
    '</div>';

  // ── SECTION 4: Metadata — Hours (always shown) ────────────────────────────
  var hoursHtml =
    '<div class="tdm-card" style="margin-bottom:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:' + (estHrs > 0 ? '8' : '4') + 'px">' +
        '<div class="stat-label">Hours</div>' +
        '<div style="font-size:12px;color:var(--muted)">' +
          (actHrs > 0 || estHrs > 0
            ? (actHrs > 0 ? '<b style="color:var(--text)">' + actHrs + '</b> actual' : '') +
              (actHrs > 0 && estHrs > 0 ? ' &nbsp;/&nbsp; ' : '') +
              (estHrs > 0 ? estHrs + ' est' : '') +
              (estHrs > 0 && actHrs > 0 ? ' &nbsp;\xb7&nbsp; <b style="color:var(--p)">' + hrsPct + '%</b>' : '')
            : '<span style="font-style:italic">Not tracked</span>') +
        '</div>' +
      '</div>' +
      (estHrs > 0 ? '<div style="height:5px;background:var(--border);border-radius:3px;overflow:hidden">' +
        '<div style="width:' + hrsPct + '%;height:100%;background:' + hrsBarColor + ';border-radius:3px;transition:width .3s"></div>' +
      '</div>' : '') +
    '</div>';

  // ── SECTION 5: Description — ALWAYS shown ────────────────────────────────
  var descHtml =
    '<div style="margin-bottom:14px">' +
      '<div class="stat-label" style="margin-bottom:8px">Description</div>' +
      (t.Description && t.Description.trim()

function saveTask() {
  var title = el('f-t-title').value.trim();
  var proj  = el('f-t-proj').value;
  var assigneeIds = _msGetIds('ms-t-assignee');
  var assignedTeams = _msGetIds('ms-t-teams');

    toast('Title and at least one Assignee or Team are required.', 'error'); return;
  }

  var sfnId  = el('f-t-parent').value || '';
  var fnSel2 = el('f-t-function');
  var fnId   = (fnSel2 ? fnSel2.value : '') || '';
  // If Sub-Function selected but no explicit Function, derive from Sub-Function's parent
  if (sfnId && !fnId) {
    var sfnRec = (APP.functions || []).find(function(f) { return f.Function_ID === sfnId; });
    if (sfnRec && sfnRec.Parent_Fn_ID) fnId = sfnRec.Parent_Fn_ID;
  }

  var tid = el('task-id').value;
  var rec = {
    Title:           title,
    Description:     el('f-t-desc').value,
    Proj_ID:         proj || '',
    SubFn_ID:        sfnId,
    Function_ID:     fnId,
    Assignee_IDs:    assigneeIds,
    Assigned_Teams:  assignedTeams || '',
    Priority:        el('f-t-priority').value,
    Status:          el('f-t-status').value,
    Recurring_Task:  el('f-t-recurring').value || 'One Time',
    Due_Date:        el('f-t-due').value,
    Estimated_Hours: parseFloat(el('f-t-est').value) || 0
  };
  // Add Links only if the field exists (requires migrateSchema to have added the column)
  var linksEl = el('f-t-links');
  if (linksEl) rec.Links = linksEl.value.trim();
  // Include Assigner_ID only if: creating a new task (always set to current user),
  // or the user changed it via the assigner dropdown (requires permission check)
  var _asgrSelEl = el('f-t-assigner-sel');
  if (!tid) {
    // New task creation — always set assigner to current user
    rec.Assigner_ID = APP.currentUser.empId;
  } else if (_asgrSelEl) {
    // Edit with permission — user can choose different assigner
    rec.Assigner_ID = _asgrSelEl.value || APP.currentUser.empId;
  }
  // If no assigner dropdown is shown (read-only user), Assigner_ID is NOT included in rec,
  // so dbUpdate will leave the existing Assigner_ID untouched.
  // Assigned Date (Created_At) — editable so managers can correct import dates
  var _adSaveEl = el('f-t-assigned-date');
  if (_adSaveEl && _adSaveEl.value) {
    try { rec.Created_At = new Date(_adSaveEl.value).toISOString(); } catch(e) {}

  var btn = el('task-wz-next');
  _btnLoading(btn, tid ? 'Updating…' : 'Creating…');
  var fn  = tid ? 'updateTask' : 'createTask';
  var arg = tid ? [tid, rec, APP.currentUser.email] : [rec, APP.currentUser.email];

  google.script.run
    .withSuccessHandler(function(id) {
      _btnReset(btn);
      closeWizard('task');
      toast(tid ? 'Task updated!' : 'Task ' + id + ' created!', 'success');
      refresh();
    })
    .withFailureHandler(function(err) {
      _btnReset(btn);
      toast(err.message || 'Failed', 'error');
    })[fn].apply(null, arg);
}

// Tracks task IDs that the user removed in the edit wizard (to be deleted on save)
var _projDeletedTaskIds = [];

// ── Assign-To filter setup ────────────────────────────────────────────────────
// Determines which roles the current user is allowed to assign to.
function _projAssignableRoles() {
  var role = APP.currentUser ? APP.currentUser.role : '';
  if (_isAdmin(role))    return ['Super Admin','Admin','Team Captain','Team Facilitator','Team Member','Intern'];
  if (_isManager(role))  return ['Team Captain','Team Facilitator','Team Member','Intern']; // TC and TF access each other
  return ['Super Admin','Admin','Team Captain','Team Facilitator','Team Member','Intern']; // TM → any person
}

// Returns true if the current user can assign to whole teams (SA/Admin/TC/TF)
function _canAssignToTeams() {
  return APP.currentUser ? _isManager(APP.currentUser.role) : false;
}

// Hint text describing who team assignments resolve to based on assigner role
function _teamAssignHint() {
  var role = APP.currentUser ? APP.currentUser.role : '';
  if (_isAdmin(role))  return '(auto-assigns to Team Captains)';
  if (_isManager(role)) return '(auto-assigns to Captains, Facilitators & Members)';

// Builds a team multi-select from TEAM_HIERARCHY top-level divisions.
// keepTeams: comma-string of already-selected team names to restore.
function _buildTeamsMultiSelect(msId, keepTeams) {
  var items = Object.keys(TEAM_HIERARCHY).map(function(div) {

// Initialises the Team filter and Role filter dropdowns, then builds the people list.
// keepIds: comma-string of already-selected person IDs to preserve.
// keepTeams: comma-string of already-selected team names to restore.
function _projInitAssignFilters(keepIds, keepTeams) {
  var role    = APP.currentUser ? APP.currentUser.role : '';
  var myTeam  = APP.currentUser ? (APP.currentUser.team || '') : '';

  // ── Team assignment widget (SA/Admin/TC/TF only) ──
  var teamWrap = el('proj-team-assign-wrap');
  if (teamWrap) {
    var canTeam = _canAssignToTeams();
    teamWrap.style.display = canTeam ? '' : 'none';
    if (canTeam) {
      var hintEl = el('proj-team-assign-hint');
      if (hintEl) hintEl.textContent = _teamAssignHint();
      _buildTeamsMultiSelect('ms-p-teams', keepTeams || '');
    }
  }

  // ── Team filter dropdown (person picker) ──
  var teamSel = el('f-p-assign-team');
  if (teamSel) {
    teamSel.innerHTML = '<option value="">All Teams</option>';
    Object.keys(TEAM_HIERARCHY).forEach(function(div) {
      var grp = document.createElement('optgroup');
      grp.label = div;
      var dOpt = document.createElement('option');
      dOpt.value = div; dOpt.textContent = div;
      grp.appendChild(dOpt);
      TEAM_HIERARCHY[div].forEach(function(sub) {
        var sOpt = document.createElement('option');
        sOpt.value = sub;
        sOpt.textContent = '\u00a0\u00a0\u00a0' + sub;
        grp.appendChild(sOpt);
      });
      teamSel.appendChild(grp);
    });
    // Pre-select own team for Team Captain / Facilitator (not admin, not TM, not Intern)
    if (!_isAdmin(role) && role !== 'Team Member' && role !== 'Intern' && myTeam) teamSel.value = myTeam;
  }

  // ── Role selector ──
  var roleSel = el('f-p-assign-role');
  if (roleSel) {
    var allowed = _projAssignableRoles();
    roleSel.innerHTML = '<option value="">All Roles</option>';
    allowed.forEach(function(r) {
      var opt = document.createElement('option');
      opt.value = r; opt.textContent = r;
      roleSel.appendChild(opt);
    });
  }

  _projBuildAssigneeDropdown(keepIds);
}

// Rebuilds the ms-p-owner dropdown respecting team + role filters.
// keepIds: comma-string of IDs that should remain checked after rebuild.
function _projBuildAssigneeDropdown(keepIds) {
  var teamFilter = (el('f-p-assign-team') || {}).value || '';
  var roleFilter = (el('f-p-assign-role') || {}).value || '';
  var allowed    = _projAssignableRoles();

  // Current selections to preserve
  var currentIds = keepIds !== undefined ? keepIds : _msGetIds('ms-p-owner');

  var items = (APP.employees || [])
    .filter(function(e) {
      if (!e.Emp_ID) return false;
      // Role-based filter — only show roles the assigner is allowed to assign to
      if (allowed.indexOf(e.Role) === -1) return false;
      // Team/sub-dept filter
      if (teamFilter) {
        var isDiv = TEAM_HIERARCHY.hasOwnProperty(teamFilter);
        if (isDiv) {
          // Top-level division: match Team OR any of its Sub_Departments
          var subs = TEAM_HIERARCHY[teamFilter] || [];
          var match = (e.Team === teamFilter) ||
                      (subs.indexOf(e.Team) !== -1) ||
                      (subs.indexOf(e.Sub_Department) !== -1);
          if (!match) return false;
        } else {
          // Sub-department selected
          if (e.Sub_Department !== teamFilter && e.Team !== teamFilter) return false;
        }
      }
      // Role filter
      if (roleFilter && e.Role !== roleFilter) return false;
      return true;
    })
    .map(function(e) {
      var sub = [e.Role, e.Team, e.Sub_Department].filter(Boolean).join(' · ');
      return { value: e.Emp_ID, label: e.Name || e.Emp_ID, sub: sub };
    });

  _msBuild('ms-p-owner', items, currentIds);
}

// ── Meeting attendee picker — mirrors _projInitAssignFilters / _projBuildAssigneeDropdown ──

// Rebuilds the mtg-asgn-people dropdown respecting team + role filters.
function _mtgBuildPeoplePicker(keepIds) {
  var teamFilter = (el('mtg-asgn-filter-team') || {}).value || '';
  var roleFilter = (el('mtg-asgn-filter-role') || {}).value || '';
  var currentIds = keepIds !== undefined ? keepIds : _msGetIds('mtg-asgn-people');

  var items = (APP.employees || [])
    .filter(function(e) {
      if (!e.Emp_ID) return false;
      if (e.Email === APP.currentUser.email) return false; // exclude self
      if (teamFilter) {
        var isDiv = TEAM_HIERARCHY.hasOwnProperty(teamFilter);
        if (isDiv) {
          var subs = TEAM_HIERARCHY[teamFilter] || [];
          var match = (e.Team === teamFilter) ||
                      (subs.indexOf(e.Team) !== -1) ||
                      (subs.indexOf(e.Sub_Department) !== -1);
          if (!match) return false;
        } else {
          if (e.Sub_Department !== teamFilter && e.Team !== teamFilter) return false;
        }
      }
      if (roleFilter && e.Role !== roleFilter) return false;
      return true;
    })
    .sort(function(a, b) { return (a.Name || '').localeCompare(b.Name || ''); })
    .map(function(e) {
      var sub = [e.Role, e.Team].filter(Boolean).join(' · ');
      return { value: e.Emp_ID, label: e.Name || e.Emp_ID, sub: sub };
    });

  _msBuild('mtg-asgn-people', items, currentIds);
}

// ── Task Assign-To filter setup ───────────────────────────────────────────────
// Mirrors project assign logic — same hierarchy rules apply.
function _tskAssignableRoles() {
  var role = APP.currentUser ? APP.currentUser.role : '';
  if (_isAdmin(role))    return ['Super Admin','Admin','Team Captain','Team Facilitator','Team Member','Intern'];
  if (_isManager(role))  return ['Team Captain','Team Facilitator','Team Member','Intern']; // TC and TF access each other
  return ['Super Admin','Admin','Team Captain','Team Facilitator','Team Member','Intern']; // TM → any person
}

// keepIds: comma-string of already-selected person IDs.
// keepTeams: comma-string of already-selected team names.
function _tskInitAssignFilters(keepIds, keepTeams) {
  var role   = APP.currentUser ? APP.currentUser.role : '';
  var myTeam = APP.currentUser ? (APP.currentUser.team || '') : '';

  // ── Team assignment widget (SA/Admin/TC/TF only) ──
  var teamWrap = el('task-team-assign-wrap');
  var teamTog  = el('f-t-team-tog');
  var canTeam  = _canAssignToTeams();
  // Show/hide toggle button; expand section only if teams already assigned
  if (teamTog)  teamTog.style.display  = canTeam ? '' : 'none';
  if (teamWrap) {
    var hasTeams = !!(keepTeams && keepTeams.trim());
    teamWrap.style.display = (canTeam && hasTeams) ? '' : 'none';
    if (canTeam) {
      var hintEl = el('task-team-assign-hint');
      if (hintEl) hintEl.textContent = _teamAssignHint();
      _buildTeamsMultiSelect('ms-t-teams', keepTeams || '');
    }
  }

  var teamSel = el('f-t-assign-team');
  if (teamSel) {
    teamSel.innerHTML = '<option value="">All Teams</option>';
    Object.keys(TEAM_HIERARCHY).forEach(function(div) {
      var grp = document.createElement('optgroup');
      grp.label = div;
      var dOpt = document.createElement('option');
      dOpt.value = div; dOpt.textContent = div;
      grp.appendChild(dOpt);
      TEAM_HIERARCHY[div].forEach(function(sub) {
        var sOpt = document.createElement('option');
        sOpt.value = sub;
        sOpt.textContent = '\u00a0\u00a0\u00a0' + sub;
        grp.appendChild(sOpt);
      });
      teamSel.appendChild(grp);
    });
    if (!_isAdmin(role) && role !== 'Team Member' && role !== 'Intern' && myTeam && !keepIds) teamSel.value = myTeam;
  }
  var roleSel = el('f-t-assign-role');
  if (roleSel) {
    var allowed = _tskAssignableRoles();
    roleSel.innerHTML = '<option value="">All Roles</option>';
    allowed.forEach(function(r) {
      var opt = document.createElement('option');
      opt.value = r; opt.textContent = r;
      roleSel.appendChild(opt);
    });
  }
  _tskBuildAssigneeDropdown(keepIds);
}

function _tskToggleTeamAssign() {
  var wrap = el('task-team-assign-wrap');
  var tog  = el('f-t-team-tog');
  if (!wrap) return;
  var showing = wrap.style.display !== 'none';
  wrap.style.display = showing ? 'none' : '';
  if (tog) tog.textContent = showing ? '+ Assign to Team' : '— Hide Team Assign';
}

function _tskBuildAssigneeDropdown(keepIds) {
  var teamFilter = (el('f-t-assign-team') || {}).value || '';
  var roleFilter = (el('f-t-assign-role') || {}).value || '';
  var allowed    = _tskAssignableRoles();
  var currentIds = keepIds !== undefined ? keepIds : _msGetIds('ms-t-assignee');
  var items = (APP.employees || [])
    .filter(function(e) {
      if (!e.Emp_ID) return false;
      if (allowed.indexOf(e.Role) === -1) return false;
      if (teamFilter) {
        var isDiv = TEAM_HIERARCHY.hasOwnProperty(teamFilter);
        if (isDiv) {
          var subs = TEAM_HIERARCHY[teamFilter] || [];
          var match = (e.Team === teamFilter) || (subs.indexOf(e.Team) !== -1) || (subs.indexOf(e.Sub_Department) !== -1);
          if (!match) return false;
        } else {
          if (e.Sub_Department !== teamFilter && e.Team !== teamFilter) return false;
        }
      }
      if (roleFilter && e.Role !== roleFilter) return false;
      return true;
    })
    .map(function(e) {
      var sub = [e.Role, e.Team, e.Sub_Department].filter(Boolean).join(' · ');
      return { value: e.Emp_ID, label: e.Name || e.Emp_ID, sub: sub };
    });
  _msBuild('ms-t-assignee', items, currentIds);
}

// ── Existing task loader for Edit mode ────────────────────────────────────────
// Loads Functions and Sub-Functions from APP.functions for this project.
function _projLoadExistingTasks(projId) {
  var rows = el('proj-task-rows');
  rows.innerHTML = '';

  // Top-level Functions for this project
  var topFns = (APP.functions || []).filter(function(f) {
    return !f.Parent_Fn_ID && f.Proj_ID === projId;
  });
  // Sub-Functions (grouped by parent Function_ID)
  var allSubFns = (APP.functions || []).filter(function(f) {
    return !!f.Parent_Fn_ID && f.Proj_ID === projId;
  });

  // Sub-functions with no parent function (orphaned)
  var noFn = allSubFns.filter(function(f) {
    return !topFns.some(function(fn) { return fn.Function_ID === f.Parent_Fn_ID; });
  });

  if (!topFns.length && !noFn.length) { el('proj-task-empty').style.display = 'block'; return; }
  el('proj-task-empty').style.display = 'none';

  topFns.forEach(function(fn) {
    var subFns = allSubFns.filter(function(f) { return f.Parent_Fn_ID === fn.Function_ID; });
    _projAddExistingFnRow(rows, fn, subFns, projId);
  });

  if (noFn.length) _projAddExistingFnRow(rows, null, noFn, projId);
}

  var fnItem = document.createElement('div');
  fnItem.className = 'proj-fn-item';
  if (fn) fnItem.setAttribute('data-fn-id', fn.Function_ID);
  fnItem.style.cssText = 'border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px';
  var fnHeader =
    '<div style="display:flex;gap:8px;align-items:center">' +
      '<span class="material-symbols-outlined" style="font-size:14px;color:var(--accent);flex-shrink:0">functions</span>' +
      '<input class="fc proj-fn-name" value="' + esc(fn ? fn.Name : '') + '" placeholder="Function name *" style="flex:1;min-width:0;font-weight:500"/>' +
      '<button type="button" class="btn btn-ghost" style="padding:4px 10px;font-size:11px;min-width:0;flex-shrink:0;white-space:nowrap" onclick="projAddSubFnRow(this)">+ Sub-Function</button>' +
      '<button type="button" class="btn btn-ghost" style="padding:6px 10px;min-width:0;flex-shrink:0;color:var(--muted)" onclick="var i=this.closest(\'.proj-fn-item\');i.remove();if(!el(\'proj-task-rows\').children.length)el(\'proj-task-empty\').style.display=\'block\'">✕</button>' +

function saveProject() {
  var name = el('f-p-name').value.trim();
  if (!name) { toast('Project name is required.', 'error'); return; }
  var rec = {
    Name:           name,
    Description:    el('f-p-desc').value,
    Parent_Proj_ID: (el('f-p-parent') ? el('f-p-parent').value : '') || '',
    Assignee_IDs:   _msGetIds('ms-p-owner') || '',   // specific people
    Assigned_Teams: _msGetIds('ms-p-teams') || '',   // team-level assignment
    Priority:       el('f-p-priority').value,
    Status:         el('f-p-status').value,
    Start_Date:     el('f-p-start').value,
    Deadline:       el('f-p-deadline').value,
    Chat_Link:      el('f-p-chatlink').value.trim()
    // Owner_IDs intentionally omitted — server locks it to creator and never changes it
  };

  // ── Edit mode: update existing project then process task changes ──
  var editId = el('proj-id').value;
  if (editId) {
    var btn2 = el('proj-wz-next');
    btn2.disabled = true;
    btn2.innerHTML = '<span class="btn-spinner"></span> Updating…';
    google.script.run
      .withSuccessHandler(function() {
        _processEditTasks(editId, function() {
          btn2.disabled = false;
          btn2.textContent = 'Update Project';
          closeWizard('proj');
          toast('Project updated!', 'success');
          refresh();
        });
      })
      .withFailureHandler(function(err) {
        btn2.disabled = false;
        btn2.textContent = 'Update Project';
        toast(err.message || 'Update failed', 'error');
      })
      .updateProject(editId, rec, APP.currentUser.email);
    return;
  }

  // Collect Function → Sub-Function → Task hierarchy from step 4
  var fnItems = [];
  el('proj-task-rows').querySelectorAll(':scope > .proj-fn-item').forEach(function(fnEl) {
    var fnNameInp = fnEl.querySelector('.proj-fn-name');
    var fnName = fnNameInp ? fnNameInp.value.trim() : '';
    var subFns = [];
    fnEl.querySelectorAll('.proj-task-item').forEach(function(item) {
      var taskRow = item.querySelector(':scope > div');
      var title = taskRow ? (taskRow.querySelector('.proj-task-title') || {}).value || '' : '';
      title = title.trim();
      if (!title) return;
      var assigneeId = taskRow ? (taskRow.querySelector('.proj-task-assignee') || {}).value || '' : '';
      var tasks = [];
      item.querySelectorAll('.proj-task-row').forEach(function(row) {
        var stTitle = (row.querySelector('.proj-task-title') || {}).value.trim();
        if (stTitle) tasks.push({ title: stTitle, assigneeId: (row.querySelector('.proj-task-assignee') || {}).value || '' });
      });
      subFns.push({ title: title, assigneeId: assigneeId, tasks: tasks });
    });
    if (fnName || subFns.length) fnItems.push({ fnName: fnName, subFns: subFns });
  });

  var btn = el('proj-wz-next');
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spinner"></span> Creating…';
  google.script.run
    .withSuccessHandler(function(projId) {
      if (!fnItems.length) {
        btn.disabled = false;
        btn.textContent = 'Create Project';
        closeWizard('proj');
        toast('Project ' + projId + ' created!', 'success');
        refresh();
        return;
      }
      // Sequential: Function → Sub-Functions → Tasks
      var totalCreated = 0;

      function createTasks(tasks, sfnId, fnId, cb) {
        (function next(i) {
          if (i >= tasks.length) { cb(); return; }
          var t = tasks[i];
          google.script.run
            .withSuccessHandler(function() { totalCreated++; next(i + 1); })
            .withFailureHandler(function(err) { toast('Task "' + t.title + '" failed: ' + (err && err.message || 'Error'), 'error'); next(i + 1); })
            .createTask({ Proj_ID: projId, SubFn_ID: sfnId, Function_ID: fnId, Title: t.title, Assignee_IDs: t.assigneeId, Status: 'Yet to Start', Priority: rec.Priority }, APP.currentUser.email);
        }(0));
      }

      function createSubFns(subFns, fnId, cb) {
        (function next(i) {
          if (i >= subFns.length) { cb(); return; }
          var s = subFns[i];
          // Sub-Functions are now stored in the Functions sheet with Parent_Fn_ID
          google.script.run
            .withSuccessHandler(function(r) {
              totalCreated++;
              var sfnId = (r && r.ok) ? r.id : '';
              createTasks(s.tasks, sfnId, fnId, function() { next(i + 1); });
            })
            .withFailureHandler(function(err) { toast('Sub-Function "' + s.title + '" failed: ' + (err && err.message || 'Error'), 'error'); next(i + 1); })
            .createFunction({ Proj_ID: projId, Parent_Fn_ID: fnId, Name: s.title }, APP.currentUser.email);
        }(0));
      }

      (function createNextFn(fi) {
        if (fi >= fnItems.length) {
          btn.disabled = false;
          btn.textContent = 'Create Project';
          closeWizard('proj');
          toast('Project ' + projId + ' created with ' + totalCreated + ' item(s)!', 'success');
          refresh();
          return;
        }
        var fn = fnItems[fi];
        if (!fn.fnName) {
          // No function name — create sub-functions without a Function record
          createSubFns(fn.subFns, '', function() { createNextFn(fi + 1); });
          return;
        }
        google.script.run
          .withSuccessHandler(function(r) {
            var fnId = (r && r.ok) ? r.id : '';
            createSubFns(fn.subFns, fnId, function() { createNextFn(fi + 1); });
          })
          .withFailureHandler(function(err) {
            toast('Function "' + fn.fnName + '" failed: ' + (err && err.message || 'Error'), 'error');
            createSubFns(fn.subFns, '', function() { createNextFn(fi + 1); });
          })
          .createFunction({ Proj_ID: projId, Name: fn.fnName }, APP.currentUser.email);
      }(0));
    })
    .withFailureHandler(function(err) { btn.disabled = false; btn.textContent = 'Create Project'; toast(err.message || 'Failed', 'error'); })
    .createProject(rec, APP.currentUser.email);
}

// ── Edit-mode task processor ──────────────────────────────────────────────────
// Called after updateProject succeeds. Deletes removed tasks, updates existing
// ones, creates new tasks/sub-tasks, then calls callback().
function _processEditTasks(projId, callback) {
  var email = APP.currentUser.email;
  var ops   = [];

  // Deletes (functions the user removed via ✕ on an existing row)
  _projDeletedTaskIds.forEach(function(fnId) { ops.push({ type: 'delete-fn', fnId: fnId }); });
  _projDeletedTaskIds = [];

  var newTopLevelItems = [];

  // Each .proj-task-item is a Sub-Function; data-fn-id is the Function_ID
  el('proj-task-rows').querySelectorAll('.proj-task-item').forEach(function(item) {
    var fnId     = item.getAttribute('data-fn-id');
    var firstRow = item.querySelector(':scope > div');
    var title    = firstRow ? (firstRow.querySelector('.proj-task-title') || {}).value || '' : '';
    title = title.trim();
    var assignee = firstRow ? (firstRow.querySelector('.proj-task-assignee') || {}).value || '' : '';

    if (fnId) {
      // Existing sub-function → update name if changed
      var origTitle = item.getAttribute('data-orig-title') || '';
      if (title && title !== origTitle) {
        ops.push({ type: 'update-fn', fnId: fnId, updates: { Name: title } });
      }
      // Its child tasks
      item.querySelectorAll('.proj-task-row').forEach(function(row) {
        var tId    = row.getAttribute('data-task-id');
        var tTitle = (row.querySelector('.proj-task-title') || {}).value || '';
        tTitle = tTitle.trim();
        var tAsgn  = (row.querySelector('.proj-task-assignee') || {}).value || '';
        if (tId) {
          var origT = row.getAttribute('data-orig-title')    || '';
          var origA = row.getAttribute('data-orig-assignee') || '';
          if (tTitle && (tTitle !== origT || tAsgn !== origA)) {
            ops.push({ type: 'update', taskId: tId, updates: { Title: tTitle, Assignee_IDs: tAsgn } });
          }
        } else if (tTitle) {
          ops.push({ type: 'create-task', subFnId: fnId, title: tTitle, assignee: tAsgn });
        }
      });
    } else if (title) {
      // New sub-function → collect child tasks and queue for creation
      var tasks = [];
      item.querySelectorAll('.proj-task-row').forEach(function(row) {
        var tTitle = (row.querySelector('.proj-task-title') || {}).value || '';
        tTitle = tTitle.trim();
        if (tTitle) tasks.push({ title: tTitle, assigneeId: (row.querySelector('.proj-task-assignee') || {}).value || '' });
      });
      // Read parent Function_ID from item data attribute or container
      var parentFnId = item.getAttribute('data-parent-fn-id') || '';
      newTopLevelItems.push({ title: title, assigneeId: assignee, tasks: tasks, parentFnId: parentFnId });
    }
  });

  // Run ops sequentially, then create new sub-functions with their tasks
  (function runOp(i) {
    if (i >= ops.length) {
      (function createNext(ti) {
        if (ti >= newTopLevelItems.length) { callback(); return; }
        var sf = newTopLevelItems[ti];
        google.script.run
          .withSuccessHandler(function(r) {
            var newSfnId = r && r.id ? r.id : '';
            (function createTask(ki) {
              if (ki >= sf.tasks.length) { createNext(ti + 1); return; }
              var t = sf.tasks[ki];
              google.script.run
                .withSuccessHandler(function() { createTask(ki + 1); })
                .withFailureHandler(function(err) { toast('Task "' + t.title + '" failed: ' + (err && err.message || 'Unknown error'), 'error'); createTask(ki + 1); })
                .createTask({ Proj_ID: projId, SubFn_ID: newSfnId, Function_ID: sf.parentFnId, Title: t.title, Assignee_IDs: t.assigneeId, Status: 'Yet to Start' }, email);
            }(0));
          })
          .withFailureHandler(function(err) { toast('Sub-function "' + sf.title + '" failed: ' + (err && err.message || 'Unknown error'), 'error'); createNext(ti + 1); })
          .createFunction({ Proj_ID: projId, Parent_Fn_ID: sf.parentFnId, Name: sf.title }, email);
      }(0));
      return;
    }
    var op   = ops[i];
    var next = function() { runOp(i + 1); };
    if (op.type === 'delete-fn') {
      google.script.run.withSuccessHandler(next).withFailureHandler(next).deleteFunction(op.fnId, email);
    } else if (op.type === 'update-fn') {
      google.script.run.withSuccessHandler(next).withFailureHandler(next).updateFunction(op.fnId, op.updates, email);
    } else if (op.type === 'update') {
      google.script.run.withSuccessHandler(next).withFailureHandler(next).updateTask(op.taskId, op.updates, email);
    } else if (op.type === 'create-task') {
      var sfnRec = (APP.functions || []).find(function(f) { return f.Function_ID === op.subFnId; });
      var pfnId  = sfnRec ? sfnRec.Parent_Fn_ID || '' : '';
      google.script.run.withSuccessHandler(next).withFailureHandler(next)
        .createTask({ Proj_ID: projId, SubFn_ID: op.subFnId, Function_ID: pfnId, Title: op.title, Assignee_IDs: op.assignee, Status: 'Yet to Start' }, email);
    } else { next(); }
  }(0));
}

// Reset the manager field to a clean, editable, unblocked state
function _regResetManagerField() {
  var inp  = el('reg-manager-email');

  inp.readOnly          = false;
  inp.value             = '';
  inp.style.background  = '';

}

// Fetch the team's manager (priority: TC → Admin → Super Admin → TF) for the
// current team/subdept and auto-fill the manager email.
// Only triggers for Team Member / Team Facilitator / Intern roles.
// If no manager is found, registration is BLOCKED — user must contact admin.
function _regAutoFillManager() {
  var role    = el('reg-role').value;
  var team    = el('reg-division').value;
  var subDept = el('reg-subdept').value;
  var inp     = el('reg-manager-email');
  var hint    = el('reg-manager-hint');

  // Only auto-fill for TM / TF / Intern
  if (role !== 'Team Member' && role !== 'Team Facilitator' && role !== 'Intern') return;
  if (!team) { _regResetManagerField(); return; }

  // Loading state — disable submit while the lookup runs
  inp.readOnly                  = true;
  inp.value                     = '';
  inp.placeholder               = 'Looking up manager…';
  inp.style.background          = 'var(--bg)';
  inp.style.borderColor         = '';
  el('btn-submit-reg').disabled = true;
  if (hint) { hint.textContent = '⏳ Fetching manager from database…'; hint.style.color = 'var(--muted)'; hint.style.display = 'block'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.ok && res.email) {
        // Captain found — auto-fill and unlock submit
        inp.value                     = res.email;
        inp.readOnly                  = true;
        inp.style.background          = 'var(--bg)';
        inp.style.borderColor         = 'var(--ok)';
        inp.placeholder               = '';
        el('btn-submit-reg').disabled = false;
        if (hint) {
          hint.textContent   = '✓ Auto-filled: ' + res.name + ' (Manager)';
          hint.style.color   = 'var(--ok, #2e7d32)';
          hint.style.display = 'block';
        }
      } else {
        // No TC registered — block registration entirely
        inp.readOnly                  = true;
        inp.value                     = '';
        inp.style.background          = '#fff8f8';
        inp.style.borderColor         = 'var(--danger, #c62828)';
        inp.placeholder               = 'No manager assigned for this team';
        el('btn-submit-reg').disabled = true;
        if (hint) {
          hint.innerHTML     = 'No manager is assigned for this team yet. Please contact the admin.';
          hint.style.color   = 'var(--danger, #c62828)';
          hint.style.display = 'block';
        }
      }
    })
    .withFailureHandler(function() {
      // Network/script error — fail open so user can proceed manually
      inp.readOnly                  = false;
      inp.style.background          = '';
      inp.style.borderColor         = '';
      inp.placeholder               = 'Enter manager email manually';
      el('btn-submit-reg').disabled = false;
      if (hint) { hint.style.display = 'none'; }
    })
    .getTeamCaptainByTeam(team, subDept || '');
}

function submitRegistration() {
  var fname       = (el('reg-fname').value        || '').trim();
  var lname       = (el('reg-lname').value        || '').trim();
  var email       = (el('reg-email').value        || '').trim();
  var password    = (el('reg-password').value     || '');
  var confirm_    = (el('reg-confirm').value      || '');
  var role        = (el('reg-role').value         || '').trim();
  var designation = (el('reg-designation').value  || '').trim();
  var dob         = (el('reg-dob').value          || '').trim();
  var division    = (el('reg-division').value     || '').trim();
  var subdept     = (el('reg-subdept').value      || '').trim();
  var managerEmail = (el('reg-manager-email').value || '').trim();
  var message_    = (el('reg-message').value      || '').trim();

  var errEl = el('reg-error');
  errEl.style.display = 'none';

  function showRegError(msg) {
    errEl.textContent   = msg;
    errEl.style.display = 'block';
  }

  if (!fname)        { showRegError('First name is required.');                      return; }
  if (!lname)        { showRegError('Last name is required.');                       return; }
  if (!email)        { showRegError('Email is required.');                           return; }
  if (!password)     { showRegError('Password is required.');                        return; }
  if (password.length < 6) { showRegError('Password must be at least 6 characters.'); return; }
  if (password !== confirm_) { showRegError('Passwords do not match.');              return; }
  if (!role)         { showRegError('Please select a role.');                        return; }
  if (!dob)          { showRegError('Date of birth is required.');                   return; }
  if (!division)     { showRegError('Please select a division.');                    return; }
  // Manager email is optional for Super Admin only; required for all other roles
  if (!managerEmail && role !== 'Super Admin') { showRegError("Manager's / reporting email is required."); return; }

  var btn = el('btn-submit-reg');
  _btnLoading(btn, 'Submitting…');

  var record = {
    first_name:     fname,
    last_name:      lname,
    email:          email,
    password:       password,  // server will hash this
    role:           role,
    designation:    designation,
    dob:            dob,
    team:           division,
    sub_department: subdept,
    manager_email:  managerEmail,
    message:        message_
  };

  google.script.run
    .withSuccessHandler(function(result) {
      _btnReset(btn);
      if (!result || !result.ok) {
        showRegError((result && result.error) || 'Registration failed. Please try again.');
        return;
      }
      closeModal('register-modal');
      toast('Registration submitted! Your manager will review your request.', 'success');
    })
    .withFailureHandler(function(err) {
      _btnReset(btn);
      showRegError(err.message || 'Registration failed. Please try again.');
    })
    .submitRegistration(record);
}

    var people  = m.attendees && m.attendees.length
                  ? m.attendees.slice(0,3).join(', ') + (m.attendees.length > 3 ? ' +' + (m.attendees.length - 3) + ' more' : '')

      ? '<span class="meet-type-badge mtb-company"><span class="material-symbols-outlined" style="font-size:11px;vertical-align:middle">corporate_fare</span> Company</span>'
      : m.type === 'team'

        : '';

    var canCancel = _isAdmin(APP.currentUser.role) || _isManager(APP.currentUser.role) ||
                    m.creatorEmail === APP.currentUser.email || m.organizerEmail === APP.currentUser.email;
    var deleteBtn = canCancel

      : '';

        '<span class="material-symbols-outlined" style="font-size:20px;color:' + (m.type==='company'?'#1565c0':m.type==='team'?'#2e7d32':'var(--p)') + '">' +
          (m.type==='company' ? 'corporate_fare' : m.type==='team' ? 'groups' : 'video_call') +
        '</span>' +
      '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="meet-card-title">' + typeBadge + esc(m.title) + '</div>' +
        '<div class="meet-card-meta"><span class="material-symbols-outlined" style="font-size:13px;vertical-align:middle">schedule</span> ' + esc(dateStr) +
          (people !== 'No attendees' ? ' &nbsp;·&nbsp; <span class="material-symbols-outlined" style="font-size:13px;vertical-align:middle">group</span> ' + esc(people) : '') + '</div>' +
        (m.description ? '<div class="meet-card-meta" style="margin-top:2px">' + esc(m.description) + '</div>' : '') +
        (m.attendees && m.attendees.length
          ? '<div class="mtg-attendees" style="font-size:12px;color:var(--muted);margin-top:4px;">Attendees: '
              + m.attendees.slice(0, 5).map(function(a) { return esc(a); }).join(', ')
              + (m.attendees.length > 5 ? ' +' + (m.attendees.length - 5) + ' more' : '')
              + '</div>'
          : '') +
      '</div>' +
      '<div class="meet-card-actions">' +
        (m.meetLink ? '<a href="' + esc(m.meetLink) + '" target="_blank" class="btn btn-accent btn-sm"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">video_call</span> Join</a>' : '') +
        (m.htmlLink ? '<a href="' + esc(m.htmlLink) + '" target="_blank" class="btn btn-ghost btn-sm" title="View in Calendar"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle">event</span></a>' : '') +

    '</div>';
  }).join('');

function openScheduleForm(type) {

  // Title & type bar
  var typeLabels  = { company: 'Company Meeting', team: 'Team Meeting', custom: 'Custom Meeting' };

  bar.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">' + typeIcons[type] + '</span>' + typeLabels[type];

  } else if (type === 'company') {
    el('mf-auto-invite-text').textContent = 'All active employees in the company will be auto-invited.';
  }

  // Submit button label
  var labels = { company: 'Schedule Company Meeting', team: 'Schedule Team Meeting', custom: 'Create Meeting' };
  el('mf-submit-label').textContent = labels[type];

  var placeholders = { company: 'e.g. All-Hands Company Meeting', team: 'e.g. Weekly Team Standup', custom: 'e.g. Project Kickoff' };
  el('mf-title').placeholder = placeholders[type];

  // Default datetime = next rounded 30 min
  var now = new Date();
  now.setMinutes(now.getMinutes() < 30 ? 30 : 60, 0, 0);
  var pad = function(n) { return n < 10 ? '0' + n : n; };
  el('mf-datetime').value = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes());

  // ── Populate meeting attendee pickers (mirrors New Project "Assign To" section) ──

function submitScheduleMeeting() {
  var title    = (el('mf-title').value || '').trim();
  var dtVal    = el('mf-datetime').value;
  var duration = parseInt(el('mf-duration').value) || 30;
  var desc     = (el('mf-desc').value || '').trim();
  var type     = el('mf-type').value || 'custom';

  if (!title) { toast('Meeting title is required', 'error'); return; }
  if (!dtVal)  { toast('Date and time are required', 'error'); return; }

  var startIso = new Date(dtVal).toISOString();
  var btn      = el('mf-submit-btn');
  btn.disabled = true;
  el('mf-submit-label').textContent = 'Creating…';

  var onSuccess = function(r) {
    btn.disabled = false;
    el('mf-submit-label').textContent = { company: 'Schedule Company Meeting', team: 'Schedule Team Meeting', custom: 'Create Meeting' }[type] || 'Create Meeting';
    if (!r || !r.ok) { toast('Error: ' + (r && r.error || 'Failed to schedule meeting'), 'error'); return; }
    closeScheduleForm();
    _showMeetCreatedBanner(r);
    loadMeetings();
    toast('Meeting scheduled!', 'success');
  };
  var onError = function(err) {
    btn.disabled = false;
    el('mf-submit-label').textContent = 'Create Meeting';
    toast('Error: ' + err.message, 'error');
  };

  if (type === 'custom') {
    // Read from the ms-widget pickers (same pattern as New Project "Assign To")
    var attendeeIds   = _msGetIds('mtg-asgn-people').split(',').filter(Boolean);
    var attendeeTeams = _msGetIds('mtg-asgn-teams').split(',').filter(Boolean);

    var record = {
      title: title, startIso: startIso, durationMins: duration,
      description: desc, type: 'personal',
      attendeeIds: attendeeIds, attendeeTeams: attendeeTeams
    };
    google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onError)
      .scheduleMeeting(record, APP._verifiedEmail);
  } else {
    var team = type === 'team' ? (el('mf-team').value || '') : '';
    google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onError)
      .scheduleMeetingWithTemplate({ type: type, title: title, startIso: startIso, durationMins: duration, description: desc, team: team }, APP.currentUser.email);
  }
}
