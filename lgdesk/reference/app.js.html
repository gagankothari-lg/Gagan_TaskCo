function _atmProjChange(n) {
  var projId = (el('atm-proj-' + n) || {}).value || '';
  var fnSel  = el('atm-fn-'   + n);
  var sfnSel = el('atm-sfn-'  + n);

  // Reset Function dropdown — top-level functions only, filtered by project
  if (fnSel) {
    var curFn = fnSel.value;
    fnSel.innerHTML = '<option value="">— Function —</option>';
    (APP.functions || []).filter(function(f) {
      if (f.Parent_Fn_ID) return false;
      return !projId || f.Proj_ID === projId;
    }).forEach(function(f) {
      fnSel.innerHTML += '<option value="' + esc(f.Function_ID) + '">' + esc(f.Name) + '</option>';
    });
    fnSel.value = curFn;
  }

  // Reset Sub-Function dropdown
  if (sfnSel) {
    sfnSel.innerHTML = '<option value="">— Sub-Function —</option>';
    (APP.functions || []).filter(function(f) {
      if (!f.Parent_Fn_ID) return false;
      return !projId || f.Proj_ID === projId;
    }).forEach(function(f) {
      sfnSel.innerHTML += '<option value="' + esc(f.Function_ID) + '">' + esc(f.Name) + '</option>';
    });
  }
}

// When Function changes, filter the Sub-Function dropdown
function _atmFnChange(n) {
  var fnId   = (el('atm-fn-'  + n) || {}).value || '';
  var projId = (el('atm-proj-'+ n) || {}).value || '';
  var sfnSel = el('atm-sfn-'  + n);
  if (!sfnSel) return;
  sfnSel.innerHTML = '<option value="">— Sub-Function —</option>';
  (APP.functions || []).filter(function(f) {
    if (!f.Parent_Fn_ID) return false;
    if (fnId   && f.Parent_Fn_ID !== fnId) return false;
    if (projId && f.Proj_ID      !== projId) return false;
    return true;
  }).forEach(function(f) {
    sfnSel.innerHTML += '<option value="' + esc(f.Function_ID) + '">' + esc(f.Name) + '</option>';
  });
}


function _atmKey(event) {

// Helper: hide or show the _ssInit trigger button that sits before a select.
// _ssInit inserts a div button immediately before sel in the DOM.
// When showing the text input, that button must be hidden so the input gets the flex space.
function _atmToggleSsBtn(sel, show) {
  if (!sel) return;
  var prev = sel.previousElementSibling;
  // The _ssInit button is a <div> with tabindex="0"; skip if it's the input or button element
  if (prev && prev.tagName === 'DIV') prev.style.display = show ? '' : 'none';
}

// Explicit input styles to ensure visibility regardless of class overrides

  + 'border:1.5px solid #6366f1;border-radius:4px;outline:none;display:block';

// Toggle Function column between existing-select mode and new-name input mode
function _atmToggleNewFn(n) {
  var sel    = el('atm-fn-'     + n);
  var inp    = el('atm-fn-new-' + n);
  var tog    = el('atm-fn-tog-' + n);
  var sfSel  = el('atm-sfn-'     + n);
  var sfInp  = el('atm-sfn-new-' + n);
  var sfTog  = el('atm-sfn-tog-' + n);
  if (!sel || !inp) return;

  var isNew = inp.classList.contains('hidden');
  if (isNew) {
    // Switch to new-fn mode: hide _ssInit trigger btn + show text input
    _atmToggleSsBtn(sel, false);
    sel.classList.add('hidden');
    inp.classList.remove('hidden');
    inp.style.cssText = _ATM_INP_VIS; // ensure visible regardless of class
    setTimeout(function() { inp.focus(); }, 20);
    if (tog) tog.title = 'Select existing function';
    if (tog) tog.querySelector('span') && (tog.querySelector('span').textContent = 'close');
    // Also switch sub-fn to new mode
    if (sfSel && sfInp) {
      _atmToggleSsBtn(sfSel, false);
      sfSel.classList.add('hidden');
      sfInp.classList.remove('hidden');
      sfInp.style.cssText = _ATM_INP_VIS;
      if (sfTog) sfTog.querySelector('span') && (sfTog.querySelector('span').textContent = 'close');
      if (sfTog) sfTog.title = 'Select existing sub-function';
    }
  } else {
    // Switch back to select mode: restore _ssInit trigger btn
    _atmToggleSsBtn(sel, true);
    sel.classList.remove('hidden');
    inp.classList.add('hidden');
    inp.value = '';
    if (tog) tog.title = 'Create new function';
    if (tog) tog.querySelector('span') && (tog.querySelector('span').textContent = 'add_circle');
    if (sfSel && sfInp) {
      _atmToggleSsBtn(sfSel, true);
      sfSel.classList.remove('hidden');
      sfInp.classList.add('hidden');
      sfInp.value = '';
      if (sfTog) sfTog.querySelector('span') && (sfTog.querySelector('span').textContent = 'add_circle');
      if (sfTog) sfTog.title = 'Create new sub-function';
    }
  }
}

// Toggle Sub-Function column between existing-select mode and new-name input mode

function _atmSaveAll() {
  var vid      = _atmVid;
  var mainBody = el(_atmBodyId(vid));
  if (!mainBody) return;
  var rows = Array.prototype.slice.call(mainBody.querySelectorAll('.atm-data-row'));

  // Parse all rows first; validate before touching server
  var entries = [];
  var valid   = true;

  rows.forEach(function(row) {
    if (!valid) return;
    var n = row.id.replace('atm-row-', '');

    var fnSel      = el('atm-fn-'      + n);
    var fnNewInp   = el('atm-fn-new-'  + n);
    var sfnSel     = el('atm-sfn-'     + n);
    var sfnNewInp  = el('atm-sfn-new-' + n);

    var fnIsNew  = fnNewInp  && !fnNewInp.classList.contains('hidden');
    var sfnIsNew = sfnNewInp && !sfnNewInp.classList.contains('hidden');

    var fnExistingId = (!fnIsNew  && fnSel)    ? (fnSel.value    || '') : '';
    var sfExistingId = (!sfnIsNew && sfnSel)   ? (sfnSel.value   || '') : '';
    var fnNewName    = (fnIsNew   && fnNewInp)  ? (fnNewInp.value  || '').trim() : '';
    var sfNewName    = (sfnIsNew  && sfnNewInp) ? (sfnNewInp.value || '').trim() : '';

    var title  = ((el('atm-title-' + n) || {}).value || '').trim();
    var proj   = (el('atm-proj-'   + n) || {}).value || '';
    var asgn   = (el('atm-asgn-'   + n) || {}).value || (vid === 'my' ? APP.currentUser.empId : '');
    var asgr   = (el('atm-asgr-'   + n) || {}).value || APP.currentUser.empId;
    var status = (el('atm-status-' + n) || {}).value || 'Yet to Start';
    var pri    = (el('atm-pri-'    + n) || {}).value || 'Medium';
    var due    = (el('atm-due-'    + n) || {}).value || '';
    var rec    = (el('atm-rec-'    + n) || {}).value || 'One Time';
    var desc   = ((el('atm-desc-'  + n) || {value: ''}).value || '').trim();
    var links  = ((el('atm-links-' + n) || {value: ''}).value || '').trim();

    // At least one of: new fn name, new sf name, or task title must be present
    var hasContent = fnNewName || sfNewName || fnExistingId || sfExistingId || title;
    if (!hasContent) {
      toast('Row ' + (+n + 1) + ': enter at least a Function, Sub-Function, or Task title.', 'error');
      valid = false; return;
    }

    // Task rows need an assignee; fn/sf-only rows do not
    if (title && !asgn) {
      toast('Row ' + (+n + 1) + ': please select an assignee for the task.', 'error');
      var as = el('atm-asgn-' + n); if (as) as.focus();
      valid = false; return;
    }

    entries.push({
      n: n,
      fnIsNew: fnIsNew,   fnNewName: fnNewName,   fnExistingId: fnExistingId,
      sfnIsNew: sfnIsNew, sfNewName: sfNewName,   sfExistingId: sfExistingId,
      title: title, proj: proj, asgn: asgn, asgr: asgr, status: status, pri: pri, due: due, rec: rec,
      desc: desc, links: links
    });
  });

  if (!valid || !entries.length) return;

  var btn = el('atm-save-' + vid);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  var createdFns = 0, createdSfs = 0, createdTasks = 0, failed = 0;

  // Process entries sequentially; each may create fn → sf → task
  function processNext(i) {
    if (i >= entries.length) {
      if (btn) { btn.disabled = false; btn.textContent = 'Save All'; }
      _tskBatchClose(vid);
      var parts = [];
      if (createdFns)   parts.push(createdFns   + ' function'     + (createdFns   !== 1 ? 's' : ''));
      if (createdSfs)   parts.push(createdSfs   + ' sub-function' + (createdSfs   !== 1 ? 's' : ''));
      if (createdTasks) parts.push(createdTasks + ' task'         + (createdTasks !== 1 ? 's' : ''));
      toast((parts.length ? parts.join(', ') : 'Items') + ' created' +
        (failed ? ' (' + failed + ' failed)' : '') + '!', failed ? 'warn' : 'success');
      refresh();
      return;
    }

    var e = entries[i];

    // Step 1: create new Function if needed
    function step1_fn(cb) {
      if (!e.fnIsNew || !e.fnNewName) { cb(e.fnExistingId || ''); return; }
      google.script.run
        .withSuccessHandler(function(r) {
          if (r && r.ok) {
            createdFns++;
            // Cache locally so sub-fn creation can use it immediately
            var newFn = { Function_ID: r.id, Name: e.fnNewName, Proj_ID: e.proj, Parent_Fn_ID: '', Created_At: '', Updated_At: '' };
            APP.functions = (APP.functions || []);
            APP.functions.push(newFn);
            cb(r.id);
          } else {
            failed++;
            toast('Row ' + (+e.n + 1) + ': could not create function — ' + ((r && r.error) || 'unknown error'), 'error');
            processNext(i + 1);
          }
        })
        .withFailureHandler(function(err) {
          // Function may have been created despite the error (e.g. a background sync step failed)
          createdFns++;
          toast('Row ' + (+e.n + 1) + ': function saved — background step had a warning (' + (err.message || 'unknown') + ')', 'warn');
          processNext(i + 1);
        })
        .createFunction({
          Name: e.fnNewName, Proj_ID: e.proj, Parent_Fn_ID: '', Description: e.desc || '',
          Assigner_ID: e.asgr || APP.currentUser.empId, Assignee_IDs: e.asgn || '',
          Status: e.status || 'Yet to Start', Priority: e.pri || 'Medium',
          Deadline: e.due || '', Links: e.links || ''
        }, APP.currentUser.email);
    }

    // Step 2: create new Sub-Function if needed (receives resolved fnId from step1)
    function step2_sf(fnId, cb) {
      if (!e.sfnIsNew || !e.sfNewName) { cb(fnId, e.sfExistingId || ''); return; }
      google.script.run
        .withSuccessHandler(function(r) {
          if (r && r.ok) {
            createdSfs++;
            var newSf = { Function_ID: r.id, Name: e.sfNewName, Proj_ID: e.proj, Parent_Fn_ID: fnId,
                          Status: e.status || 'Yet to Start', Priority: e.pri || 'Medium',
                          Assignee_IDs: e.asgn || '', Deadline: e.due || '', Created_At: '', Updated_At: '' };
            APP.functions.push(newSf);
            cb(fnId, r.id);
          } else {
            failed++;
            toast('Row ' + (+e.n + 1) + ': could not create sub-function — ' + ((r && r.error) || 'unknown error'), 'error');
            processNext(i + 1);
          }
        })
        .withFailureHandler(function(err) {
          createdSfs++;
          toast('Row ' + (+e.n + 1) + ': sub-function saved — background step had a warning (' + (err.message || 'unknown') + ')', 'warn');
          processNext(i + 1);
        })
        .createFunction({
          Name: e.sfNewName, Proj_ID: e.proj, Parent_Fn_ID: fnId, Description: e.desc || '',
          Assigner_ID: e.asgr || APP.currentUser.empId, Assignee_IDs: e.asgn || '',
          Status: e.status || 'Yet to Start', Priority: e.pri || 'Medium',
          Deadline: e.due || '', Links: e.links || ''
        }, APP.currentUser.email);
    }

    // Step 3: create Task if title present
    function step3_task(fnId, sfId) {
      if (!e.title) { processNext(i + 1); return; }
      // Derive top-level Function_ID if only sf was set
      var derivedFnId = fnId;
      if (!derivedFnId && sfId) {
        var sfRec = (APP.functions || []).find(function(f) { return f.Function_ID === sfId; });
        if (sfRec) derivedFnId = sfRec.Parent_Fn_ID || '';
      }
      google.script.run
        .withSuccessHandler(function(r) {
          // createTask returns the new Task_ID string on success (not {ok:true})
          if (r) { createdTasks++; } else { failed++; }
          processNext(i + 1);
        })
        .withFailureHandler(function(err) {
          // The task may have been written to the sheet even if a post-creation step (calendar,
          // chat space) threw. Count as created, show a warning, and refresh to confirm.
          createdTasks++;
          toast('Row ' + (+e.n + 1) + ': task saved — a background step had a warning (' + (err.message || 'unknown') + ')', 'warn');
          processNext(i + 1);
        })
        .createTask({
          Title:           e.title,
          Description:     e.desc || '',
          Proj_ID:         e.proj,
          Function_ID:     derivedFnId,
          SubFn_ID:        sfId,
          Assignee_IDs:    e.asgn,
          Assigner_ID:     e.asgr || APP.currentUser.empId,
          Status:          e.status,
          Priority:        e.pri,
          Recurring_Task:  e.rec || 'One Time',
          Due_Date:        e.due,
          Estimated_Hours: 0,
          Links:           e.links || ''
        }, APP.currentUser.email);
    }

    // Chain: fn → sf → task
    step1_fn(function(fnId) {
      step2_sf(fnId, function(fnId2, sfId) {
        step3_task(fnId2, sfId);
      });
    });
  }

  processNext(0);
}

// ── Card Builders ─────────────────────────────────────────────────────────────
function taskCard(t, compact, isParentInGroup) {
  var proj  = findProj(t.Proj_ID);
  var asgn  = t.Assigner_Name || findEmpName(t.Assigner_ID);
  var subFn = t.SubFn_ID ? (APP.functions || []).find(function(f) { return f.Function_ID === t.SubFn_ID; }) : null;
  var fn    = (!subFn && t.Function_ID) ? (APP.functions || []).find(function(f) { return f.Function_ID === t.Function_ID; }) : null;

  // ── Compact row (dashboard upcoming tasks) ──────────────────────────────────
  if (compact) {
    var ctxParts = [];
    if (subFn) ctxParts.push(esc(subFn.Name));
    else if (fn) ctxParts.push(esc(fn.Name));
    if (proj)  ctxParts.push(esc(proj.Name));
    if (asgn)  ctxParts.push('by ' + esc(asgn));

    // Progress: derive from status name if no Actual/Estimated hours
    var progPct = 0;
    var statusProg = {
      'Yet to Start': 0, 'Planning': 5,
      'WIP (0%-25%)': 15, 'WIP (25%-50%)': 38,
      'WIP (50%-75%)': 63, 'WIP (75%-100%)': 88,
      'Review': 92, 'On Hold': 0, 'Done': 100, 'Completed': 100, 'Implemented': 100
    };
    if (t.Estimated_Hours && t.Actual_Hours) {
      progPct = Math.min(100, Math.round(parseFloat(t.Actual_Hours) / parseFloat(t.Estimated_Hours) * 100));
    } else {
      progPct = statusProg[t.Status] !== undefined ? statusProg[t.Status] : 0;
    }
    var progColor = progPct >= 80 ? 'var(--ok)' : progPct >= 40 ? 'var(--p2)' : 'var(--warn)';

    // Description preview (first 60 chars)
    var desc = t.Description ? String(t.Description).trim() : '';
    var descHtml = desc
      ? '<span style="margin-left:6px;font-style:italic;color:var(--muted2)">' + esc(desc.length > 55 ? desc.substring(0, 55) + '…' : desc) + '</span>'
      : '';

    return '<div class="tc-row p-' + esc(t.Priority) + '" onclick="openTaskDetail(\'' + esc(t.Task_ID) + '\')">' +
      '<div class="tc-row-pri">' + badge(t.Priority) + '</div>' +
      '<div class="tc-row-body">' +
        '<div class="tc-row-top">' +
          '<span class="tc-row-t">' + esc(t.Title) + '</span>' +
          '<div class="tc-row-right">' + pill(t.Status) + deadlineHtml(t.Due_Date, t.Status) + '</div>' +
        '</div>' +
        (ctxParts.length
          ? '<div class="tc-row-meta">' + ctxParts.join(' · ') + descHtml + '</div>'
          : (desc ? '<div class="tc-row-meta">' + descHtml + '</div>' : '')) +
        (progPct > 0
          ? '<div class="tc-row-prog"><div class="tc-row-prog-fill" style="width:' + progPct + '%;background:' + progColor + '"></div></div>'
          : '') +
      '</div>' +
    '</div>';
  }

  // ── Full card (other views) ──────────────────────────────────────────────────
  var cls = 'task-card p-' + esc(t.Priority) + (isParentInGroup ? ' tc-parent' : '');
  var contextRef = subFn
    ? '<div class="tc-parent-ref"><span class="material-symbols-outlined" style="font-size:11px">subdirectory_arrow_right</span>' + esc(subFn.Name) + '</div>'
    : '';
  return '<div class="' + cls + '" onclick="openTaskDetail(\'' + esc(t.Task_ID) + '\')">' +
    contextRef +
    '<div class="tc-header">' + badge(t.Priority) + '</div>' +
    '<div class="tc-title">' + esc(t.Title) + '</div>' +
    (proj ? '<div class="tc-project"><span class="material-symbols-outlined" style="font-size:11px;vertical-align:middle;margin-right:2px">folder_open</span>' + esc(proj.Name) + '</div>' : '') +
    '<div class="tc-meta">' + pill(t.Status) + ' &nbsp;' + deadlineHtml(t.Due_Date, t.Status) + '</div>' +
    '<div class="tc-assigner">Assigned by: ' + esc(asgn) + '</div>' +
  '</div>';
}

// Sort a project list so parents always appear before their sub-projects,
// with each sub-project card immediately following its parent.
function _sortProjHierarchy(projs) {
  var result   = [];
  var seen     = new Set();
  var topLevel = projs.filter(function(p) { return !p.Parent_Proj_ID; });
  var byParent = {};
  projs.forEach(function(p) {
    if (p.Parent_Proj_ID) {
      if (!byParent[p.Parent_Proj_ID]) byParent[p.Parent_Proj_ID] = [];
      byParent[p.Parent_Proj_ID].push(p);
    }
  });
  topLevel.forEach(function push(p) {
    if (seen.has(p.Proj_ID)) return;
    seen.add(p.Proj_ID);
    result.push(p);
    (byParent[p.Proj_ID] || []).forEach(push);
  });
  // Append any sub-projects whose parent wasn't in the list
  projs.forEach(function(p) {
    if (!seen.has(p.Proj_ID)) result.push(p);
  });
  return result;
}

// ── Grouped project renderer for all project grid views ───────────────────────
function _renderProjGrouped(projs) {
  if (!projs.length) return emptyState('No projects yet', '');
  var byParent  = {};
  var topLevel  = [];
  var topIds    = new Set();
  projs.forEach(function(p) {
    if (!p.Parent_Proj_ID) { topLevel.push(p); topIds.add(p.Proj_ID); }
    else {
      if (!byParent[p.Parent_Proj_ID]) byParent[p.Parent_Proj_ID] = [];
      byParent[p.Parent_Proj_ID].push(p);
    }
  });
  var html = '';
  topLevel.forEach(function(p) {
    var subs = byParent[p.Proj_ID] || [];
    html += subs.length ? _projGroupBlock(p, subs) : projCard(p);
  });
  // Orphan sub-projects (parent not in the filtered list)
  projs.forEach(function(p) {
    if (p.Parent_Proj_ID && !topIds.has(p.Parent_Proj_ID)) html += projCard(p);
  });
  return html;
}

// Renders the functions + tasks tree for a single project (no sub-project nesting).
// Returns HTML string.
function _renderProjSectionHtml(projId) {
  var fns       = (APP.functions || []).filter(function(f) { return f.Proj_ID === projId && !f.Parent_Fn_ID; });
  var allSubFns = (APP.functions || []).filter(function(f) { return f.Proj_ID === projId && !!f.Parent_Fn_ID; });
  var projTasks = APP.tasks.filter(function(t) { return t.Proj_ID === projId; });

  if (!fns.length && !projTasks.length) {
    return '<div class="dash-hier-empty-fn" style="padding:6px 0 4px">No functions or tasks yet</div>';
  }

  var html = '';

  fns.forEach(function(fn) {
    var subFns  = allSubFns.filter(function(sf) { return sf.Parent_Fn_ID === fn.Function_ID; });
    var fnTasks = projTasks.filter(function(t) { return t.Function_ID === fn.Function_ID && !t.SubFn_ID; });
    // Function-level progress
    var fnProg = _calcFnProgress(fn.Function_ID, false);
    var fnBarColor = fnProg.pct >= 80 ? 'var(--ok)' : fnProg.pct >= 40 ? 'var(--p2)' : 'var(--warn)';

    html += '<div class="dash-hier-fn">' +
      '<div class="dash-hier-fn-hd" onclick="openFunctionDetail(\'' + esc(fn.Function_ID) + '\')" title="Click to open details">' +
        '<span class="material-symbols-outlined dash-hier-fn-icon">folder</span>' +
        '<span class="dash-hier-fn-name">' + esc(fn.Name) + '</span>' +
        '<span class="dash-hier-id">' + esc(fn.Function_ID) + '</span>' +
        (fnProg.total > 0 ? '<span style="font-size:11px;color:var(--muted);margin-left:auto;margin-right:4px">' + fnProg.pct + '%</span>' : '') +
        '<span class="material-symbols-outlined dash-hier-open-icon">open_in_new</span>' +
      '</div>' +
      (fnProg.total > 0 ? '<div style="height:3px;background:var(--border);border-radius:0"><div style="width:' + fnProg.pct + '%;height:100%;background:' + fnBarColor + ';transition:width .3s"></div></div>' : '') +
      '<div class="dash-hier-fn-body">';

    if (subFns.length) {
      subFns.forEach(function(sf) {
        var sfTasks = projTasks.filter(function(t) { return t.SubFn_ID === sf.Function_ID; });
        var sfDone  = sfTasks.filter(function(t) { return _isDone(t.Status); }).length;
        var sfPct   = sfTasks.length > 0 ? Math.round(sfDone / sfTasks.length * 100) : 0;
        var sfBarColor = sfPct >= 80 ? 'var(--ok)' : sfPct >= 40 ? 'var(--p2)' : 'var(--warn)';
        html += '<div class="dash-hier-sf">' +
          '<div class="dash-hier-sf-hd" onclick="openFunctionDetail(\'' + esc(sf.Function_ID) + '\')" title="Click to open details">' +
            '<span class="material-symbols-outlined dash-hier-sf-icon">subdirectory_arrow_right</span>' +
            '<span class="dash-hier-sf-name">' + esc(sf.Name) + '</span>' +
            '<span class="dash-hier-id">' + esc(sf.Function_ID) + '</span>' +
            (sfTasks.length > 0 ? '<span style="font-size:11px;color:var(--muted);margin-left:auto;margin-right:4px">' + sfPct + '%</span>' : '') +
            '<span class="material-symbols-outlined dash-hier-open-icon">open_in_new</span>' +
          '</div>' +
          (sfTasks.length > 0 ? '<div style="height:2px;background:var(--border)"><div style="width:' + sfPct + '%;height:100%;background:' + sfBarColor + '"></div></div>' : '') +
          '<div class="dash-hier-sf-body">';
        if (sfTasks.length) {
          sfTasks.forEach(function(t) { html += _hierTaskRow(t); });
        } else {
          html += '<div class="dash-hier-empty-sf">No tasks yet</div>';
        }
        html += '</div></div>';
      });
    }

    fnTasks.forEach(function(t) { html += _hierTaskRow(t); });

    if (!subFns.length && !fnTasks.length) {
      html += '<div class="dash-hier-empty-fn">No sub-functions or tasks yet</div>';
    }

    html += '</div></div>';
  });

  // Standalone tasks (no function)
  var standalone = projTasks.filter(function(t) { return !t.Function_ID && !t.SubFn_ID; });
  if (standalone.length) {
    html += '<div class="dash-hier-fn">' +
      '<div class="dash-hier-fn-hd">' +
        '<span class="material-symbols-outlined dash-hier-fn-icon">list</span>' +
        '<span class="dash-hier-fn-name" style="color:var(--muted);font-style:italic">Uncategorized</span>' +
      '</div>' +
      '<div class="dash-hier-fn-body">';
    standalone.forEach(function(t) { html += _hierTaskRow(t); });
    html += '</div></div>';
  }

  return html;
}

function _renderProjHierarchy(projId) {
  var proj    = findProj(projId);
  var hierEl  = el('dash-proj-hierarchy');

// ── Function / Sub-Function Progress Helpers ──────────────────────────────────

// Returns {pct, done, total, byStatus} for a function or sub-function
function _calcFnProgress(fnId, isSubFn) {
  var tasks = [];
  if (isSubFn) {
    tasks = (APP.tasks || []).filter(function(t) { return t.SubFn_ID === fnId; });
  } else {
    // direct tasks + tasks via child sub-functions
    var childSfIds = (APP.functions || [])
      .filter(function(f) { return f.Parent_Fn_ID === fnId; })
      .map(function(f) { return f.Function_ID; });
    tasks = (APP.tasks || []).filter(function(t) {
      return t.Function_ID === fnId && !t.SubFn_ID ||
             childSfIds.indexOf(t.SubFn_ID) !== -1;
    });
  }
  var total  = tasks.length;
  var done   = tasks.filter(function(t) { return _isDone(t.Status); }).length;
  // Weighted progress from actual/estimated hours first, else status map
  var statusProg = { 'Yet to Start':0,'Planning':5,'WIP (0%-25%)':15,'WIP (25%-50%)':38,
    'WIP (50%-75%)':63,'WIP (75%-100%)':88,'Review':92,'On Hold':0,'Done':100,'Completed':100,'Implemented':100 };
  var sumPct = 0;
  tasks.forEach(function(t) {
    if (t.Estimated_Hours && t.Actual_Hours) {
      sumPct += Math.min(100, Math.round(parseFloat(t.Actual_Hours) / parseFloat(t.Estimated_Hours) * 100));
    } else {
      sumPct += (statusProg[t.Status] !== undefined ? statusProg[t.Status] : 0);
    }
  });
  var pct = total ? Math.round(sumPct / total) : 0;
  // Status breakdown
  var byStatus = {};
  tasks.forEach(function(t) {
    var s = t.Status || 'Yet to Start';
    byStatus[s] = (byStatus[s] || 0) + 1;
  });
  return { pct: pct, done: done, total: total, byStatus: byStatus };
}

// Auto-derive suggested status from progress %
function _statusFromPct(pct) {
  if (pct >= 100) return 'Done';
  if (pct >= 75)  return 'WIP (75%-100%)';
  if (pct >= 50)  return 'WIP (50%-75%)';
  if (pct >= 25)  return 'WIP (25%-50%)';
  if (pct > 0)    return 'WIP (0%-25%)';
  return 'Yet to Start';
}

// Returns HTML for the progress section in function/sub-function detail modal
function _fnProgressSectionHtml(fnId, isSubFn) {
  var p = _calcFnProgress(fnId, isSubFn);
  if (p.total === 0) {
    return '<div style="color:var(--muted);font-size:13px;margin-bottom:16px">No tasks linked yet.</div>';
  }
  var barColor = p.pct >= 80 ? 'var(--ok)' : p.pct >= 40 ? 'var(--p2)' : 'var(--warn)';
  var suggested = _statusFromPct(p.pct);

  // Top status breakdown
  var breakdownHtml = Object.keys(p.byStatus).map(function(s) {
    var cnt = p.byStatus[s];
    var bPct = Math.round(cnt / p.total * 100);
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
      pill(s) +
      '<div style="flex:1;background:var(--border);border-radius:2px;height:4px;overflow:hidden">' +
        '<div style="width:' + bPct + '%;height:100%;background:var(--p2);border-radius:2px"></div>' +
      '</div>' +
      '<span style="font-size:11px;color:var(--muted);min-width:28px;text-align:right">' + cnt + '</span>' +
    '</div>';
  }).join('');

  return '<div style="margin-bottom:16px">' +
    // Header
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
      '<span style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Progress</span>' +
      '<span style="font-size:13px;font-weight:700;color:var(--p)">' + p.pct + '%</span>' +
    '</div>' +
    // Main progress bar
    '<div style="background:var(--border);border-radius:4px;height:8px;overflow:hidden;margin-bottom:8px">' +
      '<div style="width:' + p.pct + '%;height:100%;background:' + barColor + ';border-radius:4px;transition:width .3s"></div>' +
    '</div>' +
    // Stats row
    '<div style="display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:12px">' +
      '<span>' + p.done + ' / ' + p.total + ' tasks done</span>' +
      '<span style="color:var(--muted2)">·</span>' +
      '<span>Suggested status: ' + pill(suggested) + '</span>' +
    '</div>' +
    // Breakdown
    breakdownHtml +
  '</div>';
}

function _saveFunctionEdit(fnId) {
  var fn = (APP.functions || []).find(function(f) { return f.Function_ID === fnId; });
  if (!fn) return;
  var nameEl = el('fe-name');
  if (!nameEl) return;
  var newName = nameEl.value.trim();
  if (!newName) { toast('Name is required.', 'error'); nameEl.focus(); return; }

  var descEl       = el('fe-desc');
  var parentEl     = el('fe-parent');
  var statusEl     = el('fe-status');
  var priorityEl   = el('fe-priority');
  var recurringEl  = el('fe-recurring');
  var assigneesEl  = el('fe-assignees');
  var assignerEl   = el('fe-assigner');
  var startEl      = el('fe-start');
  var deadlineEl   = el('fe-deadline');
  var chatLinkEl   = el('fe-chat-link');

  var newAssignees = assigneesEl
    ? Array.from(assigneesEl.selectedOptions).map(function(o) { return o.value; }).join(',')
    : (fn.Assignee_IDs || '');

  var updates = {};
  if (newName !== (fn.Name || ''))                              updates.Name         = newName;
  if (descEl     && descEl.value      !== (fn.Description || '')) updates.Description  = descEl.value;
  if (statusEl    && statusEl.value    !== (fn.Status              || ''))           updates.Status              = statusEl.value;
  if (priorityEl  && priorityEl.value  !== (fn.Priority            || ''))           updates.Priority            = priorityEl.value;
  if (recurringEl && recurringEl.value !== (fn.Recurring_Functions  || 'One Time'))  updates.Recurring_Functions = recurringEl.value;
  if (newAssignees !== (fn.Assignee_IDs || ''))                  updates.Assignee_IDs = newAssignees;
  if (assignerEl && assignerEl.value  !== (fn.Assigner_ID  || '')) updates.Assigner_ID  = assignerEl.value;
  if (startEl    && startEl.value     !== (fn.Start_Date   ? String(fn.Start_Date).substring(0,10) : '')) updates.Start_Date = startEl.value;
  if (deadlineEl && deadlineEl.value  !== (fn.Deadline     ? String(fn.Deadline).substring(0,10)   : '')) updates.Deadline   = deadlineEl.value;
  if (chatLinkEl && chatLinkEl.value  !== (fn.Chat_Link    || '')) updates.Chat_Link   = chatLinkEl.value;
  var linksEditEl = el('fe-links');
  if (linksEditEl && linksEditEl.value !== (fn.Links || '')) updates.Links = linksEditEl.value;
  if (parentEl   && parentEl.value    !== (fn.Parent_Fn_ID || '')) updates.Parent_Fn_ID = parentEl.value;

  if (!Object.keys(updates).length) { openFunctionDetail(fnId); return; }

  var btn = el('fe-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  // Snapshot for rollback
  var orig = {};
  Object.keys(updates).forEach(function(k) { orig[k] = fn[k]; });
  Object.keys(updates).forEach(function(k) { fn[k] = updates[k]; });

  google.script.run
    .withSuccessHandler(function() {
      toast('Saved.', 'ok');
      openFunctionDetail(fnId);
      if (fn.Proj_ID) _renderProjHierarchy(fn.Proj_ID);
    })
    .withFailureHandler(function(err) {
      toast(err.message || 'Save failed', 'error');
      Object.keys(orig).forEach(function(k) { fn[k] = orig[k]; });
      if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; }
    })
    .updateFunction(fnId, updates, APP._verifiedEmail);
}

function confirmDeleteFunction(fnId) {
  var fn = (APP.functions || []).find(function(f) { return f.Function_ID === fnId; });
  if (!fn) return;
  var isSubFn = !!fn.Parent_Fn_ID;
  var msg = isSubFn
    ? 'Delete Sub-Function "' + fn.Name + '"?\nAll tasks linked to it will be unlinked.'
    : 'Delete Function "' + fn.Name + '"?\nAll its sub-functions and linked tasks will be unlinked.';
  if (!confirm(msg)) return;
  closeModal('fn-detail-modal');
  toast('Deleting…', '');
  var projId = fn.Proj_ID;
  google.script.run
    .withSuccessHandler(function() {
      toast('Deleted.', 'ok');
      APP.functions = (APP.functions || []).filter(function(f) {
        return f.Function_ID !== fnId && f.Parent_Fn_ID !== fnId;
      });
      if (projId) _renderProjHierarchy(projId);
      refresh();
    })
    .withFailureHandler(function(err) { toast(err.message || 'Delete failed', 'error'); })
    .deleteFunction(fnId, APP._verifiedEmail);
}

// ── Task Modal: Project Change Handler ────────────────────────────────────────
function onTaskProjChange() {
  var projId = el('f-t-proj').value;
  var chip   = el('proj-info-chip');
  var parentSel = el('f-t-parent');

  // Rebuild Sub-Function options from APP.functions (rows where Parent_Fn_ID is set)
  var subFns = (APP.functions || []).filter(function(f) {
    return !!f.Parent_Fn_ID && (!projId || f.Proj_ID === projId);
  });
  parentSel.innerHTML = '<option value="">— None (standalone task) —</option>' +
    subFns.map(function(f) {
      var parentFn = (APP.functions || []).find(function(p) { return p.Function_ID === f.Parent_Fn_ID; });
      var label = (parentFn ? esc(parentFn.Name) + ' › ' : '') + esc(f.Name);
      return '<option value="' + esc(f.Function_ID) + '">' + label + '</option>';
    }).join('');

  // Reload top-level functions for the selected project
  _tskLoadFunctions(projId);

  if (!projId) { chip.classList.remove('show'); return; }
  var proj = findProj(projId);
  if (!proj)  { chip.classList.remove('show'); return; }

  // Auto-fill due date from project deadline if field is empty
  if (!el('f-t-due').value && proj.Deadline) {
    el('f-t-due').value = String(proj.Deadline).substring(0, 10);
  }

  // Show project info chip
  chip.innerHTML =
    '<span><span class="material-symbols-outlined" style="font-size:13px;vertical-align:middle;margin-right:3px">folder_open</span><strong>' + esc(proj.Name) + '</strong></span>' +
    (proj.Status   ? '<span>' + pill(proj.Status)   + '</span>' : '') +
    (proj.Priority ? '<span>' + badge(proj.Priority) + '</span>' : '') +
    '<span style="font-size:11px;color:var(--muted)">Deadline: ' + (proj.Deadline ? fmtDate(proj.Deadline) : '<em>Unscheduled</em>') + '</span>';
  chip.classList.add('show');
}

// Load functions for a project and populate the #f-t-function dropdown.
// Uses APP.functions (already loaded at startup) — no backend call needed.
// When projId is empty, shows ALL top-level functions (task may have a function but no project).
function _tskLoadFunctions(projId) {
  var sel = el('f-t-function');

  var fns = (APP.functions || []).filter(function(f) {

    fns.map(function(f) {

// Create a new function inline from the task wizard

  if (!name)   { toast('Enter a function name.', 'error'); return; }

var CAL = {
  year:        new Date().getFullYear(),
  month:       new Date().getMonth(),   // 0-indexed
  popupDate:   '',
  evMap:       {},
  filters:     { task: true, meeting: true, project: true, holiday: true, leave: true },
  memberFilter: '',   // '' = Organisation | 'team:Tech' = team | empId = individual
  empTeamMap:   {}    // empId → team name (built in _calPopulateMemberSel)
};

var CAL_MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
var CAL_COLORS = {
  task:    { bg: '#1565c0', fg: '#fff' },
  meeting: { bg: '#00897b', fg: '#fff' },
  project: { bg: '#c62828', fg: '#fff' },
  leave:   { bg: '#6a1b9a', fg: '#fff' },
  holiday: { bg: '#2e7d32', fg: '#fff' },
};

function _calGetVisibleEvs(ds) {
  return (CAL.evMap[ds] || []).filter(function(ev) {
    if (!CAL.filters[ev.type]) return false;
    var f = CAL.memberFilter;
    if (!f) return true;                              // Organisation — show all
    if (ev.type === 'holiday') return true;           // Holidays always visible

    if (f.indexOf('team:') === 0) {
      // Team filter
      var teamName = f.substring(5);
      if (ev.type === 'meeting') return ev.tmType === 'company' || ev.tmTeam === teamName;
      var evIds = ev.empIds || (ev.empId ? [ev.empId] : []);
      return evIds.some(function(id) { return CAL.empTeamMap[id] === teamName; });
    }
    // Individual member filter
    if (ev.type === 'meeting') return ev.tmType === 'company';
    var evIds = ev.empIds || (ev.empId ? [ev.empId] : []);
    return evIds.indexOf(f) !== -1;
  });
}

function _calToggleFilter(type) {
  CAL.filters[type] = !CAL.filters[type];
  var btn = el('cal-f-' + type);
  if (btn) btn.classList.toggle('active', CAL.filters[type]);
  renderCalendar();
}

function _calMemberChange() {
  var teamSel   = el('cal-team-sel');
  var memberSel = el('cal-member-sel');
  var teamVal   = teamSel   ? teamSel.value   : '';
  var memberVal = memberSel ? memberSel.value : '';

  if (!teamVal) {
    CAL.memberFilter = '';
  } else if (memberVal) {
    CAL.memberFilter = memberVal; // specific employee
  } else {
    CAL.memberFilter = 'team:' + teamVal; // all members of the team
  }
  renderCalendar();
}

function _calPopulateMemberSel() {
  var teamSel   = el('cal-team-sel');
  var memberSel = el('cal-member-sel');
  if (!teamSel || !memberSel) return;

  var u = APP.currentUser;
  if (!_isManager(u.role)) {
    teamSel.classList.add('hidden');
    memberSel.classList.add('hidden');
    return;
  }

  // Build empId → team lookup used by _calGetVisibleEvs
  CAL.empTeamMap = {};
  (APP.employees || []).forEach(function(e) { CAL.empTeamMap[e['Emp_ID']] = e['Team'] || ''; });

  // Determine which teams this user may see
  // Admins see all 7 defined teams; managers see only their own team
  var visibleTeams;
  if (_isAdmin(u.role)) {
    visibleTeams = Object.keys(TEAM_HIERARCHY).sort();
  } else {
    var myTeam = u.team || '';
    visibleTeams = myTeam ? [myTeam] : Object.keys(TEAM_HIERARCHY).sort();
  }

  // Build team dropdown
  var tHtml = '<option value="">Organisation</option>';
  visibleTeams.forEach(function(t) {
    tHtml += '<option value="' + esc(t) + '">' + esc(t) + '</option>';
  });
  teamSel.innerHTML = tHtml;
  teamSel.classList.remove('hidden');

  // Member dropdown — initially hidden (shown when a team is selected)
  memberSel.innerHTML = '<option value="">All Members</option>';
  memberSel.classList.add('hidden');
}

// Called when team dropdown changes — rebuilds member list for selected team
function _calTeamChange() {
  var teamSel   = el('cal-team-sel');
  var memberSel = el('cal-member-sel');
  if (!teamSel || !memberSel) return;

  var selectedTeam = teamSel.value; // '' = Organisation, or team name

  if (!selectedTeam) {
    // Organisation selected — hide member dropdown, show all
    memberSel.classList.add('hidden');
    CAL.memberFilter = '';
    renderCalendar();
    return;
  }

  // Build member list for this team
  var teamMembers = (APP.employees || []).filter(function(e) { return e['Team'] === selectedTeam; });
  teamMembers.sort(function(a, b) { return (a.Name||'') < (b.Name||'') ? -1 : 1; });

  var mHtml = '<option value="">All in ' + esc(selectedTeam) + '</option>';
  teamMembers.forEach(function(e) {
    mHtml += '<option value="' + esc(e['Emp_ID']) + '">' + esc(e.Name || e['Emp_ID']) + '</option>';
  });
  memberSel.innerHTML = mHtml;
  memberSel.value = '';
  memberSel.classList.remove('hidden');

  CAL.memberFilter = 'team:' + selectedTeam;
  renderCalendar();
}

function _calPush(ds, ev) {
  if (!CAL.evMap[ds]) CAL.evMap[ds] = [];
  CAL.evMap[ds].push(ev);
}

function _calAddTasks() {
  APP.tasks.forEach(function(t) {
    if (!t.Due_Date || _isDone(t.Status)) return;
    var ds  = String(t.Due_Date).substring(0, 10);
    var ids = _parseIds(t.Assignee_IDs || t.Assignee_ID);
    _calPush(ds, { type: 'task', label: t.Title, id: t.Task_ID, empIds: ids, empId: ids[0] || '' });
  });
}

function _calAddProjects() {
  APP.projects.forEach(function(p) {
    if (!p.Deadline || _isDone(p.Status)) return;
    var ds  = String(p.Deadline).substring(0, 10);
    var ids = _parseIds(p.Owner_IDs || p.Owner_ID);
    _calPush(ds, { type: 'project', label: p.Name, id: p.Proj_ID, empIds: ids, empId: ids[0] || '' });
  });
}

function _calAddLeaves(leaves) {
  leaves.forEach(function(l) {
    var start = new Date(String(l.Start_Date).substring(0, 10) + 'T00:00:00');
    var end   = new Date(String(l.End_Date).substring(0, 10)   + 'T00:00:00');
    var cur   = new Date(start);
    while (cur <= end) {
      var ds = _localIso(cur);
      _calPush(ds, { type: 'leave', label: (l.Emp_Name || '') + ' — ' + (l.Leave_Type || ''), id: l.Leave_ID, empId: l.Emp_ID });
      cur.setDate(cur.getDate() + 1);
    }
  });
}

function _calAddHolidays(holidays) {
  holidays.forEach(function(h) {
    var ds = String(h.Date).substring(0, 10);
    // Holidays shown first: unshift
    if (!CAL.evMap[ds]) CAL.evMap[ds] = [];
    CAL.evMap[ds].unshift({ type: 'holiday', label: h.Name, id: h.Holiday_ID });
  });
}

function _calAddMeetings(meetings) {
  meetings.forEach(function(m) {
    if (!m.start) return;
    var ds = String(m.start).substring(0, 10);
    var typeLabel = m.type === 'company' ? 'Company' : m.type === 'team' ? 'Team' : '';
    var label = (typeLabel ? typeLabel + ' Mtg: ' : '') + (m.title || 'Meeting');
    _calPush(ds, { type: 'meeting', label: label, id: m.id, meetLink: m.meetLink,
                   tmType: m.type || 'custom', tmTeam: m.team || '' });
  });
}

function _calAddWorkLogs(logs) {
  logs.forEach(function(wl) {
    var ds = _dateIso(wl.Date);
    if (ds) _calPush(ds, { type: 'wlog', label: (wl.Emp_Name || 'Work Log') + ' — ' + _attEffHours(wl.Attendance, wl['Extra Hours'] || wl.Hours_Total) + 'h', id: wl.Log_ID });
  });
}

var CAL_SECTIONS = [
  { key: 'task',    lbl: 'Task Due Dates',     cls: 'lbl-task' },
  { key: 'meeting', lbl: 'Events & Meetings',  cls: 'lbl-meeting' },
  { key: 'project', lbl: 'Project Deadlines',  cls: 'lbl-project' },
  { key: 'holiday', lbl: 'Holidays',           cls: 'lbl-holiday' },
  { key: 'leave',   lbl: 'Leaves',             cls: 'lbl-leave' }
];

function _calPad(n) { return n < 10 ? '0' + n : String(n); }

function renderCalendar() {
  var year = CAL.year, month = CAL.month;
  var todayStr = _localIso(new Date());
  el('cal-title').textContent = CAL_MONTHS[month] + ' ' + year;

  var firstDow  = new Date(year, month, 1).getDay();
  var daysInMon = new Date(year, month + 1, 0).getDate();
  var prevLast  = new Date(year, month, 0).getDate();

  // Build 42 cells; dow is simply index % 7 (grid starts on Sunday)
  var cells = [];
  var prevM = month === 0 ? 12 : month, prevY = month === 0 ? year - 1 : year;
  for (var i = firstDow - 1; i >= 0; i--) {
    var pd = prevLast - i;
    cells.push({ day: pd, out: true, ds: prevY + '-' + _calPad(prevM) + '-' + _calPad(pd) });
  }
  var cm = month + 1;
  for (var d = 1; d <= daysInMon; d++) {
    var ds = year + '-' + _calPad(cm) + '-' + _calPad(d);
    cells.push({ day: d, out: false, ds: ds, today: ds === todayStr });
  }
  var nm = month + 2, ny = year;
  if (nm > 12) { nm = 1; ny++; }
  for (var n = 1; cells.length < 42; n++) {
    cells.push({ day: n, out: true, ds: ny + '-' + _calPad(nm) + '-' + _calPad(n) });
  }
  cells.forEach(function(c, gi) { c.dow = gi % 7; });

  // Group into 6 weeks
  var weeks = [];
  for (var w = 0; w < 42; w += 7) weeks.push(cells.slice(w, w + 7));

  var MAX_EV_ROWS = 4;
  var TYPE_ORDER  = { holiday: 0, meeting: 1, task: 2, project: 3, leave: 4 };

  var html = weeks.map(function(week) {
    // ── Collect items for this week ──────────────────────────────────────────
    var items = []; // { ev, colStart(1-based), colEnd(1-based), ds }
    var seenLeaveIds = {};

    week.forEach(function(cell, ci) {
      if (cell.out || !cell.ds) return;
      var col = ci + 1;
      var evs = _calGetVisibleEvs(cell.ds).slice().sort(function(a, b) {
        return (TYPE_ORDER[a.type] || 99) - (TYPE_ORDER[b.type] || 99);
      });
      evs.forEach(function(ev) {
        if (ev.type === 'leave') {
          if (seenLeaveIds[ev.id]) return;
          seenLeaveIds[ev.id] = true;
          // Find contiguous span of this leave within this week row
          var colEnd = ci;
          for (var fc = ci + 1; fc < 7; fc++) {
            var fcCell = week[fc];
            if (!fcCell || fcCell.out || !fcCell.ds) break;
            var found = _calGetVisibleEvs(fcCell.ds).some(function(fe) { return fe.id === ev.id; });
            if (found) colEnd = fc; else break;
          }
          items.push({ ev: ev, colStart: col, colEnd: colEnd + 1, ds: cell.ds });
        } else {
          items.push({ ev: ev, colStart: col, colEnd: col, ds: cell.ds });
        }
      });
    });

    // ── Layout: assign grid rows ──────────────────────────────────────────────
    // Sort: longer spans first → by type → by colStart
    items.sort(function(a, b) {
      var sd = (b.colEnd - b.colStart) - (a.colEnd - a.colStart);
      if (sd) return sd;
      var td = (TYPE_ORDER[a.ev.type] || 99) - (TYPE_ORDER[b.ev.type] || 99);
      if (td) return td;
      return a.colStart - b.colStart;
    });

    var colNext = [2, 2, 2, 2, 2, 2, 2]; // next free row per column (row 1 = day numbers)
    var overflowCol = [0, 0, 0, 0, 0, 0, 0];
    var placed = [];

    items.forEach(function(item) {
      var row = 2;
      for (var c = item.colStart - 1; c < item.colEnd; c++) {
        if (colNext[c] > row) row = colNext[c];
      }
      if (row > MAX_EV_ROWS + 1) {
        for (var c = item.colStart - 1; c < item.colEnd; c++) overflowCol[c]++;
        return;
      }
      for (var c = item.colStart - 1; c < item.colEnd; c++) colNext[c] = row + 1;
      placed.push({ item: item, row: row });
    });

    // ── Build week HTML ───────────────────────────────────────────────────────
    var wh = '';

    // Day number cells (grid-row:1)
    week.forEach(function(c, ci) {
      var cellCls = 'cal-cell' +
        (c.out ? ' cal-out' : '') +
        (c.today ? ' cal-today' : '') +
        (c.dow === 0 && !c.out ? ' cal-sunday' : '') +
        (ci === 6 ? ' cal-last-col' : '');
      var numStyle = c.out ? ' style="color:#b0b4bb"' : '';
      wh += '<div class="' + cellCls + '" style="grid-column:' + (ci + 1) + ';grid-row:1/span 6"' +
            ' onclick="calDayClick(event,\'' + esc(c.ds || '') + '\')">' +
            '<div class="cal-day-num"' + numStyle + '>' + c.day + '</div>' +
            '</div>';
    });

    // Placed events
    placed.forEach(function(p) {
      var item = p.item, row = p.row;
      var span = item.colEnd - item.colStart + 1;
      var isSpan = span > 1;
      var onclick = item.ev.type === 'task'
        ? 'event.stopPropagation();openTaskDetail(\'' + esc(item.ev.id) + '\')'
        : item.ev.type === 'meeting'
          ? 'event.stopPropagation();goToMeeting(\'' + esc(item.ev.id) + '\')'
          : 'event.stopPropagation();calDayClick(event,\'' + esc(item.ds) + '\')';
      wh += '<div class="cal-ev cal-ev-' + item.ev.type + (isSpan ? ' cal-ev-span' : '') + '"' +
            ' style="grid-column:' + item.colStart + '/span ' + span + ';grid-row:' + row + '"' +
            ' onclick="' + onclick + '">' +
            esc(item.ev.label) + '</div>';
    });

    // Overflow "+N more" per column
    week.forEach(function(c, ci) {
      if (c.out || !overflowCol[ci]) return;
      wh += '<div class="cal-more"' +
            ' style="grid-column:' + (ci + 1) + ';grid-row:' + (MAX_EV_ROWS + 2) + '"' +
            ' onclick="event.stopPropagation();calDayClick(event,\'' + esc(c.ds) + '\')">' +
            overflowCol[ci] + ' more</div>';
    });

    return '<div class="cal-week">' + wh + '</div>';
  }).join('');

  el('cal-body').innerHTML = html;
  calPopupClose();
}

function calNav(dir) {
  CAL.month += dir;
  if (CAL.month < 0)  { CAL.month = 11; CAL.year--; }
  if (CAL.month > 11) { CAL.month = 0;  CAL.year++; }
  renderCalendar();
}

function calToday() {
  CAL.year  = new Date().getFullYear();
  CAL.month = new Date().getMonth();
  renderCalendar();
}

function calEvClick(e, type, label, id) {
  e.stopPropagation();
  if (type === 'task') { openTaskDetail(id); return; }
  if (type === 'holiday') { _calOpenPopup(e, _calFindDateByHolidayId(id)); return; }
  toast(label);
}

// Returns the date string for a holiday by its ID
function _calFindDateByHolidayId(id) {
  var found = '';
  Object.keys(CAL.evMap).forEach(function(ds) {
    CAL.evMap[ds].forEach(function(ev) { if (ev.type === 'holiday' && ev.id === id) found = ds; });
  });
  return found;
}

function calDayClick(e, ds) {
  e.stopPropagation();
  _calOpenPopup(e, ds);
}

function calShowMore(e, ds) {
  e.stopPropagation();
  _calOpenPopup(e, ds);
}

function _calOpenPopup(e, ds) {
  if (!ds) return;
  CAL.popupDate = ds;
  var evs   = CAL.evMap[ds] || [];  // popup shows ALL events, filters don't hide popup details
  var isAdm = APP.currentUser && _isAdmin(APP.currentUser.role);
  var popup = el('cal-popup');
  var d = new Date(ds + 'T00:00:00');
  el('cal-popup-date').textContent = d.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  var sectionsHtml = CAL_SECTIONS.map(function(sec) {
    var secEvs = evs.filter(function(ev) { return ev.type === sec.key; });
    if (!secEvs.length) return '';
    var evRows = secEvs.map(function(ev) {
      var c = CAL_COLORS[ev.type] || { bg: '#eee', fg: '#333' };
      var deleteBtn = (isAdm && ev.type === 'holiday')
        ? ' <button class="btn btn-sm btn-danger" style="margin-left:auto;padding:2px 8px;font-size:11px" onclick="event.stopPropagation();calPopupClose();deleteHoliday(\'' + esc(ev.id) + '\')">Delete</button>'
        : '';
      var clickFn = ev.type === 'task'
        ? 'calPopupClose();openTaskDetail(\'' + esc(ev.id) + '\')'
        : 'void(0)';
      return '<div class="cal-popup-ev" onclick="' + clickFn + '" style="cursor:' + (ev.type === 'task' ? 'pointer' : 'default') + '">' +
        '<span class="cal-popup-ev-dot" style="background:' + c.bg + '"></span>' +
        '<span style="flex:1">' + esc(ev.label) + '</span>' + deleteBtn + '</div>';
    }).join('');
    return '<div class="cal-popup-section">' +
      '<div class="cal-popup-sec-lbl">' + sec.lbl + '</div>' +
      evRows + '</div>';
  }).join('');

  el('cal-popup-events').innerHTML = sectionsHtml ||
    '<div style="font-size:12px;color:var(--muted);padding:6px 0">No events</div>';

  // Show admin "Add Holiday" button
  var adminBar = el('cal-popup-admin-actions');
  if (adminBar) adminBar.classList.toggle('hidden', !isAdm);

  // Position near click
  var x = Math.min(e.clientX, window.innerWidth  - 320);
  var y = Math.min(e.clientY, window.innerHeight - 280);
  popup.style.left = x + 'px';
  popup.style.top  = y + 'px';
  popup.classList.add('show');
  setTimeout(function() {
    document.addEventListener('click', calPopupClose, { once: true });
  }, 10);
}

function calPopupClose() {
  el('cal-popup').classList.remove('show');
}

// ── Keep Panel (Todos / Notes / Ideas) — Google Tasks API via server proxy ────
// Uses OAuth2 authorization code flow. Tokens stored per-user in ScriptProperties.
// No spreadsheet sharing needed — stays USER_DEPLOYING.

var KP = {
  tab: 'todo',
  todos: [], notes: [], ideas: [],
  lists: {},         // { 'Company-Todos': 'tasklistId', 'Company-Notes': 'tasklistId', 'Company-Ideas': 'tasklistId' }
  listsReady: false,
  noteEdit: null,
  noteColor: '#ffffff'
};

var KP_COLORS = [
  '#ffffff','#f28b82','#fbbc04','#fff475',
  '#ccff90','#a8dab5','#aecbfa','#d7aefb',
  '#fdcfe8','#e6c9a8','#e8eaed','#b0bec5'
];
var KP_STATUSES = ['Open','In Review','Accepted','Archived'];

// Color encoded as first line "__c__#rrggbb" in task notes field
function _encodeColor(color, content) {
  if (!color || color === '#ffffff') return content || '';
  return '__c__' + color + '\n' + (content || '');
}
function _decodeColor(raw) {
  var m = (raw || '').match(/^__c__(#[0-9a-fA-F]{6})\n([\s\S]*)$/);
  return m ? { color: m[1], text: m[2] } : { color: '#ffffff', text: raw || '' };
}

// ── Parse helpers ─────────────────────────────────────────────────────────────

function _taskToTodo(t) {
  return {
    _id: t.id,
    Title: t.title || '',
    Created_At: t.updated || ''
  };
}

function _taskToNote(t) {
  var decoded = _decodeColor(t.notes || '');
  return {
    _id: t.id,
    Title: t.title || '',
    Content: decoded.text,
    Color: decoded.color,
    Updated_At: t.updated || ''
  };
}

function _taskToIdea(t) {
  var raw = t.notes || '';
  var status = 'Open', content = raw;
  var m = raw.match(/^Status:\s*(.+)\n\n([\s\S]*)$/);
  if (m) { status = m[1].trim(); content = m[2]; }
  return {
    _id: t.id,
    Title: t.title || '',
    Content: content,
    Status: status,
    Created_At: t.updated || ''
  };
}

// ── Panel ──────────────────────────────────────────────────────────────────────

function kpToggle() {
  var p = el('kp-panel');
  if (p.classList.contains('kp-show')) { kpClose(); return; }
  p.classList.add('kp-show');
  if (KP.listsReady) { kpLoadAll(); return; }
  kpInitConnect();
}

function kpInitConnect() {
  el('kp-body').innerHTML = '<div class="kp-empty"><div class="kp-ei material-symbols-outlined">hourglass_empty</div>Loading…</div>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok) { kpShowConnectBtn(r && r.error); return; }
      KP.lists = r.lists;
      KP.listsReady = true;
      kpLoadAll();
    })
    .withFailureHandler(function(err) { kpShowConnectBtn(err.message); })
    .tasksEnsureLists(APP.currentUser.email);
}

function kpShowConnectBtn(errMsg) {
  el('kp-body').innerHTML =
    '<div class="kp-empty" style="padding:24px 16px">' +
      '<div class="kp-ei material-symbols-outlined">cloud_off</div>' +
      '<p style="font-size:12px;color:#70757a;margin:0 0 16px">Could not connect to workspace.</p>' +
      (errMsg ? '<p style="font-size:12px;color:#c62828;margin:0 0 12px">' + esc(errMsg) + '</p>' : '') +
      '<button class="btn btn-accent btn-sm" onclick="kpConnect(this)">Retry</button>' +
    '</div>';
}

function kpConnect(btn) {
  _btnReset(btn);
  KP.listsReady = false;
  kpInitConnect();
}

function kpClose() { el('kp-panel').classList.remove('kp-show'); }

function kpTab(tab) {
  KP.tab = tab;
  document.querySelectorAll('#kp-panel .kp-tab').forEach(function(t) {
    t.classList.toggle('kp-active', t.getAttribute('data-tab') === tab);
  });
  kpRender();
}

function kpLoadAll() {
  el('kp-body').innerHTML = '<div class="kp-empty"><div class="kp-ei material-symbols-outlined">hourglass_empty</div>Loading…</div>';
  var email = APP.currentUser.email;
  var done = 0;
  function onDone(r) {
    if (++done === 3) kpRender();
  }
  google.script.run
    .withSuccessHandler(function(r){ KP.todos = r && r.ok ? r.tasks.map(_taskToTodo) : []; onDone(r); })
    .withFailureHandler(function(){ KP.todos = []; onDone(null); })
    .tasksListTasks(KP.lists['Company-Todos'], email);
  google.script.run
    .withSuccessHandler(function(r){ KP.notes = r && r.ok ? r.tasks.map(_taskToNote) : []; onDone(r); })
    .withFailureHandler(function(){ KP.notes = []; onDone(null); })
    .tasksListTasks(KP.lists['Company-Notes'], email);
  google.script.run
    .withSuccessHandler(function(r){ KP.ideas = r && r.ok ? r.tasks.map(_taskToIdea) : []; onDone(r); })
    .withFailureHandler(function(){ KP.ideas = []; onDone(null); })
    .tasksListTasks(KP.lists['Company-Ideas'], email);
}

function kpRender() {
  if (KP.tab === 'todo')  return kpRenderTodos();
  if (KP.tab === 'notes') return kpRenderNotes();
  kpRenderIdeas();
}

// ── To-Dos ────────────────────────────────────────────────────────────────────

function kpRenderTodos() {
  var addRow = '<div class="kp-add-row">' +
    '<input class="kp-add-inp" id="kp-todo-inp" placeholder="Add a to-do…" onkeydown="if(event.key===\'Enter\')kpAddTodo(document.getElementById(\'kp-todo-add-btn\'))" />' +
    '<button id="kp-todo-add-btn" class="kp-add-btn" onclick="kpAddTodo(this)">Add</button></div>';
  if (!KP.todos.length) {
    el('kp-body').innerHTML = addRow + '<div class="kp-empty"><div class="kp-ei material-symbols-outlined">check_circle</div>No to-dos yet. Add one above!</div>';
    return;
  }
  el('kp-body').innerHTML = addRow + KP.todos.map(function(t) {
    return '<div class="kp-todo">' +
      '<input type="checkbox" onchange="kpCheckTodo(\'' + esc(t._id) + '\')">' +
      '<span class="kp-todo-lbl">' + esc(t.Title) + '</span>' +
      '<button class="kp-del-btn" onclick="kpDeleteTodo(this,\'' + esc(t._id) + '\')">✕</button>' +
      '</div>';
  }).join('');
}

function kpAddTodo(btn) {
  var inp = el('kp-todo-inp');
  var title = (inp ? inp.value : '').trim();
  if (!title) return;
  inp.value = '';
  _btnLoading(btn, '');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn);
      if (!r || !r.ok) { toast('Error: ' + (r && r.error || 'Failed')); return; }
      KP.todos.unshift(_taskToTodo(r.task));
      kpRenderTodos();
    })
    .withFailureHandler(function(err) { _btnReset(btn); toast(err.message || 'Failed'); })
    .tasksCreateTask(KP.lists['Company-Todos'], title, '', APP.currentUser.email);
}

function kpCheckTodo(id) {
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok) { kpRenderTodos(); return; }
      KP.todos = KP.todos.filter(function(t) { return t._id !== id; });
      kpRenderTodos();
    })
    .tasksUpdateTask(KP.lists['Company-Todos'], id, null, null, 'completed', APP.currentUser.email);
}

function kpDeleteTodo(btn, id) {
  _btnLoading(btn, '');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn);
      if (!r || !r.ok) { toast('Error deleting to-do'); return; }
      KP.todos = KP.todos.filter(function(t) { return t._id !== id; });
      kpRenderTodos();
    })
    .withFailureHandler(function(err) { _btnReset(btn); toast(err.message || 'Failed'); })
    .tasksDeleteTask(KP.lists['Company-Todos'], id, APP.currentUser.email);
}

// ── Notes ─────────────────────────────────────────────────────────────────────

function kpRenderNotes() {
  var newBtn = '<div class="kp-note-new" onclick="kpOpenNoteModal(null)">' +
    '<span>Take a note…</span><span class="material-symbols-outlined" style="font-size:18px">edit</span></div>';
  if (!KP.notes.length) {
    el('kp-body').innerHTML = newBtn + '<div class="kp-empty"><div class="kp-ei material-symbols-outlined">sticky_note_2</div>No notes yet.</div>';
    return;
  }
  var cards = KP.notes.map(function(n) {
    return '<div class="kp-note-card" style="background:' + esc(n.Color||'#ffffff') + '"' +
      ' onclick="kpOpenNoteModal(\'' + esc(n._id) + '\')">' +
      (n.Title   ? '<div class="kp-note-title">' + esc(n.Title)   + '</div>' : '') +
      (n.Content ? '<div class="kp-note-body">'  + esc(n.Content) + '</div>' : '') +
      '</div>';
  }).join('');
  el('kp-body').innerHTML = newBtn + '<div class="kp-notes-grid">' + cards + '</div>';
}

function kpOpenNoteModal(noteId) {
  var note = noteId ? KP.notes.find(function(n) { return n._id === noteId; }) : null;
  KP.noteEdit  = note || null;
  KP.noteColor = (note && note.Color) || '#ffffff';

  el('kp-ne-title').value   = note ? (note.Title   || '') : '';
  el('kp-ne-content').value = note ? (note.Content || '') : '';
  _kpApplyNoteColor(KP.noteColor);
  el('kp-ne-del-btn').style.display = note ? '' : 'none';
  el('kp-color-dots').innerHTML = KP_COLORS.map(function(c) {
    return '<div class="kp-color-dot' + (c === KP.noteColor ? ' kp-sel' : '') + '"' +
      ' style="background:' + c + ';border-color:' + (c === '#ffffff' ? '#ddd' : c) + '"' +
      ' onclick="kpNeSetColor(\'' + c + '\')" title="' + c + '"></div>';
  }).join('');
  el('kp-note-modal').classList.add('show');
  setTimeout(function() { el('kp-ne-title').focus(); }, 50);
}

function _kpApplyNoteColor(color) {
  el('kp-note-editor-bg').style.background    = color;
  el('kp-note-editor-inner').style.background = color;
  el('kp-ne-title').style.color   = '#202124';
  el('kp-ne-content').style.color = '#202124';
}

function kpNeSetColor(color) {
  KP.noteColor = color;
  _kpApplyNoteColor(color);
  document.querySelectorAll('.kp-color-dot').forEach(function(d) {
    d.classList.toggle('kp-sel', d.title === color);
    d.style.borderColor = (color === '#ffffff' ? '#ddd' : d.title === color ? '#5f6368' : d.getAttribute('style').match(/background:([^;]+)/)[1]);
  });
}

function kpNeSave() {
  var title   = el('kp-ne-title').value.trim();
  var content = el('kp-ne-content').value.trim();
  if (!title && !content) { kpNoteModalClose(); return; }
  el('kp-note-modal').classList.remove('show');
  var notesField = _encodeColor(KP.noteColor, content);
  var email = APP.currentUser.email;
  if (KP.noteEdit) {
    var editId = KP.noteEdit._id;
    google.script.run
      .withSuccessHandler(function(r) {
        if (!r || !r.ok) { toast('Error updating note'); return; }
        var idx = KP.notes.findIndex(function(n){ return n._id === editId; });
        if (idx !== -1) KP.notes[idx] = _taskToNote(r.task);
        kpRenderNotes();
      })
      .tasksUpdateTask(KP.lists['Company-Notes'], editId, title, notesField, null, email);
  } else {
    google.script.run
      .withSuccessHandler(function(r) {
        if (!r || !r.ok) { toast('Error saving note'); return; }
        KP.notes.unshift(_taskToNote(r.task));
        kpRenderNotes();
      })
      .tasksCreateTask(KP.lists['Company-Notes'], title, notesField, email);
  }
}

function kpNeDelete() {
  if (!KP.noteEdit) return;
  if (!confirm('Delete this note?')) return;
  var id = KP.noteEdit._id;
  el('kp-note-modal').classList.remove('show');
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.ok) { toast('Error deleting note'); return; }
      KP.notes = KP.notes.filter(function(n) { return n._id !== id; });
      kpRenderNotes();
    })
    .tasksDeleteTask(KP.lists['Company-Notes'], id, APP.currentUser.email);
}

function kpNoteModalClose(e) {
  if (e && e.target !== el('kp-note-modal')) return;
  el('kp-note-modal').classList.remove('show');
}

function kpIdeaFormClose() {

function kpSubmitIdea(btn) {

  var content = (el('kp-idea-content-inp') || {value:''}).value.trim();
  if (!title) { toast('Idea title is required'); return; }
  _btnLoading(btn, 'Posting…');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn);
      if (!r || !r.ok) { toast('Error: ' + (r && r.error || 'Failed')); return; }
      KP.ideas.unshift(_taskToIdea(r.task));
      kpRenderIdeas();
    })
    .withFailureHandler(function(err) { _btnReset(btn); toast(err.message || 'Failed'); })
    .tasksCreateTask(KP.lists['Company-Ideas'], title, 'Status: Open\n\n' + content, APP.currentUser.email);

function kpEditIdea(id) {
  var idea = KP.ideas.find(function(i) { return i._id === id; });
  if (!idea) return;
  var safeId = id.replace(/[^a-zA-Z0-9]/g,'_');
  var row = el('kp-idea-' + safeId);
  if (!row) return;
  var statusOpts = KP_STATUSES.map(function(s) {

  row.innerHTML =
    '<div class="kp-idea-form" style="margin:0;background:transparent;border:none;padding:0">' +
      '<input id="kp-edit-title-' + esc(safeId) + '" value="' + esc(idea.Title) + '">' +
      '<textarea id="kp-edit-content-' + esc(safeId) + '" rows="2">' + esc(idea.Content || '') + '</textarea>' +
      '<select id="kp-edit-status-' + esc(safeId) + '" class="kp-add-inp" style="margin-top:4px">' + statusOpts + '</select>' +
      '<div class="kp-idea-form-foot">' +
        '<button class="btn btn-ghost btn-sm" onclick="kpRenderIdeas()">Cancel</button>' +
        '<button class="btn btn-sm btn-danger" onclick="kpDeleteIdea(this,\'' + esc(id) + '\')">Delete</button>' +
        '<button class="btn btn-sm btn-accent" onclick="kpUpdateIdea(this,\'' + esc(id) + '\')">Save</button>' +

function kpUpdateIdea(btn, id) {
  var safeId  = id.replace(/[^a-zA-Z0-9]/g,'_');
  var title   = (el('kp-edit-title-'   + safeId) || {}).value || '';
  var content = (el('kp-edit-content-' + safeId) || {}).value || '';
  var status  = (el('kp-edit-status-'  + safeId) || {}).value || 'Open';
  var bodyText = 'Status: ' + status + '\n\n' + content.trim();
  var email = APP.currentUser.email;
  _btnLoading(btn, 'Saving…');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn);
      if (!r || !r.ok) { toast('Error updating idea'); return; }
      var idx = KP.ideas.findIndex(function(i){ return i._id === id; });
      if (idx !== -1) KP.ideas[idx] = _taskToIdea(r.task);
      kpRenderIdeas();
    })
    .withFailureHandler(function(err) { _btnReset(btn); toast(err.message || 'Failed'); })
    .tasksUpdateTask(KP.lists['Company-Ideas'], id, title.trim(), bodyText, null, email);
}

function kpDeleteIdea(btn, id) {
  if (!confirm('Delete this idea?')) return;
  _btnLoading(btn, '');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn);
      if (!r || !r.ok) { toast('Error deleting idea'); return; }
      KP.ideas = KP.ideas.filter(function(i) { return i._id !== id; });
      kpRenderIdeas();
    })
    .withFailureHandler(function(err) { _btnReset(btn); toast(err.message || 'Failed'); })
    .tasksDeleteTask(KP.lists['Company-Ideas'], id, APP.currentUser.email);

function reviewLeave(btn, leaveId, status) {
  var notes = '';
  if (status === 'Rejected') {
    notes = prompt('Reason for rejection (optional):');
    if (notes === null) return; // user cancelled
    notes = notes || '';
  } else {
    if (!confirm('Approve this leave request?')) return;
  }
  _btnLoading(btn, status === 'Approved' ? 'Approving…' : 'Rejecting…');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn);
      if (!r || !r.ok) { toast((r && r.error) || 'Failed.', 'error'); return; }
      toast('Leave request ' + status.toLowerCase() + '.', status === 'Approved' ? 'success' : 'warn');
      loadLeaveApprovals();
      google.script.run
        .withSuccessHandler(function(p) { if (p && p.ok) updateLeaveBadge(p.pendingLeaveCount || 0); })
        .withFailureHandler(function() {})
        .getInitialPayload(APP.currentUser.email);
    })
    .withFailureHandler(function(err) { _btnReset(btn); toast(err.message || 'Failed.', 'error'); })
    .reviewLeaveRequest(leaveId, status, notes, APP.currentUser.email);
}

function openLeaveModal() {
  el('lv-type').value   = '';
  el('lv-start').value  = _localIso(new Date());
  el('lv-end').value    = _localIso(new Date());
  el('lv-reason').value = '';
  el('lv-days-info').textContent = '1 day';
  el('btn-submit-leave').disabled = false;
  el('leave-modal').classList.remove('hidden');
}

function calcLeaveDays() {
  var s = el('lv-start').value, e = el('lv-end').value;
  if (!s || !e) { el('lv-days-info').textContent = ''; return; }
  var days = Math.round((new Date(e) - new Date(s)) / 86400000) + 1;
  if (days < 1) { el('lv-days-info').textContent = '⚠ End date must be on or after start date'; return; }
  el('lv-days-info').textContent = days + (days === 1 ? ' day' : ' days');
}

function saveLeaveRequest() {
  var type  = el('lv-type').value;
  var start = el('lv-start').value;
  var end   = el('lv-end').value;
  if (!type)  { toast('Please select a leave type.', 'error'); return; }
  if (!start) { toast('Please enter a start date.', 'error'); return; }
  if (!end)   { toast('Please enter an end date.', 'error'); return; }
  if (start > end) { toast('End date must be on or after start date.', 'error'); return; }

  var btn = el('btn-submit-leave');
  _btnLoading(btn, 'Submitting…');
  google.script.run
    .withSuccessHandler(function(r) {
      _btnReset(btn);
      if (!r || !r.ok) { toast((r && r.error) || 'Failed to submit.', 'error'); return; }
      closeModal('leave-modal');
      toast('Leave request submitted! Your manager will review it.', 'success');
      if (APP.view === 'my-leaves') loadMyLeaves();
    })
    .withFailureHandler(function(err) {
      _btnReset(btn);
      toast(err.message || 'Failed.', 'error');
    })
    .submitLeaveRequest({
      leave_type: type,
      start_date: start,
      end_date:   end,
      reason:     el('lv-reason').value.trim()
    }, APP.currentUser.email);
}

function _avatarColor(id) {
  var palette = ['#1a237e','#00897b','#c62828','#6a1b9a','#e65100','#1565c0','#2e7d32','#880e4f','#4e342e','#37474f'];
  var idx = 0;
  for (var i = 0; i < (id || '').length; i++) idx = (idx + id.charCodeAt(i)) % palette.length;
  return palette[idx];
}

var DIR_DATA         = []; // team directory data
var DIR_COMPANY_DATA = []; // company directory data
var DIR_ACTIVE_TAB   = 'team';
var DIR_TEAM_SPACES  = {}; // teamName → { spaceId, uri }

function loadDirectory() {
  DIR_ACTIVE_TAB = 'team';
  el('dir-tab-team').classList.add('active');
  el('dir-tab-company').classList.remove('active');
  el('dir-panel-team').classList.remove('hidden');
  el('dir-panel-company').classList.add('hidden');
  el('dir-search').value = '';

  var cont = el('dir-grid');
  cont.innerHTML = '<div class="empty-state"><div class="ei material-symbols-outlined">hourglass_empty</div><p>Loading…</p></div>';

        cont.innerHTML = '<div class="empty-state"><div class="ei material-symbols-outlined">error_outline</div><p>' + esc(r && r.error || 'Error') + '</p></div>';
        return;
      }
      DIR_DATA = r.employees || [];
      if (r.teamChatSpaces) { DIR_TEAM_SPACES = r.teamChatSpaces; _navPopulateTeamChats(); }

    })

      }
    })
    .getCompanyDirectory(APP.currentUser.email);

function switchDirTab(tab) {
  if (DIR_ACTIVE_TAB === tab) return;
  DIR_ACTIVE_TAB = tab;
  el('dir-search').value = '';

  el('dir-tab-team').classList.toggle('active', tab === 'team');
  el('dir-tab-company').classList.toggle('active', tab === 'company');
  el('dir-panel-team').classList.toggle('hidden', tab !== 'team');
  el('dir-panel-company').classList.toggle('hidden', tab !== 'company');

  if (tab === 'team') {
    var u = APP.currentUser;
    el('dir-sub').textContent = DIR_DATA.length
      ? (DIR_DATA.length + ' members in ' + (u.team || 'your team'))
      : 'Members in ' + (u.team || 'your team');

  } else {
    el('dir-sub').textContent = DIR_COMPANY_DATA.length
      ? (DIR_COMPANY_DATA.length + ' people across all teams')
      : 'All company members';
    if (DIR_COMPANY_DATA.length) {
      renderCompanyDirectory(DIR_COMPANY_DATA);
      _presRefreshAll();

      // Data not yet loaded — fetch now
      var cont = el('dir-company-container');
      cont.innerHTML = '<div class="empty-state"><div class="ei material-symbols-outlined">hourglass_empty</div><p>Loading…</p></div>';
      google.script.run

      return e.name.toLowerCase().indexOf(q) !== -1 ||

function renderDirectory(employees) {
